<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo V82</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03040b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{
  display:none!important;
}

.screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 25%,rgba(0,220,255,.18),transparent 38%),
    linear-gradient(#030411,#08051b);
}

.logo{
  font-size:10px;
  letter-spacing:6px;
  opacity:.55;
}

.title{
  margin-top:15px;
  text-align:center;
  font-size:44px;
  line-height:.9;
  font-weight:900;
  text-shadow:
    0 0 15px #00eaff,
    0 0 35px rgba(0,220,255,.4);
}

.subtitle{
  margin-top:18px;
  font-size:9px;
  letter-spacing:4px;
  opacity:.55;
}

.version{
  margin-top:18px;
  color:#00eaff;
  font-size:11px;
  letter-spacing:5px;
}

button{
  border:0;
  color:#fff;
  font-weight:900;
  letter-spacing:2px;
  border-radius:14px;
  background:linear-gradient(135deg,#00d9ff,#6737ff);
  box-shadow:0 0 25px rgba(0,220,255,.25);
}

button:active{
  transform:scale(.96);
}

.mainBtn{
  width:245px;
  padding:18px;
  margin-top:35px;
  font-size:16px;
}

.smallBtn{
  width:195px;
  padding:14px;
  margin-top:12px;
  font-size:11px;
}

#hud{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:
    calc(10px + env(safe-area-inset-top))
    10px 0;
  pointer-events:none;
}

.hud{
  display:flex;
  justify-content:space-between;
  gap:7px;
}

.hudBox{
  min-width:78px;
  padding:8px 10px;
  border-radius:12px;
  background:rgba(0,0,15,.68);
  border:1px solid rgba(0,235,255,.32);
  backdrop-filter:blur(8px);
}

.hudLabel{
  font-size:7px;
  letter-spacing:2px;
  opacity:.55;
}

.hudValue{
  margin-top:3px;
  font-size:18px;
  font-weight:900;
}

.centerHud{
  min-width:145px;
  text-align:center;
}

#phaseName{
  font-size:10px;
  letter-spacing:2px;
}

#worldName{
  margin-top:4px;
  font-size:8px;
  letter-spacing:2px;
  opacity:.6;
}

#target{
  margin-top:4px;
  font-size:8px;
  opacity:.5;
}

#soundButton{
  position:fixed;
  z-index:25;
  right:12px;
  top:calc(82px + env(safe-area-inset-top));
  width:64px;
  height:42px;
  font-size:9px;
  pointer-events:auto;
  background:rgba(0,0,15,.72);
  border:1px solid rgba(0,235,255,.35);
  box-shadow:none;
}

#phaseMenu{
  justify-content:flex-start;
  padding:
    calc(40px + env(safe-area-inset-top))
    14px 30px;
  overflow:auto;
}

.phaseTitle{
  font-size:25px;
  font-weight:900;
}

.phaseSubtitle{
  margin:8px 0 20px;
  font-size:9px;
  letter-spacing:3px;
  opacity:.5;
}

.phaseGrid{
  width:min(440px,95vw);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.phaseBtn{
  height:52px;
  padding:0;
  margin:0;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:none;
}

.phaseBtn.open{
  background:linear-gradient(135deg,#00bde8,#5730d8);
}

.phaseBtn.lock{
  opacity:.2;
}

.result{
  text-align:center;
}

.resultTitle{
  font-size:38px;
  font-weight:900;
  text-shadow:0 0 20px #00eaff;
}

.resultText{
  margin-top:15px;
  font-size:12px;
  line-height:1.9;
  opacity:.75;
}

.controls{
  position:fixed;
  z-index:15;
  bottom:
    calc(15px + env(safe-area-inset-bottom));
  left:0;
  right:0;
  text-align:center;
  font-size:9px;
  letter-spacing:1px;
  opacity:.42;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">

  <div class="hud">

    <div class="hudBox">
      <div class="hudLabel">PONTOS</div>
      <div id="score" class="hudValue">0</div>
    </div>

    <div class="hudBox centerHud">
      <div id="phaseName">FASE 1</div>
      <div id="worldName">CIDADE NEON</div>
      <div id="target">META 1200</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">MOEDAS</div>
      <div id="coins" class="hudValue">0</div>
    </div>

  </div>

  <button id="soundButton">🔊 SOM</button>

</div>

<div id="controls" class="controls hidden">
  ← → FAIXA • ↑ PULAR • ↓ DESLIZAR
</div>


<!-- MENU -->

<div id="menu" class="screen">

  <div class="logo">
    RUNNER EXPERIENCE
  </div>

  <div class="title">
    ÚLTIMO<br>SEGUNDO
  </div>

  <div class="subtitle">
    CORRA • DESVIE • SOBREVIVA
  </div>

  <div class="version">
    V82 • 50 FASES
  </div>

  <button id="play" class="mainBtn">
    JOGAR
  </button>

  <button id="phases" class="smallBtn">
    FASES
  </button>

</div>


<!-- FASES -->

<div id="phaseMenu" class="screen hidden">

  <div class="phaseTitle">
    SELECIONE A FASE
  </div>

  <div class="phaseSubtitle">
    50 FASES • 10 AMBIENTES
  </div>

  <div id="phaseGrid" class="phaseGrid"></div>

  <div class="phaseSubtitle">
    DESBLOQUEADAS:
    <span id="unlockedText">1</span>/50
  </div>

  <button id="backMenu" class="smallBtn">
    VOLTAR
  </button>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen hidden">

  <div class="result">

    <div class="resultTitle">
      FIM DE JOGO
    </div>

    <div id="loseText" class="resultText"></div>

    <button id="retry" class="mainBtn">
      VOLTAR À FASE 1
    </button>

    <button id="loseMenu" class="smallBtn">
      MENU
    </button>

  </div>

</div>


<!-- VITÓRIA -->

<div id="victory" class="screen hidden">

  <div class="result">

    <div class="resultTitle">
      FASE CONCLUÍDA
    </div>

    <div id="winText" class="resultText"></div>

    <button id="next" class="mainBtn">
      PRÓXIMA FASE
    </button>

    <button id="winMenu" class="smallBtn">
      MENU
    </button>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

let DPR =
  Math.min(
    devicePixelRatio || 1,
    2
  );

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR =
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   MUNDOS
========================================================= */

const worlds = [

  {
    name:"CIDADE NEON",
    sky:"#05051b",
    sky2:"#101a3b",
    road:"#10152c",
    glow:"#00eaff",
    obstacle:"#ff2d75"
  },

  {
    name:"CENTRO FUTURISTA",
    sky:"#061522",
    sky2:"#063b54",
    road:"#10212b",
    glow:"#29efff",
    obstacle:"#ff3d91"
  },

  {
    name:"VIA NOTURNA",
    sky:"#13051d",
    sky2:"#3a0b43",
    road:"#211229",
    glow:"#ff42dd",
    obstacle:"#ff315d"
  },

  {
    name:"ZONA INDUSTRIAL",
    sky:"#151006",
    sky2:"#43230a",
    road:"#211c16",
    glow:"#ffb52e",
    obstacle:"#ff5428"
  },

  {
    name:"CYBER CITY",
    sky:"#02191a",
    sky2:"#06483e",
    road:"#092421",
    glow:"#00ffb0",
    obstacle:"#ff3970"
  },

  {
    name:"DISTRITO VERMELHO",
    sky:"#190306",
    sky2:"#57090f",
    road:"#281015",
    glow:"#ff4439",
    obstacle:"#ffb12e"
  },

  {
    name:"MEGA TÚNEL",
    sky:"#070713",
    sky2:"#252253",
    road:"#17172d",
    glow:"#9e72ff",
    obstacle:"#ff36dd"
  },

  {
    name:"CIDADE AÉREA",
    sky:"#06162a",
    sky2:"#08617c",
    road:"#0d2938",
    glow:"#52eaff",
    obstacle:"#ff9134"
  },

  {
    name:"ZONA ZERO",
    sky:"#010104",
    sky2:"#141419",
    road:"#0a0a0d",
    glow:"#d0d0df",
    obstacle:"#ffffff"
  },

  {
    name:"ÚLTIMO SEGUNDO",
    sky:"#03000d",
    sky2:"#32075c",
    road:"#140c25",
    glow:"#d83cff",
    obstacle:"#ff205e"
  }

];


/* =========================================================
   ESTADO
========================================================= */

let unlocked = 1;
let phase = 1;
let running = false;

let score = 0;
let coins = 0;

let target = 1200;
let speed = .4;

let lane = 1;
let laneVisual = 1;

let jumping = false;
let jumpTime = 0;

let sliding = false;
let slideTimer = 0;

let spawnTimer = .5;
let lastTime = 0;

let objects = [];


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let masterGain = null;
let soundEnabled = true;
let audioTimer = null;

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain =
      audioCtx.createGain();

    masterGain.gain.value =
      .055;

    masterGain.connect(
      audioCtx.destination
    );
  }

  if(
    audioCtx.state === "suspended"
  ){
    audioCtx.resume();
  }

  if(
    soundEnabled &&
    !audioTimer
  ){

    audioTimer =
      setInterval(
        ambientBeat,
        720
      );
  }
}

function tone(
  frequency,
  duration,
  volume,
  type="sine"
){

  if(
    !soundEnabled ||
    !audioCtx ||
    !masterGain
  ){
    return;
  }

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = type;
  osc.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    0,
    audioCtx.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    volume,
    audioCtx.currentTime+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();

  osc.stop(
    audioCtx.currentTime+duration+.02
  );
}

function ambientBeat(){

  if(
    !running ||
    !soundEnabled
  ){
    return;
  }

  tone(
    110 + phase*2,
    .16,
    .035,
    "triangle"
  );
}

function coinSound(){

  tone(
    880,
    .08,
    .08,
    "square"
  );

  setTimeout(
    ()=>{
      tone(
        1320,
        .1,
        .055,
        "square"
      );
    },
    55
  );
}

function jumpSound(){

  tone(
    420,
    .12,
    .055,
    "sine"
  );

  tone(
    700,
    .1,
    .035,
    "sine"
  );
}

function hitSound(){

  tone(
    90,
    .28,
    .11,
    "sawtooth"
  );
}

function winSound(){

  tone(523,.12,.06);
  setTimeout(
    ()=>tone(659,.12,.06),
    100
  );
  setTimeout(
    ()=>tone(784,.22,.07),
    200
  );
}

function toggleSound(){

  soundEnabled =
    !soundEnabled;

  const b =
    document.getElementById(
      "soundButton"
    );

  b.textContent =
    soundEnabled
      ? "🔊 SOM"
      : "🔇 SOM";

  if(soundEnabled){

    initAudio();

  }
}


/* =========================================================
   FASES
========================================================= */

function worldIndex(p){

  return Math.floor(
    (p-1)/5
  );
}

function world(){

  return worlds[
    worldIndex(phase)
  ];
}

function phaseTarget(p){

  return Math.floor(
    1200 +
    (p-1)*470 +
    Math.pow(
      p-1,
      1.2
    )*18
  );
}

function phaseSpeed(p){

  return (
    .38 +
    (p-1)*.011 +
    Math.min(
      .25,
      p*.002
    )
  );
}

function spawnGap(){

  if(phase<=5)
    return 2.35;

  if(phase<=10)
    return 2.1;

  if(phase<=20)
    return 1.85;

  if(phase<=30)
    return 1.6;

  if(phase<=40)
    return 1.4;

  return 1.25;
}


/* =========================================================
   UI
========================================================= */

function show(id){

  document
    .getElementById(id)
    .classList
    .remove("hidden");
}

function hide(id){

  document
    .getElementById(id)
    .classList
    .add("hidden");
}

function menu(){

  running=false;

  hide("hud");
  hide("controls");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("menu");
}

function openPhases(){

  hide("menu");
  hide("gameOver");
  hide("victory");

  show("phaseMenu");

  renderPhases();
}

function renderPhases(){

  const grid =
    document.getElementById(
      "phaseGrid"
    );

  grid.innerHTML="";

  for(
    let i=1;
    i<=50;
    i++
  ){

    const b =
      document.createElement(
        "button"
      );

    b.className =
      "phaseBtn";

    if(i<=unlocked){

      b.classList.add("open");

      b.textContent=i;

      b.onclick=()=>{
        startGame(i);
      };

    }else{

      b.classList.add("lock");

      b.textContent="🔒";
    }

    grid.appendChild(b);
  }

  document.getElementById(
    "unlockedText"
  ).textContent =
    unlocked;
}

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(score);

  document.getElementById(
    "coins"
  ).textContent =
    coins;

  document.getElementById(
    "phaseName"
  ).textContent =
    "FASE " + phase;

  document.getElementById(
    "worldName"
  ).textContent =
    world().name;

  document.getElementById(
    "target"
  ).textContent =
    "META " + target;
}


/* =========================================================
   START
========================================================= */

function startGame(p){

  if(p>unlocked)
    return;

  initAudio();

  phase =
    Math.max(
      1,
      Math.min(
        50,
        p
      )
    );

  score=0;
  coins=0;

  target =
    phaseTarget(phase);

  speed =
    phaseSpeed(phase);

  lane=1;
  laneVisual=1;

  jumping=false;
  jumpTime=0;

  sliding=false;
  slideTimer=0;

  spawnTimer=.6;

  objects=[];

  updateHUD();

  hide("menu");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("hud");
  show("controls");

  running=true;

  lastTime =
    performance.now();

  requestAnimationFrame(loop);
}


/* =========================================================
   ESTRADA
========================================================= */

function roadY(z){

  const top =
    H*.28;

  const bottom =
    H*1.08;

  return (
    top +
    (bottom-top)*z
  );
}

function roadHalf(z){

  return W*
    (
      .055 +
      .47*z
    );
}

function laneX(l,z){

  const center =
    W/2;

  const spread =
    roadHalf(z)*.62;

  return (
    center+
    (l-1)*spread
  );
}


/* =========================================================
   FUNDO — SEM PRÉDIOS
========================================================= */

function drawBackground(){

  const w =
    world();

  const g =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  g.addColorStop(
    0,
    w.sky
  );

  g.addColorStop(
    .48,
    w.sky2
  );

  g.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );

  /* brilho do horizonte */

  const glow =
    ctx.createRadialGradient(
      W/2,
      H*.30,
      0,
      W/2,
      H*.30,
      W*.55
    );

  glow.addColorStop(
    0,
    w.glow+"33"
  );

  glow.addColorStop(
    1,
    "transparent"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    0,
    0,
    W,
    H*.6
  );

  /* estrelas discretas */

  if(
    worldIndex(phase)>=2
  ){

    for(
      let i=0;
      i<35;
      i++
    ){

      const x =
        (i*97)%W;

      const y =
        35+
        (i*43)%(H*.25);

      ctx.fillStyle =
        "rgba(255,255,255,.35)";

      ctx.fillRect(
        x,
        y,
        2,
        2
      );
    }
  }

  /* linha do horizonte */

  ctx.strokeStyle =
    w.glow;

  ctx.globalAlpha=.4;
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    H*.28
  );

  ctx.lineTo(
    W,
    H*.28
  );

  ctx.stroke();

  ctx.globalAlpha=1;
}


/* =========================================================
   ESTRADA
========================================================= */

function drawRoad(){

  const w =
    world();

  const topY =
    roadY(0);

  const bottomY =
    roadY(1);

  const topHalf =
    roadHalf(0);

  const bottomHalf =
    roadHalf(1);

  /* estrada */

  ctx.fillStyle =
    w.road;

  ctx.beginPath();

  ctx.moveTo(
    W/2-topHalf,
    topY
  );

  ctx.lineTo(
    W/2+topHalf,
    topY
  );

  ctx.lineTo(
    W/2+bottomHalf,
    bottomY
  );

  ctx.lineTo(
    W/2-bottomHalf,
    bottomY
  );

  ctx.closePath();

  ctx.fill();

  /* bordas */

  ctx.strokeStyle =
    w.glow;

  ctx.lineWidth=3;

  ctx.globalAlpha=.8;

  ctx.beginPath();

  ctx.moveTo(
    W/2-topHalf,
    topY
  );

  ctx.lineTo(
    W/2-bottomHalf,
    bottomY
  );

  ctx.moveTo(
    W/2+topHalf,
    topY
  );

  ctx.lineTo(
    W/2+bottomHalf,
    bottomY
  );

  ctx.stroke();

  /* faixas */

  ctx.lineWidth=2;

  ctx.globalAlpha=.55;

  for(
    let l=0;
    l<2;
    l++
  ){

    const divider =
      l===0
        ? -.33
        : .33;

    ctx.beginPath();

    for(
      let z=.02;
      z<1;
      z+=.055
    ){

      const y =
        roadY(z);

      const x =
        W/2+
        divider*
        roadHalf(z);

      if(z===.02)
        ctx.moveTo(x,y);
      else
        ctx.lineTo(x,y);
    }

    ctx.stroke();
  }

  /* marcas de velocidade */

  ctx.globalAlpha=.18;

  for(
    let z=.12;
    z<1;
    z+=.13
  ){

    const y =
      roadY(z);

    const half =
      roadHalf(z);

    ctx.beginPath();

    ctx.moveTo(
      W/2-half*.85,
      y
    );

    ctx.lineTo(
      W/2+half*.85,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   PERSONAGEM
========================================================= */

function drawRunner(){

  const baseY =
    H*.82;

  let jumpOffset=0;

  if(jumping){

    const t =
      Math.min(
        1,
        jumpTime/.85
      );

    jumpOffset =
      -Math.sin(
        t*Math.PI
      )*H*.16;
  }

  const x =
    laneX(
      laneVisual,
      .91
    );

  const y =
    baseY+
    jumpOffset;

  const w =
    world();

  /* sombra */

  ctx.fillStyle =
    "rgba(0,0,0,.5)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    baseY+13,
    38,
    10,
    0,0,
    Math.PI*2
   );

  ctx.fill();

  /* cabelo/visor */

  ctx.fillStyle =
    w.glow;

  ctx.beginPath();

  ctx.arc(
    x,
    y-33,
    13,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  /* brilho */

  ctx.shadowBlur=18;
  ctx.shadowColor=w.glow;

  ctx.strokeStyle =
    w.glow;

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    x,
    y-30,
    17,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;
}


/* =========================================================
   SPAWN
========================================================= */

function canSpawn(){

  for(const o of objects){

    if(
      o.type==="obstacle" &&
      o.z>.48
    ){
      return false;
    }
  }

  return true;
}

function spawn(){

  if(!canSpawn()) return;

  const amount =
    phase>=8 &&
    Math.random()<.28
      ? 2
      : 1;

  const used=[];

  for(let i=0;i<amount;i++){

    let l;

    do{
      l=Math.floor(Math.random()*3);
    }while(used.includes(l));

    used.push(l);

    objects.push({
      type:"obstacle",
      lane:l,
      z:0,
      kind:
        Math.random()<.22
          ? "low"
          : "block"
    });
  }

  if(Math.random()<.78){

    const l =
      Math.floor(Math.random()*3);

    for(let i=0;i<5;i++){

      objects.push({
        type:"coin",
        lane:l,
        z:-i*.095
      });
    }
  }
}


/* =========================================================
   OBJETOS
========================================================= */

function drawObjects(){

  const w=world();

  for(const o of objects){

    if(o.z<0 || o.z>1.15)
      continue;

    const x=laneX(o.lane,o.z);
    const y=roadY(o.z);

    const s=.30+o.z*1.9;

    if(o.type==="coin"){

      ctx.shadowBlur=18;
      ctx.shadowColor="#ffd83d";

      ctx.fillStyle="#ffd83d";
      ctx.strokeStyle="#fff4a0";
      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.ellipse(
        x,
        y-26*s,
        9*s,
        12*s,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur=0;

    }else{

      const width=35*s;

      const height =
        o.kind==="low"
          ? 20*s
          : 45*s;

      ctx.shadowBlur=20;
      ctx.shadowColor=w.obstacle;

      ctx.fillStyle="#101827";

      ctx.fillRect(
        x-width/2,
        y-height,
        width,
        height
      );

      ctx.strokeStyle=w.obstacle;
      ctx.lineWidth=4;

      ctx.strokeRect(
        x-width/2,
        y-height,
        width,
        height
      );

      ctx.shadowBlur=0;

      ctx.fillStyle=w.obstacle;

      const light=Math.max(3,5*s);

      ctx.fillRect(
        x-width*.25,
        y-height*.45,
        light,
        light
      );

      ctx.fillRect(
        x+width*.25-light,
        y-height*.45,
        light,
        light
      );
    }
  }
}


/* =========================================================
   COLISÃO
========================================================= */

function collision(){

  for(const o of objects){

    if(o.type!=="obstacle")
      continue;

    if(
      o.z>.79 &&
      o.z<1.03 &&
      o.lane===lane
    ){

      const jumpingOver =
        jumping &&
        jumpTime>.16 &&
        jumpTime<.73;

      const slidingUnder =
        sliding &&
        o.kind==="low";

      if(
        !jumpingOver &&
        !slidingUnder
      ){

        hitSound();
        gameOver();
        return;
      }
    }
  }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  laneVisual +=
    (lane-laneVisual)*
    Math.min(1,dt*28);

  if(jumping){

    jumpTime+=dt;

    if(jumpTime>=.85){

      jumping=false;
      jumpTime=0;
    }
  }

  if(sliding){

    slideTimer-=dt;

    if(slideTimer<=0){
      sliding=false;
    }
  }

  for(const o of objects){

    o.z +=
      dt*(.36+speed*.90);
  }

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    if(
      o.type==="coin" &&
      o.z>.78 &&
      o.z<1.04 &&
      o.lane===lane
    ){

      coins++;
      score+=35;

      coinSound();

      objects.splice(i,1);
      continue;
    }

    if(o.z>1.15){

      objects.splice(i,1);
    }
  }

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawn();

    spawnTimer =
      spawnGap()*
      (.86+Math.random()*.22);
  }

  score +=
    dt*(48+phase*2);

  if(score>=target){

    win();
    return;
  }

  collision();

  updateHUD();
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  if(!running)
    return;

  const lostPhase=phase;

  running=false;

  hide("hud");
  hide("controls");

  unlocked=1;
  phase=1;

  document.getElementById(
    "loseText"
  ).innerHTML =
    "VOCÊ CAIU NA FASE "+
    lostPhase+
    "<br><br>"+
    "Pontuação: "+
    Math.floor(score)+
    "<br>"+
    "Todas as fases foram bloqueadas novamente.";

  show("gameOver");

  renderPhases();
}


/* =========================================================
   VITÓRIA
========================================================= */

function win(){

  if(!running)
    return;

  running=false;

  hide("hud");
  hide("controls");

  winSound();

  if(phase<50){

    unlocked=
      Math.max(
        unlocked,
        phase+1
      );
  }

  document.getElementById(
    "winText"
  ).innerHTML =
    "FASE "+
    phase+
    " • "+
    world().name+
    "<br><br>"+
    "Pontuação: "+
    Math.floor(score)+
    "<br>"+
    "Moedas: "+
    coins+
    "<br><br>"+
    (
      phase<50
      ?
      "FASE "+
      (phase+1)+
      " DESBLOQUEADA!"
      :
      "VOCÊ TERMINOU AS 50 FASES!"
    );

  document.getElementById(
    "next"
  ).textContent =
    phase<50
      ? "PRÓXIMA FASE"
      : "JOGAR NOVAMENTE";

  show("victory");

  renderPhases();
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!running)
    return;

  let dt =
    (now-lastTime)/1000;

  dt=Math.min(dt,.035);

  lastTime=now;

  update(dt);

  draw();

  if(running){

    requestAnimationFrame(loop);
  }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();
  drawRoad();
  drawObjects();
  drawRunner();
}


/* =========================================================
   CONTROLES
========================================================= */

let touchX=0;
let touchY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    if(!running)
      return;

    const t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    if(!running)
      return;

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    const ax=Math.abs(dx);
    const ay=Math.abs(dy);

    if(Math.max(ax,ay)<25)
      return;

    if(ax>ay){

      if(dx>0){

        lane=Math.min(
          2,
          lane+1
        );

      }else{

        lane=Math.max(
          0,
          lane-1
        );
      }

    }else{

      if(dy<0){

        if(!jumping && !sliding){

          jumping=true;
          jumpTime=0;

          jumpSound();
        }

      }else{

        if(!jumping){

          sliding=true;
          slideTimer=.65;

          tone(
            220,
            .08,
            .035,
            "triangle"
          );
        }
      }
    }

  },
  {passive:true}
);


/* =========================================================
   BOTÕES
========================================================= */

document.getElementById("play").onclick=()=>{
  startGame(1);
};

document.getElementById("phases").onclick=()=>{
  openPhases();
};

document.getElementById("backMenu").onclick=()=>{
  menu();
};

document.getElementById("retry").onclick=()=>{
  startGame(1);
};

document.getElementById("loseMenu").onclick=()=>{
  menu();
};

document.getElementById("winMenu").onclick=()=>{
  menu();
};

document.getElementById("next").onclick=()=>{

  if(phase<50){

    startGame(phase+1);

  }else{

    startGame(1);
  }
};

document.getElementById("soundButton").onclick=()=>{
  toggleSound();
};


/* =========================================================
   INÍCIO
========================================================= */

renderPhases();
updateHUD();

</script>
