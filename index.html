<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 15px);
  font-size:46px;
  font-weight:1000;
  text-shadow:0 4px 20px #000;
}

#coins{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 72px);
  color:#ffd83d;
  font-size:20px;
  font-weight:1000;
}

#phase{
  position:absolute;
  right:25px;
  top:calc(env(safe-area-inset-top) + 20px);
  color:#5eeaff;
  font-size:17px;
  font-weight:1000;
  text-shadow:0 0 15px #19dfff;
}

#soundBtn{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 66px);
  pointer-events:auto;
  border:1px solid rgba(94,234,255,.55);
  border-radius:16px;
  padding:9px 13px;
  background:rgba(3,12,28,.82);
  color:#5eeaff;
  font-size:13px;
  font-weight:1000;
  box-shadow:0 0 20px rgba(0,220,255,.12);
}

#hint{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  text-align:center;
  color:rgba(255,255,255,.58);
  font-size:12px;
  font-weight:700;
}

#combo{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 105px);
  color:#fff;
  font-size:15px;
  font-weight:1000;
}

#menu,
#gameover{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(0,220,255,.13),transparent 35%),
    linear-gradient(180deg,rgba(1,5,18,.48),rgba(1,3,10,.92));
}

#gameover{
  display:none;
}

.card{
  width:min(430px,92vw);
  padding:32px 24px;
  border:1px solid rgba(80,220,255,.38);
  border-radius:28px;
  text-align:center;
  background:rgba(4,10,27,.9);
  box-shadow:
    0 0 50px rgba(0,180,255,.18),
    inset 0 0 40px rgba(0,180,255,.04);
  backdrop-filter:blur(15px);
}

.logoTop{
  color:#fff;
  font-size:43px;
  font-weight:1000;
  letter-spacing:-3px;
  line-height:.95;
  text-shadow:0 0 25px #19dfff;
}

.logoBottom{
  color:#ffd126;
  font-size:48px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-3px;
  text-shadow:0 0 25px rgba(255,209,38,.4);
}

.sub{
  color:#9eb4cf;
  margin:22px 0 27px;
  font-size:14px;
  font-weight:800;
  line-height:1.5;
}

button.play{
  border:0;
  border-radius:19px;
  padding:18px 48px;
  background:linear-gradient(90deg,#ffd52f,#ff9e16);
  color:#080b12;
  font-weight:1000;
  font-size:20px;
  box-shadow:
    0 10px 30px rgba(255,180,30,.24),
    0 0 35px rgba(255,200,40,.1);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button.play:active{
  transform:scale(.96);
}

.final{
  color:#fff;
  font-size:21px;
  font-weight:900;
  margin-bottom:22px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="score">0</div>

  <div id="coins">● 0</div>

  <div id="combo">COMBO ×1</div>

  <div id="phase">FASE 1</div>

  <button id="soundBtn" type="button">🔊 SOM</button>

  <div id="hint">
    DESLIZE ← → PARA MUDAR DE FAIXA • ↑ PULAR • ↓ DESLIZAR
  </div>

</div>

<div id="menu">

  <div class="card">

    <div class="logoTop">ÚLTIMO</div>
    <div class="logoBottom">SEGUNDO</div>

    <div class="sub">
      CORRA • DESVIE • SOBREVIVA<br>
      O mundo muda a cada fase.
    </div>

    <button class="play" id="play">JOGAR</button>

  </div>

</div>

<div id="gameover">

  <div class="card">

    <div class="logoTop">FIM DE</div>
    <div class="logoBottom">JOGO</div>

    <div class="sub">
      Você chegou ao limite.
    </div>

    <div class="final" id="finalScore">
      Pontuação: 0
    </div>

    <button class="play" id="again">
      JOGAR NOVAMENTE
    </button>

  </div>

</div>

<script>
(function(){

"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var over=document.getElementById("gameover");

var play=document.getElementById("play");
var again=document.getElementById("again");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var comboEl=document.getElementById("combo");
var phaseEl=document.getElementById("phase");
var soundBtn=document.getElementById("soundBtn");
var finalEl=document.getElementById("finalScore");

var W=0;
var H=0;
var dpr=1;

var running=false;
var last=0;
var gameTime=0;

var score=0;
var coins=0;

var speed=.46;

var lane=1;
var targetLane=1;

var jump=0;
var slide=0;

var spawnTimer=1;
var coinTimer=.5;

var phase=1;
var combo=1;
var comboTimer=0;

var objects=[];
var particles=[];

var best=Number(
  localStorage.getItem("ultimoSegundoBest")||0
);

var audioCtx=null;
var soundEnabled=true;


/* =========================
   RESIZE
========================= */

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener("resize",resize);

resize();


/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!soundEnabled)return;

  try{

    if(!audioCtx){

      audioCtx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

  }catch(e){}

}

function sound(type){

  if(!soundEnabled)return;
  if(!audioCtx)return;
  if(audioCtx.state!=="running")return;

  try{

    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();

    o.connect(g);
    g.connect(audioCtx.destination);

    var now=audioCtx.currentTime;

    if(type==="start"){

      o.type="sine";

      o.frequency.setValueAtTime(
        380,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        760,
        now+.14
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .15,
        now+.025
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.20
      );

      o.start(now);
      o.stop(now+.22);

    }

    else if(type==="coin"){

      o.type="sine";

      o.frequency.setValueAtTime(
        620,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        1100,
        now+.09
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .18,
        now+.015
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.15
      );

      o.start(now);
      o.stop(now+.17);

    }

    else if(type==="jump"){

      o.type="triangle";

      o.frequency.setValueAtTime(
        220,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        600,
        now+.13
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .10,
        now+.015
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.18
      );

      o.start(now);
      o.stop(now+.20);

    }

    else if(type==="slide"){

      o.type="sine";

      o.frequency.setValueAtTime(
        330,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        150,
        now+.14
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .09,
        now+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.16
      );

      o.start(now);
      o.stop(now+.18);

    }

    else if(type==="hit"){

      o.type="sawtooth";

      o.frequency.setValueAtTime(
        180,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        45,
        now+.28
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .20,
        now+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.30
      );

      o.start(now);
      o.stop(now+.32);

    }

  }catch(e){}

}


/* =========================
   RESET
========================= */

function reset(){

  score=0;
  coins=0;

  speed=.46;

  lane=1;
  targetLane=1;

  jump=0;
  slide=0;

  phase=1;

  combo=1;
  comboTimer=0;

  spawnTimer=.9;
  coinTimer=.45;

  objects=[];
  particles=[];

  updateHUD();
}


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  comboEl.textContent=
    "COMBO ×"+combo;

  phaseEl.textContent=
    "FASE "+phase;

}


/* =========================
   START
========================= */

function startGame(){

  initAudio();

  reset();

  running=true;

  menu.style.display="none";
  over.style.display="none";

  sound("start");

  last=performance.now();

  requestAnimationFrame(loop);
}

function finishGame(){

  if(!running)return;

  running=false;

  var finalScore=Math.floor(score);

  if(finalScore>best){

    best=finalScore;

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );

  }

  finalEl.textContent=
    "Pontuação: "+
    finalScore+
    " • Recorde: "+
    best;

  over.style.display="flex";

  sound("hit");
}


/* =========================
   BUTTONS
========================= */

play.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    startGame();

  }
);

again.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    startGame();

  }
);

play.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    startGame();

  },
  {passive:false}
);

again.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    startGame();

  },
  {passive:false}
);

soundBtn.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    soundEnabled=!soundEnabled;

    if(soundEnabled){

      soundBtn.textContent="🔊 SOM";

      initAudio();

      sound("start");

    }else{

      soundBtn.textContent="🔇 SOM";

    }

  }
);


/* =========================
   ROAD
========================= */

function roadY(z){

  var horizon=H*.39;

  return horizon+
    Math.pow(z,1.65)*
    (H*.68-horizon);
}

function roadHalf(z){

  return W*.055+
    Math.pow(z,1.12)*
    W*.48;

}

function laneX(l,z){

  var center=W/2;

  var half=roadHalf(z);

  return center+
    (l-1)*half*.62;

}


/* =========================
   SPAWN
========================= */

function spawnObstacle(){

  var type;

  var r=Math.random();

  if(phase===1){

    type="block";

  }else if(phase===2){

    type=
      r<.55
      ?"block"
      :"low";

  }else{

    if(r<.38)
      type="block";

    else if(r<.70)
      type="low";

    else
      type="high";

  }

  objects.push({

    type:type,

    lane:Math.floor(
      Math.random()*3
    ),

    z:0

  });

}

function spawnPattern(){

  if(phase<2){

    spawnObstacle();

    return;

  }

  var r=Math.random();

  if(r<.45){

    spawnObstacle();

  }else{

    var safeLane=
      Math.floor(Math.random()*3);

    for(var l=0;l<3;l++){

      if(l!==safeLane){

        objects.push({

          type:"block",

          lane:l,

          z:0

        });

      }

    }

  }

}

function spawnCoinLine(){

  var l=
    Math.floor(Math.random()*3);

  var amount=
    3+
    Math.floor(Math.random()*4);

  for(var i=0;i<amount;i++){

    objects.push({

      type:"coin",

      lane:l,

      z:-i*.10

    });

  }

}


/* =========================
   PARTICLES
========================= */

function burst(
  x,
  y,
  color,
  amount
){

  for(
    var i=0;
    i<amount;
    i++
  ){

    var a=
      Math.random()*
      Math.PI*2;

    var v=
      40+
      Math.random()*120;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v,

      life:.45+
        Math.random()*.35,

      color:color

    });

  }

}


/* =========================
   UPDATE
========================= */

function update(dt){

  gameTime+=dt;

  score+=
    speed*
    dt*
    125;

  speed=Math.min(
    .82,
    speed+
    dt*.010
  );

  /*
    A cada 120 pontos:
    nova fase.
  */

  var newPhase=
    Math.min(
      6,
      1+
      Math.floor(score/120)
    );

  if(newPhase!==phase){

    phase=newPhase;

    burst(
      W/2,
      H*.38,
      "#ffd83d",
      30
    );

    sound("start");

  }

  /*
    Movimento suave
    de faixa.
  */

  lane+=
    (targetLane-lane)*
    (1-Math.exp(-dt*15));

  /*
    Salto.
  */

  if(jump>0){

    jump=
      Math.max(
        0,
        jump-dt
      );

  }

  /*
    Deslize.
  */

  if(slide>0){

    slide=
      Math.max(
        0,
        slide-dt
      );

  }

  /*
    Combo.
  */

  if(comboTimer>0){

    comboTimer-=dt;

  }else{

    combo=1;

  }

  /*
    Spawn obstáculos.
  */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnPattern();

    var base=
      Math.max(
        .52,
        .92-
        speed*.40-
        phase*.035
      );

    spawnTimer=
      base+
      Math.random()*.28;

  }

  /*
    Spawn moedas.
  */

  coinTimer-=dt;

  if(coinTimer<=0){

    spawnCoinLine();

    coinTimer=
      .75+
      Math.random()*.65;

  }


  /*
    Mover objetos.
  */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z+=
      speed*
      (1+
      Math.max(
        0,
        o.z
      )*.95)*
      dt;

    /*
      Colisão perto do jogador.
    */

    if(o.z>.86){

      var sameLane=
        Math.abs(
          o.lane-lane
        )<.35;

      if(o.type==="coin"){

        if(
          sameLane&&
          o.z>.90
        ){

          coins++;

          score+=
            10*
            combo;

          combo=
            Math.min(
              8,
              combo+1
            );

          comboTimer=2.4;

          burst(
            laneX(
              o.lane,
              .94
            ),
            roadY(.94)-25,
            "#ffd83d",
            10
          );

          sound("coin");

          objects.splice(i,1);

          continue;

        }

      }else{

        if(
          sameLane&&
          o.z>.91
        ){

          var safe=false;

          /*
            BLOCK:
            precisa trocar de faixa.
          */

          if(o.type==="block"){

            safe=false;

          }

          /*
            LOW:
            precisa pular.
          */

          if(o.type==="low"){

            if(jump>.12)
              safe=true;

          }

          /*
            HIGH:
            precisa deslizar.
          */

          if(o.type==="high"){

            if(slide>.10)
              safe=true;

          }

          if(!safe){

            var px=
              laneX(
                o.lane,
                .96
              );

            var py=
              roadY(.96);

            burst(
              px,
              py,
              "#ff315d",
              24
            );

            finishGame();

            return;

          }

        }

      }

    }

    /*
      Remove quando passa.
    */

    if(o.z>1.04){

      objects.splice(
        i,
        1
      );

    }

  }


  /*
    Partículas.
  */

  for(
    var j=particles.length-1;
    j>=0;
    j--
  ){

    var p=particles[j];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=120*dt;

    if(p.life<=0){

      particles.splice(
        j,
        1
      );

    }

  }

  updateHUD();

}


/* =========================
   DRAW
========================= */

function draw(){

  /*
    Céu.
  */

  var sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    "#020617"
  );

  sky.addColorStop(
    .40,
    "#092b4a"
  );

  sky.addColorStop(
    1,
    "#010307"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  drawCity();

  drawRoad();


  /*
    Objetos mais distantes
    primeiro.
  */

  objects.sort(
    function(a,b){
      return b.z-a.z;
    }
  );

  for(
    var i=0;
    i<objects.length;
    i++
  ){

    var o=objects[i];

    if(o.type==="coin")
      drawCoin(o);

    else
      drawObstacle(o);

  }


  drawRunner();


  /*
    Partículas.
  */

  for(
    var j=0;
    j<particles.length;
    j++
  ){

    var p=particles[j];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life*2
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );

  }

  ctx.globalAlpha=1;

}


/* =========================
   CITY
========================= */

function drawCity(){

  var horizon=H*.39;

  /*
    prédios.
  */

  for(
    var i=0;
    i<22;
    i++
  ){

    var bw=
      28+
      ((i*37)%70);

    var bh=
      45+
      ((i*61)%155);

    var x=
      (i*83)%W;

    ctx.fillStyle=
      i%3===0
      ?"#0b2143"
      :"#09203d";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );

    /*
      janelas.
    */

    ctx.fillStyle=
      "rgba(42,214,255,.32)";

    for(
      var y=horizon-bh+12;
      y<horizon-6;
      y+=18
    ){

      ctx.fillRect(
        x+7,
        y,
        4,
        6
      );

    }

  }

  /*
    horizonte neon.
  */

  ctx.fillStyle="#4feaff";

  ctx.shadowBlur=18;
  ctx.shadowColor="#4feaff";

  ctx.fillRect(
    0,
    horizon,
    W,
    2
  );

  ctx.shadowBlur=0;

}


/* =========================
   ROAD
========================= */

function drawRoad(){

  var horizon=H*.39;
  var bottom=H;

  var road=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      bottom
    );

  road.addColorStop(
    0,
    "#071321"
  );

  road.addColorStop(
    1,
    "#010307"
  );

  ctx.fillStyle=road;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.closePath();

  ctx.fill();


  /*
    laterais.
  */

  ctx.strokeStyle="#20dcff";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.stroke();


  /*
    faixas.
  */

  for(
    var l=1;
    l<3;
    l++
  ){

    ctx.strokeStyle=
      "rgba(80,220,255,.45)";

    ctx.lineWidth=2;

    ctx.setLineDash([
      18,
      18
    ]);

    ctx.beginPath();

    ctx.moveTo(
      laneX(l-.5,0),
      horizon
    );

    ctx.lineTo(
      W/2+
      (l-1.5)*
      W*.5,
      bottom
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  /*
    linhas de velocidade.
  */

  for(
    var z=.06;
    z<1;
    z+=.085
  ){

    var y=roadY(z);

    var half=roadHalf(z);

    ctx.strokeStyle=
      "rgba(40,180,255,.15)";

    ctx.beginPath();

    ctx.moveTo(
      W/2-half,
      y
    );

    ctx.lineTo(
      W/2+half,
      y
    );

    ctx.stroke();

  }

}


/* =========================
   OBSTÁCULOS
========================= */

function drawObstacle(o){

  var z=o.z;

  var x=
    laneX(
      o.lane,
      z
    );

  var y=
    roadY(z);

  var s=
    13+
    z*76;

  ctx.save();

  /*
    BLOQUEIO
  */

  if(o.type==="block"){

    ctx.translate(
      x,
      y-s*.55
    );

    ctx.fillStyle="#ff315d";

    ctx.shadowBlur=15;
    ctx.shadowColor="#ff315d";

    ctx.fillRect(
      -s*.58,
      -s*.38,
      s*1.16,
      s*.76
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#260b19";

    ctx.fillRect(
      -s*.38,
      -s*.18,
      s*.76,
      s*.13
    );

    ctx.fillStyle="#fff";

    ctx.globalAlpha=.75;

    ctx.fillRect(
      -s*.32,
      s*.05,
      s*.64,
      s*.07
    );

  }


  /*
    BARREIRA BAIXA
  */

  if(o.type==="low"){

    ctx.translate(
      x,
      y-s*.28
    );

    ctx.fillStyle="#ff9d24";

    ctx.shadowBlur=16;
    ctx.shadowColor="#ff9d24";

    ctx.fillRect(
      -s*.65,
      -s*.22,
      s*1.3,
      s*.44
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#17110a";

    for(
      var i=-1;
      i<=1;
      i++
    ){

      ctx.fillRect(
        i*s*.32,
        -s*.22,
        s*.12,
        s*.44
      );

    }

  }


  /*
    OBSTÁCULO ALTO
    precisa deslizar.
  */

  if(o.type==="high"){

    ctx.translate(
      x,
      y-s*.85
    );

    ctx.fillStyle="#9d39ff";

    ctx.shadowBlur=18;
    ctx.shadowColor="#9d39ff";

    ctx.fillRect(
      -s*.62,
      -s*.12,
      s*1.24,
      s*.24
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#4d1b85";

    ctx.fillRect(
      -s*.62,
      -s*.12,
      s*.13,
      s*1.05
    );

    ctx.fillRect(
      s*.49,
      -s*.12,
      s*.13,
      s*1.05
    );

  }

  ctx.restore();

}


/* =========================
   COIN
========================= */

function drawCoin(o){

  var z=o.z;

  var x=
    laneX(
      o.lane,
      z
    );

  var y=
    roadY(z)-
    22-
    z*28;

  var r=
    5+
    z*16;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.fillStyle="#ffd83d";

  ctx.shadowBlur=15;
  ctx.shadowColor="#ffd83d";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff5a0";

  ctx.beginPath();

  ctx.arc(
    -r*.25,
    -r*.25,
    r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================
   RUNNER
========================= */

function drawRunner(){

  var x=
    laneX(
      lane,
      .98
    );

  var ground=
    H*.91;

  /*
    salto.
  */

  var lift=0;

  if(jump>0){

    var progress=
      (0.42-jump)/.42;

    lift=
      Math.sin(
        progress*Math.PI
      )*
      H*.13;

  }

  /*
    corrida.
  */

  var run=
    Math.sin(
      gameTime*16
    );

  var y=
    ground-
    lift;

  ctx.save();

  ctx.translate(
    x,
    y
  );


  /*
    sombra.
  */

  ctx.globalAlpha=.22;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    6,
    slide>0?34:26,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /*
    deslize.
  */

  if(slide>0){

    drawSlidingRunner(run);

    ctx.restore();

    return;

  }


  /*
    pernas.
  */

  var leg=run*13;

  ctx.strokeStyle="#a9f5ff";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -8,
    -20
  );

  ctx.lineTo(
    -14+leg,
    17
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    8,
    -20
  );

  ctx.lineTo(
    14-leg,
    17
  );

  ctx.stroke();


  /*
    tênis.
  */

  ctx.strokeStyle="#39eaff";
  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    -14+leg,
    17
  );

  ctx.lineTo(
    -23+leg,
    18
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    14-leg,
    17
  );

  ctx.lineTo(
    23-leg,
    18
  );

  ctx.stroke();


  /*
    corpo.
  */

  ctx.fillStyle="#111d34";

  ctx.shadowBlur=14;
  ctx.shadowColor="#24eaff";

  ctx.beginPath();

  ctx.roundRect(
    -18,
    -71,
    36,
    54,
    12
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /*
    mochila/núcleo.
  */

  ctx.fillStyle="#ff3fcb";

  ctx.shadowBlur=10;
  ctx.shadowColor="#ff3fcb";

  ctx.fillRect(
    -7,
    -57,
    14,
    5
  );

  ctx.shadowBlur=0;


  /*
    braços.
  */

  var arm=
    Math.sin(
      gameTime*16+
      Math.PI
    )*
    10;

  ctx.strokeStyle="#9cefff";
  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(
    -15,
    -55
  );

  ctx.lineTo(
    -28-arm*.25,
    -26+arm*.4
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    15,
    -55
  );

  ctx.lineTo(
    28+arm*.25,
    -26-arm*.4
  );

  ctx.stroke();


  /*
    cabeça/capacete.
  */

  ctx.fillStyle="#07101e";

  ctx.shadowBlur=12;
  ctx.shadowColor="#53edff";

  ctx.beginPath();

  ctx.arc(
    0,
    -87,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#61edff";
  ctx.lineWidth=3;

  ctx.stroke();


  /*
    visor.
  */

  ctx.fillStyle="#152b43";

  ctx.beginPath();

  ctx.roundRect(
    -11,
    -91,
    22,
    8,
    4
  );

  ctx.fill();


  /*
    luz central.
  */

  ctx.fillStyle="#ff3dce";

  ctx.shadowBlur=14;
  ctx.shadowColor="#ff3dce";

  ctx.fillRect(
    -5,
    -47,
    10,
    4
  );

  ctx.shadowBlur=0;

  ctx.restore();

}


/* =========================
   SLIDE RUNNER
========================= */

function drawSlidingRunner(run){

  /*
    corpo inclinado.
  */

  ctx.save();

  ctx.rotate(
    -.10
  );

  ctx.fillStyle="#111d34";

  ctx.shadowBlur=14;
  ctx.shadowColor="#24eaff";

  ctx.beginPath();

  ctx.roundRect(
    -30,
    -46,
    60,
    34,
    13
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /*
    cabeça.
  */

  ctx.fillStyle="#07101e";

  ctx.beginPath();

  ctx.arc(
    27,
    -48,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#61edff";
  ctx.lineWidth=3;
  ctx.stroke();


  /*
    braço.
  */

  ctx.strokeStyle="#9cefff";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -15,
    -30
  );

  ctx.lineTo(
    -34,
    -10
  );

  ctx.stroke();


  /*
    pernas.
  */

  ctx.strokeStyle="#a9f5ff";
  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    -5,
    -14
  );

  ctx.lineTo(
    -31,
    5
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    8,
    -14
  );

  ctx.lineTo(
    38,
    3
  );

  ctx.stroke();


  /*
    rastro neon.
  */

  ctx.strokeStyle="#ff3fd1";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    -35,
    7
  );

  ctx.lineTo(
    -58,
    10
  );

  ctx.stroke();

  ctx.restore();

}


/* =========================
   GAME LOOP
========================= */

function loop(t){

  if(!running)return;

  var dt=
    Math.min(
      .035,
      (t-last)/1000||0
    );

  last=t;

  update(dt);

  if(running){

    draw();

    requestAnimationFrame(loop);

  }

}


/* =========================
   TOUCH
========================= */

var sx=0;
var sy=0;

canvas.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    sx=t.clientX;
    sy=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    var dx=
      t.clientX-sx;

    var dy=
      t.clientY-sy;

    var distance=
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      );

    if(distance<25)return;


    /*
      horizontal.
    */

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0){

        targetLane=
          Math.min(
            2,
            targetLane+1
          );

      }else{

        targetLane=
          Math.max(
            0,
            targetLane-1
          );

      }

      return;

    }


    /*
      vertical.
    */

    if(dy<0){

      if(jump<=0){

        jump=.42;

        sound("jump");

        burst(
          laneX(
            lane,
            .98
          ),
          H*.90,
          "#5eeaff",
          5
        );

      }

    }else{

      if(slide<=0){

        slide=.48;

        sound("slide");

      }

    }

  },
  {passive:true}
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  function(e){

    if(!running)return;

    var key=e.key.toLowerCase();

    if(
      key==="arrowleft"||
      key==="a"
    ){

      targetLane=
        Math.max(
          0,
          targetLane-1
        );

    }

    if(
      key==="arrowright"||
      key==="d"
    ){

      targetLane=
        Math.min(
          2,
          targetLane+1
        );

    }

    if(
      key==="arrowup"||
      key==="w"||
      key===" "
    ){

      e.preventDefault();

      if(jump<=0){

        jump=.42;

        sound("jump");

      }

    }

    if(
      key==="arrowdown"||
      key==="s"
    ){

      e.preventDefault();

      if(slide<=0){

        slide=.48;

        sound("slide");

      }

    }

  }
);


/* =========================
   PRIMEIRO DESENHO
========================= */

draw();

})();
</script>
