<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#18345c 0%,#090d1d 42%,#02030a 100%);
}

/* CÉU */

.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 25%,rgba(0,180,255,.12),transparent 20%),
    radial-gradient(circle at 80% 35%,rgba(255,0,100,.10),transparent 22%);
}

/* PRÉDIOS */

.buildings{
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:38%;
  height:34%;
  opacity:.7;
  background:
    linear-gradient(90deg,
      transparent 0 4%,
      #10172b 4% 10%,
      transparent 10% 13%,
      #111a31 13% 20%,
      transparent 20% 24%,
      #0d1629 24% 31%,
      transparent 31% 36%,
      #131b35 36% 44%,
      transparent 44% 48%,
      #0c1529 48% 57%,
      transparent 57% 62%,
      #121a31 62% 69%,
      transparent 69% 74%,
      #0d1529 74% 82%,
      transparent 82% 87%,
      #121a32 87% 94%,
      transparent 94%);
}

/* CHÃO */

.road{
  position:absolute;
  left:-45%;
  width:190%;
  height:70%;
  bottom:-30%;
  transform:perspective(500px) rotateX(58deg);
  background:
    linear-gradient(90deg,
      transparent 0 32.8%,
      rgba(0,200,255,.35) 32.9% 33.2%,
      transparent 33.3% 66.5%,
      rgba(0,200,255,.35) 66.6% 66.9%,
      transparent 67%),
    repeating-linear-gradient(
      0deg,
      rgba(0,180,255,.14) 0 2px,
      transparent 2px 70px
    ),
    #050817;
  box-shadow:0 -30px 80px rgba(0,120,255,.12);
}

/* HUD */

#hud{
  position:absolute;
  top:20px;
  left:18px;
  right:18px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.score{
  font-size:34px;
  font-weight:900;
  color:#fff;
}

.coins{
  margin-top:4px;
  color:#ffd000;
  font-weight:900;
}

.record{
  margin-top:4px;
  color:#8c98aa;
  font-size:12px;
}

.level{
  padding:8px 13px;
  border-radius:20px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.12);
  font-size:12px;
  font-weight:900;
}

/* PLAYER */

#player{
  position:absolute;
  width:52px;
  height:64px;
  left:50%;
  bottom:17%;
  transform:translateX(-50%);
  z-index:20;
  transition:left .14s ease,transform .12s ease;
}

.body{
  position:absolute;
  left:7px;
  top:12px;
  width:38px;
  height:44px;
  border-radius:14px 14px 10px 10px;
  background:linear-gradient(145deg,#fff,#ffc400 65%,#ff7600);
  box-shadow:
    0 0 18px #ffc400,
    0 0 45px rgba(255,190,0,.55);
}

.body:before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#080b15;
  left:8px;
  top:10px;
  box-shadow:13px 0 #080b15;
}

.body:after{
  content:"";
  position:absolute;
  width:18px;
  height:4px;
  border-radius:5px;
  background:#080b15;
  left:10px;
  bottom:9px;
}

.shadow{
  position:absolute;
  width:55px;
  height:12px;
  left:-2px;
  bottom:-3px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  filter:blur(5px);
}

.jump{
  animation:jump .55s ease;
}

@keyframes jump{
  0%{bottom:17%}
  50%{bottom:31%}
  100%{bottom:17%}
}

.slide .body{
  height:27px;
  top:28px;
}

/* OBSTÁCULOS */

.obstacle{
  position:absolute;
  z-index:15;
  width:58px;
  height:58px;
  border-radius:12px;
  background:linear-gradient(145deg,#ff1744,#ff6500);
  box-shadow:
    0 0 18px #ff1744,
    0 0 45px rgba(255,30,70,.5);
  transform:translateX(-50%);
}

.obstacle.blue{
  background:linear-gradient(145deg,#00d5ff,#006cff);
  box-shadow:
    0 0 20px #00caff,
    0 0 45px rgba(0,150,255,.45);
}

.barrier{
  width:95px;
  height:38px;
  border-radius:8px;
}

/* MOEDAS */

.coin{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  border:5px solid #ffd000;
  background:#fff1a0;
  box-shadow:
    0 0 12px #ffd000,
    0 0 30px rgba(255,210,0,.6);
  z-index:14;
  transform:translateX(-50%);
  animation:spin .55s linear infinite;
}

@keyframes spin{
  0%{transform:translateX(-50%) rotateY(0)}
  100%{transform:translateX(-50%) rotateY(360deg)}
}

/* COMBO */

#combo{
  position:absolute;
  top:105px;
  left:0;
  right:0;
  text-align:center;
  color:#ffd000;
  font-size:22px;
  font-weight:1000;
  z-index:35;
  opacity:0;
  transition:.2s;
}

/* FLASH */

#flash{
  position:absolute;
  inset:0;
  background:#ff1744;
  z-index:80;
  opacity:0;
  pointer-events:none;
}

/* TELAS */

.screen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(2,3,10,.9);
  backdrop-filter:blur(12px);
}

#gameOver{
  display:none;
}

.logo{
  font-size:clamp(58px,15vw,92px);
  line-height:.82;
  font-weight:1000;
  font-style:italic;
  color:#fff;
  text-shadow:
    4px 4px 0 #ff8c00,
    0 0 35px rgba(255,180,0,.45);
}

.tagline{
  margin-top:22px;
  color:#aeb8c8;
  letter-spacing:3px;
  font-size:11px;
}

button{
  width:min(320px,82vw);
  margin-top:38px;
  padding:19px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#ffd400,#ff8500);
  color:#101010;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 10px 35px rgba(255,170,0,.35);
}

button:active{
  transform:scale(.96);
}

.gameTitle{
  color:#ff3040;
  font-size:55px;
  font-weight:1000;
  font-style:italic;
}

.finalLabel{
  margin-top:28px;
  color:#9ca5b4;
}

.finalScore{
  margin-top:5px;
  color:#fff;
  font-size:65px;
  font-weight:1000;
}

.best{
  margin-top:8px;
  color:#ffd000;
  font-weight:900;
}

.hint{
  position:absolute;
  bottom:5%;
  left:0;
  right:0;
  z-index:40;
  text-align:center;
  color:rgba(255,255,255,.4);
  font-size:10px;
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>
  <div class="buildings"></div>
  <div class="road"></div>

  <div id="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="coins">🪙 <span id="coinCount">0</span></div>
      <div class="record">
        RECORDE: <span id="record">0</span>
      </div>
    </div>

    <div class="level" id="level">NÍVEL 1</div>
  </div>

  <div id="combo"></div>

  <div id="player">
    <div class="body"></div>
    <div class="shadow"></div>
  </div>

  <div id="flash"></div>

  <div class="hint">
    DESLIZE ← → PARA MUDAR • ↑ PULAR • ↓ DESLIZAR
  </div>

  <!-- INÍCIO -->

  <div class="screen" id="startScreen">

    <div class="logo">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="tagline">
      CORRA • DESVIE • SOBREVIVA
    </div>

    <button onclick="startGame()">
      JOGAR
    </button>

  </div>

  <!-- GAME OVER -->

  <div class="screen" id="gameOver">

    <div class="gameTitle">
      GAME OVER
    </div>

    <div class="finalLabel">
      SUA PONTUAÇÃO
    </div>

    <div class="finalScore" id="finalScore">
      0
    </div>

    <div class="best">
      🏆 RECORDE: <span id="finalRecord">0</span>
    </div>

    <button onclick="startGame()">
      TENTAR DE NOVO
    </button>

  </div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const coinEl=document.getElementById("coinCount");
const recordEl=document.getElementById("record");
const levelEl=document.getElementById("level");
const comboEl=document.getElementById("combo");
const flash=document.getElementById("flash");

let lane=1;
let score=0;
let coins=0;
let combo=0;

let record=Number(
  localStorage.getItem("ultimoSegundoRecorde")||0
);

let running=false;
let startTime=0;
let lastSpawn=0;
let lastCoin=0;

let obstacles=[];
let coinObjects=[];

let startX=0;
let startY=0;

recordEl.textContent=record.toFixed(1);

const lanes=[
  "16.666%",
  "50%",
  "83.333%"
];

function setLane(value){

  lane=Math.max(0,Math.min(2,value));

  player.style.left=lanes[lane];
}

function jump(){

  if(player.classList.contains("jump"))return;

  player.classList.add("jump");

  setTimeout(()=>{
    player.classList.remove("jump");
  },550);
}

function slide(){

  if(player.classList.contains("slide"))return;

  player.classList.add("slide");

  setTimeout(()=>{
    player.classList.remove("slide");
  },650);
}

function spawnObstacle(){

  const el=document.createElement("div");

  el.className="obstacle";

  if(Math.random()>.65){
    el.classList.add("blue");
  }

  if(Math.random()>.78){
    el.classList.add("barrier");
  }

  const obstacleLane=Math.floor(Math.random()*3);

  el.style.left=lanes[obstacleLane];
  el.style.top="-90px";

  game.appendChild(el);

  obstacles.push({
    element:el,
    lane:obstacleLane,
    y:-90
  });
}

function spawnCoin(){

  const el=document.createElement("div");

  el.className="coin";

  const coinLane=Math.floor(Math.random()*3);

  el.style.left=lanes[coinLane];
  el.style.top="-60px";

  game.appendChild(el);

  coinObjects.push({
    element:el,
    lane:coinLane,
    y:-60
  });
}

function hit(a,b){

  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  return !(
    r1.right<r2.left+8 ||
    r1.left>r2.right-8 ||
    r1.bottom<r2.top+8 ||
    r1.top>r2.bottom-8
  );
}

function collectCoin(c){

  c.element.remove();

  const index=coinObjects.indexOf(c);

  if(index>=0){
    coinObjects.splice(index,1);
  }

  coins++;

  combo++;

  coinEl.textContent=coins;

  comboEl.textContent="🔥 COMBO x"+combo;
  comboEl.style.opacity="1";

  clearTimeout(window.comboTimer);

  window.comboTimer=setTimeout(()=>{
    comboEl.style.opacity="0";
  },600);

  if(navigator.vibrate){
    navigator.vibrate(20);
  }
}

function gameLoop(time){

  if(!running)return;

  score=(time-startTime)/1000;

  scoreEl.textContent=score.toFixed(1);

  const level=Math.floor(score/15)+1;

  levelEl.textContent="NÍVEL "+level;

  const speed=5+(score*.075);

  const spawnDelay=Math.max(
    320,
    900-(score*7)
  );

  if(time-lastSpawn>spawnDelay){

    spawnObstacle();

    lastSpawn=time;
  }

  if(time-lastCoin>650){

    spawnCoin();

    lastCoin=time;
  }

  for(let i=obstacles.length-1;i>=0;i--){

    const o=obstacles[i];

    o.y+=speed;

    o.element.style.top=o.y+"px";

    if(
      o.lane===lane &&
      hit(player,o.element) &&
      !player.classList.contains("jump")
    ){

      endGame();

      return;
    }

    if(o.y>window.innerHeight+120){

      o.element.remove();

      obstacles.splice(i,1);
    }
  }

  for(let i=coinObjects.length-1;i>=0;i--){

    const c=coinObjects[i];

    c.y+=speed;

    c.element.style.top=c.y+"px";

    if(
      c.lane===lane &&
      hit(player,c.element)
    ){

      collectCoin(c);

      continue;
    }

    if(c.y>window.innerHeight+100){

      c.element.remove();

      coinObjects.splice(i,1);
    }
  }

  requestAnimationFrame(gameLoop);
}

function startGame(){

  obstacles.forEach(o=>o.element.remove());
  coinObjects.forEach(c=>c.element.remove());

  obstacles=[];
  coinObjects=[];

  lane=1;
  score=0;
  coins=0;
  combo=0;

  setLane(1);

  scoreEl.textContent="0";
  coinEl.textContent="0";

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  running=true;

  startTime=performance.now();
  lastSpawn=performance.now();
  lastCoin=performance.now();

  requestAnimationFrame(gameLoop);
}

function endGame(){

  if(!running)return;

  running=false;

  flash.style.opacity=".35";

  setTimeout(()=>{
    flash.style.opacity="0";
  },100);

  if(navigator.vibrate){
    navigator.vibrate([
      100,50,180
    ]);
  }

  if(score>record){

    record=score;

    localStorage.setItem(
      "ultimoSegundoRecorde",
      record.toString()
    );
  }

  document.getElementById("finalScore")
    .textContent=score.toFixed(1);

  document.getElementById("finalRecord")
    .textContent=record.toFixed(1);

  recordEl.textContent=record.toFixed(1);

  document.getElementById("gameOver")
    .style.display="flex";
}

/* SWIPE */

game.addEventListener(
  "touchstart",
  e=>{

    if(!running)return;

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  },
  {passive:true}
);

game.addEventListener(
  "touchend",
  e=>{

    if(!running)return;

    const endX=e.changedTouches[0].clientX;
    const endY=e.changedTouches[0].clientY;

    const dx=endX-startX;
    const dy=endY-startY;

    if(
      Math.abs(dx)<30 &&
      Math.abs(dy)<30
    ){
      return;
    }

    if(Math.abs(dx)>Math.abs(dy)){

      if(dx>0){
        setLane(lane+1);
      }else{
        setLane(lane-1);
      }

    }else{

      if(dy<0){
        jump();
      }else{
        slide();
      }
    }
  },
  {passive:true}
);

</script>

</body>
</html>
