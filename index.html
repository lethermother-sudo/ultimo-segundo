<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo — Neon Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}
body{position:fixed;inset:0}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:calc(9px + env(safe-area-inset-top)) 9px 8px;
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr 1fr;
  gap:6px;
  pointer-events:none;
}
.box{
  min-width:0;
  padding:8px 9px;
  border-radius:13px;
  background:rgba(2,7,17,.78);
  border:1px solid rgba(0,235,255,.3);
  box-shadow:0 0 22px rgba(0,220,255,.08);
  backdrop-filter:blur(12px);
}
.label{
  color:#8195a3;
  font-size:8px;
  letter-spacing:1.6px;
  font-weight:900;
}
.value{
  margin-top:2px;
  font-size:17px;
  font-weight:1000;
}
#phaseName{
  color:#00eaff;
  font-size:8px;
  letter-spacing:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#phaseNum{font-size:14px}

#objective{
  position:fixed;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:7px 14px;
  border-radius:20px;
  background:rgba(2,7,16,.7);
  border:1px solid rgba(0,235,255,.2);
  font-size:10px;
  font-weight:1000;
  letter-spacing:1.5px;
  white-space:nowrap;
  pointer-events:none;
}

#crosshair{
  position:fixed;
  left:50%;
  top:51%;
  width:40px;
  height:40px;
  transform:translate(-50%,-50%);
  z-index:18;
  pointer-events:none;
}
#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#dfffff;
  box-shadow:0 0 9px #00eaff;
}
#crosshair:before{
  width:2px;
  height:40px;
  left:19px;
}
#crosshair:after{
  width:40px;
  height:2px;
  top:19px;
}
#dot{
  position:absolute;
  width:5px;
  height:5px;
  left:17px;
  top:17px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px #00eaff;
}

#hit{
  position:fixed;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%);
  z-index:30;
  opacity:0;
  font-size:25px;
  pointer-events:none;
  text-shadow:0 0 15px #fff,0 0 30px #00eaff;
}
#hit.show{animation:hit .22s ease-out}
@keyframes hit{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
}

#damage{
  position:fixed;
  inset:0;
  z-index:29;
  border:0 solid rgba(255,0,45,.7);
  pointer-events:none;
}

#flash{
  position:fixed;
  inset:0;
  z-index:30;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:185px;
  z-index:21;
  pointer-events:none;
}

#ammo{
  position:absolute;
  left:12px;
  bottom:17px;
  width:150px;
  padding:9px;
  border-radius:12px;
  background:rgba(2,7,15,.84);
  border:1px solid rgba(0,235,255,.22);
}
#ammoText{
  font-size:10px;
  font-weight:1000;
}
#ammoBar{
  height:5px;
  margin-top:6px;
  border-radius:8px;
  overflow:hidden;
  background:#16212d;
}
#ammoFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00eaff,#fff);
  box-shadow:0 0 12px #00eaff;
}
#weaponName{
  position:absolute;
  left:50%;
  bottom:17px;
  transform:translateX(-50%);
  font-size:9px;
  color:#91a6b5;
  letter-spacing:2px;
  white-space:nowrap;
}

#controls{
  position:absolute;
  right:12px;
  bottom:calc(9px + env(safe-area-inset-bottom));
  display:flex;
  align-items:end;
  gap:9px;
  pointer-events:auto;
}
.btn{
  color:#fff;
  border:0;
  font-weight:1000;
  touch-action:none;
}
#reload{
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(7,15,26,.92);
  border:1px solid rgba(255,255,255,.25);
  font-size:8px;
}
#shoot{
  width:88px;
  height:88px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6fffff,#007d9b 55%,#022d3d);
  border:2px solid #75ffff;
  box-shadow:0 0 27px rgba(0,238,255,.48),inset 0 0 20px #00eaff;
  font-size:11px;
  letter-spacing:1px;
}
#shoot:active{transform:scale(.94)}

.screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 30%,rgba(0,238,255,.14),transparent 38%),
    linear-gradient(#02030af2,#02030afa);
}
.hidden{display:none!important}
.panel{
  width:min(430px,100%);
  padding:26px 20px;
  border-radius:24px;
  background:rgba(4,8,20,.9);
  border:1px solid rgba(0,238,255,.3);
  box-shadow:0 0 60px rgba(0,180,255,.15);
  text-align:center;
  backdrop-filter:blur(18px);
}
.title{
  font-size:37px;
  line-height:.95;
  font-weight:1000;
  letter-spacing:-2px;
  text-shadow:0 0 25px #00eaff;
}
.subtitle{
  margin:8px 0 22px;
  color:#8398a6;
  font-size:10px;
  letter-spacing:3px;
}
.bigBtn{
  width:100%;
  padding:15px;
  margin-top:9px;
  border:0;
  border-radius:14px;
  background:#00eaff;
  color:#001014;
  font-size:13px;
  font-weight:1000;
  letter-spacing:1px;
}
.bigBtn.secondary{
  color:#dffcff;
  background:#101b2a;
  border:1px solid #214052;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:13px 0;
}
.stat{
  padding:10px;
  border-radius:11px;
  background:#07101d;
}
.stat b{
  display:block;
  font-size:17px;
}
.stat span{
  color:#78909f;
  font-size:7px;
}
#phaseGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  max-height:300px;
  overflow:auto;
  margin-top:12px;
}
.phaseBtn{
  padding:10px 2px;
  border-radius:9px;
  border:1px solid #1b3446;
  background:#07101b;
  color:#fff;
  font-size:10px;
  font-weight:900;
}
.phaseBtn.locked{opacity:.28}

@media(max-width:500px){
  #hud{gap:4px}
  .box{padding:7px}
  .label{font-size:7px}
  .value{font-size:15px}
  #objective{top:79px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div class="box">
    <div class="label">ALVOS</div>
    <div class="value">
      <span id="kills">0</span>/<span id="target">8</span>
    </div>
  </div>

  <div class="box" style="text-align:center">
    <div id="phaseName">CIDADE NEON</div>
    <div id="phaseNum">FASE 1</div>
  </div>

  <div class="box">
    <div class="label">VIDA</div>
    <div class="value" id="life">❤️❤️❤️</div>
  </div>

  <div class="box">
    <div class="label">MOEDAS</div>
    <div class="value" id="coins">0</div>
  </div>

</div>

<div id="objective">ELIMINE OS ALVOS</div>

<div id="crosshair">
  <div id="dot"></div>
</div>

<div id="hit">✦</div>
<div id="flash"></div>
<div id="damage"></div>

<div id="bottom">

  <div id="ammo">
    <div id="ammoText">MUNIÇÃO 18 / 72</div>
    <div id="ammoBar">
      <div id="ammoFill"></div>
    </div>
  </div>

  <div id="weaponName">NEON PISTOL</div>

  <div id="controls">
    <button class="btn" id="reload">RECARREGAR</button>
    <button class="btn" id="shoot">ATIRAR</button>
  </div>

</div>

<div id="menu" class="screen">

  <div class="panel">

    <div class="title">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="subtitle">
      NEON STRIKE
    </div>

    <div class="stats">
      <div class="stat"><b>50</b><span>FASES</span></div>
      <div class="stat"><b>5</b><span>ARMAS</span></div>
      <div class="stat"><b>5</b><span>BOSSES</span></div>
    </div>

    <button class="bigBtn" id="startBtn">
      INICIAR MISSÃO
    </button>

    <button class="bigBtn secondary" id="phasesBtn">
      SELECIONAR FASE
    </button>

  </div>

</div>

<div id="phaseMenu" class="screen hidden">

  <div class="panel">

    <div class="title" style="font-size:28px">
      FASES
    </div>

    <div class="subtitle">
      50 MISSÕES
    </div>

    <div id="phaseGrid"></div>

    <button class="bigBtn secondary" id="backBtn">
      VOLTAR
    </button>

  </div>

</div>

<div id="gameOver" class="screen hidden">

  <div class="panel">

    <div class="title" style="font-size:30px">
      MISSÃO<br>ENCERRADA
    </div>

    <div class="subtitle" id="overReason">
      VOCÊ FOI ELIMINADO
    </div>

    <div class="stats">

      <div class="stat">
        <b id="overKills">0</b>
        <span>ALVOS</span>
      </div>

      <div class="stat">
        <b id="overCoins">0</b>
        <span>MOEDAS</span>
      </div>

      <div class="stat">
        <b id="overPhase">1</b>
        <span>FASE</span>
      </div>

    </div>

    <button class="bigBtn" id="retryBtn">
      TENTAR NOVAMENTE
    </button>

    <button class="bigBtn secondary" id="menuBtn">
      MENU
    </button>

  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js";

import {EffectComposer} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/EffectComposer.js";

import {RenderPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/RenderPass.js";

import {UnrealBloomPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/UnrealBloomPass.js";

import {OutputPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/OutputPass.js";


/* =========================================================
   MUNDOS
========================================================= */

const WORLDS=[

  {
    name:"CIDADE NEON",
    sky:0x020713,
    fog:0x020713,
    road:0x050913,
    neon:0x00eaff,
    secondary:0xff00c8,
    rain:false,
    smoke:false,
    hologram:true
  },

  {
    name:"DISTRITO CHUVOSO",
    sky:0x02050c,
    fog:0x081321,
    road:0x06101a,
    neon:0x3f9dff,
    secondary:0x00eaff,
    rain:true,
    smoke:false,
    hologram:true
  },

  {
    name:"ZONA INDUSTRIAL",
    sky:0x0b0402,
    fog:0x1b0a05,
    road:0x0b0807,
    neon:0xff7200,
    secondary:0xff1838,
    rain:false,
    smoke:true,
    hologram:false
  },

  {
    name:"CIDADE SUSPENSA",
    sky:0x05010c,
    fog:0x100522,
    road:0x08041a,
    neon:0xb900ff,
    secondary:0x00eaff,
    rain:false,
    smoke:true,
    hologram:true
  },

  {
    name:"MEGA TÚNEL",
    sky:0x02070a,
    fog:0x06181b,
    road:0x050b10,
    neon:0x00ffb7,
    secondary:0x00aaff,
    rain:false,
    smoke:true,
    hologram:false
  },

  {
    name:"BASE TECNOLÓGICA",
    sky:0x02060a,
    fog:0x07151d,
    road:0x060b12,
    neon:0x00aaff,
    secondary:0x7c5cff,
    rain:false,
    smoke:false,
    hologram:true
  },

  {
    name:"CIDADE NOTURNA",
    sky:0x09020b,
    fog:0x19051c,
    road:0x09050d,
    neon:0xff1493,
    secondary:0xffd000,
    rain:true,
    smoke:false,
    hologram:true
  },

  {
    name:"ZONA VERMELHA",
    sky:0x100202,
    fog:0x230606,
    road:0x0c0506,
    neon:0xff1744,
    secondary:0xff7a00,
    rain:false,
    smoke:true,
    hologram:false
  },

  {
    name:"MEGA CITY",
    sky:0x02050b,
    fog:0x07121d,
    road:0x050b12,
    neon:0x00eaff,
    secondary:0x7aff00,
    rain:true,
    smoke:true,
    hologram:true
  },

  {
    name:"ZONA FINAL",
    sky:0x09000d,
    fog:0x180021,
    road:0x07020b,
    neon:0xff00ff,
    secondary:0x00ffff,
    rain:true,
    smoke:true,
    hologram:true
  }

];


/* =========================================================
   ARMAS
========================================================= */

const WEAPONS=[

  {
    name:"NEON PISTOL",
    damage:1,
    ammo:18,
    reserve:72,
    color:0x00eaff
  },

  {
    name:"PULSE SMG",
    damage:1,
    ammo:28,
    reserve:112,
    color:0x00ff9d
  },

  {
    name:"CYBER RIFLE",
    damage:2,
    ammo:24,
    reserve:96,
    color:0x7c5cff
  },

  {
    name:"PLASMA GUN",
    damage:3,
    ammo:15,
    reserve:60,
    color:0xff00d4
  },

  {
    name:"OMEGA CANNON",
    damage:5,
    ammo:10,
    reserve:40,
    color:0xff5b00
  }

];


/* =========================================================
   ESTADO
========================================================= */

const PHASES=50;

let phase=Number(
  localStorage.getItem("ultimoSegundoPhase")||1
);

let unlocked=Number(
  localStorage.getItem("ultimoSegundoUnlocked")||1
);

let running=false;

let kills=0;
let target=8;
let lives=3;
let coins=0;

let ammo=18;
let reserve=72;

let weapon=WEAPONS[0];

let reloading=false;

let spawnTimer=0;
let enemyShotTimer=0;

let elapsed=0;

const enemies=[];
const crates=[];
const particles=[];
const tracers=[];
const enemyShots=[];


/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  260
);

camera.position.set(
  0,
  2.05,
  5
);

camera.rotation.order="YXZ";


const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.35)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.15;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

document.getElementById("game")
.appendChild(renderer.domElement);


/* =========================================================
   PÓS-PROCESSAMENTO
========================================================= */

const composer=
  new EffectComposer(renderer);

composer.addPass(
  new RenderPass(scene,camera)
);

const bloom=
  new UnrealBloomPass(
    new THREE.Vector2(
      innerWidth,
      innerHeight
    ),
    .72,
    .55,
    .72
  );

composer.addPass(bloom);

composer.addPass(
  new OutputPass()
);


/* =========================================================
   GRUPOS
========================================================= */

const worldGroup=new THREE.Group();
const enemyGroup=new THREE.Group();
const crateGroup=new THREE.Group();
const effectGroup=new THREE.Group();
const weatherGroup=new THREE.Group();

scene.add(worldGroup);
scene.add(enemyGroup);
scene.add(crateGroup);
scene.add(effectGroup);
scene.add(weatherGroup);


/* =========================================================
   MATERIAL
========================================================= */

function metal(
  color,
  rough=.35,
  metalness=.75
){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness
  });
}

function glow(color){
  return new THREE.MeshBasicMaterial({
    color
  });
}


/* =========================================================
   WORLD INDEX
========================================================= */

function worldIndex(){
  return Math.min(
    9,
    Math.floor((phase-1)/5)
  );
}

function world(){
  return WORLDS[worldIndex()];
}


/* =========================================================
   LIMPAR
========================================================= */

function clearGroup(group){

  while(group.children.length){

    const o=group.children.pop();

    o.traverse(c=>{

      if(c.geometry)
        c.geometry.dispose();

      if(c.material){

        if(Array.isArray(c.material))
          c.material.forEach(m=>m.dispose());
        else
          c.material.dispose();

      }

    });

  }

}


/* =========================================================
   PRÉDIOS
========================================================= */

function building(
  x,z,w,h,d
){

  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    metal(0x08101b,.75,.35)
  );

  body.position.y=h/2;

  g.add(body);


  /* faixas verticais */

  for(
    let i=0;
    i<3;
    i++
  ){

    const line=new THREE.Mesh(
      new THREE.BoxGeometry(
        .045,
        h*.82,
        .045
      ),
      glow(
        i%2
        ? world().neon
        : world().secondary
      )
    );

    line.position.set(
      -w/2+.35+i*(w-.7)/2,
      h*.52,
      -d/2-.04
    );

    g.add(line);

  }


  /* janelas */

  for(
    let y=1.5;
    y<h-1;
    y+=1.8
  ){

    for(
      let xx=-w/2+.5;
      xx<w/2-.2;
      xx+=.8
    ){

      if(
        Math.random()<.35
      ) continue;

      const win=new THREE.Mesh(
        new THREE.BoxGeometry(
          .38,
          .12,
          .035
        ),
        glow(
          Math.random()<.5
          ? world().neon
          : world().secondary
        )
      );

      win.position.set(
        xx,
        y,
        -d/2-.05
      );

      g.add(win);

    }

  }

  g.position.set(x,0,z);

  worldGroup.add(g);

}


/* =========================================================
   HOLOGRAMA
========================================================= */

function hologram(x,z){

  const g=new THREE.Group();

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(
      1.1,.035,8,32
    ),
    glow(world().neon)
  );

  ring.rotation.x=Math.PI/2;
  ring.position.y=2;

  g.add(ring);


  const core=new THREE.Mesh(
    new THREE.SphereGeometry(
      .55,16,12
    ),
    new THREE.MeshBasicMaterial({
      color:world().secondary,
      transparent:true,
      opacity:.25
    })
  );

  core.position.y=2;

  g.add(core);

  g.position.set(
    x,0,z
  );

  worldGroup.add(g);

}


/* =========================================================
   POSTES
========================================================= */

function streetLight(x,z){

  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .045,.065,4.8,8
    ),
    metal(0x121b25,.3,.85)
  );

  pole.position.set(
    x,2.4,z
  );

  worldGroup.add(pole);


  const light=new THREE.Mesh(
    new THREE.SphereGeometry(
      .12,12,8
    ),
    glow(world().neon)
  );

  light.position.set(
    x,
    4.75,
    z
  );

  worldGroup.add(light);

}


/* =========================================================
   VEÍCULO
========================================================= */

function vehicle(x,z){

  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      1.8,.48,3.5
    ),
    metal(0x101722,.2,.85)
  );

  body.position.y=.55;

  g.add(body);


  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(
      1.25,.35,1.1
    ),
    glow(world().secondary)
  );

  glass.position.set(
    0,.87,-.25
  );

  g.add(glass);


  for(const sx of [-.72,.72]){

    const lamp=new THREE.Mesh(
      new THREE.BoxGeometry(
        .12,.08,.45
      ),
      glow(world().neon)
    );

    lamp.position.set(
      sx,.62,-1.78
    );

    g.add(lamp);

  }

  g.position.set(
    x,0,z
  );

  worldGroup.add(g);

}


/* =========================================================
   CHUVA
========================================================= */

function buildRain(){

  clearGroup(weatherGroup);

  if(!world().rain)
    return;

  const count=
    innerWidth<600
    ? 650
    : 1100;

  const positions=

  worldGroup.add(sun);

      26,
      48
    );

  neonLight.position.set(
    0,5,-22
  );

  worldGroup.add(neonLight);


  buildRain();
  buildSmoke();

/* =========================================================
   RAYCAST / TIRO
========================================================= */

const raycaster=
  new THREE.Raycaster();

function shoot(){

  if(!running||reloading)
    return;

  if(ammo<=0){
    reload();
    return;
  }

  ammo--;
  updateAmmo();


  if(weaponGroup){

    weaponGroup.position.z=.09;

    setTimeout(()=>{
      if(weaponGroup)
        weaponGroup.position.z=0;
    },55);

  }


  const flash=
    document.getElementById("flash");

  flash.style.opacity=".17";

  setTimeout(()=>{
    flash.style.opacity="0";
  },35);


  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const objects=[
    ...enemies,
    ...crates
  ];


  const hits=
    raycaster.intersectObjects(
      objects,
      true
    );


  let enemy=null;
  let crate=null;
  let point=null;


  if(hits.length){

    let o=
      hits[0].object;

    point=
      hits[0].point.clone();


    while(o){

      if(enemies.includes(o)){
        enemy=o;
        break;
      }

      if(crates.includes(o)){
        crate=o;
        break;
      }

      o=o.parent;
    }

  }


  /* assistência */

  if(!enemy&&!crate){

    let best=null;
    let bestDistance=.31;

    for(
      const e of enemies
    ){

      const p=
        e.position.clone();

      p.y+=1.45;

      p.project(camera);

      const d=
        Math.sqrt(
          p.x*p.x+
          p.y*p.y
        );

      if(
        d<bestDistance &&
        p.z>-1 &&
        p.z<1
      ){

        best=e;
        bestDistance=d;

      }

    }

    if(best){

      enemy=best;

      point=
        best.position.clone();

      point.y+=1.45;

    }

  }


  const start=
    camera.position.clone();


  if(enemy){

    tracer(start,point);
    hitEnemy(enemy,point);
    showHit();

  }
  else if(crate){

    tracer(start,point);
    hitCrate(crate,point);
    showHit();

  }
  else{

    const dir=
      new THREE.Vector3(
        0,0,-1
      )
      .applyQuaternion(
        camera.quaternion
      );

    const end=
      camera.position.clone()
        .add(
          dir.multiplyScalar(90)
        );

    tracer(start,end);

  }

}


/* =========================================================
   HIT INIMIGO
========================================================= */

function hitEnemy(
  enemy,
  point
){

  enemy.userData.hp-=weapon.damage;

  explode(
    point,
    enemy.userData.boss
    ? 0xff00d4
    : world().neon
  );


  const ratio=
    Math.max(
      0,
      enemy.userData.hp/
      enemy.userData.maxHp
    );

  if(enemy.userData.hpFill)
    enemy.userData.hpFill.scale.x=ratio;


  if(enemy.userData.hp<=0){

    const index=
      enemies.indexOf(enemy);

    if(index>=0)
      enemies.splice(index,1);

    enemyGroup.remove(enemy);

    kills++;

    coins+=
      enemy.userData.boss
      ? 12
      : 1;

    updateHUD();

    if(enemy.userData.boss)
      showToast("BOSS ELIMINADO");

    if(kills>=target)
      completePhase();

  }

}


/* =========================================================
   HIT OBSTÁCULO
========================================================= */

function hitCrate(
  crate,
  point
){

  crate.userData.hp--;

  explode(
    point,
    0xffa000
  );

  if(crate.userData.hp<=0){

    const index=
      crates.indexOf(crate);

    if(index>=0)
      crates.splice(index,1);

    crateGroup.remove(crate);

    coins++;

    updateHUD();

  }

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(
    !running||
    reloading||
    ammo>=weapon.ammo||
    reserve<=0
  ) return;

  reloading=true;

  document.getElementById(
    "ammoText"
  ).textContent=
    "RECARREGANDO...";


  setTimeout(()=>{

    const need=
      weapon.ammo-ammo;

    const amount=
      Math.min(
        need,
        reserve
      );

    ammo+=amount;
    reserve-=amount;

    reloading=false;

    updateAmmo();

  },850);

}

/* =========================================================
   ATUALIZAÇÃO DOS INIMIGOS
========================================================= */

function updateEnemies(dt){

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];

    e.userData.time+=dt;

    e.position.z+=
      e.userData.speed*dt;

    const t=
      e.userData.time;


    /* animação */

    e.rotation.y=
      Math.sin(t*1.4)*.07;

    e.position.y=
      Math.sin(t*2)*.025;


    e.children.forEach(
      part=>{

        if(
          part.userData &&
          part.userData.limb
        ){

          part.rotation.x=
            Math.sin(
              t*5+
              part.userData.side*Math.PI
            )*.35;

        }

      }
    );


    if(
      e.position.z>5
    ){

      enemyGroup.remove(e);

      enemies.splice(i,1);

      damagePlayer();

    }

  }

}


/* =========================================================
   CAIXAS
========================================================= */

function updateCrates(dt){

  for(
    let i=crates.length-1;
    i>=0;
    i--
  ){

    const c=crates[i];

    c.position.z+=
      (.45+phase*.01)*dt;

    c.rotation.y+=dt*.25;

    if(c.position.z>5){

      crateGroup.remove(c);

      crates.splice(i,1);

    }

  }

}


/* =========================================================
   SPAWN
========================================================= */

function updateSpawn(dt){

  spawnTimer-=dt;

  const interval=
    Math.max(
      .65,
      1.35-phase*.012
    );


  if(
    spawnTimer<=0
  ){

    spawnTimer=interval;

    if(
      enemies.length<7
    ){

      if(
        phase%10===0 &&
        kills>=target-2 &&
        !enemies.some(
          e=>e.userData.boss
        )
      ){

        createEnemy(true);

      }else{

        createEnemy(false);

      }

    }

  }


  if(
    phase>=3 &&
    crates.length<3 &&
    Math.random()<dt*.22
  ){

    createCrate();

  }

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.userData.life-=dt;

    p.position.addScaledVector(
      p.userData.velocity,
      dt
    );

    p.scale.multiplyScalar(
      1-dt*.8
    );

    if(
      p.userData.life<=0
    ){

      effectGroup.remove(p);

      particles.splice(i,1);

    }

  }

}


/* =========================================================
   TRACERS
========================================================= */

function updateTracers(dt){

  for(
    let i=tracers.length-1;
    i>=0;
    i--
  ){

    const t=tracers[i];

    t.life-=dt;

    t.line.material.opacity=
      Math.max(
        0,
        t.life/.09
      );

    if(t.life<=0){

      scene.remove(t.line);

      tracers.splice(i,1);

    }

  }

}


/* =========================================================
   AMBIENTE
========================================================= */

function updateEnvironment(dt){

  const rain=
    weatherGroup.children[0];

  if(rain){

    const attr=
      rain.geometry.attributes.position;

    for(
      let i=0;
      i<attr.count;
      i++
    ){

      let y=attr.getY(i);

      y-=dt*19;

      if(y<0)
        y=18+Math.random()*3;

      attr.setY(i,y);

    }

    attr.needsUpdate=true;

  }


  worldGroup.children.forEach(
    o=>{

      if(
        o.userData &&
        o.userData.smokeSpeed
      ){

        o.position.y+=
          dt*o.userData.smokeSpeed;

        if(o.position.y>5)
          o.position.y=.8;

      }

    }
  );

}


/* =========================================================
   FASE
========================================================= */

function setupPhase(){

  target=
    8+
    Math.floor(
      (phase-1)*.65
    );

  weapon=
    WEAPONS[
      Math.min(
        WEAPONS.length-1,
        Math.floor((phase-1)/10)
      )
    ];

  kills=0;
  lives=3;

  ammo=weapon.ammo;
  reserve=weapon.reserve;

  spawnTimer=0;

  while(enemyGroup.children.length)
    enemyGroup.remove(
      enemyGroup.children[0]
    );

  while(crateGroup.children.length)
    crateGroup.remove(
      crateGroup.children[0]
    );

  enemies.length=0;
  crates.length=0;

  buildWorld();
  buildWeapon();

  updateHUD();
  updateAmmo();

  createEnemy(false);
  createEnemy(false);

  if(phase>=3)
    createCrate();

}


/* =========================================================
   INICIAR
========================================================= */

function startPhase(){

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("phaseMenu")
    .classList.add("hidden");

  document.getElementById("gameOver")
    .classList.add("hidden");

  running=true;

  setupPhase();

  showToast(
    `FASE ${phase} • ${world().name}`
  );

}


/* =========================================================
   COMPLETAR FASE
========================================================= */

function completePhase(){

  if(!running)
    return;

  running=false;


  if(
    phase<PHASES
  ){

    if(
      phase>=unlocked
    ){

      unlocked=phase+1;

      localStorage.setItem(
        "ultimoSegundoUnlocked",
        unlocked
      );

    }


    phase++;

    localStorage.setItem(
      "ultimoSegundoPhase",
      phase
    );


    setTimeout(
      ()=>{
        startPhase();
      },
      850
    );

  }
  else{

    document.getElementById(
      "overReason"
    ).textContent=
      "VOCÊ CONCLUIU AS 50 FASES";

    document.getElementById(
      "overKills"
    ).textContent=kills;

    document.getElementById(
      "overCoins"
    ).textContent=coins;

    document.getElementById(
      "overPhase"
    ).textContent=50;

    document.getElementById(
      "gameOver"
    ).classList.remove("hidden");

  }

}


/* =========================================================
   MENU DE FASES
========================================================= */

function buildPhaseGrid(){

  const grid=
    document.getElementById(
      "phaseGrid"
    );

  grid.innerHTML="";


  for(
    let i=1;
    i<=PHASES;
    i++
  ){

    const b=
      document.createElement(
        "button"
      );

    b.className="phaseBtn";


    if(i>unlocked){

      b.classList.add("locked");

      b.textContent=
        `🔒 ${i}`;

    }
    else{

      b.textContent=
        `FASE ${i}`;

      b.onclick=()=>{

        phase=i;

        localStorage.setItem(
          "ultimoSegundoPhase",
          phase
        );

        startPhase();

      };

    }

    grid.appendChild(b);

  }

}


/* =========================================================
   TOUCH / MIRA
========================================================= */

let aiming=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    aiming=true;

    lastX=e.clientX;
    lastY=e.clientY;

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!aiming||!running)
      return;

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    camera.rotation.y-=
      dx*.0023;

    camera.rotation.x-=
      dy*.0018;

    camera.rotation.x=
      THREE.MathUtils.clamp(
        camera.rotation.x,
        -.45,
        .35
      );

  }
);

window.addEventListener(
  "pointerup",
  ()=>{
    aiming=false;
  }
);


/* =========================================================
   BOTÕES
========================================================= */

document.getElementById("shoot")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);

document.getElementById("reload")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    reload();
  }
);

document.getElementById("startBtn")
.onclick=()=>{
  startPhase();
};

document.getElementById("retryBtn")
.onclick=()=>{
  startPhase();
};

document.getElementById("menuBtn")
.onclick=()=>{

  running=false;

  document.getElementById("gameOver")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

};


document.getElementById("phasesBtn")
.onclick=()=>{

  buildPhaseGrid();

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("phaseMenu")
    .classList.remove("hidden");

};


document.getElementById("backBtn")
.onclick=()=>{

  document.getElementById("phaseMenu")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

};


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space")
      shoot();

    if(e.key.toLowerCase()==="r")
      reload();

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    composer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   LOOP
========================================================= */

let last=
  performance.now();

function animate(now){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      .05,
      (now-last)/1000
    );

  last=now;

  elapsed+=dt;


  if(running){

    updateSpawn(dt);
    updateEnemies(dt);
    updateCrates(dt);

  }

  updateParticles(dt);
  updateTracers(dt);
  updateEnvironment(dt);


  composer.render(dt);

}


/* =========================================================
   START
========================================================= */

buildWorld();

buildWeapon();

updateHUD();

updateAmmo();

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
