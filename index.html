<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo V60</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050511;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  color:white;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 30%,rgba(0,220,255,.16),transparent 35%),
    linear-gradient(#050512,#09051c);
}

.hidden{
  display:none!important;
}

.logo{
  font-size:13px;
  letter-spacing:7px;
  opacity:.7;
  margin-bottom:12px;
}

.title{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  text-shadow:0 0 25px #00eaff;
}

.subtitle{
  margin-top:10px;
  font-size:12px;
  letter-spacing:3px;
  opacity:.7;
}

.version{
  margin-top:16px;
  font-size:11px;
  letter-spacing:4px;
  color:#00eaff;
}

button{
  border:0;
  color:white;
  font-weight:900;
  letter-spacing:2px;
  border-radius:14px;
  background:linear-gradient(135deg,#00d9ff,#7c36ff);
  box-shadow:0 0 25px rgba(0,220,255,.25);
}

.mainBtn{
  width:240px;
  padding:18px;
  margin-top:35px;
  font-size:16px;
}

.smallBtn{
  width:190px;
  padding:14px;
  margin-top:12px;
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:5;
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
  pointer-events:none;
}

.hudRow{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hudBox{
  min-width:78px;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(0,0,15,.58);
  border:1px solid rgba(0,235,255,.3);
  backdrop-filter:blur(8px);
}

.hudLabel{
  font-size:8px;
  opacity:.6;
  letter-spacing:2px;
}

.hudValue{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

.phaseHud{
  text-align:center;
}

#phaseName{
  font-size:10px;
  letter-spacing:2px;
  opacity:.8;
}

#target{
  font-size:9px;
  opacity:.55;
  margin-top:3px;
}

#phaseMenu{
  justify-content:flex-start;
  padding:35px 18px;
  overflow:auto;
}

.phaseTitle{
  font-size:25px;
  font-weight:900;
  margin-bottom:18px;
}

.phases{
  width:min(440px,94vw);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.phaseBtn{
  height:55px;
  margin:0;
  padding:0;
  font-size:13px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:none;
}

.phaseBtn.unlocked{
  background:linear-gradient(135deg,#00bde8,#5730d8);
}

.phaseBtn.locked{
  opacity:.25;
}

.info{
  margin-top:18px;
  font-size:10px;
  letter-spacing:2px;
  opacity:.55;
  text-align:center;
}

#gameOver,#victory{
  background:rgba(3,3,15,.88);
}

.bigResult{
  font-size:38px;
  font-weight:900;
  text-shadow:0 0 25px #00eaff;
}

.resultText{
  margin-top:14px;
  text-align:center;
  line-height:1.8;
  font-size:13px;
  opacity:.8;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hudRow">

    <div class="hudBox">
      <div class="hudLabel">PONTOS</div>
      <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox phaseHud">
      <div id="phaseName">CIDADE NEON</div>
      <div id="target">META 1200</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">MOEDAS</div>
      <div class="hudValue" id="coins">0</div>
    </div>

  </div>
</div>

<div id="menu" class="screen">
  <div class="logo">RUNNER EXPERIENCE</div>
  <div class="title">ÚLTIMO SEGUNDO</div>
  <div class="subtitle">CORRA • DESVIE • SOBREVIVA</div>
  <div class="version">V60 • 50 FASES</div>

  <button class="mainBtn" id="play">JOGAR</button>
  <button class="smallBtn" id="phases">FASES</button>
</div>

<div id="phaseMenu" class="screen hidden">
  <div class="phaseTitle">SELECIONE A FASE</div>

  <div class="phases" id="phaseGrid"></div>

  <div class="info">
    FASES DESBLOQUEADAS: <span id="unlockedText">1</span>/50
  </div>

  <button class="smallBtn" id="backMenu">VOLTAR</button>
</div>

<div id="gameOver" class="screen hidden">
  <div class="bigResult">FIM DE JOGO</div>
  <div class="resultText" id="loseText"></div>
  <button class="mainBtn" id="retry">VOLTAR À FASE 1</button>
  <button class="smallBtn" id="loseMenu">MENU</button>
</div>

<div id="victory" class="screen hidden">
  <div class="bigResult">FASE CONCLUÍDA</div>
  <div class="resultText" id="winText"></div>
  <button class="mainBtn" id="next">PRÓXIMA FASE</button>
  <button class="smallBtn" id="winMenu">MENU</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const names=[
"CIDADE NEON",
"CENTRO FUTURISTA",
"VIA NOTURNA",
"ZONA INDUSTRIAL",
"CYBER CITY",
"DISTRITO VERMELHO",
"MEGA TÚNEL",
"CIDADE AÉREA",
"ZONA ZERO",
"ÚLTIMO SEGUNDO"
];

const unlockedKey="ultimoSegundoUnlocked";
let unlocked=Math.max(
  1,
  Math.min(50,Number(localStorage.getItem(unlockedKey)||1))
);

let phase=1;
let running=false;
let score=0;
let coins=0;
let distance=0;
let last=0;
let spawnTimer=0;
let speed=0;
let target=1200;

let lane=1;
let laneVisual=1;

let jumping=false;
let sliding=false;
let jumpTime=0;

let objects=[];

const player={
  x:0,
  y:0
};

function phaseName(p){
  if(p<=5)return names[p-1];
  if(p<=10)return names[p-1];
  return names[(p-1)%10]+" • "+Math.ceil(p/10);
}

function phaseTarget(p){
  return Math.floor(
    1200+
    (p-1)*430+
    Math.pow(p-1,1.22)*15
  );
}

function phaseSpeed(p){
  return .38+
    (p-1)*.010+
    Math.min(.18,p/250);
}

function spawnGap(p){
  if(p<=5)return 2.05;
  if(p<=15)return 1.75;
  if(p<=30)return 1.48;
  if(p<=40)return 1.28;
  return 1.12;
}

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}

function menu(){
  running=false;
  hide("hud");
  hide("gameOver");
  hide("victory");
  hide("phaseMenu");
  show("menu");
}

function phaseScreen(){
  hide("menu");
  hide("gameOver");
  hide("victory");
  show("phaseMenu");
  renderPhases();
}

function renderPhases(){
  const grid=document.getElementById("phaseGrid");
  grid.innerHTML="";

  for(let i=1;i<=50;i++){
    const b=document.createElement("button");
    b.className="phaseBtn";

    if(i<=unlocked){
      b.classList.add("unlocked");
      b.textContent=i;
      b.onclick=()=>startGame(i);
    }else{
      b.classList.add("locked");
      b.textContent="🔒";
    }

    grid.appendChild(b);
  }

  document.getElementById("unlockedText").textContent=unlocked;
}

function startGame(p){
  phase=Math.max(1,Math.min(50,p));

  score=0;
  coins=0;
  distance=0;
  spawnTimer=0;
  objects=[];
  lane=1;
  laneVisual=1;
  jumping=false;
  sliding=false;
  jumpTime=0;
  speed=phaseSpeed(phase);
  target=phaseTarget(phase);

  document.getElementById("phaseName").textContent=phaseName(phase);
  document.getElementById("target").textContent=
    "META "+target;

  updateHud();

  hide("menu");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");
  show("hud");

  running=true;
  last=performance.now();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById("score").textContent=
    Math.floor(score);

  document.getElementById("coins").textContent=
    coins;
}

function roadY(z){
  const top=H*.39;
  const bottom=H*1.04;
  return top+(bottom-top)*z;
}

function roadHalf(z){
  return W*(.07+.43*z);
}

function laneX(l,z){
  const center=W/2;
  const spread=roadHalf(z)*.62;
  return center+(l-1)*spread;
}

function obstacleScale(z){
  return .25+z*1.05;
}

function canSpawn(){
  for(const o of objects){
    if(o.z>.55)return false;
  }
  return true;
}

function spawn(){
  if(!canSpawn())return;

  let available=[0,1,2];

  if(phase>12 && Math.random()<.18){
    available=available.filter(x=>x!==lane);
    if(!available.length)available=[0,1,2];
  }

  const l=
    available[Math.floor(Math.random()*available.length)];

  const type=
    Math.random()<.28 ? "bar" : "block";

  objects.push({
    lane:l,
    z:0,
    type,
    passed:false
  });

  if(Math.random()<.62){
    objects.push({
      lane:(l+1+Math.floor(Math.random()*2))%3,
      z:-.12,
      type:"coin",
      passed:false
    });
  }
}

function jump(){
  if(!running)return;
  if(jumping || sliding)return;

  jumping=true;
  jumpTime=0;
}

function slide(){
  if(!running)return;
  if(jumping)return;

  sliding=true;

  setTimeout(()=>{
    sliding=false;
  },480);
}

function move(dir){
  if(!running)return;

  lane+=dir;

  if(lane<0)lane=0;
  if(lane>2)lane=2;
}

function collision(o){
  if(o.type==="coin")return false;

  if(Math.abs(o.z-1)>.12)return false;

  if(o.lane!==lane)return false;

  if(jumping)return false;

  return true;
}

function collect(o){
  if(o.type!=="coin")return;

  if(Math.abs(o.z-1)<.12 && o.lane===lane){
    o.dead=true;
    coins++;
    score+=100;
  }
}

function update(dt){
  const smooth=Math.min(1,dt*22);

  laneVisual+=(lane-laneVisual)*smooth;

  if(jumping){
    jumpTime+=dt;

    if(jumpTime>.72){
      jumping=false;
      jumpTime=0;
    }
  }

  spawnTimer+=dt;

  const gap=
    spawnGap(phase)/
    Math.max(.72,speed);

  if(spawnTimer>=gap){
    spawnTimer=0;
    spawn();
  }

  const velocity=
    speed*dt*.72;

  for(const o of objects){
    o.z+=velocity;

    collect(o);

    if(collision(o)){
      gameOver();
      return;
    }

    if(!o.passed && o.z>1.05){
      o.passed=true;

      if(o.type!=="coin"){
        score+=25;
      }
    }
  }

  objects=objects.filter(o=>!o.dead && o.z<1.2);

  distance+=dt*speed*100;

  score+=dt*speed*18;

  if(score>=target){
    winPhase();
  }

  updateHud();
}

function drawBackground(){
  const t=performance.now()/1000;

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#05051b");
  g.addColorStop(.48,"#120b32");
  g.addColorStop(1,"#030308");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // lua
  ctx.beginPath();
  ctx.arc(W*.76,H*.17,32,0,Math.PI*2);
  ctx.fillStyle="rgba(120,210,255,.13)";
  ctx.fill();

  // prédios
  const base=H*.48;

  for(let i=0;i<18;i++){
    const bw=W/18+4;
    const x=i*bw;
    const bh=45+(i*37)%130;

    ctx.fillStyle=
      i%2
      ? "rgba(18,20,48,.95)"
      : "rgba(10,12,34,.95)";

    ctx.fillRect(x,base-bh,bw-2,bh);

    for(let y=base-bh+10;y<base-8;y+=16){
      if((i+y)%3<1){
        ctx.fillStyle="rgba(0,225,255,.3)";
        ctx.fillRect(x+5,y,4,7);
      }
    }
  }

  // horizonte
  ctx.fillStyle="rgba(0,230,255,.35)";
  ctx.fillRect(0,base,W,2);
}

function drawRoad(){
  const topY=H*.39;
  const bottomY=H*1.04;

  const topHalf=W*.075;
  const bottomHalf=W*.48;

  ctx.beginPath();
  ctx.moveTo(W/2-topHalf,topY);
  ctx.lineTo(W/2+topHalf,topY);
  ctx.lineTo(W/2+bottomHalf,bottomY);
  ctx.lineTo(W/2-bottomHalf,bottomY);
  ctx.closePath();

  const g=ctx.createLinearGradient(0,topY,0,H);
  g.addColorStop(0,"#11152c");
  g.addColorStop(1,"#070912");

  ctx.fillStyle=g;
  ctx.fill();

  // laterais
  ctx.strokeStyle="rgba(0,225,255,.55)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(W/2-topHalf,topY);
  ctx.lineTo(W/2-bottomHalf,bottomY);
  ctx.moveTo(W/2+topHalf,topY);
  ctx.lineTo(W/2+bottomHalf,bottomY);
  ctx.stroke();

  // faixas das 3 pistas
  for(let l=1;l<=2;l++){
    ctx.beginPath();

    const tx=W/2+(l-1.5)*topHalf*.8;
    const bx=W/2+(l-1.5)*bottomHalf*.8;

    ctx.moveTo(tx,topY);
    ctx.lineTo(bx,bottomY);

    ctx.strokeStyle="rgba(80,150,190,.22)";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // linhas de perspectiva
  for(let i=0;i<13;i++){
    const z=((i/13)+(performance.now()/1000*speed*.35))%1;
    const y=roadY(z);

    const h=3+z*8;

    ctx.fillStyle=
      "rgba(0,220,255,"+(0.05+z*.22)+")";

    ctx.fillRect(
      W/2-roadHalf(z),
      y,
      roadHalf(z)*2,
      h
    );
  }
}

function drawObject(o){
  const z=Math.max(0,o.z);
  const x=laneX(o.lane,z);
  const y=roadY(z);
  const s=obstacleScale(z);

  if(o.type==="coin"){
    ctx.beginPath();
    ctx.arc(x,y-28*s,11*s,0,Math.PI*2);

    ctx.strokeStyle="#ffd84d";
    ctx.lineWidth=5*s;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x,y-28*s,5*s,0,Math.PI*2);
    ctx.strokeStyle="#fff1a0";
    ctx.lineWidth=2*s;
    ctx.stroke();

    return;
  }

  const w=
    (o.type==="bar"?65:48)*s;

  const h=
    (o.type==="bar"?22:58)*s;

  const yy=y-h;

  ctx.shadowBlur=16*s;
  ctx.shadowColor="#ff2d75";

  const g=ctx.createLinearGradient(
    x-w/2,yy,
    x+w/2,yy+h
  );

  g.addColorStop(0,"#ff326f");
  g.addColorStop(1,"#7020bb");

  ctx.fillStyle=g;
  ctx.fillRect(x-w/2,yy,w,h);

  ctx.shadowBlur=0;

  ctx.strokeStyle="rgba(255,255,255,.55)";
  ctx.lineWidth=2*s;
  ctx.strokeRect(x-w/2,yy,w,h);
}

function drawRunner(){
  const x=laneX(laneVisual,.98);

  let y=H*.82;

  let jumpOffset=0;

  if(jumping){
    jumpOffset=
      Math.sin(
        (jumpTime/.72)*Math.PI
      )*H*.15;
  }

  y-=jumpOffset;

  const s=Math.min(W,H)/500;

  // sombra
  ctx.beginPath();
  ctx.ellipse(
    x,
    H*.88,
    28*s,
    9*s,
    0,0,Math.PI*2
  );

  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fill();

  ctx.save();
  ctx.translate(x,y);

  // pernas
  const run=Math.sin(performance.now()/80)*8*s;

  ctx.strokeStyle="#d7faff";
  ctx.lineWidth=10*s;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-8*s,25*s);
  ctx.lineTo((-18+run)*s,58*s);
  ctx.moveTo(8*s,25*s);
  ctx.lineTo((18-run)*s,58*s);
  ctx.stroke();

  // corpo
  const body=
    ctx.createLinearGradient(
      -18*s,-30*s,
      18*s,35*s
    );

  body.addColorStop(0,"#00eaff");
  body.addColorStop(1,"#6737ff");

  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.roundRect(
    -17*s,
    -32*s,
    34*s,
    60*s,
    10*s
  );
  ctx.fill();

  // braços
  ctx.strokeStyle="#d7faff";
  ctx.lineWidth=8*s;

  ctx.beginPath();
  ctx.moveTo(-14*s,-18*s);
  ctx.lineTo((-28-run*.4)*s,12*s);

  ctx.moveTo(14*s,-18*s);
  ctx.lineTo((28+run*.4)*s,12*s);
  ctx.stroke();

  // cabeça
  ctx.beginPath();
  ctx.arc(0,-49*s,16*s,0,Math.PI*2);

  ctx.fillStyle="#bfefff";
  ctx.fill();

  // cabelo/capacete
  ctx.fillStyle="#10152f";

  ctx.beginPath();
  ctx.arc(0,-53*s,16*s,Math.PI,Math.PI*2);
  ctx.fill();

  // visor
  ctx.fillStyle="#00eaff";
  ctx.fillRect(-9*s,-51*s,18*s,5*s);

  ctx.restore();
}

function draw(){
  drawBackground();
  drawRoad();

  const sorted=
    [...objects].sort((a,b)=>a.z-b.z);

  for(const o of sorted){
    drawObject(o);
  }

  drawRunner();
}

function loop(t){
  if(!running)return;

  let dt=(t-last)/1000;
  last=t;

  if(dt>.05)dt=.05;

  update(dt);
  draw();

  if(running){
    requestAnimationFrame(loop);
  }
}

function gameOver(){
  if(!running)return;

  running=false;
  hide("hud");

  document.getElementById("loseText").innerHTML=
    "FASE "+phase+
    "<br>PONTUAÇÃO: "+Math.floor(score)+
    "<br>MOEDAS: "+coins+
    "<br><br>O PROGRESSO DA FASE NÃO É SALVO.";

  show("gameOver");
}

function winPhase(){
  if(!running)return;

  running=false;

  if(phase<50){
    unlocked=Math.max(unlocked,phase+1);
    localStorage.setItem(
      unlockedKey,
      unlocked
    );
  }

  hide("hud");

  document.getElementById("winText").innerHTML=
    "FASE "+phase+
    " • "+phaseName(phase)+
    "<br>PONTUAÇÃO: "+Math.floor(score)+
    "<br>MOEDAS: "+coins+
    "<br><br>"+
    (phase<50
      ?"FASE "+(phase+1)+" DESBLOQUEADA!"
      :"VOCÊ COMPLETOU AS 50 FASES!");

  document.getElementById("next").textContent=
    phase<50
    ?"PRÓXIMA FASE"
    :"JOGAR NOVAMENTE";

  show("victory");
}

// BOTÕES

document.getElementById("play").onclick=()=>{
  startGame(1);
};

document.getElementById("phases").onclick=()=>{
  phaseScreen();
};

document.getElementById("backMenu").onclick=()=>{
  menu();
};

document.getElementById("retry").onclick=()=>{
  startGame(1);
};

document.getElementById("loseMenu").onclick=()=>{
  menu();
};

document.getElementById("next").onclick=()=>{
  if(phase<50){
    startGame(phase+1);
  }else{
    startGame(1);
  }
};

document.getElementById("winMenu").onclick=()=>{
  menu();
};

// CONTROLES TOUCH

let sx=0;
let sy=0;

canvas.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];
  sx=t.clientX;
  sy=t.clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];

  const dx=t.clientX-sx;
  const dy=t.clientY-sy;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25){
    return;
  }

  if(Math.abs(dx)>Math.abs(dy)){
    move(dx>0?1:-1);
  }else{
    if(dy<0){
      jump();
    }else{
      slide();
    }
  }
},{passive:true});

// TECLADO

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key==="ArrowUp"||e.key===" ")jump();
  if(e.key==="ArrowDown")slide();
});

// inicial
menu();

</script>
</body>
</html>
