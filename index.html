<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02050d">
<title>Último Segundo — Neon Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050d;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{
  display:none!important;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.menu-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 38%,rgba(0,220,255,.18),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(255,0,170,.10),transparent 30%),
    linear-gradient(180deg,#02050e 0%,#030916 50%,#01030a 100%);
}

.grid{
  position:absolute;
  inset:0;
  opacity:.22;
  background-image:
    linear-gradient(rgba(0,220,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.12) 1px,transparent 1px);
  background-size:45px 45px;
  transform:perspective(500px) rotateX(60deg) scale(1.8);
  transform-origin:center bottom;
}

.menu-card{
  position:relative;
  width:min(720px,94vw);
  padding:34px 28px 30px;
  border:1px solid rgba(0,225,255,.55);
  border-radius:30px;
  background:rgba(3,9,20,.90);
  box-shadow:
    0 0 70px rgba(0,220,255,.12),
    inset 0 0 35px rgba(0,180,255,.04);
  text-align:center;
}

.logo{
  font-size:clamp(42px,10vw,76px);
  line-height:.88;
  font-weight:1000;
  letter-spacing:-3px;
  text-shadow:
    0 0 8px #fff,
    0 0 30px rgba(0,230,255,.75);
}

.subtitle{
  margin-top:18px;
  letter-spacing:8px;
  color:#a8b8c9;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:34px 0;
}

.stat{
  padding:20px 10px;
  border-radius:20px;
  background:#07101f;
  border:1px solid rgba(255,255,255,.04);
}

.stat b{
  display:block;
  font-size:29px;
}

.stat span{
  display:block;
  margin-top:8px;
  color:#708399;
  font-size:11px;
  letter-spacing:1px;
}

.bigBtn{
  width:100%;
  border:0;
  border-radius:20px;
  padding:21px 18px;
  margin-top:12px;
  background:#08d9f5;
  color:#001018;
  font-size:19px;
  font-weight:1000;
  letter-spacing:2px;
  box-shadow:0 0 30px rgba(0,220,255,.18);
}

.bigBtn:active{
  transform:scale(.98);
}

.bigBtn.secondary{
  background:#0b1728;
  color:#d9f9ff;
  border:1px solid #1e4059;
}

#phaseMenu{
  overflow:auto;
}

.phase-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  max-height:65vh;
  overflow:auto;
  padding:10px 2px;
}

.phase{
  min-height:58px;
  border-radius:13px;
  border:1px solid #1c344b;
  background:#07101c;
  color:#dffaff;
  font-weight:900;
}

.phase.locked{
  opacity:.32;
}

.phase.active{
  border-color:#00eaff;
  box-shadow:0 0 16px rgba(0,220,255,.3);
}

#hud{
  position:fixed;
  z-index:8;
  inset:0;
  pointer-events:none;
}

.top{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:10px;
  right:10px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:7px;
}

.hudBox{
  min-width:0;
  padding:9px 7px;
  border-radius:14px;
  background:rgba(2,7,16,.74);
  border:1px solid rgba(0,220,255,.16);
  text-align:center;
  backdrop-filter:blur(8px);
}

.hudBox small{
  display:block;
  color:#637589;
  font-size:9px;
  letter-spacing:1px;
}

.hudBox b{
  display:block;
  margin-top:3px;
  font-size:17px;
}

#objective{
  position:absolute;
  top:108px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 18px;
  border-radius:30px;
  background:rgba(0,8,18,.55);
  color:#dffcff;
  font-size:12px;
  letter-spacing:2px;
  font-weight:900;
  white-space:nowrap;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#bdfaff;
  box-shadow:0 0 8px #00eaff;
}

#crosshair:before{
  width:25px;
  height:2px;
  top:11px;
}

#crosshair:after{
  width:2px;
  height:25px;
  left:11px;
}

#hit{
  position:absolute;
  left:50%;
  top:50%;
  width:45px;
  height:45px;
  transform:translate(-50%,-50%) scale(.4);
  border:3px solid #fff;
  border-radius:50%;
  opacity:0;
}

#hit.show{
  animation:hit .22s ease-out;
}

@keyframes hit{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}

.bottom{
  position:absolute;
  left:14px;
  right:14px;
  bottom:max(15px,env(safe-area-inset-bottom));
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}

.ammo{
  width:180px;
}

.weapon-name{
  font-size:12px;
  color:#a9bacb;
  letter-spacing:2px;
  margin-bottom:6px;
}

.ammoText{
  font-weight:1000;
  font-size:17px;
}

.bar{
  height:6px;
  margin-top:7px;
  background:#172334;
  border-radius:10px;
  overflow:hidden;
}

#ammoBar{
  width:100%;
  height:100%;
  background:#00eaff;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

.controlBtn{
  width:82px;
  height:62px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(7,15,28,.82);
  color:white;
  font-weight:900;
  font-size:11px;
}

.shoot{
  width:100px;
  height:100px;
  border-radius:50%;
  border:1px solid rgba(0,235,255,.45);
  background:rgba(0,40,62,.78);
  color:#dffcff;
  font-size:14px;
  font-weight:1000;
  letter-spacing:1px;
  box-shadow:0 0 30px rgba(0,220,255,.14);
}

.shoot:active{
  transform:scale(.93);
  background:#00b9d3;
}

#weapon{
  position:absolute;
  right:-10px;
  bottom:90px;
  width:240px;
  height:190px;
  pointer-events:none;
  transform:rotate(-7deg);
}

.gun-body{
  position:absolute;
  right:18px;
  top:48px;
  width:190px;
  height:65px;
  border-radius:18px 38px 15px 15px;
  background:
    linear-gradient(150deg,#eaf5f8,#748493 48%,#202a35 52%,#05090f);
  box-shadow:
    0 0 25px rgba(0,220,255,.18),
    inset 0 2px 3px rgba(255,255,255,.8);
  transform:skewX(-8deg);
}

.gun-top{
  position:absolute;
  right:75px;
  top:28px;
  width:105px;
  height:28px;
  border-radius:8px 20px 5px 5px;
  background:#182533;
  border:1px solid #3e5669;
}

.gun-glow{
  position:absolute;
  right:28px;
  top:73px;
  width:58px;
  height:8px;
  border-radius:10px;
  background:#00eaff;
  box-shadow:0 0 16px #00eaff;
}

.gun-grip{
  position:absolute;
  right:90px;
  top:100px;
  width:45px;
  height:105px;
  border-radius:10px 10px 24px 24px;
  background:linear-gradient(90deg,#111a24,#536170,#111821);
  transform:rotate(13deg);
}

.gun-barrel{
  position:absolute;
  right:0;
  top:63px;
  width:50px;
  height:28px;
  border-radius:5px 15px 15px 5px;
  background:#070d15;
  border:2px solid #2c4052;
}

#toast{
  position:absolute;
  left:50%;
  top:38%;
  transform:translate(-50%,-50%) scale(.8);
  padding:15px 22px;
  border-radius:18px;
  background:rgba(1,7,15,.9);
  border:1px solid #00eaff;
  color:#e9fdff;
  font-weight:1000;
  letter-spacing:2px;
  opacity:0;
  transition:.2s;
  text-align:center;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(0,3,10,.78);
  backdrop-filter:blur(12px);
}

.result{
  width:min(480px,92vw);
  padding:32px 25px;
  text-align:center;
  border-radius:28px;
  background:#050c18;
  border:1px solid #00eaff;
  box-shadow:0 0 60px rgba(0,220,255,.14);
}

.result h1{
  margin:0 0 10px;
  font-size:35px;
}

.result p{
  color:#9cafc1;
  line-height:1.6;
}

@media(max-width:520px){
  .menu-card{
    padding:28px 18px;
  }

  .phase-grid{
    grid-template-columns:repeat(4,1fr);
  }

  #weapon{
    transform:scale(.75) rotate(-7deg);
    transform-origin:right bottom;
    right:-15px;
    bottom:85px;
  }

  .ammo{
    width:135px;
  }

  .shoot{
    width:84px;
    height:84px;
  }

  .controlBtn{
    width:67px;
    height:56px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->
<div id="homeMenu" class="screen">
  <div class="menu-bg"></div>
  <div class="grid"></div>

  <div class="menu-card">

    <div class="logo">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="subtitle">
      NEON STRIKE
    </div>

    <div class="stats">
      <div class="stat">
        <b>50</b>
        <span>FASES</span>
      </div>

      <div class="stat">
        <b>5</b>
        <span>ARMAS</span>
      </div>

      <div class="stat">
        <b>5</b>
        <span>BOSSES</span>
      </div>
    </div>

    <button id="startBtn" class="bigBtn" type="button">
      INICIAR MISSÃO
    </button>

    <button id="phaseBtn" class="bigBtn secondary" type="button">
      SELECIONAR FASE
    </button>

  </div>
</div>

<!-- FASES -->
<div id="phaseMenu" class="screen hidden">

  <div class="menu-bg"></div>

  <div class="menu-card">

    <div class="logo" style="font-size:42px">
      FASES
    </div>

    <div class="subtitle">
      50 MISSÕES
    </div>

    <div id="phaseGrid" class="phase-grid"></div>

    <button id="backBtn" class="bigBtn secondary">
      VOLTAR
    </button>

  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">

  <div class="top">

    <div class="hudBox">
      <small>ALVOS</small>
      <b id="targets">0/8</b>
    </div>

    <div class="hudBox">
      <small id="worldName">CIDADE NEON</small>
      <b id="phaseLabel">FASE 1</b>
    </div>

    <div class="hudBox">
      <small>VIDA</small>
      <b id="lives">❤️❤️❤️</b>
    </div>

    <div class="hudBox">
      <small>MOEDAS</small>
      <b id="coins">0</b>
    </div>

  </div>

  <div id="objective">
    ELIMINE OS ALVOS
  </div>

  <div id="crosshair"></div>
  <div id="hit"></div>

  <div id="toast"></div>

  <div id="weapon">
    <div class="gun-top"></div>
    <div class="gun-body"></div>
    <div class="gun-glow"></div>
    <div class="gun-grip"></div>
    <div class="gun-barrel"></div>
  </div>

  <div class="bottom">

    <div class="ammo">

      <div class="weapon-name" id="weaponName">
        NEON PISTOL
      </div>

      <div>
        MUNIÇÃO
        <span id="ammoText">18 / 72</span>
      </div>

      <div class="bar">
        <div id="ammoBar"></div>
      </div>

    </div>

    <div class="controls">

      <button id="reloadBtn" class="controlBtn">
        RECARREGAR
      </button>

      <button id="shootBtn" class="shoot">
        ATIRAR
      </button>

    </div>

  </div>

</div>

<!-- RESULTADO -->
<div id="resultOverlay" class="overlay hidden">

  <div class="result">

    <h1 id="resultTitle">
      FASE CONCLUÍDA
    </h1>

    <p id="resultText">
      Missão concluída.
    </p>

    <button id="nextBtn" class="bigBtn">
      PRÓXIMA FASE
    </button>

    <button id="menuBtn" class="bigBtn secondary">
      MENU PRINCIPAL
    </button>

  </div>

</div>

<script>
/* =========================================================
   ÚLTIMO SEGUNDO — NEON STRIKE
   VERSÃO INDEPENDENTE
   Sem módulos externos.
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize(){

  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   ELEMENTOS
========================================================= */

const homeMenu = document.getElementById("homeMenu");
const phaseMenu = document.getElementById("phaseMenu");
const hud = document.getElementById("hud");
const resultOverlay = document.getElementById("resultOverlay");

const startBtn = document.getElementById("startBtn");
const phaseBtn = document.getElementById("phaseBtn");
const backBtn = document.getElementById("backBtn");
const shootBtn = document.getElementById("shootBtn");
const reloadBtn = document.getElementById("reloadBtn");
const nextBtn = document.getElementById("nextBtn");
const menuBtn = document.getElementById("menuBtn");

const targetsEl = document.getElementById("targets");
const worldNameEl = document.getElementById("worldName");
const phaseLabelEl = document.getElementById("phaseLabel");
const livesEl = document.getElementById("lives");
const coinsEl = document.getElementById("coins");
const objectiveEl = document.getElementById("objective");
const ammoTextEl = document.getElementById("ammoText");
const ammoBarEl = document.getElementById("ammoBar");
const weaponNameEl = document.getElementById("weaponName");
const toastEl = document.getElementById("toast");
const hitEl = document.getElementById("hit");


/* =========================================================
   PROGRESSÃO
========================================================= */

let unlocked = Number(localStorage.getItem("ultimoSegundoUnlocked") || 1);

if(unlocked < 1) unlocked = 1;
if(unlocked > 50) unlocked = 50;

let currentPhase = 1;

const WORLDS = [
  {
    name:"CIDADE NEON",
    sky:"#020816",
    horizon:"#00dff5",
    road:"#060b14",
    neon:"#00eaff",
    secondary:"#ff2bd6"
  },
  {
    name:"DISTRITO CHUVOSO",
    sky:"#030713",
    horizon:"#3d8cff",
    road:"#050811",
    neon:"#4aa8ff",
    secondary:"#9d4dff"
  },
  {
    name:"ZONA INDUSTRIAL",
    sky:"#100704",
    horizon:"#ff6a20",
    road:"#0b0908",
    neon:"#ff8a25",
    secondary:"#ff254f"
  },
  {
    name:"CIDADE SUSPENSA",
    sky:"#070314",
    horizon:"#b84cff",
    road:"#080612",
    neon:"#d94dff",
    secondary:"#00eaff"
  },
  {
    name:"MEGA TÚNEL",
    sky:"#020b0b",
    horizon:"#00ffb7",
    road:"#030b0a",
    neon:"#00ffb7",
    secondary:"#00bfff"
  },
  {
    name:"BASE TECNOLÓGICA",
    sky:"#02050c",
    horizon:"#ffffff",
    road:"#070b11",
    neon:"#d8f5ff",
    secondary:"#4c8dff"
  },
  {
    name:"CIDADE NOTURNA",
    sky:"#09020c",
    horizon:"#ff42b8",
    road:"#08050d",
    neon:"#ff39c9",
    secondary:"#5b6dff"
  },
  {
    name:"ZONA VERMELHA",
    sky:"#100202",
    horizon:"#ff2535",
    road:"#0d0406",
    neon:"#ff3048",
    secondary:"#ff9b27"
  },
  {
    name:"MEGA CITY",
    sky:"#02050e",
    horizon:"#00c8ff",
    road:"#040810",
    neon:"#00eaff",
    secondary:"#ffd42a"
  },
  {
    name:"ZONA FINAL",
    sky:"#050008",
    horizon:"#ff00aa",
    road:"#060109",
    neon:"#ff00d9",
    secondary:"#00f7ff"
  }
];

const WEAPONS = [
  {
    name:"NEON PISTOL",
    ammo:18,
    reserve:72,
    damage:1,
    fireRate:260
  },
  {
    name:"VOLT SMG",
    ammo:30,
    reserve:120,
    damage:1,
    fireRate:120
  },
  {
    name:"CYBER RIFLE",
    ammo:24,
    reserve:96,
    damage:2,
    fireRate:190
  },
  {
    name:"PLASMA X",
    ammo:12,
    reserve:60,
    damage:3,
    fireRate:420
  },
  {
    name:"OMEGA CANNON",
    ammo:8,
    reserve:40,
    damage:5,
    fireRate:650
  }
];

function getWorld(){
  return WORLDS[Math.floor((currentPhase-1)/5)];
}

function getWeapon(){
  return WEAPONS[Math.min(4,Math.floor((currentPhase-1)/10))];
}

function targetCount(){
  return 8 + Math.floor((currentPhase-1)*.65);
}

function bossPhase(){
  return currentPhase % 10 === 0;
}


/* =========================================================
   ESTADO
========================================================= */

let playing = false;
let paused = false;

let targets = 0;
let totalTargets = 0;
let lives = 3;
let coins = 0;

let ammo = 18;
let reserve = 72;

let lastShot = 0;
let lastTime = 0;
let spawnTimer = 0;
let flash = 0;

let cameraShake = 0;

let enemies = [];
let particles = [];
let stars = [];
let buildings = [];
let roadLights = [];
let rain = [];
let drones = [];

let pointerX = W/2;
let pointerY = H/2;

let toastTimer = 0;


/* =========================================================
   BOTÕES
========================================================= */

startBtn.addEventListener("click",function(e){
  e.preventDefault();
  startGame(1);
});

phaseBtn.addEventListener("click",function(e){
  e.preventDefault();
  openPhaseMenu();
});

backBtn.addEventListener("click",function(e){
  e.preventDefault();
  phaseMenu.classList.add("hidden");
  homeMenu.classList.remove("hidden");
});

shootBtn.addEventListener("click",function(e){
  e.preventDefault();
  shoot();
});

shootBtn.addEventListener("touchstart",function(e){
  e.preventDefault();
  shoot();
},{passive:false});

reloadBtn.addEventListener("click",function(e){
  e.preventDefault();
  reload();
});

nextBtn.addEventListener("click",function(e){
  e.preventDefault();

  if(currentPhase < 50){
    startGame(currentPhase + 1);
  }else{
    showHome();
  }
});

menuBtn.addEventListener("click",function(e){
  e.preventDefault();
  showHome();
});


/* =========================================================
   MENU DE FASES
========================================================= */

function openPhaseMenu(){

  homeMenu.classList.add("hidden");
  phaseMenu.classList.remove("hidden");

  const grid = document.getElementById("phaseGrid");

  grid.innerHTML = "";

  for(let i=1;i<=50;i++){

    const button = document.createElement("button");

    button.className = "phase";

    if(i > unlocked){
      button.classList.add("locked");
      button.textContent = "🔒 " + i;
      button.disabled = true;
    }else{
      button.textContent = i;

      if(i === currentPhase){
        button.classList.add("active");
      }

      button.addEventListener("click",function(){
        startGame(i);
      });
    }

    grid.appendChild(button);
  }
}


/* =========================================================
   INICIAR JOGO
========================================================= */

function startGame(phase){

  currentPhase = Math.max(1,Math.min(50,phase));

  playing = true;
  paused = false;

  targets = 0;
  totalTargets = targetCount();

  lives = 3;
  coins = 0;

  enemies = [];
  particles = [];
  drones = [];

  const weapon = getWeapon();

  ammo = weapon.ammo;
  reserve = weapon.reserve;

  homeMenu.classList.add("hidden");
  phaseMenu.classList.add("hidden");
  resultOverlay.classList.add("hidden");
  hud.classList.remove("hidden");

  setupWorld();

  updateHUD();

  showToast(
    bossPhase()
      ? "⚠ BOSS DETECTADO"
      : "FASE " + currentPhase
  );

  lastTime = performance.now();
}


/* =========================================================
   VOLTAR AO MENU
========================================================= */

function showHome(){

  playing = false;

  hud.classList.add("hidden");
  phaseMenu.classList.add("hidden");
  resultOverlay.classList.add("hidden");

  homeMenu.classList.remove("hidden");
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const world = getWorld();
  const weapon = getWeapon();

  targetsEl.textContent =
    targets + "/" + totalTargets;

  worldNameEl.textContent =
    world.name;

  phaseLabelEl.textContent =
    "FASE " + currentPhase;

  livesEl.textContent =
    "❤️".repeat(Math.max(0,lives)) +
    "🖤".repeat(Math.max(0,3-lives));

  coinsEl.textContent =
    coins;

  weaponNameEl.textContent =
    weapon.name;

  ammoTextEl.textContent =
    ammo + " / " + reserve;

  ammoBarEl.style.width =
    ((ammo / weapon.ammo) * 100) + "%";

  objectiveEl.textContent =
    bossPhase()
      ? "ELIMINE O BOSS"
      : "ELIMINE " + totalTargets + " ALVOS";
}


/* =========================================================
   MUNDO
========================================================= */

function setupWorld(){

  stars = [];
  buildings = [];
  roadLights = [];
  rain = [];
  drones = [];

  const world = getWorld();

  for(let i=0;i<90;i++){

    stars.push({
      x:Math.random(),
      y:Math.random()*.55,
      size:Math.random()*2+.4,
      alpha:Math.random()*.7+.2
    });
  }

  for(let i=0;i<34;i++){

    buildings.push({
      x:i/34 + Math.random()*.025,
      w:.018 + Math.random()*.035,
      h:.06 + Math.random()*.25,
      color:i%2 ? world.neon : world.secondary
    });
  }

  for(let i=0;i<22;i++){

    roadLights.push({
      side:i%2,
      z:i/22,
      pulse:Math.random()*Math.PI*2
    });
  }

  if(currentPhase >= 6){

    for(let i=0;i<130;i++){

      rain.push({
        x:Math.random(),
        y:Math.random(),
        speed:.3+Math.random()*.7,
        length:8+Math.random()*18
      });
    }
  }

  if(currentPhase >= 16){

    for(let i=0;i<5;i++){

      drones.push({
        x:Math.random(),
        y:.25+Math.random()*.25,
        phase:Math.random()*Math.PI*2
      });
    }
  }
}


/* =========================================================
   INIMIGOS
========================================================= */

function spawnEnemy(){

  if(!playing) return;

  if(targets >= totalTargets) return;

  const boss = bossPhase() && enemies.length === 0;

  const lane =
    Math.floor(Math.random()*3)-1;

  enemies.push({
    lane,
    z:1.0,
    hp:boss ? 15 : 1 + Math.floor((currentPhase-1)/12),
    maxHp:boss ? 15 : 1 + Math.floor((currentPhase-1)/12),
    boss,
    wobble:Math.random()*Math.PI*2,
    hit:0,
    alive:true
  });
}


/* =========================================================
   PROJEÇÃO
========================================================= */

function project(enemy){

  const depth = Math.max(.08,enemy.z);

  const perspective =
    1 / depth;

  const roadTop =
    H*.43;

  const roadBottom =
    H*1.08;

  const y =
    roadTop +
    (roadBottom-roadTop) *
    Math.pow(Math.min(1,perspective/9),.72);

  const roadWidth =
    W*.9 *
    Math.min(1,perspective/8);

  const x =
    W/2 +
    enemy.lane *
    roadWidth*.27;

  const scale =
    Math.min(3.5,Math.max(.35,perspective*.16));

  return {
    x,
    y,
    scale
  };
}


/* =========================================================
   TIRO
========================================================= */

function shoot(){

  if(!playing) return;

  const now = performance.now();

  const weapon = getWeapon();

  if(now-lastShot < weapon.fireRate){
    return;
  }

  lastShot = now;

  if(ammo <= 0){

    showToast("SEM MUNIÇÃO");

    return;
  }

  ammo--;

  flash = 1;
  cameraShake = .45;

  createMuzzle();

  let closest = null;
  let closestDepth = Infinity;

  for(const enemy of enemies){

    if(!enemy.alive) continue;

    const p = project(enemy);

    const dx =
      Math.abs(p.x-W/2);

    const dy =
      Math.abs(p.y-H*.50);

    const tolerance =
      enemy.boss ? 180 : 130;

    if(dx < tolerance && dy < 180){

      if(enemy.z < closestDepth){

        closest = enemy;
        closestDepth = enemy.z;
      }
    }
  }

  if(closest){

    closest.hp -= weapon.damage;
    closest.hit = 1;

    hitEl.classList.remove("show");
    void hitEl.offsetWidth;
    hitEl.classList.add("show");

    createExplosion(
      project(closest).x,
      project(closest).y,
      closest.boss ? 26 : 13
    );

    if(closest.hp <= 0){

      closest.alive = false;

      if(closest.boss){

        targets = totalTargets;

        coins += 15;

        showToast("BOSS DESTRUÍDO");

      }else{

        targets++;

        coins += 1;

      }

      updateHUD();

      if(targets >= totalTargets){

        setTimeout(completePhase,450);
      }
    }
  }

  updateHUD();
}


/* =========================================================
   RECARREGAR
========================================================= */

function reload(){

  if(!playing) return;

  const weapon = getWeapon();

  if(ammo >= weapon.ammo){
    return;
  }

  if(reserve <= 0){
    showToast("SEM RESERVA");
    return;
  }

  const need =
    weapon.ammo-ammo;

  const amount =
    Math.min(need,reserve);

  ammo += amount;
  reserve -= amount;

  updateHUD();
}


/* =========================================================
   EXPLOSÃO
========================================================= */

function createExplosion(x,y,count){

  const world = getWorld();

  for(let i=0;i<count;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      1+Math.random()*5;

    particles.push({
      x,
      y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      size:2+Math.random()*5,
      color:i%2
        ? world.neon
        : world.secondary
    });
  }
}

function createMuzzle(){

  const x=W*.86;
  const y=H*.72;

  for(let i=0;i<12;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:.35+Math.random()*.3,
      size:2+Math.random()*5,
      color:"#ffffff"
    });
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x += p.vx*dt*60;
    p.y += p.vy*dt*60;

    p.vy += .08;

    p.life -= dt*2.4;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle =
      p.color;

    ctx.shadowBlur = 14;
    ctx.shadowColor = p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}


/* =========================================================
   CENÁRIO
========================================================= */

function drawWorld(time){

  const world = getWorld();

  const sky =
    ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,world.sky);
  sky.addColorStop(.48,world.sky);
  sky.addColorStop(.55,world.horizon);
  sky.addColorStop(1,"#010207");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* estrelas */

  for(const s of stars){

    ctx.globalAlpha=s.alpha;

    ctx.fillStyle="#c9f8ff";

    ctx.fillRect(
      s.x*W,
      s.y*H,
      s.size,
      s.size
    );
  }

  ctx.globalAlpha=1;

  /* cidade */

  const horizon=H*.43;

  for(const b of buildings){

    const x=b.x*W;
    const bw=b.w*W;
    const bh=b.h*H;

    ctx.fillStyle="#050b15";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );

    const rows=Math.max(2,Math.floor(bh/18));

    for(let r=0;r<rows;r++){

      if(Math.random()>.3){

        ctx.fillStyle=b.color;

        ctx.globalAlpha=.32;

        ctx.fillRect(
          x+bw*.2,
          horizon-bh+r*16+5,
          Math.max(2,bw*.18),
          4
        );
      }
    }

    ctx.globalAlpha=1;
  }

  /* brilho do horizonte */

  const glow =
    ctx.createRadialGradient(
      W/2,
      horizon,
      5,
      W/2,
      horizon,
      W*.55
    );

  glow.addColorStop(0,world.horizon+"99");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.fillRect(0,horizon-120,W,250);


  /* estrada */

  const roadTop=H*.43;

  ctx.fillStyle=world.road;

  ctx.beginPath();

  ctx.moveTo(W*.44,roadTop);
  ctx.lineTo(W*.56,roadTop);
  ctx.lineTo(W*1.05,H);
  ctx.lineTo(-W*.05,H);
  ctx.closePath();

  ctx.fill();


  /* laterais neon */

  ctx.strokeStyle=world.neon;
  ctx.lineWidth=3;
  ctx.shadowBlur=15;
  ctx.shadowColor=world.neon;

  ctx.beginPath();
  ctx.moveTo(W*.44,roadTop);
  ctx.lineTo(-W*.04,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.56,roadTop);
  ctx.lineTo(W*1.04,H);
  ctx.stroke();


  /* linhas da estrada */

  for(let i=0;i<12;i++){

    const p=((i/12)+(performance.now()/7000))%1;

    const y =
      roadTop+
      Math.pow(p,2)*H*.7;

    const width =
      3+p*12;

    const x1 =
      W/2-width*10;

    const x2 =
      W/2+width*10;

    ctx.strokeStyle=world.secondary;
    ctx.globalAlpha=.25+p*.7;
    ctx.lineWidth=Math.max(1,p*5);

    ctx.beginPath();
    ctx.moveTo(W/2,y);
    ctx.lineTo(W/2,y+width*4);
    ctx.stroke();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;


  /* postes */

  for(let i=0;i<12;i++){

    const p=((i/12)+(performance.now()/10000))%1;

    const y =
      roadTop+
      Math.pow(p,2)*H*.7;

    const height =
      12+p*75;

    const side =
      i%2 ? 1 : -1;

    const x =
      W/2+
      side*(W*.12+p*W*.43);

    ctx.strokeStyle=world.neon;
    ctx.lineWidth=Math.max(1,p*3);
    ctx.shadowBlur=12;
    ctx.shadowColor=world.neon;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x,y-height);
    ctx.stroke();

    ctx.fillStyle=world.neon;

    ctx.beginPath();
    ctx.arc(x,y-height,Math.max(2,p*7),0,Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur=0;


  /* chuva */

  if(currentPhase>=6){

    ctx.strokeStyle=world.neon;
    ctx.globalAlpha=.22;

    for(const r of rain){

      const x=r.x*W;
      const y=((r.y + time*r.speed*.0005)%1)*H;

      ctx.beginPath();

      ctx.moveTo(x,y);
      ctx.lineTo(x-4,y+r.length);

      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }


  /* drones */

  if(currentPhase>=16){

    for(const d of drones){

      const x =
        d.x*W+
        Math.sin(time*.001+d.phase)*35;

      const y =
        d.y*H+
        Math.sin(time*.002+d.phase)*12;

      ctx.fillStyle=world.secondary;

      ctx.shadowBlur=18;
      ctx.shadowColor=world.secondary;

      ctx.beginPath();
      ctx.ellipse(x,y,18,6,0,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle=world.neon;

      ctx.beginPath();
      ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fill();
    }

    ctx.shadowBlur=0;
  }
}


/* =========================================================
   DESENHAR INIMIGOS
========================================================= */

function drawEnemy(enemy,time){

  if(!enemy.alive) return;

  const p=project(enemy);

  const s=p.scale;

  const x=p.x;
  const y=p.y;

  const world=getWorld();

  const bob =
    Math.sin(time*.004+enemy.wobble)*4*s;

  const cy=y+bob;

  if(enemy.boss){

    drawBoss(x,cy,s,enemy,world);

    return;
  }


  /* sombra */

  ctx.fillStyle="rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+12*s,
    28*s,
    9*s,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* pernas */

  ctx.strokeStyle="#1e2d3d";
  ctx.lineWidth=Math.max(3,7*s);
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x-10*s,cy+30*s);
  ctx.lineTo(x-13*s,cy+55*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+10*s,cy+30*s);
  ctx.lineTo(x+13*s,cy+55*s);
  ctx.stroke();


  /* botas */

  ctx.fillStyle="#07101b";

  ctx.fillRect(
    x-20*s,
    cy+51*s,
    15*s,
    7*s
  );

  ctx.fillRect(
    x+5*s,
    cy+51*s,
    15*s,
    7*s
  );


  /* braços */

  ctx.strokeStyle="#314456";
  ctx.lineWidth=Math.max(4,8*s);

  ctx.beginPath();
  ctx.moveTo(x-22*s,cy-7*s);
  ctx.lineTo(x-39*s,cy+17*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+22*s,cy-7*s);
  ctx.lineTo(x+39*s,cy+17*s);
  ctx.stroke();


  /* corpo */

  const bodyGrad=
    ctx.createLinearGradient(
      x-25*s,
      cy-25*s,
      x+25*s,
      cy+35*s
    );

  bodyGrad.addColorStop(0,"#718496");
  bodyGrad.addColorStop(.45,"#243342");
  bodyGrad.addColorStop(1,"#080f18");

  ctx.fillStyle=bodyGrad;

  roundRect(
    ctx,
    x-25*s,
    cy-20*s,
    50*s,
    58*s,
    13*s
  );

  ctx.fill();


  /* visor */

  ctx.fillStyle="#03070c";

  roundRect(
    ctx,
    x-24*s,
    cy-33*s,
    48*s,
    27*s,
    11*s
  );

  ctx.fill();


  ctx.fillStyle=world.neon;

  ctx.shadowBlur=14;
  ctx.shadowColor=world.neon;

  roundRect(
    ctx,
    x-16*s,
    cy-25*s,
    32*s,
    7*s,
    4*s
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* núcleo */

  ctx.fillStyle=world.secondary;

  ctx.shadowBlur=18;
  ctx.shadowColor=world.secondary;

  ctx.beginPath();

  ctx.arc(
    x,
    cy+5*s,
    7*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* barra de vida */

  if(enemy.maxHp>1){

    const bw=58*s;

    ctx.fillStyle="rgba(0,0,0,.7)";
    ctx.fillRect(
      x-bw/2,
      cy-48*s,
      bw,
      5*s
    );

    ctx.fillStyle=world.neon;

    ctx.fillRect(
      x-bw/2,
      cy-48*s,
      bw*(enemy.hp/enemy.maxHp),
      5*s
    );
  }
}


/* =========================================================
   BOSS
========================================================= */

function drawBoss(x,y,s,enemy,world){

  s*=1.5;

  ctx.shadowBlur=30;
  ctx.shadowColor=world.secondary;

  ctx.fillStyle="#120b1c";

  roundRect(
    ctx,
    x-45*s,
    y-58*s,
    90*s,
    115*s,
    20*s
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* ombros */

  ctx.fillStyle="#3a4556";

  ctx.beginPath();
  ctx.arc(x-54*s,y-30*s,16*s,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+54*s,y-30*s,16*s,0,Math.PI*2);
  ctx.fill();


  /* cabeça */

  ctx.fillStyle="#718496";

  roundRect(
    ctx,
    x-42*s,
    y-85*s,
    84*s,
    43*s,
    17*s
  );

  ctx.fill();


  ctx.fillStyle=world.neon;

  ctx.shadowBlur=20;
  ctx.shadowColor=world.neon;

  roundRect(
    ctx,
    x-28*s,
    y-70*s,
    56*s,
    9*s,
    5*s
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* núcleo grande */

  ctx.fillStyle=world.secondary;

  ctx.shadowBlur=30;
  ctx.shadowColor=world.secondary;

  ctx.beginPath();
  ctx.arc(x,y+2*s,15*s,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;


  /* vida */

  const bw=130*s;

  ctx.fillStyle="#06080d";

  ctx.fillRect(
    x-bw/2,
    y-110*s,
    bw,
    8*s
  );

  ctx.fillStyle=world.neon;

  ctx.fillRect(
    x-bw/2,
    y-110*s,
    bw*(enemy.hp/enemy.maxHp),
    8*s
  );
}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(c,x,y,w,h,r){

  c.beginPath();

  c.moveTo(x+r,y);

  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);

  c.closePath();
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt,time){

  if(!playing) return;

  spawnTimer -= dt*1000;

  if(
    spawnTimer<=0 &&
    targets<totalTargets
  ){

    spawnEnemy();

    const difficulty =
      Math.max(
        360,
        950-currentPhase*10
      );

    spawnTimer=difficulty;
  }


  for(const enemy of enemies){

    if(!enemy.alive) continue;

    const speed =
      .00013+
      currentPhase*.000002;

    enemy.z -= speed*dt*1000;

    enemy.hit*=.86;

    if(enemy.z<.06){

      enemy.alive=false;

      if(!enemy.boss){

        lives--;

        cameraShake=.8;

        updateHUD();

        if(lives<=0){

          gameOver();

          return;
        }
      }
    }
  }

  enemies =
    enemies.filter(e=>e.alive);

  updateParticles(dt);

  flash*=.84;
  cameraShake*=.9;

  if(toastTimer>0){

    toastTimer-=dt;

    if(toastTimer<=0){
      toastEl.classList.remove("show");
    }
  }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  playing=false;

  resultOverlay.classList.remove("hidden");

  document.getElementById("resultTitle").textContent =
    "MISSÃO FALHOU";

  document.getElementById("resultText").textContent =
    "Você foi eliminado na Fase " +
    currentPhase +
    ". Tente novamente.";

  nextBtn.textContent="TENTAR NOVAMENTE";

  nextBtn.onclick=function(){

    resultOverlay.classList.add("hidden");

    startGame(currentPhase);
  };
}


/* =========================================================
   FASE CONCLUÍDA
========================================================= */

function completePhase(){

  if(!playing) return;

  playing=false;

  if(currentPhase<50){

    if(currentPhase+1>unlocked){

      unlocked=currentPhase+1;

      localStorage.setItem(
        "ultimoSegundoUnlocked",
        unlocked
      );
    }
  }

  resultOverlay.classList.remove("hidden");

  if(currentPhase===50){

    document.getElementById("resultTitle").textContent =
      "ÚLTIMO SEGUNDO";

    document.getElementById("resultText").textContent =
      "Você completou as 50 fases e venceu a operação.";

    nextBtn.textContent="JOGAR NOVAMENTE";

    nextBtn.onclick=function(){

      resultOverlay.classList.add("hidden");

      startGame(1);
    };

  }else{

    document.getElementById("resultTitle").textContent =
      "FASE " + currentPhase + " CONCLUÍDA";

    document.getElementById("resultText").textContent =
      "Alvos destruídos: " +
      targets +
      " • Moedas: " +
      coins;

    nextBtn.textContent =
      "FASE " + (currentPhase+1);
  }
}

/* =========================================================
   LOOP
========================================================= */

function render(time){

  const dt =
    Math.min(.033,(time-lastTime)/1000 || .016);

  lastTime=time;

  update(dt,time);

  let shakeX=0;
  let shakeY=0;

  if(cameraShake>.02){

    shakeX=(Math.random()-.5)*cameraShake*14;
    shakeY=(Math.random()-.5)*cameraShake*14;
  }

  ctx.save();

  ctx.translate(shakeX,shakeY);

  drawWorld(time);

  for(const enemy of enemies){
    drawEnemy(enemy,time);
  }

  drawParticles();

  if(flash>.05){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      (flash*.16)+")";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }

  ctx.restore();

  requestAnimationFrame(render);
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

setupWorld();

updateHUD();

requestAnimationFrame(function(t){

  lastTime=t;

  render(t);
});


/* =========================================================
