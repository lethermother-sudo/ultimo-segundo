<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.hidden{
  display:none!important;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:calc(8px + env(safe-area-inset-top)) 8px 7px;
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr 1fr;
  gap:5px;
  pointer-events:none;
}

.box{
  min-width:0;
  padding:7px 8px;
  border-radius:12px;
  background:rgba(2,8,18,.82);
  border:1px solid rgba(0,235,255,.28);
  backdrop-filter:blur(10px);
}

.label{
  color:#758c9d;
  font-size:7px;
  letter-spacing:1.5px;
  font-weight:900;
}

.value{
  margin-top:2px;
  font-size:15px;
  font-weight:1000;
}

#phaseName{
  color:#00eaff;
  font-size:8px;
  letter-spacing:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#phaseNum{
  text-align:center;
  font-size:13px;
}

/* ================= OBJETIVO ================= */

#objective{
  position:fixed;
  top:78px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:6px 13px;
  border-radius:20px;
  background:rgba(2,8,18,.72);
  border:1px solid rgba(0,235,255,.2);
  font-size:9px;
  font-weight:1000;
  letter-spacing:1.5px;
  white-space:nowrap;
  pointer-events:none;
}

/* ================= MIRA ================= */

#crosshair{
  position:fixed;
  left:50%;
  top:51%;
  width:34px;
  height:34px;
  transform:translate(-50%,-50%);
  z-index:18;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#dfffff;
  box-shadow:0 0 8px #00eaff;
}

#crosshair:before{
  width:2px;
  height:34px;
  left:16px;
}

#crosshair:after{
  width:34px;
  height:2px;
  top:16px;
}

#dot{
  position:absolute;
  width:4px;
  height:4px;
  left:15px;
  top:15px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 10px #00eaff;
}

#hit{
  position:fixed;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%);
  z-index:30;
  opacity:0;
  color:white;
  font-size:27px;
  text-shadow:0 0 20px #00eaff;
  pointer-events:none;
}

#hit.show{
  animation:hit .22s ease-out;
}

@keyframes hit{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.7);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.35);
  }
}

#damage{
  position:fixed;
  inset:0;
  z-index:29;
  pointer-events:none;
}

#flash{
  position:fixed;
  inset:0;
  z-index:30;
  background:white;
  opacity:0;
  pointer-events:none;
}

/* ================= CONTROLES ================= */

#bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:170px;
  z-index:21;
  pointer-events:none;
}

#ammo{

#ammoBar{

#ammoFill{

#weaponName{

#controls{

.btn{

#reload{

}

#shoot:active{

}

/* ================= TELAS ================= */

.screen{

  align-items:center;
  justify-content:center;

.panel{

  border-radius:23px;
  background:rgba(4,8,20,.92);
  border:1px solid rgba(0,238,255,.3);

  text-align:center;
  backdrop-filter:blur(15px);
}

.title{
  font-size:36px;
  line-height:.94;
  font-weight:1000;
  letter-spacing:-2px;
  text-shadow:0 0 25px #00eaff;
}

.subtitle{
  margin:8px 0 20px;
  color:#8197a5;
  font-size:9px;
  letter-spacing:3px;
}

.bigBtn{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background:#00eaff;
  color:#001014;
  font-size:12px;
  font-weight:1000;
  letter-spacing:1px;
}

.bigBtn.secondary{

}

.stats{

.stat{

.stat b{

}

.stat span{

#phaseGrid{

.phaseBtn{

/* ================= ERRO ================= */

#errorScreen{

/* ================= MOBILE ================= */

@media(max-width:500px){

    gap:4px;
  }

/* =========================================================

========================================================= */

function currentWorld(){

    Math.min(
      9,

    )

}

function currentWeapon(){

function makeMetal(
  color,
  rough=.35,
  metalness=.75
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness
  });

}

function makeGlow(color){

  return new THREE.MeshBasicMaterial({
    color
  });

}


/* =========================================================
   LIMPAR GRUPO
========================================================= */

function clearGroup(group){

  if(!group)
    return;

  while(group.children.length){

    const object=
      group.children[0];

    group.remove(object);

    object.traverse(
      child=>{

        if(child.geometry)
          child.geometry.dispose();

        if(child.material){

          if(Array.isArray(child.material)){

            child.material.forEach(
              m=>m.dispose()
            );

          }else{

            child.material.dispose();

          }

        }

      }
    );

  }

}


/* =========================================================

========================================================= */

function showError(message){

  document
    .getElementById("errorText")
    .textContent=message;

  document
    .getElementById("errorScreen")
    .classList.remove("hidden");

}


/* =========================================================
   INICIALIZAÇÃO SEGURA
========================================================= */

async function boot(){

  // ============================================
  // BOTÕES — LIGADOS IMEDIATAMENTE
  // Não dependem do carregamento do 3D
  // ============================================

  const startBtn = document.getElementById("startBtn");
  const phaseBtn = document.getElementById("phaseBtn");

  if(startBtn){
    startBtn.addEventListener("click", () => {

      const home = document.getElementById("homeMenu");
      const game = document.getElementById("gameScreen");

      if(home) home.classList.add("hidden");
      if(game) game.classList.remove("hidden");

      // Se o sistema do jogo já estiver pronto
      if(typeof startGame === "function"){
        try{
          startGame();
        }catch(error){
          console.error("Erro ao iniciar missão:", error);
        }
      }

    });
  }

  if(phaseBtn){
    phaseBtn.addEventListener("click", () => {

      const home = document.getElementById("homeMenu");
      const phases = document.getElementById("phaseMenu");

      if(home) home.classList.add("hidden");
      if(phases) phases.classList.remove("hidden");

    });
  }


  // ============================================
  // CARREGAMENTO DO THREE.JS
  // ============================================

  try{

    THREE = await import(THREE_URL);

  }catch(error){

    console.error("Erro ao carregar Three.js:", error);

    const errorScreen = document.getElementById("errorScreen");

    if(errorScreen){
      errorScreen.classList.remove("hidden");
    }

    return;
  }


  // ============================================
  // EFEITOS VISUAIS — OPCIONAIS
  // Se falharem, o jogo continua normalmente
  // ============================================

  try{

    const modules = await Promise.all([

      import(
        ADDON_BASE +
        "EffectComposer.js"
      ),

      import(
        ADDON_BASE +
        "RenderPass.js"
      ),

      import(
        ADDON_BASE +
        "UnrealBloomPass.js"
      ),

      import(
        ADDON_BASE +
        "OutputPass.js"
      )

    ]);

    EffectComposer = modules[0].EffectComposer;
    RenderPass = modules[1].RenderPass;
    UnrealBloomPass = modules[2].UnrealBloomPass;
    OutputPass = modules[3].OutputPass;

  }catch(error){

    console.warn(
      "Bloom indisponível. Continuando sem bloom.",
      error
    );

    EffectComposer = null;
    RenderPass = null;
    UnrealBloomPass = null;
    OutputPass = null;

  }


  // ============================================
  // INICIALIZAÇÃO DO JOGO
  // ============================================

  try{

    createRenderer();

    createScene();

    setupEvents();

    setupPhase();

    animate(
      performance.now()
    );

  }catch(error){

    console.error(
      "Erro ao iniciar sistema gráfico:",
      error
    );

    showError(
      "O sistema gráfico não conseguiu iniciar."
    );

  }

}


// ============================================
// INICIA O SISTEMA
// ============================================

boot();

    createRenderer();
    createScene();
    setupEvents();

    setupPhase();

    animate(
      performance.now()
    );

  }catch(error){

    console.error(error);

    showError(
      "O sistema gráfico não conseguiu iniciar. Recarregue a página e tente novamente."
    );

  }

}


/* =========================================================
   RENDERER
========================================================= */

function createRenderer(){

  try{

    renderer=
      new THREE.WebGLRenderer({
        antialias:false,
        alpha:false,
        powerPreference:"high-performance"
      });

  }catch(error){

    showError(
      "O navegador não conseguiu criar o modo gráfico 3D."
    );

    throw error;

  }


  const mobile=
    innerWidth<700;

  renderer.setPixelRatio(
    mobile
    ? Math.min(devicePixelRatio,1.05)
    : Math.min(devicePixelRatio,1.25)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.outputColorSpace=
    THREE.SRGBColorSpace;

  renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=
    1.08;

  document
    .getElementById("game")
    .appendChild(
      renderer.domElement
    );


  /*
    Composer é opcional.
  */

  if(
    EffectComposer &&
    RenderPass &&
    OutputPass
  ){

    try{

      composer=
        new EffectComposer(
          renderer
        );

      composer.addPass(
        new RenderPass(
          scene,
          camera
        )
      );

      if(UnrealBloomPass){

        bloom=
          new UnrealBloomPass(
            new THREE.Vector2(
              innerWidth,
              innerHeight
            ),
            .55,
            .45,
            .8
          );

        composer.addPass(
          bloom
        );

      }

      composer.addPass(
        new OutputPass()
      );

    }catch(error){

      console.warn(
        "Composer desativado:",
        error
      );

      composer=null;

    }

  }

}

function createRain(){

  const count=
    innerWidth<700
    ? 380

    new Float32Array(
      count*3

/* =========================================================
   TIRO
========================================================= */

const raycaster=
  new THREE.Raycaster();


function shoot(){

  if(
    !running||
    reloading
  )
    return;


  if(ammo<=0){

    reload();

    return;

  }


  ammo--;

  updateAmmo();


  const flash=
    document.getElementById(
      "flash"
    );

  flash.style.opacity=".15";

  setTimeout(
    ()=>{
      flash.style.opacity="0";
    },
    35
  );


  if(weaponGroup){

    weaponGroup.position.z=.08;

    setTimeout(
      ()=>{
        if(weaponGroup)
          weaponGroup.position.z=0;
      },
      55
    );

  }


  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const objects=[
    ...enemies,
    ...crates
  ];


  const hits=
    raycaster.intersectObjects(
      objects,
      true
    );


  let enemy=null;
  let crate=null;
  let point=null;


  if(hits.length){

    let object=
      hits[0].object;

    point=
      hits[0].point.clone();


    while(object){

      if(
        enemies.includes(object)
      ){

        enemy=object;
        break;

      }


      if(
        crates.includes(object)
      ){

        crate=object;
        break;

      }


      object=
        object.parent;

    }

  }


  /* assistência de mira */

  if(!enemy&&!crate){

    let closest=null;
    let closestDistance=.3;


    for(
      const e of enemies
    ){

      const p=
        e.position.clone();

      p.y+=1.4;

      p.project(camera);


      const distance=
        Math.sqrt(
          p.x*p.x+
          p.y*p.y
        );


      if(
        distance<closestDistance &&
        p.z>-1 &&
        p.z<1
      ){

        closest=e;
        closestDistance=
          distance;

      }

    }


    if(closest){

      enemy=closest;

      point=
        closest.position.clone();

      point.y+=1.4;

    }

  }


  const start=
    camera.position.clone();


  if(enemy){

    createTracer(
      start,
      point
    );

    hitEnemy(
      enemy,
      point
    );

    showHit();

  }
  else if(crate){

    createTracer(
      start,
      point
    );

    hitCrate(
      crate,
      point
    );

    showHit();

  }
  else{

    const direction=
      new THREE.Vector3(
        0,
        0,
        -1
      ).applyQuaternion(
        camera.quaternion
      );


    const end=
      start.clone().add(
        direction.multiplyScalar(80)
      );


    createTracer(
      start,
      end
    );

  }

}


/* =========================================================
   ACERTO INIMIGO
========================================================= */

function hitEnemy(
  enemy,
  point
){

  enemy.userData.hp-=
    weapon.damage;


  explode(
    point,
    enemy.userData.boss
    ? 0xff00d4
    : currentWorld().neon
  );


  const ratio=
    Math.max(
      0,
      enemy.userData.hp/
      enemy.userData.maxHp
    );


  if(enemy.userData.hpFill){

    enemy.userData.hpFill.scale.x=
      ratio;

  }


  if(
    enemy.userData.hp<=0
  ){

    const index=
      enemies.indexOf(
        enemy
      );

    if(index>=0)
      enemies.splice(
        index,
        1
      );


    enemyGroup.remove(
      enemy
    );


    kills++;

    coins+=
      enemy.userData.boss
      ? 10
      : 1;


    updateHUD();


    if(
      enemy.userData.boss
    ){

      showToast(
        "BOSS ELIMINADO"
      );

    }


    if(
      kills>=target
    ){

      completePhase();

    }

  }

}


/* =========================================================
   ACERTO CAIXA
========================================================= */

function hitCrate(
  crate,
  point
){

  crate.userData.hp--;

  explode(
    point,
    0xffa000
  );


  if(
    crate.userData.hp<=0
  ){

    const index=
      crates.indexOf(
        crate
      );

    if(index>=0)
      crates.splice(
        index,
        1
      );


    crateGroup.remove(
      crate
    );


    coins++;

    updateHUD();

  }

}


/* =========================================================
   RECARREGAR
========================================================= */

function reload(){

  if(
    !running||
    reloading||
    ammo>=weapon.ammo||
    reserve<=0
  )
    return;


  reloading=true;


  document
    .getElementById(
      "ammoText"
    )
    .textContent=
      "RECARREGANDO...";


  setTimeout(
    ()=>{

      const need=
        weapon.ammo-ammo;

      const amount=
        Math.min(
          need,
          reserve
        );


      ammo+=amount;
      reserve-=amount;

      reloading=false;

      updateAmmo();

    },
    750
  );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "kills"
  ).textContent=
    kills;


  document.getElementById(
    "target"
  ).textContent=
    target;


  document.getElementById(
    "phaseNum"
  ).textContent=
    `FASE ${phase}`;


  document.getElementById(
    "phaseName"
  ).textContent=
    currentWorld().name;


  document.getElementById(
    "life"
  ).textContent=
    "❤️".repeat(
      Math.max(
        0,
        lives
      )
    );


  document.getElementById(
    "coins"
  ).textContent=
    coins;


  document.getElementById(
    "weaponName"
  ).textContent=
    weapon.name;


  document.getElementById(
    "objective"
  ).textContent=
    `ELIMINE ${target} ALVOS`;

}


function updateAmmo(){

  document.getElementById(
    "ammoText"
  ).textContent=
    `MUNIÇÃO ${ammo} / ${reserve}`;


  document.getElementById(
    "ammoFill"
  ).style.width=
    `${
      Math.max(
        0,
        ammo/weapon.ammo*100
      )
    }%`;

}


/* =========================================================
   HIT
========================================================= */

function showHit(){

  const element=
    document.getElementById(
      "hit"
    );

  element.classList.remove(
    "show"
  );

  void element.offsetWidth;

  element.classList.add(
    "show"
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  const old=
    document.getElementById(
      "toast"
    );

  if(old)
    old.remove();


  const t=
    document.createElement(
      "div"
    );


  t.id="toast";

  t.textContent=text;


  t.style.cssText=`
    position:fixed;
    left:50%;
    top:34%;
    transform:translate(-50%,-50%);
    z-index:80;
    color:white;
    font-size:21px;
    font-weight:1000;
    letter-spacing:2px;
    text-shadow:0 0 20px #00eaff;
    pointer-events:none;
    transition:.65s;
  `;


  document.body.appendChild(t);


  setTimeout(
    ()=>{
      t.style.opacity="0";
      t.style.transform=
        "translate(-50%,-70%) scale(1.1)";
    },
    30
  );


  setTimeout(
    ()=>{
      t.remove();
    },
    700
  );

}


/* =========================================================
   DANO
========================================================= */

function damagePlayer(){

  if(!running)
    return;


  lives--;


  const damage=
    document.getElementById(
      "damage"
    );


  damage.style.border=
    "10px solid rgba(255,0,40,.72)";


  setTimeout(
    ()=>{
      damage.style.border="0";
    },
    130
  );


  updateHUD();


  if(lives<=0){

    running=false;


    document.getElementById(
      "overReason"
    ).textContent=
      "VOCÊ FOI ELIMINADO";


    document.getElementById(
      "overKills"
    ).textContent=
      kills;


    document.getElementById(
      "overCoins"
    ).textContent=
      coins;


    document.getElementById(
      "overPhase"
    ).textContent=
      phase;


    document.getElementById(
      "gameOver"
    ).classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   INIMIGOS
========================================================= */

function updateEnemies(dt){

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=
      enemies[i];


    e.userData.t+=dt;


    e.position.z+=
      e.userData.speed*dt;


    e.rotation.y=
      Math.sin(
        e.userData.t*1.5
      )*.07;


    e.position.y=
      Math.sin(
        e.userData.t*2
      )*.025;


    e.children.forEach(
      part=>{

        if(
          part.userData &&
          part.userData.limb
        ){

          part.rotation.x=
            Math.sin(
              e.userData.t*5+
              part.userData.side
            )*.32;

        }

      }
    );


    if(
      e.position.z>5
    ){

      enemyGroup.remove(e);

      enemies.splice(
        i,
        1
      );

      /*
        Só tira uma vida.
        Não causa dano instantâneo em sequência.
      */

      damagePlayer();

    }

  }

}


/* =========================================================
   CAIXAS
========================================================= */

function updateCrates(dt){

  for(
    let i=crates.length-1;
    i>=0;
    i--
  ){

    const c=
      crates[i];


    c.position.z+=
      (.4+phase*.008)*dt;


    c.rotation.y+=
      dt*.2;


    if(
      c.position.z>5
    ){

      crateGroup.remove(c);

      crates.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   SPAWN
========================================================= */

function updateSpawn(dt){

  spawnTimer-=dt;


  const interval=
    Math.max(
      .78,
      1.35-phase*.009
    );


  if(
    spawnTimer<=0
  ){

    spawnTimer=
      interval;


    if(
      enemies.length<6
    ){

      const bossExists=
        enemies.some(
          e=>e.userData.boss
        );


      if(
        phase%10===0 &&
        kills>=target-2 &&
        !bossExists
      ){

        createEnemy(true);

      }else{

        createEnemy(false);

      }

    }

  }


  if(
    phase>=3 &&
    crates.length<3 &&
    Math.random()<dt*.18
  ){

    createCrate();

  }

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];


    p.userData.life-=dt;


    p.position.addScaledVector(
      p.userData.velocity,
      dt
    );


    p.scale.multiplyScalar(
      1-dt*.8
    );


    if(
      p.userData.life<=0
    ){

      effectGroup.remove(p);

      particles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   TRACERS
========================================================= */

function updateTracers(dt){

  for(
    let i=tracers.length-1;
    i>=0;
    i--
  ){

    const t=
      tracers[i];


    t.life-=dt;


    t.line.material.opacity=
      Math.max(
        0,
        t.life/.08
      );


    if(
      t.life<=0
    ){

      scene.remove(
        t.line
      );

      tracers.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   CHUVA
========================================================= */

function updateWeather(dt){

  if(
    !weatherGroup.children.length
  )
    return;


  const rain=
    weatherGroup.children[0];


  if(
    !rain.geometry ||
    !rain.geometry.attributes.position
  )
    return;


  const attr=
    rain.geometry.attributes.position;


  for(
    let i=0;
    i<attr.count;
    i++
  ){

    let y=
      attr.getY(i);


    y-=
      dt*16;


    if(y<0)
      y=18+Math.random()*2;


    attr.setY(
      i,
      y
    );

  }


  attr.needsUpdate=true;

}


/* =========================================================
   FASE
========================================================= */

function setupPhase(){

  target=
    8+
    Math.floor(
      (phase-1)*.65
    );


  weapon=
    currentWeapon();


  kills=0;
  lives=3;

  ammo=
    weapon.ammo;

  reserve=
    weapon.reserve;

  spawnTimer=.2;


  clearGroup(
    enemyGroup
  );

  clearGroup(
    crateGroup
  );

  clearGroup(
    effectGroup
  );


  enemies.length=0;
  crates.length=0;
  particles.length=0;
  tracers.length=0;


  buildWorld();

  buildWeapon();

  updateHUD();
  updateAmmo();


  createEnemy(false);
  createEnemy(false);


  if(
    phase>=3
  ){

    createCrate();

  }

}


/* =========================================================
   INICIAR
========================================================= */

function startPhase(){

  document
    .getElementById("menu")
    .classList.add("hidden");

  document
    .getElementById("phaseMenu")
    .classList.add("hidden");

  document
    .getElementById("gameOver")
    .classList.add("hidden");


  running=true;


  setupPhase();


  showToast(
    `FASE ${phase} • ${currentWorld().name}`
  );

}


/* =========================================================
   COMPLETAR
========================================================= */

function completePhase(){

  if(!running)
    return;


  running=false;


  if(
    phase<50
  ){

    if(
      phase>=unlocked
    ){

      unlocked=
        phase+1;


      localStorage.setItem(
        "ultimoSegundoUnlocked",
        unlocked
      );

    }


    phase++;


    localStorage.setItem(
      "ultimoSegundoPhase",
      phase
    );


    setTimeout(
      ()=>{
        startPhase();
      },
      900
    );


  }else{

    document.getElementById(
      "overReason"
    ).textContent=
      "VOCÊ CONCLUIU AS 50 FASES";


    document.getElementById(
      "overKills"
    ).textContent=
      kills;


    document.getElementById(
      "overCoins"
    ).textContent=
      coins;


    document.getElementById(
      "overPhase"
    ).textContent=
      50;


    document.getElementById(
      "gameOver"
    ).classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   MENU FASES
========================================================= */

function buildPhaseGrid(){

  const grid=
    document.getElementById(
      "phaseGrid"
    );


  grid.innerHTML="";


  for(
    let i=1;
    i<=50;
    i++
  ){

    const button=
      document.createElement(
        "button"
      );


    button.className=
      "phaseBtn";


    if(
      i>unlocked
    ){

      button.classList.add(
        "locked"
      );

      button.textContent=
        `🔒 ${i}`;

    }else{

      button.textContent=
        `FASE ${i}`;


      button.onclick=
        ()=>{

          phase=i;


          localStorage.setItem(
            "ultimoSegundoPhase",
            phase
          );


          startPhase();

        };

    }


    grid.appendChild(
      button
    );

  }

}


/* =========================================================
   CONTROLES
========================================================= */

function setupEvents(){

  document
    .getElementById("shoot")
    .addEventListener(
      "pointerdown",
      event=>{
        event.preventDefault();
        shoot();
      }
    );


  document
    .getElementById("reload")
    .addEventListener(
      "pointerdown",
      event=>{
        event.preventDefault();
        reload();
      }
    );


  document
    .getElementById("startBtn")
    .onclick=
      startPhase;


  document
    .getElementById("retryBtn")
    .onclick=
      startPhase;


  document
    .getElementById("menuBtn")
    .onclick=
      ()=>{

        running=false;

        document
          .getElementById(
            "gameOver"
          )
          .classList.add(
            "hidden"
          );

        document
          .getElementById(
            "menu"
          )
          .classList.remove(
            "hidden"
          );

      };


  document
    .getElementById("phasesBtn")
    .onclick=
      ()=>{

        buildPhaseGrid();

        document
          .getElementById(
            "menu"
          )
          .classList.add(
            "hidden"
          );

        document
          .getElementById(
            "phaseMenu"
          )
          .classList.remove(
            "hidden"
          );

      };


  document
    .getElementById("backBtn")
    .onclick=
      ()=>{

        document
          .getElementById(
            "phaseMenu"
          )
          .classList.add(
            "hidden"
          );

        document
          .getElementById(
            "menu"
          )
          .classList.remove(
            "hidden"
          );

      };


  /* mira por toque */

  let aiming=false;
  let lastX=0;
  let lastY=0;


  renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

      aiming=true;

      lastX=
        event.clientX;

      lastY=
        event.clientY;

    }
  );


  renderer.domElement.addEventListener(
    "pointermove",
    event=>{

      if(
        !aiming||
        !running
      )
        return;


      const dx=
        event.clientX-lastX;

      const dy=
        event.clientY-lastY;


      lastX=
        event.clientX;

      lastY=
        event.clientY;


      camera.rotation.y-=
        dx*.0022;

      camera.rotation.x-=
        dy*.0017;


      camera.rotation.x=
        THREE.MathUtils.clamp(
          camera.rotation.x,
          -.4,
          .3
        );

    }
  );


  window.addEventListener(
    "pointerup",
    ()=>{
      aiming=false;
    }
  );


  /* teclado */

  window.addEventListener(
    "keydown",
    event=>{

      if(
        event.code==="Space"
      )
        shoot();


      if(
        event.key.toLowerCase()==="r"
      )
        reload();

    }
  );


  window.addEventListener(
    "resize",
    resize
  );

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  if(!renderer||!camera)
    return;


  camera.aspect=
    innerWidth/
    innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  if(composer){

    composer.setSize(
      innerWidth,
      innerHeight
    );

  }

}


/* =========================================================
   LOOP
========================================================= */

let lastTime=
  performance.now();


function animate(now){

  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      .05,
      (now-lastTime)/1000
    );


  lastTime=now;


  if(running){

    updateSpawn(dt);
    updateEnemies(dt);
    updateCrates(dt);

  }


  updateParticles(dt);
  updateTracers(dt);
  updateWeather(dt);


  if(composer){

    composer.render(dt);

  }else{

    renderer.render(
      scene,
      camera
    );

  }

}


/* =========================================================
   BOOT
========================================================= */

boot();

</script>
