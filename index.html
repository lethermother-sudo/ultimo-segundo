<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:linear-gradient(
    180deg,
    rgba(1,4,15,.45),
    rgba(1,2,8,.94)
  );
}

.card{
  width:min(430px,94vw);
  max-height:92vh;
  overflow:auto;
  padding:27px 20px;
  text-align:center;
  border:1px solid rgba(100,225,255,.35);
  border-radius:27px;
  background:rgba(4,9,25,.91);
  box-shadow:
    0 0 55px rgba(0,190,255,.18),
    inset 0 0 30px rgba(50,150,255,.04);
  backdrop-filter:blur(16px);
}

#menu{display:flex}

.logo{
  color:#61eaff;
  font-size:10px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  margin:0 0 9px;
  color:#fff;
  font-size:43px;
  line-height:.94;
  letter-spacing:-2px;
  text-shadow:0 0 26px #16dfff;
}

.sub{
  color:#9eb3cf;
  font-size:13px;
  margin-bottom:22px;
}

button{
  border:0;
  border-radius:17px;
  padding:15px 20px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(90deg,#15dfff,#7a43ff);
  box-shadow:0 10px 30px rgba(20,190,255,.20);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.97);
}

.mainBtn,
.nextBtn,
.secondaryBtn{
  width:100%;
  margin-top:9px;
}

.secondaryBtn{
  background:rgba(16,30,58,.85);
  border:1px solid rgba(94,234,255,.27);
  box-shadow:none;
}

.bestLabel{
  color:#ffd83d;
  font-size:11px;
  font-weight:900;
  margin-top:18px;
}

#menuBest{
  color:#fff;
  font-size:20px;
  font-weight:900;
  margin-top:4px;
}

.phaseGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin:16px 0;
}

.phaseBtn{
  position:relative;
  min-height:86px;
  padding:9px 5px;
  background:rgba(9,22,46,.92);
  border:1px solid rgba(94,234,255,.2);
  box-shadow:none;
}

.phaseBtn.selected{
  border-color:#5eeaff;
  box-shadow:
    0 0 22px rgba(94,234,255,.2),
    inset 0 0 18px rgba(94,234,255,.04);
}

.phaseBtn.locked{
  opacity:.38;
  filter:grayscale(.5);
}

.phaseNum{
  display:block;
  color:#5eeaff;
  font-size:25px;
}

.phaseName{
  display:block;
  color:#c0cde0;
  font-size:9px;
  margin-top:3px;
}

.phaseGoal{
  display:block;
  color:#ffd83d;
  font-size:9px;
  margin-top:4px;
}

.lock{
  position:absolute;
  right:7px;
  top:6px;
  font-size:12px;
}

.resultTitle{
  color:#5eeaff;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
}

.resultStats{
  color:#dbe9f7;
  line-height:1.8;
  margin-bottom:16px;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 10px);
  font-size:41px;
  line-height:1;
  font-weight:900;
  text-shadow:0 3px 16px #000;
}

#coins{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 58px);
  color:#ffd83d;
  font-size:17px;
  font-weight:900;
}

#target{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 89px);
  color:rgba(255,255,255,.65);
  font-size:10px;
  font-weight:900;
}

#progressWrap{
  position:absolute;
  left:27px;
  right:27px;
  top:calc(env(safe-area-inset-top) + 108px);
  height:4px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.13);
}

#progress{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#1be2ff,#9144ff);
  box-shadow:0 0 14px #20dcff;
}

#speed{
  position:absolute;
  right:24px;
  top:calc(env(safe-area-inset-top) + 12px);
  color:#61eaff;
  font-size:14px;
  font-weight:900;
}

#phase{
  position:absolute;
  right:24px;
  top:calc(env(safe-area-inset-top) + 42px);
  color:#ffd83d;
  font-size:12px;
  font-weight:900;
}

#sound{
  position:absolute;
  right:19px;
  top:calc(env(safe-area-inset-top) + 72px);
  pointer-events:auto;
  padding:7px 10px;
  border-radius:13px;
  background:rgba(3,12,28,.82);
  border:1px solid rgba(94,234,255,.4);
  color:#5eeaff;
  font-size:11px;
  box-shadow:none;
}

#hint{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  text-align:center;
  color:rgba(255,255,255,.48);
  font-size:10px;
}

@media(max-width:380px){
  h1{font-size:36px}
  #score{font-size:36px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="coins">● 0</div>
  <div id="target">META 1000</div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="speed">VELOCIDADE 1.0x</div>
  <div id="phase">FASE 1</div>
  <button id="sound">🔊 SOM</button>
  <div id="hint">DESLIZE ← → FAIXA • ↑ PULAR • ↓ DESLIZAR</div>
</div>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo">RUNNER EXPERIENCE</div>
    <h1>ÚLTIMO<br>SEGUNDO</h1>
    <div class="sub">CORRA. DESVIE. SOBREVIVA.</div>

    <button id="play" class="mainBtn">▶ JOGAR</button>
    <button id="openPhases" class="secondaryBtn">🎮 FASES</button>

    <div class="bestLabel">MELHOR PONTUAÇÃO</div>
    <div id="menuBest">0</div>
  </div>
</div>

<div id="phaseMenu" class="screen">
  <div class="card">
    <div class="logo">SELEÇÃO DE FASE</div>
    <h1 style="font-size:31px">ESCOLHA A FASE</h1>
    <div class="sub">Complete uma fase para desbloquear a próxima.</div>

    <div id="phaseGrid" class="phaseGrid"></div>

    <button id="backMenu" class="secondaryBtn">← VOLTAR</button>
  </div>
</div>

<div id="gameover" class="screen">
  <div class="card">
    <div class="resultTitle">CORRIDA ENCERRADA</div>
    <h1>FIM DE JOGO</h1>
    <div id="finalStats" class="resultStats"></div>
    <button id="again" class="nextBtn">🔄 JOGAR NOVAMENTE</button>
    <button id="overMenu" class="secondaryBtn">🏠 MENU</button>
  </div>
</div>

<div id="victory" class="screen">
  <div class="card">
    <div class="resultTitle">FASE CONCLUÍDA</div>
    <h1>🏆 VITÓRIA</h1>
    <div id="victoryStats" class="resultStats"></div>
    <button id="nextPhase" class="nextBtn">🚀 PRÓXIMA FASE</button>
    <button id="victoryMenu" class="secondaryBtn">🏠 MENU</button>
  </div>
</div>

<script>
(function(){

"use strict";

/* =========================================================
   ELEMENTOS
========================================================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var hud=document.getElementById("hud");
var menu=document.getElementById("menu");
var phaseMenu=document.getElementById("phaseMenu");
var gameover=document.getElementById("gameover");
var victory=document.getElementById("victory");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var targetEl=document.getElementById("target");
var progressEl=document.getElementById("progress");
var speedEl=document.getElementById("speed");
var phaseEl=document.getElementById("phase");

var phaseGrid=document.getElementById("phaseGrid");
var menuBest=document.getElementById("menuBest");

var finalStats=document.getElementById("finalStats");
var victoryStats=document.getElementById("victoryStats");

var soundBtn=document.getElementById("sound");


/* =========================================================
   TAMANHO
========================================================= */

var W=0;
var H=0;
var dpr=1;

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   FASES
========================================================= */

var phaseData=[
  {
    name:"CIDADE NEON",
    target:1000,
    max:.82,
    accent:"#20dcff",
    sky1:"#020617",
    sky2:"#092b4a",
    road:"#071321"
  },
  {
    name:"CENTRO FUTURISTA",
    target:1500,
    max:.88,
    accent:"#b45cff",
    sky1:"#09021c",
    sky2:"#24104a",
    road:"#10091d"
  },
  {
    name:"VIA NOTURNA",
    target:2200,
    max:.94,
    accent:"#35ffd2",
    sky1:"#020611",
    sky2:"#102e3a",
    road:"#061218"
  },
  {
    name:"ZONA INDUSTRIAL",
    target:3000,
    max:1,
    accent:"#ff7b2f",
    sky1:"#120504",
    sky2:"#4a1c08",
    road:"#160b08"
  },
  {
    name:"CYBER CITY",
    target:4000,
    max:1.06,
    accent:"#ff35df",
    sky1:"#10001c",
    sky2:"#30104f",
    road:"#10051b"
  },
  {
    name:"DISTRITO VERMELHO",
    target:5200,
    max:1.12,
    accent:"#ff304f",
    sky1:"#180208",
    sky2:"#52101d",
    road:"#19070c"
  },
  {
    name:"MEGA TÚNEL",
    target:6500,
    max:1.18,
    accent:"#477cff",
    sky1:"#02030b",
    sky2:"#16264c",
    road:"#050914"
  },
  {
    name:"CIDADE AÉREA",
    target:8000,
    max:1.24,
    accent:"#29f7ff",
    sky1:"#03121a",
    sky2:"#07506a",
    road:"#031017"
  },
  {
    name:"ZONA ZERO",
    target:10000,
    max:1.32,
    accent:"#ff168f",
    sky1:"#100008",
    sky2:"#360015",
    road:"#100007"
  },
  {
    name:"ÚLTIMO SEGUNDO",
    target:12500,
    max:1.42,
    accent:"#a855ff",
    sky1:"#05000f",
    sky2:"#26005c",
    road:"#07000e"
  }
];


var currentPhase=
  Number(localStorage.getItem("ultimoSegundoPhase")||1);

var unlockedPhase=
  Number(localStorage.getItem("ultimoSegundoUnlocked")||1);

var best=
  Number(localStorage.getItem("ultimoSegundoBest")||0);

unlockedPhase=Math.max(1,Math.min(10,unlockedPhase));
currentPhase=Math.max(1,Math.min(unlockedPhase,10));

menuBest.textContent=best;


/* =========================================================
   MENU DE FASES
========================================================= */

function buildPhaseMenu(){

  phaseGrid.innerHTML="";

  for(
    var i=0;
    i<phaseData.length;
    i++
  ){

    (function(){

      var n=i+1;
      var p=phaseData[i];

      var b=document.createElement("button");

      b.className="phaseBtn";

      if(n>unlockedPhase){
        b.className+=" locked";
      }

      if(n===currentPhase){
        b.className+=" selected";
      }

      b.innerHTML=
        '<span class="phaseNum">'+
        String(n).padStart(2,"0")+
        '</span>'+
        '<span class="phaseName">'+
        p.name+
        '</span>'+
        '<span class="phaseGoal">META '+
        p.target+
        '</span>'+
        (
          n>unlockedPhase
          ?'<span class="lock">🔒</span>'
          :""
        );

      b.onclick=function(){

        if(n>unlockedPhase)return;

        currentPhase=n;

        localStorage.setItem(
          "ultimoSegundoPhase",
          currentPhase
        );

        startGame();
      };

      phaseGrid.appendChild(b);

    })();

  }
}

buildPhaseMenu();


/* =========================================================
   ESTADO DO JOGO
========================================================= */

var running=false;

var last=0;
var time=0;

var score=0;
var coins=0;

var speed=.5;

var lane=1;
var targetLane=1;

var laneVisual=1;

var jump=0;
var slide=0;

var spawnTimer=.7;
var coinTimer=.4;

var objects=[];
var particles=[];
var speedLines=[];

var soundOn=true;


/* =========================================================
   UTILIDADES
========================================================= */

function show(el){
  el.style.display="flex";
}

function hide(el){
  el.style.display="none";
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  var p=phaseData[currentPhase-1];

  scoreEl.textContent=Math.floor(score);

  coinsEl.textContent="● "+coins;

  targetEl.textContent="META "+p.target;

  phaseEl.textContent=
    "FASE "+currentPhase+
    " • "+p.name;

  speedEl.textContent=
    "VELOCIDADE "+
    (speed/.5).toFixed(1)+"x";

  progressEl.style.width=
    Math.min(
      100,
      score/p.target*100
    )+"%";

  menuBest.textContent=best;
}


/* =========================================================
   COMEÇAR
========================================================= */

function startGame(){

  running=true;

  var p=phaseData[currentPhase-1];

  score=0;
  coins=0;

  speed=.5;

  lane=1;
  targetLane=1;
  laneVisual=1;

  jump=0;
  slide=0;

  time=0;

  spawnTimer=.6;
  coinTimer=.25;

  objects=[];
  particles=[];
  speedLines=[];

  hide(menu);
  hide(phaseMenu);
  hide(gameover);
  hide(victory);

  show(hud);

  updateHUD();

  createSpeedLines();

  last=performance.now();
}


/* =========================================================
   FIM DE JOGO
========================================================= */

function endGame(){

  if(!running)return;

  running=false;

  hide(hud);

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      best
    );
  }

  finalStats.innerHTML=
    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+
    "Moedas: <b>"+
    coins+
    "</b><br>"+
    "Fase: <b>"+
    currentPhase+
    "</b>";

  menuBest.textContent=best;

  show(gameover);
}


/* =========================================================
   VITÓRIA
========================================================= */

function finishPhase(){

  if(!running)return;

  running=false;

  hide(hud);

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      best
    );
  }

  if(currentPhase<10){

    unlockedPhase=Math.max(
      unlockedPhase,
      currentPhase+1
    );

    localStorage.setItem(
      "ultimoSegundoUnlocked",
      unlockedPhase
    );
  }

  localStorage.setItem(
    "ultimoSegundoPhase",
    currentPhase
  );

  var p=phaseData[currentPhase-1];

  victoryStats.innerHTML=
    "FASE "+currentPhase+
    " • "+p.name+
    "<br>"+
    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+
    "Moedas: <b>"+
    coins+
    "</b>"+
    (
      currentPhase<10
      ?
      "<br><span style='color:#5eeaff'>"+
      "FASE "+
      (currentPhase+1)+
      " DESBLOQUEADA!</span>"
      :
      "<br><span style='color:#ffd83d'>"+
      "TODAS AS FASES CONCLUÍDAS!</span>"
    );

  var next=document.getElementById("nextPhase");

  next.textContent=
    currentPhase<10
    ?
    "🚀 IR PARA FASE "+(currentPhase+1)
    :
    "🏆 VOLTAR AO MENU";

  buildPhaseMenu();

  show(victory);
}


/* =========================================================
   CONTROLES
========================================================= */

function changeLane(dir){

  targetLane=Math.max(
    0,
    Math.min(
      2,
      targetLane+dir
    )
  );
}

function doJump(){

  if(jump<=0 && slide<=0){
    jump=0.001;
  }
}

function doSlide(){

  if(jump<=0){
    slide=.62;
  }
}


var touchX=0;
var touchY=0;
var touchActive=false;

window.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=e.touches[0];

    touchX=t.clientX;
    touchY=t.clientY;
    touchActive=true;

  },
  {passive:true}
);

window.addEventListener(
  "touchend",
  function(e){

    if(!running || !touchActive)return;

    var t=e.changedTouches[0];

    var dx=t.clientX-touchX;
    var dy=t.clientY-touchY;

    touchActive=false;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<28
    )return;

    if(Math.abs(dx)>Math.abs(dy)){

      changeLane(dx>0?1:-1);

    }else{

      if(dy<0){
        doJump();
      }else{
        doSlide();
      }

    }

  },
  {passive:true}
);

window.addEventListener(
  "keydown",
  function(e){

    if(!running)return;

    if(e.key==="ArrowLeft"){
      changeLane(-1);
    }

    if(e.key==="ArrowRight"){
      changeLane(1);
    }

    if(e.key==="ArrowUp" || e.key===" "){
      doJump();
    }

    if(e.key==="ArrowDown"){
      doSlide();
    }

  }
);


/* =========================================================
   PERSPECTIVA DA PISTA
========================================================= */

function horizon(){
  return H*.30;
}

function ground(){
  return H*.94;
}

function roadY(z){

  var h=horizon();
  var g=ground();

  return h+(g-h)*z;
}

function roadHalf(z){

  return W*.055+
    W*.40*Math.pow(z,1.08);
}

function laneX(l,z){

  var spread=
    roadHalf(z)*.62;

  return W/2+
    (l-1)*spread;
}


/* =========================================================
   VELOCIDADE / CÂMERA
========================================================= */

function cameraBob(){

  if(!running)return 0;

  if(jump>0)return 0;

  return Math.sin(
    time*13*
    (speed/.5)
  )*
  Math.min(
    3.2,
    1.2+
    speed*2
  );
}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function addObject(
  lane,
  type,
  z
){

  objects.push({
    lane:lane,
    type:type,
    z:z,
    hit:false,
    rot:Math.random()*6
  });
}


function spawnObstacle(){

  var hard=currentPhase>=5;
  var veryHard=currentPhase>=7;

  var r=Math.random();

  /*
    Nas fases 7-10:
    dois obstáculos deixam uma pista livre.
  */

  if(veryHard && r<.34){

    var safe=
      Math.floor(Math.random()*3);

    for(
      var l=0;
      l<3;
      l++
    ){

      if(l!==safe){

        addObject(
          l,
          Math.random()<.5
          ?"gate"
          :"car",
          -.05
        );
      }
    }

    return;
  }

  /*
    Fases 5+ começam a criar
    combinações.
  */

  if(hard && r<.30){

    var a=
      Math.floor(Math.random()*3);

    var b=(a+1+Math.floor(Math.random()*2))%3;

    addObject(
      a,
      Math.random()<.5
      ?"gate"
      :"car",
      -.05
    );

    addObject(
      b,
      "drone",
      -.24
    );

    return;
  }

  var lane=Math.floor(Math.random()*3);

  var types=[
    "gate",
    "car",
    "column",
    "drone"
  ];

  addObject(
    lane,
    types[
      Math.floor(
        Math.random()*types.length
      )
    ],
    -.03
  );
}


/* =========================================================
   MOEDAS
========================================================= */

function spawnCoins(){

  var lane=Math.floor(Math.random()*3);

  var amount=
    currentPhase>=7
    ?5
    :4;

  for(
    var i=0;
    i<amount;
    i++
  ){

    addObject(
      lane,
      "coin",
      -.08-i*.115
    );
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function particle(
  x,
  y,
  amount,
  power
){

  var p=phaseData[currentPhase-1];

  for(
    var i=0;
    i<amount;
    i++
  ){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*power,
      vy:(Math.random()-.5)*power,
      life:.35+Math.random()*.55,
      size:1+Math.random()*3,
      color:p.accent
    });
  }
}


function createSpeedLines(){

  speedLines=[];

  for(
    var i=0;
    i<35;
    i++
  ){

    speedLines.push({
      x:Math.random()*W,
      y:Math.random()*H,
      length:10+Math.random()*30,
      z:.1+Math.random()*.9
    });
  }
}


/* =========================================================
   ATUALIZAÇÃO
========================================================= */

function update(dt){

  var p=phaseData[currentPhase-1];

  time+=dt;

  var progress=Math.min(
    1,
    score/p.target
  );

  var targetSpeed=
    .5+
    (p.max-.5)*
    Math.min(
      1,
      progress+.12
    );

  speed+=
    (targetSpeed-speed)*
    Math.min(
      1,
      dt*2.2
    );


  /*
    Movimento suave da faixa.
  */

  laneVisual+=
    (targetLane-laneVisual)*
    Math.min(
      1,
      dt*11
    );


  /*
    PULO REAL:
    acelera para cima,
    depois volta.
  */

  if(jump>0){

    jump+=dt*2.9;

    if(jump>=2.75){
      jump=0;
    }
  }


  /*
    DESLIZE.
  */

  if(slide>0){

    slide=Math.max(
      0,
      slide-dt
    );
  }


  /*
    Spawn mais rápido nas fases altas.
  */

  var spawnRate=Math.max(
    .30,
    .88-
    (currentPhase-1)*.052-
    progress*.17
  );

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnTimer=spawnRate;

    spawnObstacle();
  }


  coinTimer-=dt;

  if(coinTimer<=0){

    coinTimer=Math.max(
      .43,
      .72-
      (currentPhase-1)*.018
    );

    spawnCoins();
  }


  /*
    Objetos avançam pela pista.
  */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z+=
      dt*
      (
        .34+
        speed*.72
      );

    o.rot+=dt*7;


    if(o.z>1.08){

      objects.splice(i,1);
      continue;
    }


    /*
      COLISÃO NA ZONA DO JOGADOR.
    */

    if(
      o.z>.79 &&
      o.z<.98 &&
      !o.hit
    ){

      var sameLane=
        Math.abs(
          o.lane-laneVisual
        )<.34;


      if(o.type==="coin"){

        if(sameLane){

          o.hit=true;

          coins++;
          score+=55;

          particle(
            laneX(o.lane,o.z),
            roadY(o.z)-25,
            12,
            2.8
          );
        }

      }else if(sameLane){

        var jumping=
          jump>.28 &&
          jump<2.5;

        var sliding=
          slide>0;

        var safe=false;

        if(
          o.type==="gate" ||
          o.type==="car" ||
          o.type==="column"
        ){
          safe=jumping;
        }

        if(
          o.type==="drone"
        ){
          safe=sliding;
        }

        if(!safe){

          particle(
            laneX(o.lane,o.z),
            roadY(o.z)-40,
            28,
            5
          );

          endGame();
          return;

        }else{

          o.hit=true;
          score+=25;

          particle(
            laneX(o.lane,o.z),
            roadY(o.z)-50,
            8,
            2
          );
        }
      }
    }
  }


  /*
    Pontuação por distância.
  */

  score+=
    dt*
    (
      42+
      currentPhase*5
    )*
    (1+speed);


  /*
    Partículas.
  */

  for(
    i=particles.length-1;
    i>=0;
    i--
  ){

    var q=particles[i];

    q.x+=q.vx;
    q.y+=q.vy;

    q.vy+=.045;

    q.life-=dt;

    if(q.life<=0){
      particles.splice(i,1);
    }
  }


  /*
    Linhas de velocidade.
  */

  for(
    i=0;
    i<speedLines.length;
    i++
  ){

    var s=speedLines[i];

    s.y+=
      (8+
      speed*17)*
      dt*
      (0.5+s.z);

    if(s.y>H){
      s.y=horizon();
      s.x=Math.random()*W;
    }
  }


  if(score>=p.target){

    finishPhase();
    return;
  }

  updateHUD();
}


/* =========================================================
   CIDADE
========================================================= */

function drawCity(p){

  var g=ctx.createLinearGradient(
    0,0,0,H
  );

  g.addColorStop(0,p.sky1);
  g.addColorStop(1,p.sky2);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);


  /*
    Lua/luz no céu.
  */

  ctx.globalAlpha=.28;

  ctx.fillStyle=p.accent;

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.17,
    Math.min(W,H)*.055,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /*
    Prédios.
  */

  var base=horizon()+8;

  for(
    var i=0;
    i<30;
    i++
  ){

    var bw=
      15+
      ((i*29)%48);

    var bh=
      35+
      ((i*47)%145);

    var x=
      ((i*91)%(
        W+80
      ))-40;

    ctx.fillStyle=
      i%3===0
      ?"rgba(9,24,48,.95)"
      :"rgba(3,12,28,.93)";

    ctx.fillRect(
      x,
      base-bh,
      bw,
      bh
    );


    /*
      Janelas.
    */

    for(
      var yy=base-bh+12;
      yy<base-7;
      yy+=15
    ){

      if(
        ((i+Math.floor(yy))%4)!==0
      ){

        ctx.fillStyle=
          p.accent+"77";

        ctx.fillRect(
          x+5,
          yy,
          4,
          5
        );

        if(bw>28){

          ctx.fillRect(
            x+bw-10,
            yy,
            4,
            5
          );
        }
      }
    }
  }


  /*
    Névoa na linha do horizonte.
  */

  var fog=ctx.createLinearGradient(
    0,horizon()-20,
    0,horizon()+100
  );

  fog.addColorStop(
    0,
    p.accent+"18"
  );

  fog.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=fog;

  ctx.fillRect(
    0,
    horizon()-20,
    W,
    120
  );
}


/* =========================================================
   ESTRADA
========================================================= */

function drawRoad(p){

  var h=horizon()+cameraBob()*.15;
  var g=ground();


  /*
    Área externa.
  */

  ctx.fillStyle=
    "rgba(1,4,12,.9)";

  ctx.fillRect(
    0,
    h,
    W,
    H-h
  );


  /*
    Pista.
  */

  ctx.fillStyle=p.road;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.05,
    h
  );

  ctx.lineTo(
    W/2+W*.05,
    h
  );

  ctx.lineTo(
    W/2+W*.47,
    g
  );

  ctx.lineTo(
    W/2-W*.47,
    g
  );

  ctx.closePath();

  ctx.fill();


  /*
    Brilho nas bordas.
  */

  ctx.strokeStyle=p.accent+"99";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.05,
    h
  );

  ctx.lineTo(
    W/2-W*.47,
    g
  );

  ctx.moveTo(
    W/2+W*.05,
    h
  );

  ctx.lineTo(
    W/2+W*.47,
    g
  );

  ctx.stroke();


  /*
    Faixas da pista.
  */

  for(
    var z=.08;
    z<1;
    z+=.10
  ){

    var y=roadY(z);

    ctx.strokeStyle=
      p.accent+
      (
        z>.45
        ?"72"
        :"3c"
      );

    ctx.lineWidth=
      1+
      z*2.2;

    ctx.beginPath();

    ctx.moveTo(
      W/2-roadHalf(z),
      y
    );

    ctx.lineTo(
      W/2+roadHalf(z),
      y
    );

    ctx.stroke();
  }


  /*
    Separação das três faixas.
  */

  for(
    var l=1;
    l<=2;
    l++
  ){

    var side=l===1?-1:1;

    ctx.strokeStyle=p.accent+"8c";
    ctx.lineWidth=1.7;

    ctx.beginPath();

    ctx.moveTo(
      W/2+side*W*.018,
      h
    );

    ctx.lineTo(
      W/2+side*W*.38,
      g
    );

    ctx.stroke();
  }


  /*
    Luzes laterais em movimento.
  */

  for(
    var side=-1;
    side<=1;
    side+=2
  ){

    for(
      var i=0;
      i<14;
      i++
    ){

      var z=
        (
          i/14+
          time*
          speed*
          .55
        )%1;

      var y=roadY(z);

      var x=
        W/2+
        side*
        (
          roadHalf(z)*1.12
        );

      ctx.fillStyle=p.accent+"99";

      ctx.shadowBlur=8;
      ctx.shadowColor=p.accent;

      ctx.fillRect(
        x-2,
        y-2,
        4,
        Math.max(2,12*z)
      );

      ctx.shadowBlur=0;
    }
  }


  /*
    Linhas de velocidade laterais.
  */

  ctx.globalAlpha=.18;

  for(
    i=0;
    i<speedLines.length;
    i++
  ){

    var s=speedLines[i];

    if(i%3!==0)continue;

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x,
      s.y+s.length*s.z
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   PERSONAGEM NOVO
========================================================= */

function drawRunner(p){

  /*
    O personagem fica sempre no
    centro inferior da pista.
  */

  var x=
    laneX(
      laneVisual,
      .99
    );

  var bob=
    cameraBob();

  var jumpHeight=0;

  if(jump>0){

    jumpHeight=
      Math.sin(
        jump/2.75*Math.PI
      )*
      Math.min(
        H*.17,
        125
      );
  }


  var y=
    H*.835-
    bob-
    jumpHeight;

  var scale=
    Math.max(
      .78,
      Math.min(
        1.12,
        Math.min(W,H)/520
      )
    );


  /*
    Animação de corrida:
    pernas e braços alternados.
  */

  var runPhase=
    time*
    (
      10+
      speed*11
    );

  var stride=
    Math.sin(runPhase);

  var stride2=
    Math.sin(
      runPhase+
      Math.PI
    );


  /*
    Durante o salto, a animação
    diminui.
  */

  var animFactor=
    jump>0
    ? .25
    : 1;


  stride*=animFactor;
  stride2*=animFactor;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );


  /*
    Inclinação natural do corpo.
  */

  ctx.rotate(
    slide>0
    ? -.12
    : -.035
  );


  /*
    SOMBRA no chão.
  */

  if(jump<=0){

    ctx.save();

    ctx.scale(
      1,
      .32
    );

    ctx.fillStyle=
      "rgba(0,0,0,.45)";

    ctx.shadowBlur=14;
    ctx.shadowColor="#000";

    ctx.beginPath();

    ctx.ellipse(
      0,
      74,
      38,
      15,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }


  /*
    Aura.
  */

  ctx.shadowBlur=20;
  ctx.shadowColor=p.accent;


  /*
    DESLIZAMENTO.
  */

  if(slide>0){

    /*
      Corpo horizontal.
    */

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=9;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      -20,
      8
    );

    ctx.lineTo(
      22,
      8
    );

    ctx.stroke();


    /*
      Pernas recolhidas.
    */

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
      8,
      15
    );

    ctx.lineTo(
      26,
      27
    );

    ctx.lineTo(
      39,
      25
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      -4,
      15
    );

    ctx.lineTo(
      -21,
      27
    );

    ctx.lineTo(
      -34,
      25
    );

    ctx.stroke();


    /*
      Cabeça.
    */

    ctx.fillStyle="#e7fbff";

    ctx.beginPath();

    ctx.arc(
      -25,
      -1,
      11,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#18263d";

    ctx.fillRect(
      -33,
      -4,
      17,
      6
    );


  }else{

    /*
      PERNA ESQUERDA.
    */

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=8;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      -7,
      25
    );

    ctx.lineTo(
      -10+
      stride*12,
      47
    );

    ctx.lineTo(
      -17+
      stride*22,
      70
    );

    ctx.stroke();


    /*
      Pé esquerdo.
    */

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
      -17+
      stride*22,
      70
    );

    ctx.lineTo(
      -25+
      stride*22,
      72
    );

    ctx.stroke();


    /*
      PERNA DIREITA.
    */

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
      7,
      25
    );

    ctx.lineTo(
      10+
      stride2*12,
      47
    );

    ctx.lineTo(
      17+
      stride2*22,
      70
    );

    ctx.stroke();


    /*
      Pé direito.
    */

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
      17+
      stride2*22,
      70
    );

    ctx.lineTo(
      25+
      stride2*22,
      72
    );

    ctx.stroke();


    /*
      BRAÇO ESQUERDO.
    */

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
      -11,
      2
    );

    ctx.lineTo(
      -25+
      stride2*13,
      19
    );

    ctx.lineTo(
      -31+
      stride2*18,
      36
    );

    ctx.stroke();


    /*
      BRAÇO DIREITO.
    */

    ctx.beginPath();

    ctx.moveTo(
      11,
      2
    );

    ctx.lineTo(
      25+
      stride*13,
      19
    );

    ctx.lineTo(
      31+
      stride*18,
      36
    );

    ctx.stroke();


    /*
      Corpo.
    */

    ctx.fillStyle=p.accent;

    ctx.beginPath();

    ctx.roundRect(
      -12,
      -3,
      24,
      34,
      7
    );

    ctx.fill();


    /*
      Detalhe central.
    */

    ctx.fillStyle="#dffcff";

    ctx.globalAlpha=.75;

    ctx.fillRect(
      -4,
      3,
      8,
      16
    );

    ctx.globalAlpha=1;


    /*
      Cabeça.
    */

    ctx.fillStyle="#e9fcff";

    ctx.beginPath();

    ctx.arc(
      0,
      -18,
      12,
      0,
      Math.PI*2
    );

    ctx.fill();


    /*
      Visor.
    */

    ctx.fillStyle="#14243d";

    ctx.fillRect(
      -9,
      -21,
      18,
      7
    );


    /*
      Pequena luz nas costas.
    */

    ctx.fillStyle=p.accent;

    ctx.shadowBlur=15;
    ctx.shadowColor=p.accent;

    ctx.beginPath();

    ctx.arc(
      0,
      11,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.restore();
}


/* =========================================================
   OBJETOS
========================================================= */

function drawObject(o,p){

  var z=Math.max(.01,o.z);

  var x=laneX(
    o.lane,
    z
  );

  var y=roadY(z);

  /*
    Escala mais natural:
    distante pequeno,
    perto grande.
  */

  var s=
    .08+
    Math.pow(z,1.18)*1.02;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    s,
    s
  );

  ctx.shadowBlur=
    12+
    z*12;

  ctx.shadowColor=p.accent;


  /*
    MOEDA
  */

  if(o.type==="coin"){

    var spin=
      Math.sin(o.rot);

    ctx.strokeStyle="#ffd83d";
    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.ellipse(
      0,
      -31,
      Math.max(
        3,
        14*Math.abs(spin)
      ),
      21,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#fff2a2";

    ctx.globalAlpha=.75;

    ctx.beginPath();

    ctx.arc(
      -4,
      -39,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

  }


  /*
    PORTÃO
  */

  else if(o.type==="gate"){

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=9;

    ctx.strokeRect(
      -31,
      -95,
      62,
      95
    );

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
      -31,
      -68
    );

    ctx.lineTo(
      31,
      -68
    );

    ctx.stroke();

    ctx.fillStyle=p.accent+"30";

    ctx.fillRect(
      -25,
      -60,
      50,
      54
    );
  }


  /*
    CARRO.
  */

  else if(o.type==="car"){

    ctx.fillStyle="#a71942";

    ctx.beginPath();

    ctx.roundRect(
      -30,
      -62,
      60,
      62,
      9
    );

    ctx.fill();

    ctx.fillStyle="#79eaff";

    ctx.fillRect(
      -18,
      -48,
      36,
      15
    );

    ctx.fillStyle="#ffdb48";

    ctx.fillRect(
      -23,
      -9,
      8,
      5
    );

    ctx.fillRect(
      15,
      -9,
      8,
      5
    );
  }


  /*
    COLUNA.
  */

  else if(o.type==="column"){

    ctx.fillStyle="#334862";

    ctx.fillRect(
      -24,
      -91,
      48,
      91
    );

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=4;

    ctx.strokeRect(
      -24,
      -91,
      48,
      91
    );

    ctx.fillStyle=p.accent+"40";

    ctx.fillRect(
      -15,
      -78,
      30,
      8
    );
  }


  /*
    DRONE.
  */

  else if(o.type==="drone"){

    ctx.fillStyle="#d9f5ff";

    ctx.beginPath();

    ctx.arc(
      0,
      -61,
      19,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=p.accent;
    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
      -37,
      -61
    );

    ctx.lineTo(
      37,
      -61
    );

    ctx.stroke();

    ctx.fillStyle=p.accent;

    ctx.beginPath();

    ctx.arc(
      0,
      -61,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   DESENHO
========================================================= */

function draw(){

  var p=phaseData[currentPhase-1];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Fundo.
  */

  drawCity(p);

  /*
    Estrada.
  */

  drawRoad(p);


  /*
    Objetos mais distantes
    primeiro.
  */

  objects
    .slice()
    .sort(function(a,b){
      return a.z-b.z;
    })
    .forEach(function(o){

      drawObject(
        o,
        p
      );

    });


  /*
    Corredor por último:
    fica sempre visualmente na frente.
  */

  drawRunner(p);

  drawParticles();
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!last){
    last=now;
  }

  var dt=Math.min(
    .033,
    (now-last)/1000
  );

  last=now;

  if(running){
    update(dt);
  }

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

      ?"🔊 SOM"
      :"🔇 MUDO";
  };


/* =========================================================
   INÍCIO
========================================================= */

hide(phaseMenu);
hide(gameover);
hide(victory);
show(menu);

})();
</script>
