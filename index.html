<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  color:#fff;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(1,4,12,.88);
  backdrop-filter:blur(8px);
}

.screen.show{
  display:flex;
}

.card{
  width:min(440px,94vw);
  max-height:90vh;
  overflow:auto;
  padding:28px 22px;
  border-radius:28px;
  border:1px solid rgba(70,225,255,.28);
  background:
    linear-gradient(
      145deg,
      rgba(7,18,40,.98),
      rgba(2,7,20,.98)
    );
  box-shadow:
    0 0 60px rgba(20,180,255,.15),
    inset 0 0 30px rgba(40,180,255,.04);
  text-align:center;
}

.logo{
  color:#5eeaff;
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:10px;
}

h1{
  margin:0;
  color:#fff;
  font-size:43px;
  line-height:.94;
  letter-spacing:-2px;
  text-shadow:
    0 0 15px rgba(40,230,255,.7);
}

.subtitle{
  margin:15px 0 22px;
  color:#91a7c2;
  font-size:12px;
  letter-spacing:1px;
}

button{
  appearance:none;
  border:0;
  color:#fff;
  font-weight:900;
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

.mainBtn{
  width:100%;
  padding:17px;
  border-radius:17px;
  font-size:18px;
  background:linear-gradient(100deg,#15ddff,#7c3cff);
  box-shadow:0 10px 30px rgba(25,200,255,.22);
}

.secondaryBtn{
  width:100%;
  margin-top:11px;
  padding:15px;
  border-radius:17px;
  font-size:14px;
  color:#ccecff;
  background:rgba(14,31,57,.86);
  border:1px solid rgba(94,234,255,.20);
}

.bestTitle{
  margin-top:20px;
  color:#667e9b;
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

#menuBest{
  margin-top:5px;
  color:#ffd83d;
  font-size:23px;
  font-weight:900;
}

.phaseGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:18px 0;
}

.phaseBtn{
  position:relative;
  min-height:76px;
  padding:8px 3px;
  border-radius:14px;
  background:
    linear-gradient(
      145deg,
      rgba(12,31,58,.96),
      rgba(4,13,28,.96)
    );
  border:1px solid rgba(94,234,255,.15);
}

.phaseBtn .num{
  display:block;
  color:#5eeaff;
  font-size:21px;
  font-weight:900;
}

.phaseBtn .name{
  display:block;
  margin-top:4px;
  color:#aabdd3;
  font-size:7px;
  font-weight:900;
}

.phaseBtn .goal{
  display:block;
  margin-top:4px;
  color:#ffd83d;
  font-size:7px;
  font-weight:900;
}

.phaseBtn.locked{
  opacity:.28;
}

.phaseBtn.selected{
  border-color:#5eeaff;
  box-shadow:0 0 15px rgba(94,234,255,.25);
}

.lock{
  position:absolute;
  top:4px;
  right:5px;
  font-size:10px;
}

.resultTitle{
  color:#5eeaff;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
}

.resultStats{
  color:#d7e6f8;
  font-size:15px;
  line-height:1.8;
  margin:18px 0 22px;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:22px;
  top:calc(env(safe-area-inset-top) + 12px);
  font-size:40px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
}

#coins{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 60px);
  color:#ffd83d;
  font-size:16px;
  font-weight:900;
}

#target{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 88px);
  color:rgba(255,255,255,.62);
  font-size:10px;
  font-weight:900;
}

#progressBox{
  position:absolute;
  left:25px;
  right:25px;
  top:calc(env(safe-area-inset-top) + 108px);
  height:4px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.12);
}

#progress{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#16ddff,#8b3cff);
}

#speed{
  position:absolute;
  right:20px;
  top:calc(env(safe-area-inset-top) + 14px);
  color:#5eeaff;
  font-size:13px;
  font-weight:900;
}

#phaseHud{
  position:absolute;
  right:20px;
  top:calc(env(safe-area-inset-top) + 39px);
  color:#ffd83d;
  font-size:10px;
  font-weight:900;
  text-align:right;
  max-width:180px;
}

#sound{
  position:absolute;
  right:18px;
  top:calc(env(safe-area-inset-top) + 66px);
  pointer-events:auto;
  padding:8px 10px;
  border-radius:12px;
  color:#5eeaff;
  background:rgba(3,12,27,.8);
  border:1px solid rgba(94,234,255,.25);
  font-size:10px;
}

#hint{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  text-align:center;
  color:rgba(255,255,255,.38);
  font-size:9px;
  font-weight:700;
}

@media(max-width:380px){
  h1{
    font-size:35px;
  }

  #score{
    font-size:35px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="score">0</div>

  <div id="coins">● 0</div>

  <div id="target">META 1200</div>

  <div id="progressBox">
    <div id="progress"></div>
  </div>

  <div id="speed">VELOCIDADE 1.0x</div>

  <div id="phaseHud">FASE 1</div>

  <button id="sound">🔊 SOM</button>

  <div id="hint">
    ← → FAIXA • ↑ PULAR • ↓ DESLIZAR
  </div>

</div>


<!-- MENU -->

<div id="menu" class="screen show">

  <div class="card">

    <div class="logo">
      RUNNER EXPERIENCE
    </div>

    <h1>
      ÚLTIMO<br>SEGUNDO
    </h1>

    <div class="subtitle">
      CORRA • DESVIE • SOBREVIVA
    </div>

    <button id="play" class="mainBtn">
      ▶ JOGAR
    </button>

    <button id="openPhases" class="secondaryBtn">
      🎮 50 FASES
    </button>

    <div class="bestTitle">
      MELHOR PONTUAÇÃO
    </div>

    <div id="menuBest">0</div>

  </div>

</div>


<!-- FASES -->

<div id="phaseScreen" class="screen">

  <div class="card">

    <div class="logo">
      PROGRESSÃO
    </div>

    <h1 style="font-size:31px">
      50 FASES
    </h1>

    <div class="subtitle">
      Complete cada fase para desbloquear a próxima.
    </div>

    <div id="phaseGrid" class="phaseGrid"></div>

    <button id="phaseBack" class="secondaryBtn">
      ← VOLTAR
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

  <div class="card">

    <div class="resultTitle">
      CORRIDA ENCERRADA
    </div>

    <h1>
      FIM DE JOGO
    </h1>

    <div id="gameOverStats" class="resultStats"></div>

    <button id="retry" class="mainBtn">
      🔄 TENTAR NOVAMENTE
    </button>

    <button id="gameOverMenu" class="secondaryBtn">
      🏠 MENU
    </button>

  </div>

</div>


<!-- VITÓRIA -->

<div id="victory" class="screen">

  <div class="card">

    <div class="resultTitle">
      FASE CONCLUÍDA
    </div>

    <h1>
      🏆 VITÓRIA
    </h1>

    <div id="victoryStats" class="resultStats"></div>

    <button id="nextPhase" class="mainBtn">
      🚀 PRÓXIMA FASE
    </button>

    <button id="victoryMenu" class="secondaryBtn">
      🏠 MENU
    </button>

  </div>

</div>


<script>
(function(){

"use strict";


/* =========================================================
   ELEMENTOS
========================================================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var phaseScreen=document.getElementById("phaseScreen");
var gameOver=document.getElementById("gameOver");
var victory=document.getElementById("victory");

var play=document.getElementById("play");
var openPhases=document.getElementById("openPhases");
var phaseBack=document.getElementById("phaseBack");
var retry=document.getElementById("retry");
var gameOverMenu=document.getElementById("gameOverMenu");
var victoryMenu=document.getElementById("victoryMenu");
var nextPhaseButton=document.getElementById("nextPhase");

var soundButton=document.getElementById("sound");

var phaseGrid=document.getElementById("phaseGrid");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var targetEl=document.getElementById("target");
var progressEl=document.getElementById("progress");
var speedEl=document.getElementById("speed");
var phaseHud=document.getElementById("phaseHud");

var menuBest=document.getElementById("menuBest");

var gameOverStats=document.getElementById("gameOverStats");
var victoryStats=document.getElementById("victoryStats");


/* =========================================================
   CANVAS
========================================================= */

var W=0;
var H=0;
var DPR=1;

function resize(){

  DPR=Math.min(
    window.devicePixelRatio||1,
    1.5
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   FASES
========================================================= */

var themes=[
  ["CIDADE NEON","#020617","#092b4a","#20dcff"],
  ["CENTRO FUTURISTA","#09021c","#24104a","#b45cff"],
  ["VIA NOTURNA","#020611","#102e3a","#35ffd2"],
  ["ZONA INDUSTRIAL","#120504","#4a1c08","#ff7b2f"],
  ["CYBER CITY","#10001c","#30104f","#ff35df"],
  ["DISTRITO VERMELHO","#180208","#52101d","#ff304f"],
  ["MEGA TÚNEL","#02030b","#16264c","#477cff"],
  ["CIDADE AÉREA","#03121a","#07506a","#29f7ff"],
  ["ZONA ZERO","#100008","#360015","#ff168f"],
  ["ÚLTIMO SEGUNDO","#05000f","#26005c","#a855ff"]
];

var phaseData={};

for(var p=1;p<=50;p++){

  var t=themes[(p-1)%themes.length];

  phaseData[p]={
    name:
      p<=10
      ?t[0]
      :t[0]+" "+(Math.floor((p-1)/10)+1),

    target:
      Math.floor(
        1200+
        (p-1)*560+
        Math.pow(p-1,1.22)*12
      ),

    maxSpeed:
      Math.min(
        1.95,
        .76+(p-1)*.024
      ),

    sky1:t[1],
    sky2:t[2],
    accent:t[3]
  };
}


/* =========================================================
   PROGRESSÃO
========================================================= */

var currentPhase=parseInt(
  localStorage.getItem("ultimoSegundoPhase")||"1",
  10
);

var unlockedPhase=parseInt(
  localStorage.getItem("ultimoSegundoUnlocked")||"1",
  10
);

var best=parseInt(
  localStorage.getItem("ultimoSegundoBest")||"0",
  10
);

if(!isFinite(currentPhase))currentPhase=1;
if(!isFinite(unlockedPhase))unlockedPhase=1;
if(!isFinite(best))best=0;

currentPhase=Math.max(
  1,
  Math.min(50,currentPhase)
);

unlockedPhase=Math.max(
  1,
  Math.min(50,unlockedPhase)
);


/* =========================================================
   ESTADO
========================================================= */

var running=false;

var lastTime=0;
var gameTime=0;

var score=0;
var coins=0;

var speed=.55;

var targetLane=1;
var laneVisual=1;

var jumpTime=0;
var slideTime=0;

var spawnTimer=0;
var coinTimer=0;

var objects=[];

var particles=[];


/* =========================================================
   ÁUDIO
========================================================= */

var audioContext=null;
var masterGain=null;

var soundOn=true;

function initAudio(){

  if(audioContext)return;

  try{

    var AudioClass=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioClass)return;

    audioContext=new AudioClass();

    masterGain=
      audioContext.createGain();

    masterGain.gain.value=.25;

    masterGain.connect(
      audioContext.destination
    );

  }catch(e){

    audioContext=null;
  }
}

function tone(
  frequency,
  duration,
  type,
  volume,
  endFrequency
){

  if(!soundOn)return;

  try{

    initAudio();

    if(!audioContext)return;

    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    var osc=
      audioContext.createOscillator();

    var gain=
      audioContext.createGain();

    var now=
      audioContext.currentTime;

    osc.type=
      type||"sine";

    osc.frequency.setValueAtTime(
      frequency,
      now
    );

    if(endFrequency){

      osc.frequency.exponentialRampToValueAtTime(
        endFrequency,
        now+duration
      );
    }

    gain.gain.setValueAtTime(
      .001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      volume||.06,
      now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now+duration+.03);

  }catch(e){}
}


/* =========================================================
   TELAS
========================================================= */

function hideScreens(){

  menu.classList.remove("show");
  phaseScreen.classList.remove("show");
  gameOver.classList.remove("show");
  victory.classList.remove("show");
}

function showMenu(){

  running=false;

  hideScreens();

  menu.classList.add("show");

  menuBest.textContent=
    Math.floor(best);

  renderPhaseMenu();
}


/* =========================================================
   MENU DE FASES
========================================================= */

function renderPhaseMenu(){

  phaseGrid.innerHTML="";

  for(
    var i=1;
    i<=50;
    i++
  ){

    var data=phaseData[i];

    var button=
      document.createElement("button");

    button.className="phaseBtn";

    if(i>unlockedPhase){
      button.classList.add("locked");
    }

    if(i===currentPhase){
      button.classList.add("selected");
    }

    button.innerHTML=
      '<span class="num">'+
      i+
      '</span>'+
      '<span class="name">'+
      data.name+
      '</span>'+
      '<span class="goal">META '+
      data.target+
      '</span>'+
      (
        i>unlockedPhase
        ?'<span class="lock">🔒</span>'
        :""
      );

    button.addEventListener(
      "click",
      (function(selected){

        return function(){

          if(selected>unlockedPhase){
            return;
          }

          currentPhase=selected;

          localStorage.setItem(
            "ultimoSegundoPhase",
            String(currentPhase)
          );

          renderPhaseMenu();
        };

      })(i)
    );

    phaseGrid.appendChild(button);
  }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  var data=
    phaseData[currentPhase];

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  targetEl.textContent=
    "META "+data.target;

  progressEl.style.width=
    Math.min(
      100,
      score/data.target*100
    )+"%";

  speedEl.textContent=
    "VELOCIDADE "+
    (speed/.55).toFixed(1)+
    "x";

  phaseHud.textContent=
    "FASE "+
    currentPhase+
    " • "+
    data.name;
}


/* =========================================================
   GEOMETRIA
========================================================= */

function horizon(){

  return H*.39;
}

function ground(){

  return H*.94;
}

function roadHalf(z){

  return W*.10+
    W*.40*
    Math.pow(
      Math.max(0,Math.min(1,z)),
      1.08
    );
}

function roadY(z){

  var h=horizon();
  var g=ground();

  return h+
    (g-h)*
    Math.pow(
      Math.max(0,Math.min(1,z)),
      1.38
    );
}

function laneX(lane,z){

  return W/2+
    (lane-1)*
    roadHalf(z)*
    .62;
}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

  var data=
    phaseData[currentPhase];

  score=0;
  coins=0;

  speed=
    Math.min(
      data.maxSpeed*.76,
      .55+
      (currentPhase-1)*.014
    );

  targetLane=1;
  laneVisual=1;

  jumpTime=0;
  slideTime=0;

  spawnTimer=.65;
  coinTimer=.5;

  gameTime=0;

  objects=[];
  particles=[];

  updateHUD();
}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

  initAudio();

  resetGame();

  hideScreens();

  running=true;

  lastTime=
    performance.now();

  tone(
    320,
    .12,
    "sine",
    .05,
    620
  );
}

play.addEventListener(
  "click",
  startGame
);

retry.addEventListener(
  "click",
  startGame
);


/* =========================================================
   MENU
========================================================= */

openPhases.addEventListener(
  "click",
  function(){

    running=false;

    hideScreens();

    phaseScreen.classList.add("show");

    renderPhaseMenu();
  }
);

phaseBack.addEventListener(
  "click",
  showMenu
);

gameOverMenu.addEventListener(
  "click",
  showMenu
);

victoryMenu.addEventListener(
  "click",
  showMenu
);


/* =========================================================
   MOVIMENTO
========================================================= */

function moveLeft(){

  if(!running)return;

  targetLane=Math.max(
    0,
    targetLane-1
  );

  tone(
    240,
    .05,
    "square",
    .025,
    180
  );
}

function moveRight(){

  if(!running)return;

  targetLane=Math.min(
    2,
    targetLane+1
  );

  tone(
    290,
    .05,
    "square",
    .025,
    220
  );
}

function jump(){

  if(!running)return;

  if(
    jumpTime<=0 &&
    slideTime<=0
  ){

    jumpTime=.70;

    tone(
      230,
      .12,
      "triangle",
      .05,
      540
    );
  }
}

function slide(){

  if(!running)return;

  if(
    slideTime<=0 &&
    jumpTime<=0
  ){

    slideTime=.55;
  }
}


/* =========================================================
   TOUCH
========================================================= */

var touchStartX=0;
var touchStartY=0;

canvas.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

    initAudio();

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    var dx=
      t.clientX-touchStartX;

    var dy=
      t.clientY-touchStartY;

    var ax=Math.abs(dx);
    var ay=Math.abs(dy);

    var minimum=25;

    if(
      ax<minimum &&
      ay<minimum
    ){
      return;
    }

    if(ax>ay){

      if(dx>0){
        moveRight();
      }else{
        moveLeft();
      }

    }else{

      if(dy<0){
        jump();
      }else{
        slide();
      }
    }

  },
  {passive:true}
);


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft"){
      moveLeft();
    }

    if(e.key==="ArrowRight"){
      moveRight();
    }

    if(
      e.key==="ArrowUp"||
      e.key===" "
    ){
      jump();
    }

    if(e.key==="ArrowDown"){
      slide();
    }

  }
);


/* =========================================================
   OBSTÁCULOS
========================================================= */

function laneBlocked(
  lane,
  z
){

  for(
    var i=0;
    i<objects.length;
    i++
  ){

    var o=objects[i];

    if(
      o.kind==="obstacle" &&
      o.lane===lane &&
      Math.abs(o.z-z)<.28
    ){

      return true;
    }
  }

  return false;
}

function freeLanes(){

  var free=[];

  for(
    var l=0;
    l<3;
    l++
  ){

    if(!laneBlocked(l,0)){
      free.push(l);
    }
  }

  return free;
}

function addObstacle(
  lane,
  type
){

  objects.push({

    kind:"obstacle",

    lane:lane,

    type:type,

    z:0,

    hit:false
  });
}

function spawnObstacle(){

  var free=
    freeLanes();

  if(!free.length){
    return;
  }

  var difficulty=
    currentPhase/50;

  var doubleChance=
    Math.min(
      .78,
      .10+
      difficulty*.68
    );

  var types=[
    "barrier",
    "train",
    "gate"
  ];

  if(
    free.length>=2 &&
    Math.random()<doubleChance
  ){

    var firstIndex=
      Math.floor(
        Math.random()*free.length
      );

    var first=
      free[firstIndex];

    var secondOptions=
      free.filter(
        function(v){
          return v!==first;
        }
      );

    var second=
      secondOptions[
        Math.floor(
          Math.random()*
          secondOptions.length
        )
      ];

    var type1;
    var type2;

    if(currentPhase<8){

      type1=
        Math.random()<.6
        ?"barrier"
        :"train";

      type2=
        Math.random()<.6
        ?"barrier"
        :"train";

    }else{

      type1=
        types[
          Math.floor(
            Math.random()*types.length
          )
        ];

      type2=
        types[
          Math.floor(
            Math.random()*types.length
          )
        ];
    }

    addObstacle(
      first,
      type1
    );

    addObstacle(
      second,
      type2
    );

  }else{

    var lane=
      free[
        Math.floor(
          Math.random()*free.length
        )
      ];

    var type;

    if(currentPhase<6){

      type=
        Math.random()<.55
        ?"barrier"
        :"train";

    }else{

      type=
        types[
          Math.floor(
            Math.random()*types.length
          )
        ];
    }

    addObstacle(
      lane,
      type
    );
  }
}


/* =========================================================
   MOEDAS
========================================================= */

function spawnCoins(){

  var free=
    freeLanes();

  if(!free.length){
    return;
  }

  var lane=
    free[
      Math.floor(
        Math.random()*free.length
      )
    ];

  var amount=
    currentPhase>=25
    ?4
    :3;

  for(
    var i=0;
    i<amount;
    i++
  ){

    objects.push({

      kind:"coin",

      lane:lane,

      z:-i*.14,

      hit:false
    });
  }
}


/* =========================================================
   COLISÃO
========================================================= */

function checkCollisions(){

  /*
    A faixa lógica muda imediatamente
    quando o jogador faz o swipe.
  */

  var playerLane=
    targetLane;

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    if(o.hit){
      continue;
    }

    if(
      o.kind==="coin" &&
      o.lane===playerLane &&
      o.z>.82 &&
      o.z<1.05
    ){

      o.hit=true;

      coins++;

      score+=
        35;

      tone(
        650,
        .07,
        "sine",
        .06,
        950
      );

      continue;
    }

    if(
      o.kind==="obstacle" &&
      o.lane===playerLane &&
      o.z>.80 &&
      o.z<1.02
    ){

      var safe=false;

      if(
        o.type==="barrier"
      ){
        safe=
          jumpTime>0;
      }

      if(
        o.type==="gate"
      ){
        safe=
          slideTime>0;
      }

      if(
        o.type==="train"
      ){
        safe=false;
      }

      if(!safe){

        tone(
          90,
          .18,
          "sawtooth",
          .06,
          45
        );

        endGame();

        return;
      }
    }
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function addParticles(
  x,
  y
){

  for(
    var i=0;
    i<6;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*
        100,

      vy:
        (Math.random()-.8)*
        100,

      life:.45
    });
  }
}

function updateParticles(dt){

  for(
    var i=particles.length-1;
    i>=0;
    i--
  ){

    var p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=140*dt;

    p.life-=dt;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  var data=
    phaseData[currentPhase];

  gameTime+=dt;

  /*
    Movimento rápido e responsivo.
  */

  laneVisual+=
    (
      targetLane-
      laneVisual
    )*
    Math.min(
      1,
      dt*32
    );

  if(
    Math.abs(
      targetLane-
      laneVisual
    )<.004
  ){

    laneVisual=
      targetLane;
  }

  if(jumpTime>0){
    jumpTime-=dt;
  }

  if(slideTime>0){
    slideTime-=dt;
  }

  /*
    velocidade
  */

  var targetSpeed=
    .55+
    (
      data.maxSpeed-
      .55
    )*
    Math.min(
      1,
      score/data.target
    );

  speed+=
    (
      targetSpeed-
      speed
    )*
    Math.min(
      1,
      dt*2
    );

  /*
    pontuação
  */

  score+=
    90*
    speed*
    dt;

  /*
    obstáculos
  */

  spawnTimer-=dt;

  var interval=
    Math.max(
      .42,
      .88-
      currentPhase*.007
    );

  if(spawnTimer<=0){

    spawnObstacle();

    spawnTimer=
      interval/
      Math.max(
        .75,
        speed/.55
      );
  }

  /*
    moedas
  */

  coinTimer-=dt;

  if(coinTimer<=0){

    spawnCoins();

    coinTimer=
      Math.max(
        .75,
        1.45-
        currentPhase*.009
      );
  }

  /*
    objetos
  */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z+=
      speed*
      dt*
      .78;

    if(o.z>1.15){

      objects.splice(
        i,
        1
      );
    }
  }

  updateParticles(dt);

  checkCollisions();

  if(
    score>=data.target
  ){

    completePhase();

    return;
  }

  updateHUD();
}


/* =========================================================
   DESENHO DO FUNDO
========================================================= */

function drawBackground(){

  var data=
    phaseData[currentPhase];

  var gradient=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    data.sky1
  );

  gradient.addColorStop(
    .50,
    data.sky2
  );

  gradient.addColorStop(
    1,
    "#02040a"
  );

  ctx.fillStyle=
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    brilho no horizonte
  */

  var glow=
    ctx.createRadialGradient(
      W/2,
      horizon(),
      10,
      W/2,
      horizon(),
      W*.60
    );

  glow.addColorStop(
    0,
    data.accent+"44"
  );

  glow.addColorStop(
    1,
    "transparent"
  );

  ctx.fillStyle=
    glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    cidade
  */

  var base=
    horizon()+8;

  for(
    var i=0;
    i<15;
    i++
  ){

    var width=
      25+
      ((i*43)%65);

    var height=
      45+
      ((i*77)%150);

    var x=
      ((i*97)%W)-20;

    ctx.fillStyle=
      i%2
      ?"rgba(1,8,22,.88)"
      :"rgba(3,13,30,.92)";

    ctx.fillRect(
      x,
      base-height,
      width,
      height
    );

    ctx.fillStyle=
      data.accent+"44";

    for(
      var y=base-height+12;
      y<base-8;
      y+=19
    ){

      if(
        (i+
        Math.floor(y))%3!==0
      ){

        ctx.fillRect(
          x+7,
          y,
          3,
          5
        );
      }
    }
  }
}


/* =========================================================
   ESTRADA
========================================================= */

function drawRoad(){

  var h=horizon();
  var g=ground();

  var topHalf=
    roadHalf(0);

  var bottomHalf=
    roadHalf(1);

  var data=
    phaseData[currentPhase];

  /*
    estrada
  */

  ctx.beginPath();

  ctx.moveTo(
    W/2-topHalf,
    h
  );

  ctx.lineTo(
    W/2+topHalf,
    h
  );

  ctx.lineTo(
    W/2+bottomHalf,
    g
  );

  ctx.lineTo(
    W/2-bottomHalf,
    g
  );

  ctx.closePath();

  ctx.fillStyle=
    "#030914";

  ctx.fill();

  /*
    bordas
  */

  ctx.strokeStyle=
    data.accent;

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    W/2-topHalf,
    h
  );

  ctx.lineTo(
    W/2-bottomHalf,
    g
  );

  ctx.moveTo(
    W/2+topHalf,
    h
  );

  ctx.lineTo(
    W/2+bottomHalf,
    g
  );

  ctx.stroke();

  /*
    linhas das três faixas
  */

  for(
    var l=1;
    l<3;
    l++
  ){

    var topX=
      W/2+
      (l-1.5)*
      topHalf*
      .66;

    var bottomX=
      W/2+
      (l-1.5)*
      bottomHalf*
      .66;

    ctx.strokeStyle=
      "rgba(70,210,240,.18)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      topX,
      h
    );

    ctx.lineTo(
      bottomX,
      g
    );

    ctx.stroke();
  }

  /*
    marcas de velocidade
  */

  for(
    var i=0;
    i<11;
    i++
  ){

    var z=
      (
        i/11+
        gameTime*.32
      )%1;

    var y=
      roadY(z);

    var half=
      roadHalf(z);

    ctx.strokeStyle=
      "rgba(80,220,255,.12)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      W/2-half,
      y
    );

    ctx.lineTo(
      W/2+half,
      y
    );

    ctx.stroke();
  }
}


/* =========================================================
   OBJETOS
========================================================= */

function drawObject(o){

  if(
    o.z<0||
    o.z>1.12
  ){
    return;
  }

  var x=
    laneX(
      o.lane,
      o.z
    );

  var y=
    roadY(o.z);

  var s=
    .30+
    o.z*1.20;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    s,
    s
  );

  if(
    o.kind==="coin"
  ){

    ctx.shadowColor=
      "#ffd83d";

    ctx.shadowBlur=14;

    ctx.fillStyle=
      "#ffd83d";

    ctx.beginPath();

    ctx.ellipse(
      0,
      -17,
      9,
      14,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle=
      "#fff4a0";

    ctx.beginPath();

    ctx.arc(
      -3,
      -21,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    return;
  }

  var data=
    phaseData[currentPhase];

  var color=
    o.type==="train"
    ?" #ff315c"
    :o.type==="gate"
    ?" #b94cff"
    :data.accent;

  color=color.trim();

  ctx.shadowColor=color;
  ctx.shadowBlur=15;

  if(
    o.type==="barrier"
  ){

    ctx.fillStyle=
      "#101827";

    ctx.fillRect(
      -45,
      -28,
      90,
      28
    );

    ctx.fillStyle=
      color;

    ctx.fillRect(
      -40,
      -23,
      80,
      6
    );

    ctx.fillStyle=
      "#ff355d";

    ctx.fillRect(
      -30,
      -10,
      60,
      4
    );

  }else if(
    o.type==="train"
  ){

    ctx.fillStyle=
      "#11192a";

    ctx.fillRect(
      -48,
      -68,
      96,
      68
    );

    ctx.strokeStyle=
      color;

    ctx.lineWidth=5;

    ctx.strokeRect(
      -48,
      -68,
      96,
      68
    );

    ctx.fillStyle=
      color;

    ctx.fillRect(
      -30,
      -27,
      11,
      9
    );

    ctx.fillRect(
      19,
      -27,
      11,
      9
    );

  }else{

    ctx.strokeStyle=
      color;

    ctx.lineWidth=8;

    ctx.strokeRect(
      -46,
      -80,
      92,
      80
    );

    ctx.fillStyle=
      "#10172a";

    ctx.fillRect(
      -38,
      -70,
      76,
      70
    );
  }

  ctx.restore();
}


/* =========================================================
   RUNNER
========================================================= */

function drawRunner(){

  var x=
    laneX(
      laneVisual,
      1
    );

  var jumpProgress=
    jumpTime>0
    ?1-jumpTime/.70
    :0;

  var lift=
    jumpTime>0
    ?Math.sin(
      jumpProgress*Math.PI
    )*H*.12
    :0;

  var run=
    Math.sin(
      gameTime*17
    );

  var sliding=
    slideTime>0;

  var y=
    ground()-25-lift;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  /*
    sombra
  */

  ctx.globalAlpha=.30;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    8,
    sliding?34:24,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /*
    inclinação
  */

  ctx.rotate(
    (
      targetLane-
      laneVisual
    )*.12
  );

  if(sliding){

    ctx.fillStyle=
      "#18283f";

    ctx.fillRect(
      -27,
      -26,
      54,
      22
    );

    ctx.strokeStyle=
      "#e5fbff";

    ctx.lineWidth=6;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      -15,
      -10
    );

    ctx.lineTo(
      -34,
      5
    );

    ctx.moveTo(
      14,
      -10
    );

    ctx.lineTo(
      33,
      5
    );

    ctx.stroke();

  }else{

    /*
      pernas
    */

    var legA=
      run*10;

    var legB=
      -run*10;

    ctx.strokeStyle=
      "#dffbff";

    ctx.lineWidth=8;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      -7,
      0
    );

    ctx.lineTo(
      -12+legA,
      18
    );

    ctx.lineTo(
      -14+legA,
      28
    );

    ctx.moveTo(
      7,
      0
    );

    ctx.lineTo(
      12+legB,
      18
    );

    ctx.lineTo(
      14+legB,
      28
    );

    ctx.stroke();

    /*
      corpo
    */

    ctx.fillStyle=
      "#172942";

    ctx.shadowColor=
      "#5eeaff";

    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.moveTo(
      -12,
      -43
    );

    ctx.lineTo(
      12,
      -43
    );

    ctx.lineTo(
      14,
      0
    );

    ctx.lineTo(
      -14,
      0
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

    /*
      braços
    */

    ctx.strokeStyle=
      "#dffbff";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
      -10,
      -34
    );

    ctx.lineTo(
      -20-run*10,
      -13
    );

    ctx.moveTo(
      10,
      -34
    );

    ctx.lineTo(
      20+run*10,
      -13
    );

    ctx.stroke();

    /*
      cabeça
    */

    ctx.fillStyle=
      "#e9fcff";

    ctx.beginPath();

    ctx.arc(
      0,
      -57,
      12,
      0,
      Math.PI*2
    );

    ctx.fill();

    /*
      visor/cabelo
    */

    ctx.fillStyle=
      "#15253b";

    ctx.beginPath();

    ctx.ellipse(
      0,
      -59,
      9,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    /*
      luz
    */

    ctx.fillStyle=
      "#5eeaff";

    ctx.beginPath();

    ctx.arc(
      0,
      -19,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life*2
      );

    ctx.fillStyle=
      "#ffd83d";

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   DESENHO
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  objects.sort(
    function(a,b){
      return a.z-b.z;
    }
  );

  for(
    var i=0;
    i<objects.length;
    i++
  ){

    drawObject(
      objects[i]
    );
  }

  drawParticles();

  drawRunner();
}


/* =========================================================
   FINAL DA FASE
========================================================= */

function completePhase(){

  running=false;

  var finished=
    currentPhase;

  if(
    score>best
  ){

    best=
      Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  if(
    currentPhase<50
  ){

    if(
      unlockedPhase<
      currentPhase+1
    ){

      unlockedPhase=
        currentPhase+1;

      localStorage.setItem(
        "ultimoSegundoUnlocked",
        String(unlockedPhase)
      );
    }

    currentPhase++;

    localStorage.setItem(
      "ultimoSegundoPhase",
      String(currentPhase)
    );

  }

  hideScreens();

  victory.classList.add(
    "show"
  );

  if(
    finished<50
  ){

    victoryStats.innerHTML=
      "FASE "+
      finished+
      " • "+
      phaseData[finished].name+
      "<br>"+
      "Pontuação: "+
      Math.floor(score)+
      "<br>"+
      "Moedas: "+
      coins+
      "<br><br>"+
      "FASE "+
      (finished+1)+
      " DESBLOQUEADA!";

    nextPhaseButton.style.display=
      "block";

  }else{

    victoryStats.innerHTML=
      "🏆 VOCÊ CHEGOU À FASE 50!"+
      "<br><br>"+
      "Pontuação: "+
      Math.floor(score)+
      "<br>"+
      "Moedas: "+
      coins;

    nextPhaseButton.style.display=
      "none";
  }
}

nextPhaseButton.addEventListener(
  "click",
  startGame
);


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  running=false;

  if(
    score>best
  ){

    best=
      Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  hideScreens();

  gameOver.classList.add(
    "show"
  );

  gameOverStats.innerHTML=
    "Pontuação: "+
    Math.floor(score)+
    "<br>"+
    "Moedas: "+
    coins+
    "<br>"+
    "Fase: "+
    currentPhase+
    " • "+
    phaseData[currentPhase].name;
}


/* =========================================================
   SOM
========================================================= */

soundButton.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    soundOn=
      !soundOn;

    soundButton.textContent=
      soundOn
      ?"🔊 SOM"
      :"🔇 SOM";

    if(soundOn){

      initAudio();

      tone(
        500,
        .08,
        "sine",
        .05,
        800
      );
    }
  }
);


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!lastTime){
    lastTime=time;
  }

  var dt=
    (time-lastTime)/1000;

  lastTime=time;

  dt=
    Math.min(
      .033,
      Math.max(
        0,
        dt
      )
    );

  if(running){

    update(dt);

    draw();
  }

  requestAnimationFrame(
    loop
  );
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

menuBest.textContent=
  Math.floor(best);

renderPhaseMenu();

updateHUD();

requestAnimationFrame(
  loop
);

})();
</script>
