<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:28px;
  top:calc(env(safe-area-inset-top) + 16px);
  font-size:48px;
  font-weight:900;
  text-shadow:0 4px 18px #000;
}

#coins{
  position:absolute;
  left:30px;
  top:calc(env(safe-area-inset-top) + 76px);
  color:#ffd83d;
  font-size:20px;
  font-weight:900;
}

#combo{
  position:absolute;
  left:28px;
  top:calc(env(safe-area-inset-top) + 112px);
  color:#ff43d0;
  font-size:18px;
  font-weight:900;
  text-shadow:0 0 15px #ff43d0;
}

#speed{
  position:absolute;
  right:28px;
  top:calc(env(safe-area-inset-top) + 18px);
  color:#45eaff;
  font-size:17px;
  font-weight:900;
}

#phase{
  position:absolute;
  right:28px;
  top:calc(env(safe-area-inset-top) + 58px);
  color:#ffd83d;
  font-size:18px;
  font-weight:900;
}

#soundBtn{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 94px);
  pointer-events:auto;
  border:1px solid rgba(94,234,255,.55);
  border-radius:16px;
  padding:9px 14px;
  background:rgba(3,12,28,.88);
  color:#5eeaff;
  font-size:14px;
  font-weight:900;
}

#hint{
  position:absolute;
  left:0;
  right:0;
  bottom:24px;
  text-align:center;
  color:rgba(255,255,255,.58);
  font-size:12px;
}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(
    180deg,
    rgba(1,5,18,.35),
    rgba(1,3,10,.92)
  );
}

#gameover{display:none}

.card{
  width:min(430px,92vw);
  padding:32px 25px;
  border:1px solid rgba(80,220,255,.42);
  border-radius:28px;
  text-align:center;
  background:rgba(4,10,27,.9);
  box-shadow:
    0 0 60px rgba(0,180,255,.18),
    inset 0 0 40px rgba(40,130,255,.04);
  backdrop-filter:blur(15px);
}

h1{
  margin:0 0 8px;
  color:#fff;
  font-size:44px;
  line-height:.95;
  letter-spacing:-2px;
}

.sub{
  color:#9eb4cf;
  margin-bottom:27px;
  font-size:14px;
  line-height:1.5;
}

button.play{
  border:0;
  border-radius:20px;
  padding:18px 42px;
  background:linear-gradient(90deg,#14dfff,#7448ff);
  color:#fff;
  font-weight:900;
  font-size:19px;
  box-shadow:0 12px 35px rgba(35,190,255,.28);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button.play:active{
  transform:scale(.97);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="score">0</div>
  <div id="coins">● 0</div>
  <div id="combo">COMBO ×1</div>

  <div id="speed">VELOCIDADE 1.0x</div>
  <div id="phase">FASE 1</div>

  <button id="soundBtn">🔊 SOM</button>

  <div id="hint">
    DESLIZE ← → PARA MUDAR DE FAIXA • ↑ PARA PULAR
  </div>

</div>

<div id="menu">
  <div class="card">

    <h1>
      ÚLTIMO<br>
      <span style="color:#ffd43b">SEGUNDO</span>
    </h1>

    <div class="sub">
      CORRA • DESVIE • SOBREVIVA
      <br>
      Uma nova cidade espera por você.
    </div>

    <button class="play" id="play">
      JOGAR
    </button>

  </div>
</div>

<div id="gameover">
  <div class="card">

    <h1>FIM DE JOGO</h1>

    <div class="sub" id="finalScore">
      Pontuação: 0
    </div>

    <button class="play" id="again">
      JOGAR NOVAMENTE
    </button>

  </div>
</div>

<script>
(function(){

"use strict";

/* =========================
   CANVAS
========================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
/* Compatibilidade com Safari/iPhone */
if(!CanvasRenderingContext2D.prototype.roundRect){

  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){

    r=Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

    this.beginPath();

    this.moveTo(x+r,y);

    this.arcTo(
      x+w,y,
      x+w,y+h,
      r
    );

    this.arcTo(
      x+w,y+h,
      x,y+h,
      r
    );

    this.arcTo(
      x,y+h,
      x,y,
      r
    );

    this.arcTo(
      x,y,
      x+w,y,
      r
    );

    this.closePath();

    return this;

  };

}
var W=0,H=0,dpr=1;

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================
   HUD
========================= */

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var comboEl=document.getElementById("combo");
var speedEl=document.getElementById("speed");
var phaseEl=document.getElementById("phase");

var menu=document.getElementById("menu");
var gameover=document.getElementById("gameover");
var finalScore=document.getElementById("finalScore");

var play=document.getElementById("play");
var again=document.getElementById("again");
var soundBtn=document.getElementById("soundBtn");


/* =========================
   GAME
========================= */

var running=false;
var last=0;

var gameTime=0;

var score=0;
var coins=0;

var speed=.48;
var phase=1;

var lane=1;
var targetLane=1;

var jump=0;

var spawnTimer=.9;
var coinTimer=.45;

var combo=1;
var comboTimer=0;

var objects=[];
var particles=[];

var best=Number(
  localStorage.getItem("ultimoSegundoBest")||0
);


/* =========================
   AUDIO
========================= */

var audioCtx=null;

function audioStart(){

  try{

    if(!audioCtx){

      audioCtx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

  }catch(e){}

}

function sound(type){

  try{

    if(!audioCtx ||
       audioCtx.state!=="running") return;

    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    var now=audioCtx.currentTime;

    if(type==="start"){

      osc.type="sine";

      osc.frequency.setValueAtTime(400,now);
      osc.frequency.exponentialRampToValueAtTime(
        760,now+.16
      );

      gain.gain.setValueAtTime(.001,now);
      gain.gain.exponentialRampToValueAtTime(
        .16,now+.025
      );
      gain.gain.exponentialRampToValueAtTime(
        .001,now+.22
      );

      osc.start(now);
      osc.stop(now+.24);

    }

    if(type==="coin"){

      osc.type="sine";

      osc.frequency.setValueAtTime(650,now);
      osc.frequency.exponentialRampToValueAtTime(
        1100,now+.10
      );

      gain.gain.setValueAtTime(.001,now);
      gain.gain.exponentialRampToValueAtTime(
        .18,now+.015
      );
      gain.gain.exponentialRampToValueAtTime(
        .001,now+.16
      );

      osc.start(now);
      osc.stop(now+.18);

    }

    if(type==="jump"){

      osc.type="square";

      osc.frequency.setValueAtTime(230,now);
      osc.frequency.exponentialRampToValueAtTime(
        580,now+.13
      );

      gain.gain.setValueAtTime(.001,now);
      gain.gain.exponentialRampToValueAtTime(
        .09,now+.015
      );
      gain.gain.exponentialRampToValueAtTime(
        .001,now+.17
      );

      osc.start(now);
      osc.stop(now+.19);

    }

    if(type==="hit"){

      osc.type="sawtooth";

      osc.frequency.setValueAtTime(180,now);
      osc.frequency.exponentialRampToValueAtTime(
        45,now+.28
      );

      gain.gain.setValueAtTime(.001,now);
      gain.gain.exponentialRampToValueAtTime(
        .20,now+.02
      );
      gain.gain.exponentialRampToValueAtTime(
        .001,now+.30
      );

      osc.start(now);
      osc.stop(now+.32);

    }

  }catch(e){}

}


/* =========================
   RESET
========================= */

function reset(){

  score=0;
  coins=0;

  speed=.48;
  phase=1;

  lane=1;
  targetLane=1;

  jump=0;

  spawnTimer=.85;
  coinTimer=.35;

  combo=1;
  comboTimer=0;

  gameTime=0;

  objects=[];
  particles=[];

  updateHUD();
}


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent=Math.floor(score);

  coinsEl.textContent="● "+coins;

  comboEl.textContent="COMBO ×"+combo;

  speedEl.textContent=
    "VELOCIDADE "+
    (speed/.48).toFixed(1)+"x";

  phaseEl.textContent=
    "FASE "+phase;

}


/* =========================
   START
========================= */

function startGame(){

  audioStart();

  sound("start");

  reset();

  running=true;

  menu.style.display="none";
  gameover.style.display="none";

  last=performance.now();

  requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function endGame(){

  if(!running)return;

  running=false;

  sound("hit");

  var final=Math.floor(score);

  if(final>best){

    best=final;

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );

  }

  finalScore.textContent=
    "Pontuação: "+
    final+
    " • Recorde: "+
    best;

  gameover.style.display="flex";

}


/* =========================
   BUTTONS
========================= */

play.addEventListener("click",function(e){

  e.preventDefault();

  startGame();

});

again.addEventListener("click",function(e){

  e.preventDefault();

  startGame();

});

soundBtn.addEventListener("click",function(e){

  e.preventDefault();

  audioStart();

  sound("start");

});


/* =========================
   ROAD
========================= */

function roadY(z){

  var horizon=H*.40;

  return horizon+
    Math.pow(z,1.65)*
    (H*.68-horizon);

}

function roadHalf(z){

  return W*.055+
    Math.pow(z,1.12)*W*.48;

}

function laneX(l,z){

  var center=W/2;
  var half=roadHalf(z);

  return center+
    (l-1)*half*.62;

}


/* =========================
   OBJECTS
========================= */

function spawnObstacle(){

  var type=Math.floor(
    Math.random()*3
  );

  objects.push({

    type:"ob",
    obstacle:type,
    lane:Math.floor(Math.random()*3),
    z:0

  });

}

function spawnCoin(){

  objects.push({

    type:"coin",
    lane:Math.floor(Math.random()*3),
    z:0

  });

}


/* =========================
   PARTICLES
========================= */

function burst(x,y,color,n){

  for(var i=0;i<n;i++){

    var a=Math.random()*Math.PI*2;
    var v=30+Math.random()*120;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v,

      life:.5,
      color:color

    });

  }

}


/* =========================
   UPDATE
========================= */

function update(dt){

  gameTime+=dt;

  score+=speed*dt*120;

  speed=Math.min(
    .86,
    speed+dt*.010
  );

  phase=Math.min(
    5,
    1+Math.floor(score/900)
  );

  lane+=
    (targetLane-lane)*
    (1-Math.exp(-dt*18));

  if(jump>0){

    jump=Math.max(
      0,
      jump-dt
    );

  }

  comboTimer-=dt;

  if(comboTimer<=0){

    combo=1;

  }


  /* SPAWN */

  spawnTimer-=dt;
  coinTimer-=dt;

  if(spawnTimer<=0){

    spawnObstacle();

    spawnTimer=
      Math.max(
        .48,
        .90-speed*.45
      )+
      Math.random()*.28;

  }

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=
      .35+
      Math.random()*.42;

  }


  /* OBJECT MOVEMENT */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z+=
      speed*
      (1+o.z*.85)*
      dt;


    /* COLLISION */

    if(o.z>.88){

      var sameLane=
        Math.abs(o.lane-lane)<.34;


      if(
        o.type==="ob" &&
        sameLane
      ){

        /*
          Obstáculos agora podem ser
          pulados.
        */

        if(jump<.24){

          burst(
            laneX(o.lane,.94),
            roadY(.94),
            "#ff3b70",
            25
          );

          endGame();

          return;

        }

      }


      /* COIN */

      if(
        o.type==="coin" &&
        sameLane
      ){

        coins++;

        score+=
          12*combo;

        combo=Math.min(
          10,
          combo+1
        );

        comboTimer=2.2;

        burst(
          laneX(o.lane,.93),
          roadY(.93)-30,
          "#ffd83d",
          12
        );

        sound("coin");

        objects.splice(i,1);

        continue;

      }

    }


    if(o.z>1.05){

      objects.splice(i,1);

    }

  }


  /* PARTICLES */

  for(
    var j=particles.length-1;
    j>=0;
    j--
  ){

    var p=particles[j];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=120*dt;

    if(p.life<=0){

      particles.splice(j,1);

    }

  }

  updateHUD();

}


/* =========================
   DRAW
========================= */

function draw(){

  drawBackground();

  drawCity();

  drawRoad();

  objects.sort(function(a,b){

    return b.z-a.z;

  });

  for(
    var i=0;
    i<objects.length;
    i++
  ){

    if(objects[i].type==="coin")
      drawCoin(objects[i]);

    else
      drawObstacle(objects[i]);

  }

  drawRunner();

  drawParticles();

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  var g=
    ctx.createLinearGradient(
      0,0,0,H
    );

  if(phase===1){

    g.addColorStop(0,"#020617");
    g.addColorStop(.45,"#082d4e");
    g.addColorStop(1,"#02040b");

  }

  if(phase===2){

    g.addColorStop(0,"#10051f");
    g.addColorStop(.45,"#31105b");
    g.addColorStop(1,"#03020b");

  }

  if(phase===3){

    g.addColorStop(0,"#12213a");
    g.addColorStop(.45,"#174e62");
    g.addColorStop(1,"#05070d");

  }

  if(phase>=4){

    g.addColorStop(0,"#18051e");
    g.addColorStop(.45,"#40134e");
    g.addColorStop(1,"#05030a");

  }

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );

}


/* =========================
   CITY
========================= */

function drawCity(){

  var horizon=H*.40;

  for(var i=0;i<22;i++){

    var bw=
      30+
      ((i*43)%75);

    var bh=
      40+
      ((i*61)%170);

    var x=
      ((i*89)%W)-20;

    var color=
      i%3===0
      ?"rgba(20,65,110,.80)"
      :"rgba(8,35,72,.90)";

    ctx.fillStyle=color;

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );


    /* janelas */

    for(
      var y=horizon-bh+14;
      y<horizon-10;
      y+=20
    ){

      var wx=x+8;

      for(
        var xx=wx;
        xx<x+bw-8;
        xx+=18
      ){

        ctx.fillStyle=
          i%4===0
          ?"rgba(255,55,190,.48)"
          :"rgba(40,215,255,.42)";

        ctx.fillRect(
          xx,
          y,
          4,
          7
        );

      }

    }

  }


  ctx.fillStyle="#54eaff";

  ctx.shadowColor="#54eaff";
  ctx.shadowBlur=18;

  ctx.fillRect(
    0,
    horizon,
    W,
    2
  );

  ctx.shadowBlur=0;

}


/* =========================
   ROAD
========================= */

function drawRoad(){

  var horizon=H*.40;

  var g=
    ctx.createLinearGradient(
      0,horizon,0,H
    );

  g.addColorStop(0,"#09182a");
  g.addColorStop(1,"#010307");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    H
  );

  ctx.lineTo(
    W/2-W*.5,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* laterais */

  ctx.strokeStyle="#28e8ff";
  ctx.lineWidth=4;

  ctx.shadowColor="#28e8ff";
  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2-W*.5,
    H
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    H
  );

  ctx.stroke();

  ctx.shadowBlur=0;


  /* faixas */

  for(
    var l=1;
    l<3;
    l++
  ){

    ctx.strokeStyle=
      "rgba(80,220,255,.42)";

    ctx.lineWidth=2;

    ctx.setLineDash([
      20,
      20
    ]);

    ctx.beginPath();

    ctx.moveTo(
      laneX(l-.5,0),
      horizon
    );

    ctx.lineTo(
      W/2+
      (l-1.5)*W*.5,
      H
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  /* linhas de velocidade */

  for(
    var z=.05;
    z<1;
    z+=.09
  ){

    var y=roadY(z);
    var half=roadHalf(z);

    ctx.strokeStyle=
      "rgba(50,190,255,.14)";

    ctx.beginPath();

    ctx.moveTo(
      W/2-half,
      y
    );

    ctx.lineTo(
      W/2+half,
      y
    );

    ctx.stroke();

  }

}


/* =========================
   OBSTACLES
========================= */

function drawObstacle(o){

  var z=o.z;

  var x=
    laneX(o.lane,z);

  var y=
    roadY(z);

  var s=
    12+z*76;

  ctx.save();

  ctx.translate(
    x,
    y-s*.55
  );


  /*
    3 tipos de obstáculo
  */

  if(o.obstacle===0){

    /* barreira */

    ctx.fillStyle="#ff315d";

    ctx.shadowColor="#ff315d";
    ctx.shadowBlur=18;

    ctx.fillRect(
      -s*.58,
      -s*.32,
      s*1.16,
      s*.64
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.globalAlpha=.8;

    ctx.fillRect(
      -s*.40,
      -s*.04,
      s*.80,
      s*.08
    );

  }


  if(o.obstacle===1){

    /* bloco 3D */

    ctx.fillStyle="#8b35ff";

    ctx.shadowColor="#a84cff";
    ctx.shadowBlur=18;

    ctx.fillRect(
      -s*.45,
      -s*.65,
      s*.9,
      s*.9
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#38eaff";

    ctx.fillRect(
      -s*.34,
      -s*.52,
      s*.68,
      s*.08
    );

  }


  if(o.obstacle===2){

    /* portal energético */

    ctx.strokeStyle="#ff42d0";

    ctx.lineWidth=
      Math.max(3,s*.12);

    ctx.shadowColor="#ff42d0";
    ctx.shadowBlur=20;

    ctx.strokeRect(
      -s*.52,
      -s*.75,
      s*1.04,
      s*.95
    );

    ctx.shadowBlur=0;

    ctx.fillStyle=
      "rgba(255,40,190,.18)";

    ctx.fillRect(
      -s*.42,
      -s*.65,
      s*.84,
      s*.75
    );

  }

  ctx.restore();

}


/* =========================
   COINS
========================= */

function drawCoin(o){

  var z=o.z;

  var x=laneX(o.lane,z);

  var y=
    roadY(z)-
    20-
    z*28;

  var r=
    5+
    z*17;

  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(
    Math.sin(gameTime*6+z*8)*.3
  );

  ctx.fillStyle="#ffd83d";

  ctx.shadowColor="#ffd83d";
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff4a0";

  ctx.beginPath();

  ctx.arc(
    -r*.25,
    -r*.25,
    r*.25,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================
   NOVO PERSONAGEM
========================= */

function drawRunner(){

  var x = laneX(lane,.98);
  var ground = H*.91;

  var lift = jump>0
    ? Math.sin(((.38-jump)/.38)*Math.PI)*H*.14
    : 0;

  var y = ground-lift+Math.sin(gameTime*15)*H*.008;

  var run = Math.sin(gameTime*15);

  var arm = run*13;
  var leg = run*18;

  /* =========================
     INCLINAÇÃO DO PERSONAGEM
     ========================= */

  var lean = (targetLane-lane)*.18;

  if(jump>0){
    lean *= .45;
  }

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(lean);

  /* =========================
     SOMBRA
     ========================= */

  ctx.globalAlpha=.25;
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.ellipse(
    0,
    28,
    20,
    8,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();
  ctx.globalAlpha=1;

  /* =========================
     EFEITO DE ENERGIA
     ========================= */

  ctx.shadowBlur=22;
  ctx.shadowColor="#20eaff";

  /* =========================
     PERNAS
     ========================= */

  var jumping = jump>0;

  var legA;
  var legB;

  if(jumping){

    legA = -10;
    legB = 10;

  }else{

    legA = leg;
    legB = -leg;

  }

  /* perna esquerda */

  ctx.strokeStyle="#172b4d";
  ctx.lineWidth=10;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-6,15);
  ctx.lineTo(-10+legA*.35,30);
  ctx.stroke();

  /* perna direita */

  ctx.beginPath();
  ctx.moveTo(6,15);
  ctx.lineTo(10+legB*.35,30);
  ctx.stroke();

  /* botas */

  ctx.shadowBlur=14;
  ctx.shadowColor="#ff27d8";

  ctx.strokeStyle="#22eaff";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(-10+legA*.35,30);
  ctx.lineTo(-18+legA*.55,30);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(10+legB*.35,30);
  ctx.lineTo(18+legB*.55,30);
  ctx.stroke();

  /* =========================
     CORPO / JAQUETA
     ========================= */

  ctx.shadowBlur=18;
  ctx.shadowColor="#13eaff";

  var bodyGrad=ctx.createLinearGradient(-16,-10,16,22);

  bodyGrad.addColorStop(0,"#172f55");
  bodyGrad.addColorStop(.55,"#0c1934");
  bodyGrad.addColorStop(1,"#081022");

  ctx.fillStyle=bodyGrad;

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -10,
    32,
    35,
    10
  );

  ctx.fill();

  /* detalhe central */

  ctx.shadowBlur=12;
  ctx.shadowColor="#ff28d8";

  ctx.fillStyle="#ff27d8";

  ctx.beginPath();

  ctx.roundRect(
    -5,
    3,
    10,
    5,
    2
  );

  ctx.fill();

  /* =========================
     BRAÇOS
     ========================= */

  ctx.shadowBlur=12;
  ctx.shadowColor="#20eaff";

  ctx.strokeStyle="#142b50";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-13,-4);
  ctx.lineTo(-23-arm*.35,12);

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(13,-4);
  ctx.lineTo(23+arm*.35,12);

  ctx.stroke();

  /* mãos */

  ctx.fillStyle="#28eaff";

  ctx.beginPath();
  ctx.arc(-23-arm*.35,12,4,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(23+arm*.35,12,4,0,Math.PI*2);
  ctx.fill();

  /* =========================
     PESCOÇO
     ========================= */

  ctx.fillStyle="#111d35";

  ctx.fillRect(
    -6,
    -15,
    12,
    7
  );

  /* =========================
     CABEÇA / CAPACETE
     ========================= */

  ctx.shadowBlur=20;
  ctx.shadowColor="#24eaff";

  var headGrad=ctx.createLinearGradient(
    -17,-40,
    17,-10
  );

  headGrad.addColorStop(0,"#1a3459");
  headGrad.addColorStop(.5,"#09172e");
  headGrad.addColorStop(1,"#050b19");

  ctx.fillStyle=headGrad;

  ctx.beginPath();

  ctx.roundRect(
    -17,
    -42,
    34,
    29,
    12
  );

  ctx.fill();

  /* visor */

  ctx.shadowBlur=10;
  ctx.shadowColor="#ff2bd8";

  ctx.fillStyle="#050a15";

  ctx.beginPath();

  ctx.roundRect(
    -14,
    -35,
    28,
    11,
    5
  );

  ctx.fill();

  /* reflexo do visor */

  ctx.fillStyle="#18344e";

  ctx.fillRect(
    -10,
    -33,
    20,
    3
  );

  /* olhos/LEDs */

  ctx.shadowBlur=14;
  ctx.shadowColor="#20eaff";

  ctx.fillStyle="#26eaff";

  ctx.beginPath();
  ctx.arc(-8,-29,3,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(8,-29,3,0,Math.PI*2);
  ctx.fill();

  /* =========================
     ARO DO CAPACETE
     ========================= */

  ctx.strokeStyle="#20eaff";
  ctx.lineWidth=4;
  ctx.shadowBlur=18;
  ctx.shadowColor="#20eaff";

  ctx.beginPath();

  ctx.arc(
    0,
    -28,
    20,
    Math.PI*1.08,
    Math.PI*1.92
  );

  ctx.stroke();

  /* =========================
     MOCHILA DE ENERGIA
     ========================= */

  ctx.shadowBlur=16;
  ctx.shadowColor="#ff27d8";

  ctx.fillStyle="#101d39";

  ctx.beginPath();

  ctx.roundRect(
    -10,
    -4,
    20,
    20,
    6
  );

  ctx.fill();

  ctx.strokeStyle="#1eeaff";
  ctx.lineWidth=2;

  ctx.stroke();

  /* núcleo */

  ctx.fillStyle="#ff27d8";

  ctx.beginPath();

  ctx.arc(
    0,
    6,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* =========================
     PROPULSOR
     ========================= */

  if(!jumping){

    ctx.shadowBlur=20;
    ctx.shadowColor="#ff27d8";

    ctx.strokeStyle="#ff27d8";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-7,24);
    ctx.lineTo(-10,34+Math.abs(run)*5);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(7,24);
    ctx.lineTo(10,34+Math.abs(run)*5);

    ctx.stroke();

  }else{

    /* energia durante o salto */

    ctx.shadowBlur=22;
    ctx.shadowColor="#20eaff";

    ctx.strokeStyle="#20eaff";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-7,24);
    ctx.lineTo(-11,36);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(7,24);
    ctx.lineTo(11,36);

    ctx.stroke();

  }

  ctx.restore();
}
/* =========================
   PARTICLES
========================= */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life*2
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );

  }

  ctx.globalAlpha=1;

}


/* =========================
   GAME LOOP
========================= */

function loop(t){

  if(!running)return;

  var dt=
    Math.min(
      .035,
      (t-last)/1000||0
    );

  last=t;

  update(dt);

  if(running){

    draw();

    requestAnimationFrame(loop);

  }

}


/* =========================
   TOUCH
========================= */

var sx=0;
var sy=0;

canvas.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=e.changedTouches[0];

    sx=t.clientX;
    sy=t.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    var t=e.changedTouches[0];

    var dx=t.clientX-sx;
    var dy=t.clientY-sy;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<25
    )return;


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0){

        targetLane=
          Math.min(
            2,
            targetLane+1
          );

      }else{

        targetLane=
          Math.max(
            0,
            targetLane-1
          );

      }

    }else{

      if(dy<0){

        jump=.38;

        sound("jump");

      }

    }

  },
  {passive:true}
);


/* =========================
   TECLADO
========================= */

window.addEventListener(
  "keydown",
  function(e){

    if(!running)return;

    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){

      targetLane=
        Math.max(
          0,
          targetLane-1
        );

    }


    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){

      targetLane=
        Math.min(
          2,
          targetLane+1
        );

    }


    if(
      e.key==="ArrowUp"||
      e.key.toLowerCase()==="w"||
      e.key===" "
    ){

      jump=.38;

      sound("jump");

    }

  }
);


/* =========================
   PRIMEIRO DESENHO
========================= */

draw();

})();
</script>
