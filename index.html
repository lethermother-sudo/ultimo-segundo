<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ÚLTIMO SEGUNDO</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020306;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.top{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.card{
  background:rgba(5,8,14,.72);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:14px;
  padding:10px 13px;
}

.small{
  font-size:10px;
  letter-spacing:1.8px;
  opacity:.65;
  text-transform:uppercase;
}

.big{
  margin-top:3px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.stats{
  display:flex;
  gap:8px;
}

.stat{
  min-width:70px;
  text-align:center;
}

#objective{
  position:absolute;
  top:92px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  text-shadow:0 3px 20px #000;
}

#objective .title{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}

#objective .sub{
  margin-top:4px;
  font-size:12px;
  opacity:.7;
  letter-spacing:2px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 8px rgba(80,220,255,.8);
}

#crosshair:before{
  width:2px;
  height:28px;
  left:13px;
  top:0;
}

#crosshair:after{
  width:28px;
  height:2px;
  left:0;
  top:13px;
}

#crossDot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:white;
  left:11.5px;
  top:11.5px;
}

#bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:max(16px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 15px;
}

.weaponInfo{
  background:rgba(4,7,12,.78);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:10px 14px;
  min-width:160px;
  backdrop-filter:blur(12px);
}

.weaponName{
  font-size:14px;
  font-weight:900;
  letter-spacing:1px;
}

.ammo{
  margin-top:6px;
  height:4px;
  width:125px;
  background:rgba(255,255,255,.12);
  border-radius:20px;
  overflow:hidden;
}

#ammoBar{
  height:100%;
  width:100%;
  background:#65e7ff;
  box-shadow:0 0 10px #65e7ff;
}

.controls{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

button{
  border:0;
  color:white;
  font-weight:900;
  cursor:pointer;
  user-select:none;
}

#shoot{
  width:88px;
  height:88px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#65f6ff,#087da5 55%,#041a28);
  border:2px solid rgba(150,245,255,.65);
  box-shadow:
    0 0 20px rgba(0,220,255,.45),
    inset 0 0 20px rgba(255,255,255,.12);
  font-size:12px;
  letter-spacing:1px;
}

#reload{
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(12,18,28,.9);
  border:1px solid rgba(255,255,255,.2);
  font-size:10px;
}

#menu,
#phaseMenu,
#gameOver,
#victory{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(0,220,255,.12),transparent 35%),
    linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.92));
}

.panel{
  width:min(92%,430px);
  padding:28px;
  border-radius:24px;
  background:rgba(5,8,14,.82);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 30px 100px rgba(0,0,0,.65);
  backdrop-filter:blur(20px);
  text-align:center;
}

.logo{
  font-size:38px;
  font-weight:1000;
  letter-spacing:5px;
  text-shadow:
    0 0 10px rgba(0,220,255,.8),
    0 0 40px rgba(0,220,255,.35);
}

.tag{
  margin-top:8px;
  font-size:10px;
  letter-spacing:4px;
  opacity:.55;
}

.menuButtons{
  margin-top:28px;
  display:grid;
  gap:10px;
}

.bigBtn{
  width:100%;
  min-height:52px;
  border-radius:14px;
  background:linear-gradient(135deg,#0a9bbd,#07526e);
  border:1px solid rgba(130,240,255,.45);
  box-shadow:0 8px 25px rgba(0,180,230,.18);
  letter-spacing:1px;
}

.bigBtn.secondary{
  background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.12);
}

#phaseGrid{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  max-height:55vh;
  overflow:auto;
}

.phase{
  aspect-ratio:1;
  border-radius:10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;
}

.phase.locked{
  opacity:.25;
}

.phase.current{
  border-color:#61eaff;
  box-shadow:0 0 16px rgba(0,220,255,.35);
}

.hidden{
  display:none!important;
}

#hit{
  position:absolute;
  left:50%;
  top:50%;
  width:45px;
  height:45px;
  transform:translate(-50%,-50%) scale(.5);
  opacity:0;
  pointer-events:none;
  transition:.08s;
}

#hit.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#hit:before,
#hit:after{
  content:"";
  position:absolute;
  left:21px;
  top:5px;
  width:3px;
  height:35px;
  background:white;
  box-shadow:0 0 10px #7df5ff;
}

#hit:after{
  transform:rotate(90deg);
}

#damage{
  position:absolute;
  inset:0;
  background:rgba(255,0,0,.35);
  opacity:0;
  transition:.1s;
}

#damage.flash{
  opacity:1;
}

#toast{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:30px;
  font-weight:1000;
  letter-spacing:3px;
  text-shadow:0 0 20px #00eaff;
  opacity:0;
  pointer-events:none;
}

#toast.show{
  animation:toast .8s ease forwards;
}

@keyframes toast{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-75%) scale(1.15)}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div class="top">

    <div class="card">
      <div class="small">Missão</div>
      <div class="big">FASE <span id="phase">1</span></div>
    </div>

    <div class="stats">

      <div class="card stat">
        <div class="small">Alvos</div>
        <div class="big"><span id="kills">0</span>/<span id="goal">8</span></div>
      </div>

      <div class="card stat">
        <div class="small">Vida</div>
        <div class="big" id="life">♥♥♥</div>
      </div>

      <div class="card stat">
        <div class="small">Moedas</div>
        <div class="big" id="coins">0</div>
      </div>

    </div>

  </div>

  <div id="objective">
    <div class="title" id="worldTitle">CIDADE NEON</div>
    <div class="sub" id="objectiveText">ELIMINE 8 ALVOS</div>
  </div>

  <div id="crosshair">
    <div id="crossDot"></div>
  </div>

  <div id="hit"></div>
  <div id="damage"></div>
  <div id="toast"></div>

  <div id="bottom">

    <div class="weaponInfo">
      <div class="small">Armamento</div>
      <div class="weaponName" id="weaponName">NEON PISTOL</div>
      <div class="ammo">
        <div id="ammoBar"></div>
      </div>
    </div>

    <div class="controls">
      <button id="reload">RECARREGAR</button>
      <button id="shoot">ATIRAR</button>
    </div>

  </div>

</div>


<div id="menu">
  <div class="panel">

    <div class="logo">ÚLTIMO<br>SEGUNDO</div>
    <div class="tag">TACTICAL NEON COMBAT</div>

    <div class="menuButtons">
      <button class="bigBtn" id="startBtn">INICIAR MISSÃO</button>
      <button class="bigBtn secondary" id="phasesBtn">SELECIONAR FASE</button>
    </div>

  </div>
</div>


<div id="phaseMenu" class="hidden">
  <div class="panel">

    <div class="logo" style="font-size:25px">MISSÕES</div>
    <div class="tag">SELECIONE UMA FASE</div>

    <div id="phaseGrid"></div>

    <div class="menuButtons">
      <button class="bigBtn secondary" id="backBtn">VOLTAR</button>
    </div>

  </div>
</div>


<div id="gameOver" class="hidden">
  <div class="panel">

    <div class="logo" style="font-size:30px">MISSÃO FALHOU</div>
    <div class="tag" id="gameOverText">VOCÊ FOI ELIMINADO</div>

    <div class="menuButtons">
      <button class="bigBtn" id="retryBtn">TENTAR NOVAMENTE</button>
      <button class="bigBtn secondary" id="menuBtn">MENU</button>
    </div>

  </div>
</div>


<div id="victory" class="hidden">
  <div class="panel">

    <div class="logo" style="font-size:30px">FASE CONCLUÍDA</div>
    <div class="tag" id="victoryText">MISSÃO CONCLUÍDA</div>

    <div class="menuButtons">
      <button class="bigBtn" id="nextBtn">PRÓXIMA FASE</button>
      <button class="bigBtn secondary" id="victoryMenuBtn">MENU</button>
    </div>

  </div>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";

import {EffectComposer}
from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/EffectComposer.js";

import {RenderPass}
from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/RenderPass.js";

import {UnrealBloomPass}
from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/UnrealBloomPass.js";

import {OutputPass}
from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/OutputPass.js";


/* =========================================================
   DOM
========================================================= */

const game = document.getElementById("game");

const menu = document.getElementById("menu");
const phaseMenu = document.getElementById("phaseMenu");
const gameOver = document.getElementById("gameOver");
const victory = document.getElementById("victory");

const startBtn = document.getElementById("startBtn");
const phasesBtn = document.getElementById("phasesBtn");
const backBtn = document.getElementById("backBtn");

const retryBtn = document.getElementById("retryBtn");
const menuBtn = document.getElementById("menuBtn");

const nextBtn = document.getElementById("nextBtn");
const victoryMenuBtn = document.getElementById("victoryMenuBtn");

const phaseEl = document.getElementById("phase");
const killsEl = document.getElementById("kills");
const goalEl = document.getElementById("goal");
const lifeEl = document.getElementById("life");
const coinsEl = document.getElementById("coins");

const worldTitle = document.getElementById("worldTitle");
const objectiveText = document.getElementById("objectiveText");
const weaponName = document.getElementById("weaponName");
const ammoBar = document.getElementById("ammoBar");

const shootBtn = document.getElementById("shoot");
const reloadBtn = document.getElementById("reload");

const hitMarker = document.getElementById("hit");
const damageFlash = document.getElementById("damage");
const toast = document.getElementById("toast");


/* =========================================================
   GAME DATA
========================================================= */

const WORLDS = [

  {
    name:"CIDADE NEON",
    sky:0x030914,
    fog:0x050a14,
    road:0x080c14,
    neon:0x00d9ff,
    secondary:0xff1ed8,
    type:"city"
  },

  {
    name:"DISTRITO CHUVOSO",
    sky:0x02050a,
    fog:0x07111b,
    road:0x090d13,
    neon:0x48baff,
    secondary:0x874cff,
    type:"rain"
  },

  {
    name:"ZONA INDUSTRIAL",
    sky:0x100806,
    fog:0x160b08,
    road:0x0d0a08,
    neon:0xff5d25,
    secondary:0xffc13b,
    type:"industrial"
  },

  {
    name:"CIDADE SUSPENSA",
    sky:0x050510,
    fog:0x0a0718,
    road:0x080812,
    neon:0xc354ff,
    secondary:0x27ddff,
    type:"sky"
  },

  {
    name:"MEGA TÚNEL",
    sky:0x030405,
    fog:0x070a0d,
    road:0x080a0c,
    neon:0x5dffde,
    secondary:0x2e82ff,
    type:"tunnel"
  },

  {
    name:"BASE TECNOLÓGICA",
    sky:0x041014,
    fog:0x07151a,
    road:0x071014,
    neon:0x53f6ff,
    secondary:0xffffff,
    type:"tech"
  },

  {
    name:"CIDADE NOTURNA",
    sky:0x07020d,
    fog:0x120515,
    road:0x09060d,
    neon:0xff37d4,
    secondary:0x763cff,
    type:"night"
  },

  {
    name:"ZONA VERMELHA",
    sky:0x100304,
    fog:0x1c0607,
    road:0x0e0707,
    neon:0xff253f,
    secondary:0xff7a20,
    type:"red"
  },

  {
    name:"MEGA CITY",
    sky:0x02070d,
    fog:0x07111b,
    road:0x070b12,
    neon:0x00eaff,
    secondary:0xff38e8,
    type:"mega"
  },

  {
    name:"ZONA FINAL",
    sky:0x08020e,
    fog:0x12051d,
    road:0x090611,
    neon:0xff18e8,
    secondary:0x26ffff,
    type:"final"
  }

];


const WEAPONS = [

  {
    name:"NEON PISTOL",
    damage:1,
    fireRate:250,
    ammo:12,
    color:0x65eaff
  },

  {
    name:"VOLT SMG",
    damage:1,
    fireRate:115,
    ammo:28,
    color:0x55dfff
  },

  {
    name:"CYBER RIFLE",
    damage:2,
    fireRate:180,
    ammo:20,
    color:0xffca4b
  },

  {
    name:"PLASMA X",
    damage:3,
    fireRate:330,
    ammo:14,
    color:0xff39ff
  },

  {
    name:"OMEGA CANNON",
    damage:5,
    fireRate:550,
    ammo:8,
    color:0xff335d
  }

];


/* =========================================================
   STATE
========================================================= */

let currentPhase =
  Number(localStorage.getItem("ultimoSegundoPhase") || 1);

let unlocked =
  Number(localStorage.getItem("ultimoSegundoUnlocked") || 1);

if(unlocked < 1) unlocked = 1;

let currentWorld;
let currentWeapon;

let running = false;

let kills = 0;
let goal = 8;

let lives = 3;
let coins = 0;

let ammo = 12;

let lastShot = 0;
let reloading = false;

let enemies = [];
let particles = [];
let projectiles = [];
let scenery = [];

let cameraShake = 0;


/* =========================================================
   THREE
========================================================= */

let renderer;
let composer;
let scene;
let camera;

let weaponGroup;

const clock = new THREE.Clock();


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color,roughness=.65,metalness=.25){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}

function glowMat(color){

  return new THREE.MeshBasicMaterial({
    color
  });

}

function box(w,h,d,material){

  return new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

}

function cylinder(r1,r2,h,material){

  return new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,h,16),
    material
  );

}


/* =========================================================
   RENDERER
========================================================= */

renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,1.8)
);

renderer.setSize(innerWidth,innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

game.appendChild(renderer.domElement);


/* =========================================================
   POST PROCESS
========================================================= */

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .05,
  300
);

camera.position.set(0,1.55,6);

composer = new EffectComposer(renderer);

const renderPass =
  new RenderPass(scene,camera);

composer.addPass(renderPass);

const bloom =
  new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight),
    .85,
    .65,
    .72
  );

composer.addPass(bloom);

composer.addPass(new OutputPass());


/* =========================================================
   LIGHTING
========================================================= */

function setupLighting(){

  scene.add(
    new THREE.HemisphereLight(
      0x6da7ff,
      0x050505,
      1.25
    )
  );

  const moon =
    new THREE.DirectionalLight(
      0xaac8ff,
      2.0
    );

  moon.position.set(-20,30,15);
  moon.castShadow = true;

  moon.shadow.mapSize.width = 1024;
  moon.shadow.mapSize.height = 1024;

  scene.add(moon);

}

setupLighting();


/* =========================================================
   WORLD
========================================================= */

function getWorld(){

  return WORLDS[
    Math.min(
      WORLDS.length-1,
      Math.floor((currentPhase-1)/5)
    )
  ];

}

function getWeapon(){

  return WEAPONS[
    Math.min(
      WEAPONS.length-1,
      Math.floor((currentPhase-1)/10)
    )
  ];

}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearScene(){

  while(scene.children.length){

    const obj = scene.children.pop();

    if(obj.geometry) obj.geometry.dispose();

    if(obj.material){

      if(Array.isArray(obj.material)){

        obj.material.forEach(m=>m.dispose());

      }else{

        obj.material.dispose();

      }

    }

  }

  enemies=[];
  particles=[];
  projectiles=[];
  scenery=[];

  setupLighting();

}


/* =========================================================
   ROAD
========================================================= */

function createRoad(){

  const road =
    box(
      20,
      .25,
      260,
      mat(currentWorld.road,.82,.35)
    );

  road.position.set(0,-.35,-110);
  road.receiveShadow=true;

  scene.add(road);


  const shoulderMat =
    glowMat(currentWorld.neon);

  for(let side of [-1,1]){

    const rail =
      box(
        .12,
        .12,
        260,
        shoulderMat
      );

    rail.position.set(
      side*7.5,
      -.05,
      -110
    );

    scene.add(rail);

  }


  for(let z=-5;z>-240;z-=8){

    const line =
      box(
        .08,
        .02,
        3.5,
        glowMat(currentWorld.secondary)
      );

    line.position.set(0,-.20,z);

    scene.add(line);

  }

}


/* =========================================================
   CITY
========================================================= */

function createBuilding(x,z,w,h,d){

  const body =
    box(
      w,
      h,
      d,
      mat(
        currentWorld.type==="night"
        ? 0x09050d
        : 0x111722,
        .72,
        .35
      )
    );

  body.position.set(
    x,
    h/2-.3,
    z
  );

  body.castShadow=true;
  body.receiveShadow=true;

  scene.add(body);

  for(
    let y=.8;
    y<h-.5;
    y+=1.15
  ){

    const windows =
      box(
        w*.65,
        .08,
        .03,
        glowMat(
          Math.random()>.5
          ? currentWorld.neon
          : currentWorld.secondary
        )
      );

    windows.position.set(
      x,
      y,
      z-d/2-.02
    );

    scene.add(windows);

  }

}


function createCity(){

  for(let i=0;i<18;i++){

    const side =
      i%2===0 ? -1 : 1;

    const z =
      -15-Math.floor(i/2)*13;

    const h =
      5+Math.random()*15;

    createBuilding(
      side*(10+Math.random()*7),
      z,
      5+Math.random()*5,
      h,
      5+Math.random()*5
    );

  }

}


/* =========================================================
   INDUSTRIAL
========================================================= */

function createIndustrial(){

  for(let i=0;i<12;i++){

    const side =
      i%2===0 ? -1 : 1;

    const z=-15-i*15;

    const tank =
      cylinder(
        1.5,
        1.5,
        5,
        mat(0x343434,.45,.8)
      );

    tank.rotation.z=Math.PI/2;

    tank.position.set(
      side*(10+Math.random()*3),
      1.5,
      z
    );

    scene.add(tank);


    const pipe =
      cylinder(
        .18,
        .18,
        8,
        glowMat(currentWorld.neon)
      );

    pipe.rotation.z=Math.PI/2;

    pipe.position.set(
      side*7,
      2.2,
      z
    );

    scene.add(pipe);

  }

}


/* =========================================================
   SKY CITY
========================================================= */

function createSkyCity(){

  for(let i=0;i<10;i++){

    const z=-20-i*20;

    for(let side of [-1,1]){

      const platform =
        box(
          7,
          .45,
          12,
          mat(0x171528,.5,.6)
        );

      platform.position.set(
        side*10,
        5+Math.sin(i)*2,
        z
      );

      scene.add(platform);


      const tower =
        box(
          2.5,
          8,
          2.5,
          mat(0x141627,.45,.65)
        );

      tower.position.set(
        side*11,
        8,
        z
      );

      scene.add(tower);

    }

  }

}


/* =========================================================
   TUNNEL
========================================================= */

function createTunnel(){

  for(let z=-10;z>-240;z-=12){

    const ring =
      new THREE.Mesh(
        new THREE.TorusGeometry(
          8,
          .16,
          10,
          32
        ),
        glowMat(currentWorld.neon)
      );

    ring.rotation.y=Math.PI/2;

    ring.position.set(
      0,
      5,
      z
    );

    scene.add(ring);

  }

}


/* =========================================================
   TECH BASE
========================================================= */

function createTech(){

  for(let i=0;i<12;i++){

    const side=i%2?1:-1;

    const tower =
      box(
        4,
        9,
        4,
        mat(0xd9e4e8,.28,.8)
      );

    tower.position.set(
      side*10,
      4.2,
      -15-i*17
    );

    scene.add(tower);


    const screen =
      box(
        2.8,
        2,
        .08,
        glowMat(currentWorld.neon)
      );

    screen.position.set(
      side*10,
      5,
      -17-i*17
    );

    scene.add(screen);

  }

}


/* =========================================================
   FINAL ARENA
========================================================= */

function createFinal(){

  const ring =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        9,
        .7,
        20,
        64
      ),
      glowMat(currentWorld.neon)
    );

  ring.position.set(
    0,
    8,
    -65
  );

  scene.add(ring);


  const ring2 =
    ring.clone();

  ring2.scale.setScalar(.65);
  ring2.material=
    glowMat(currentWorld.secondary);

  ring2.position.z=-66;

  scene.add(ring2);

}


/* =========================================================
   WORLD BUILD
========================================================= */

function buildWorld(){

  currentWorld=getWorld();

  scene.background=
    new THREE.Color(currentWorld.sky);

  scene.fog=
    new THREE.Fog(
      currentWorld.fog,
      18,
      150
    );

  createRoad();


  switch(currentWorld.type){

    case"city":
      createCity();
      break;

    case"rain":
      createCity();
      createRain();
      break;

    case"industrial":
      createIndustrial();
      break;

    case"sky":
      createSkyCity();
      break;

    case"tunnel":
      createTunnel();
      break;

    case"tech":
      createTech();
      break;

    case"night":
      createCity();
      break;

    case"red":
      createIndustrial();
      createSmoke();
      break;

    case"mega":
      createCity();
      createSkyCity();
      break;

    case"final":
      createFinal();
      break;

  }

}


/* =========================================================
   RAIN
========================================================= */

function createRain(){

  const count=500;

  const geo=
    new THREE.BufferGeometry();

  const pos=
    new Float32Array(count*3);

  for(let i=0;i<count;i++){

    pos[i*3]=(Math.random()-.5)*30;
    pos[i*3+1]=Math.random()*20;
    pos[i*3+2]=-Math.random()*150;

  }

  geo.setAttribute(
    "position",
    new THREE.BufferAttribute(pos,3)
  );

  const points=
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color:currentWorld.neon,
        size:.07,
        transparent:true,
        opacity:.75
      })
    );

  points.userData.rain=true;

  scene.add(points);
  scenery.push(points);

}


/* =========================================================
   SMOKE
========================================================= */

function createSmoke(){

  for(let i=0;i<25;i++){

    const smoke =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .7+Math.random()*1.4,
          10,
          10
        ),
        new THREE.MeshBasicMaterial({
          color:0x443737,
          transparent:true,
          opacity:.16
        })
      );

    smoke.position.set(
      (Math.random()-.5)*20,
      Math.random()*5,
      -10-Math.random()*130
    );

    scene.add(smoke);
    scenery.push(smoke);

  }

}


/* =========================================================
   WEAPON
========================================================= */

function buildWeapon(){

  weaponGroup =
    new THREE.Group();

  camera.add(weaponGroup);


  const gunMat =
    mat(0x151a22,.24,.82);

  const dark =
    mat(0x05070a,.3,.85);

  const neon =
    glowMat(currentWeapon.color);


  let bodyLength=1.7;

  if(currentWeapon.name==="VOLT SMG")
    bodyLength=2.2;

  if(currentWeapon.name==="CYBER RIFLE")
    bodyLength=2.8;

  if(currentWeapon.name==="PLASMA X")
    bodyLength=2.4;

  if(currentWeapon.name==="OMEGA CANNON")
    bodyLength=3.1;


  const body=
    box(
      .48,
      .48,
      bodyLength,
      gunMat
    );

  body.position.set(
    .58,
    -.55,
    -1.05
  );

  weaponGroup.add(body);


  const barrel=
    cylinder(
      .13,
      .16,
      bodyLength*.8,
      dark
    );

  barrel.rotation.x=Math.PI/2;

  barrel.position.set(
    .58,
    -.43,
    -2.0
  );

  weaponGroup.add(barrel);


  const energy=
    cylinder(
      .045,
      .045,
      bodyLength*.65,
      neon
    );

  energy.rotation.x=Math.PI/2;

  energy.position.set(
    .58,
    -.38,
    -1.85
  );

  weaponGroup.add(energy);


  const grip=
    box(
      .28,
      .72,
      .35,
      dark
    );

  grip.rotation.x=-.18;

  grip.position.set(
    .58,
    -.92,
    -.75
  );

  weaponGroup.add(grip);


  if(
    currentWeapon.name==="CYBER RIFLE" ||
    currentWeapon.name==="PLASMA X" ||
    currentWeapon.name==="OMEGA CANNON"
  ){

    const scope=
      box(
        .18,
        .18,
        .65,
        dark
      );

    scope.position.set(
      .58,
      -.25,
      -1.2
    );

    weaponGroup.add(scope);

  }

  weaponGroup.rotation.set(
    -.05,
    -.08,
    -.08
  );

}


/* =========================================================
   ENEMY
========================================================= */

function createEnemy(boss=false){

  const group=
    new THREE.Group();

  const scale=
    boss ? 2.0 : 1.15;

  group.scale.setScalar(scale);


  const armor=
    mat(
      boss ? 0x300f32 : 0x202934,
      .28,
      .82
    );

  const dark=
    mat(
      0x050609,
      .3,
      .85
    );

  const glow=
    glowMat(
      boss
      ? 0xff174f
      : currentWorld.neon
    );


  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .65,
        1.15,
        6,
        14
      ),
      armor
    );

  body.position.y=1.4;

  group.add(body);


  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,
        18,
        12
      ),
      dark
    );

  head.position.y=2.55;

  group.add(head);


  const visor=
    box(
      .65,
      .16,
      .06,
      glow
    );

  visor.position.set(
    0,
    2.58,
    -.45
  );

  group.add(visor);


  const core=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .18,
        16,
        10
      ),
      glow
    );

  core.position.set(
    0,
    1.45,
    -.62
  );

  group.add(core);


  for(let side of [-1,1]){

    const arm=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .17,
          .75,
          5,
          8
        ),
        armor
      );

    arm.position.set(
      side*.82,
      1.45,
      0
    );

    arm.rotation.z=side*.15;

    group.add(arm);


    const shoulder=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .25,
          12,
          8
        ),
        armor
      );

    shoulder.position.set(
      side*.72,
      1.8,
      0
    );

    group.add(shoulder);


    const leg=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .2,
          .8,
          5,
          8
        ),
        dark
      );

    leg.position.set(
      side*.32,
      .45,
      0
    );

    group.add(leg);

  }


  group.position.set(
    (Math.random()-.5)*8,
    -.2,
    -35-Math.random()*45
  );

  group.userData={
    hp:boss
      ? 12+currentPhase*.8
      : 2+Math.floor(currentPhase/7),

    boss,

    speed:
      .018+currentPhase*.0008,

    hitTime:0,

    phase:Math.random()*Math.PI*2

  };

  scene.add(group);
  enemies.push(group);

}


/* =========================================================
   SPAWN
========================================================= */

let spawnTimer=0;

function spawnEnemy(){

  const boss =
    currentPhase%10===0 &&
    enemies.filter(e=>e.userData.boss).length===0 &&
    kills>=Math.max(0,goal-2);

  createEnemy(boss);

}


/* =========================================================
   SHOOT
========================================================= */

const raycaster=
  new THREE.Raycaster();

function shoot(){

  if(!running) return;

  const now=performance.now();

  if(
    reloading ||
    now-lastShot<currentWeapon.fireRate
  ) return;

  if(ammo<=0){

    reload();

    return;

  }

  lastShot=now;
  ammo--;

  updateHUD();


  cameraShake=.035;


  const flash=
    new THREE.PointLight(
      currentWeapon.color,
      5,
      7
    );

  flash.position.set(
    .6,
    -.35,
    -2
  );

  weaponGroup.add(flash);

  setTimeout(
    ()=>weaponGroup.remove(flash),
    45
  );


  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  let best=null;
  let bestDist=Infinity;

  for(const enemy of enemies){

    const box3=
      new THREE.Box3()
      .setFromObject(enemy);

    const center=
      box3.getCenter(new THREE.Vector3());

    const dist=
      center.distanceTo(camera.position);

    const dir=
      center
      .sub(camera.position)
      .normalize();

    const dot=
      dir.dot(camera.getWorldDirection(
        new THREE.Vector3()
      ));

    if(dot>.94 && dist<bestDist){

      best=enemy;
      bestDist=dist;

    }

  }


  if(best){

    hitEnemy(best);

  }else{

    createTracer();

  }

}


function hitEnemy(enemy){

  enemy.userData.hp -=
    currentWeapon.damage;

  enemy.userData.hitTime=.15;

  hitMarker.classList.add("show");

  setTimeout(
    ()=>hitMarker.classList.remove("show"),
    90
  );

  createExplosion(
    enemy.position,
    currentWeapon.color
  );


  if(enemy.userData.hp<=0){

    const index=
      enemies.indexOf(enemy);

    if(index>=0)
      enemies.splice(index,1);

    scene.remove(enemy);

    kills++;

    coins +=
      enemy.userData.boss ? 10 : 1;

    createExplosion(
      enemy.position,
      enemy.userData.boss
      ? 0xff174f
      : currentWorld.neon
    );

    if(enemy.userData.boss){

      showToast("BOSS ELIMINADO");

    }

    if(kills>=goal){

      finishPhase();

    }

  }

  updateHUD();

}


/* =========================================================
   TRACER
========================================================= */

function createTracer(){

  const geo=
    new THREE.BufferGeometry()
    .setFromPoints([
      new THREE.Vector3(0,0,-.5),
      new THREE.Vector3(0,0,-40)
    ]);

  const line=
    new THREE.Line(
      geo,
      new THREE.LineBasicMaterial({
        color:currentWeapon.color,
        transparent:true,
        opacity:.8
      })
    );

  camera.add(line);

  setTimeout(
    ()=>camera.remove(line),
    45
  );

}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(pos,color){

  for(let i=0;i<16;i++){

    const p=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .045+Math.random()*.08,
          6,
          6
        ),
        glowMat(color)
      );

    p.position.copy(pos);

    p.userData={
      vx:(Math.random()-.5)*.13,
      vy:(Math.random()-.2)*.13,
      vz:(Math.random()-.5)*.13,
      life:.5+Math.random()*.5
    };

    scene.add(p);
    particles.push(p);

  }

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(reloading || ammo===currentWeapon.ammo)
    return;

  reloading=true;

  setTimeout(()=>{

    ammo=currentWeapon.ammo;
    reloading=false;

    updateHUD();

  },850);

}


/* =========================================================
   DAMAGE
========================================================= */

function takeDamage(){

  lives--;

  damageFlash.classList.add("flash");

  setTimeout(
    ()=>damageFlash.classList.remove("flash"),
    120
  );

  cameraShake=.18;

  updateHUD();

  if(lives<=0){

    endGame();

  }

}


/* =========================================================
   PHASE
========================================================= */

function setupPhase(){

  currentWorld=getWorld();
  currentWeapon=getWeapon();

  goal=
    8+
    Math.floor(
      (currentPhase-1)*.65
    );

  kills=0;
  lives=3;

  ammo=currentWeapon.ammo;

  spawnTimer=0;

  buildWorld();
  buildWeapon();

  updateHUD();

}


function finishPhase(){

  running=false;

  if(currentPhase>=unlocked){

    unlocked=
      Math.min(
        50,
        currentPhase+1
      );

    localStorage.setItem(
      "ultimoSegundoUnlocked",
      unlocked
    );

  }

  if(currentPhase<50){

    localStorage.setItem(
      "ultimoSegundoPhase",
      currentPhase+1
    );

    document.getElementById("victoryText").textContent=
      `FASE ${currentPhase} CONCLUÍDA • PRÓXIMA: FASE ${currentPhase+1}`;

  }else{

    document.getElementById("victoryText").textContent=
      "VOCÊ CONCLUIU AS 50 FASES";

  }

  victory.classList.remove("hidden");

}


function startGame(){

  menu.classList.add("hidden");
  phaseMenu.classList.add("hidden");
  gameOver.classList.add("hidden");
  victory.classList.add("hidden");

  clearScene();

  setupPhase();

  running=true;

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  running=false;

  document.getElementById("gameOverText").textContent=
    `FASE ${currentPhase} • ${kills}/${goal} ALVOS`;

  gameOver.classList.remove("hidden");

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  phaseEl.textContent=currentPhase;
  killsEl.textContent=kills;
  goalEl.textContent=goal;

  lifeEl.textContent=
    "♥".repeat(lives)+
    "♡".repeat(Math.max(0,3-lives));

  coinsEl.textContent=coins;

  worldTitle.textContent=
    `FASE ${currentPhase} • ${currentWorld.name}`;

  objectiveText.textContent=
    currentPhase%10===0
    ? `ELIMINE O BOSS • ${kills}/${goal}`
    : `ELIMINE ${goal} ALVOS • ${kills}/${goal}`;

  weaponName.textContent=
    currentWeapon.name;

  ammoBar.style.width=
    `${(ammo/currentWeapon.ammo)*100}%`;

}


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent=text;

  toast.classList.remove("show");

  void toast.offsetWidth;

  toast.classList.add("show");

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      .05,
      clock.getDelta()
    );


  if(running){

    spawnTimer+=dt;

    const spawnDelay=
      Math.max(
        .65,
        1.25-currentPhase*.012
      );

    if(
      spawnTimer>spawnDelay &&
      kills<goal
    ){

      spawnTimer=0;

      if(enemies.length<5)
        spawnEnemy();

    }


    for(const enemy of enemies){

      enemy.position.z +=
        enemy.userData.speed*
        dt*
        60;

      enemy.position.x +=
        Math.sin(
          performance.now()*.001+
          enemy.userData.phase
        )*.0015;


      if(enemy.position.z>4){

        takeDamage();

        enemy.position.z=-50;

      }


      if(enemy.userData.hitTime>0){

        enemy.userData.hitTime-=dt;

        enemy.scale.x=
          1+
          Math.random()*.12;

      }

    }


    for(const p of particles){

      p.position.x+=p.userData.vx*60*dt;
      p.position.y+=p.userData.vy*60*dt;
      p.position.z+=p.userData.vz*60*dt;

      p.userData.vy-=.003;

      p.userData.life-=dt;

    }


    particles=
      particles.filter(p=>{

        if(p.userData.life<=0){

          scene.remove(p);

          return false;

        }

        return true;

      });


    for(const s of scenery){

      if(s.userData.rain){

        const arr=
          s.geometry.attributes.position.array;

        for(let i=1;i<arr.length;i+=3){

          arr[i]-=.5;

          if(arr[i]<0)
            arr[i]=20;

        }

        s.geometry.attributes.position.needsUpdate=true;

      }

    }


    if(cameraShake>0){

      camera.position.x=
        (Math.random()-.5)*cameraShake;

      camera.position.y=
        1.55+
        (Math.random()-.5)*cameraShake;

      cameraShake*=.82;

    }else{

      camera.position.x=0;
      camera.position.y=1.55;

    }

  }


  composer.render();

}


/* =========================================================
   PHASE SELECT
========================================================= */

function buildPhaseMenu(){

  const grid=
    document.getElementById("phaseGrid");

  grid.innerHTML="";

  for(let i=1;i<=50;i++){

    const b=
      document.createElement("button");

    b.className="phase";

    if(i>unlocked)
      b.classList.add("locked");

    if(i===currentPhase)
      b.classList.add("current");

    b.textContent=
      i>unlocked ? "🔒" : i;

    b.onclick=()=>{

      if(i>unlocked) return;

      currentPhase=i;

      phaseMenu.classList.add("hidden");

      startGame();

    };

    grid.appendChild(b);

  }

}


/* =========================================================
   BUTTONS
========================================================= */

startBtn.onclick=()=>{

  startGame();

};


phasesBtn.onclick=()=>{

  buildPhaseMenu();

  menu.classList.add("hidden");
  phaseMenu.classList.remove("hidden");

};


backBtn.onclick=()=>{

  phaseMenu.classList.add("hidden");
  menu.classList.remove("hidden");

};


retryBtn.onclick=()=>{

  gameOver.classList.add("hidden");

  clearScene();
  setupPhase();

  running=true;

};


menuBtn.onclick=()=>{

  gameOver.classList.add("hidden");

  clearScene();

  menu.classList.remove("hidden");

};


nextBtn.onclick=()=>{

  victory.classList.add("hidden");

  if(currentPhase<50){

    currentPhase++;

    localStorage.setItem(
      "ultimoSegundoPhase",
      currentPhase
    );

    clearScene();
    setupPhase();

    running=true;

  }else{

    menu.classList.remove("hidden");

  }

};


victoryMenuBtn.onclick=()=>{

  victory.classList.add("hidden");
  menu.classList.remove("hidden");

};


/* =========================================================
   CONTROLS
========================================================= */

shootBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);

reloadBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    reload();
  }
);


window.addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space")
      shoot();

    if(e.code==="KeyR")
      reload();

  }
);


/* =========================================================
   TOUCH AIM
========================================================= */

let touching=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(!running) return;

    touching=true;

    lastX=e.clientX;
    lastY=e.clientY;

  }
);


renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!touching || !running) return;

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    camera.rotation.y -= dx*.002;
    camera.rotation.x -= dy*.0015;

    camera.rotation.x=
      Math.max(
        -.7,
        Math.min(.55,camera.rotation.x)
      );

    lastX=e.clientX;
    lastY=e.clientY;

  }
);


window.addEventListener(
  "pointerup",
  ()=>{
    touching=false;
  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    composer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   INITIAL
========================================================= */

buildPhaseMenu();

animate();

</script>
