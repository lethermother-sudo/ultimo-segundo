html,body{

#crossDot{

   UTIL
========================================================= */

function currentWorld(){

}

function hex(c){

/* =========================================================
   RENDERER
========================================================= */

function initRenderer(){

  renderer=new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.6)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  renderer.outputColorSpace=THREE.SRGBColorSpace;

  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;

  scene=new THREE.Scene();

  camera=new THREE.PerspectiveCamera(
    68,
    window.innerWidth/window.innerHeight,
    .05,
    180
  );

  camera.position.set(0,1.7,5);

  composer=new EffectComposer(renderer);

  const renderPass=new RenderPass(scene,camera);

  const bloom=new UnrealBloomPass(
    new THREE.Vector2(
      window.innerWidth,
      window.innerHeight
    ),
    .75,
    .65,
    .78
  );

  const outputPass=new OutputPass();

  composer.addPass(renderPass);
  composer.addPass(bloom);
  composer.addPass(outputPass);

  clock=new THREE.Clock();
}

/* =========================================================
   CENA
========================================================= */

function clearGroup(group){

  if(!group)return;

  while(group.children.length){

    const child=group.children.pop();

    child.traverse(obj=>{

      if(obj.geometry){
        obj.geometry.dispose();
      }

      if(obj.material){

        if(Array.isArray(obj.material)){
          obj.material.forEach(m=>m.dispose());
        }else{
          obj.material.dispose();
        }
      }

    });
  }
}

function initScene(){

  worldRoot=new THREE.Group();
  enemyRoot=new THREE.Group();
  effectRoot=new THREE.Group();
  rainRoot=new THREE.Group();

  scene.add(
    worldRoot,
    enemyRoot,
    effectRoot,
    rainRoot
  );

  const hemi=new THREE.HemisphereLight(
    0xb9d8ff,
    0x080812,
    1.65
  );

  hemi.position.set(0,20,0);
  worldRoot.add(hemi);

  const key=new THREE.DirectionalLight(
    0xffffff,
    2.4
  );

  key.position.set(-10,18,8);
  key.castShadow=true;

  key.shadow.mapSize.width=1024;
  key.shadow.mapSize.height=1024;

  key.shadow.camera.near=.5;
  key.shadow.camera.far=90;

  key.shadow.camera.left=-30;
  key.shadow.camera.right=30;
  key.shadow.camera.top=30;
  key.shadow.camera.bottom=-30;

  worldRoot.add(key);

  buildWorld();
}

/* =========================================================
   MATERIAIS
========================================================= */

function mat(color,rough=.5,metal=.2,emissive=0x000000){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal,
    emissive,
    emissiveIntensity:emissive?2:0
  });
}

function neonMaterial(color){

  return new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:color,
    emissiveIntensity:5,
    toneMapped:false
  });
}

/* =========================================================
   OBJETOS
========================================================= */

function box(
  w,h,d,
  material,
  x=0,y=0,z=0
){

  const g=new THREE.BoxGeometry(w,h,d);

  const m=new THREE.Mesh(g,material);

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function cylinder(
  r1,r2,h,
  material,
  x=0,y=0,z=0
){

  const g=new THREE.CylinderGeometry(
    r1,r2,h,20
  );

  const m=new THREE.Mesh(g,material);

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function road(){

  const w=new THREE.Mesh(
    new THREE.PlaneGeometry(30,170),
    mat(currentWorld().road,.72,.65)
  );

  w.rotation.x=-Math.PI/2;
  w.position.set(0,0,-55);
  w.receiveShadow=true;

  worldRoot.add(w);

  for(const x of [-2.3,2.3]){

    const line=new THREE.Mesh(
      new THREE.PlaneGeometry(.045,170),
      neonMaterial(currentWorld().neon)
    );

    line.rotation.x=-Math.PI/2;
    line.position.set(x,.012,-55);

    worldRoot.add(line);
  }

  for(let i=0;i<26;i++){

    const z=-4-i*6;

    const stripe=new THREE.Mesh(
      new THREE.PlaneGeometry(.13,2.4),

/* =========================================================
   MODELO REAL DE INIMIGO
========================================================= */

async function loadSoldier(){

  const loader=new GLTFLoader();

  const gltf=await loader.loadAsync(
    SOLDIER_URL
  );

  soldierTemplate=gltf.scene;
  soldierAnimations=gltf.animations;

  soldierTemplate.traverse(obj=>{

    if(obj.isMesh){

      obj.castShadow=true;
      obj.receiveShadow=true;

      if(obj.material){

        if(Array.isArray(obj.material)){

          obj.material.forEach(m=>{
            m.roughness=.55;
            m.metalness=.45;
          });

        }else{

          obj.material.roughness=.55;
          obj.material.metalness=.45;

        }
      }
    }
  });
}

/* =========================================================
   CRIA INIMIGO
========================================================= */

function createEnemy(){

  if(!soldierTemplate)return;

  const boss=phases[currentPhase-1].boss;

  const enemy=new THREE.Group();

  const model=SkeletonUtils.clone(
    soldierTemplate
  );

  model.scale.setScalar(
    boss?2.15:1.55
  );

  model.rotation.y=Math.PI;

  model.position.y=0;

  enemy.add(model);

  /* animação */

  const mixer=new THREE.AnimationMixer(model);

  if(soldierAnimations.length){

    const runClip=
      soldierAnimations[1] ||
      soldierAnimations[3] ||
      soldierAnimations[0];

    mixer
      .clipAction(runClip)
      .play();
  }

  /* hitbox invisível */

  const hitGeo=new THREE.SphereGeometry(
    boss?1.45:1.05,
    16,
    16
  );

  const hitMat=new THREE.MeshBasicMaterial({
    transparent:true,
    opacity:0
  });

  const hit=new THREE.Mesh(
    hitGeo,
    hitMat
  );

  hit.position.y=1.05;
  hit.userData.enemy=enemy;

  enemy.add(hit);

  enemy.userData={
    mixer,
    hp:boss?6:1,
    boss,
    speed:phases[currentPhase-1].speed,
    dead:false,
    hit
  };

  const lane=[
    -3.8,
    0,
    3.8
  ][Math.floor(Math.random()*3)];

  enemy.position.set(
    lane,
    0,
    -65-Math.random()*35
  );

  enemyRoot.add(enemy);

  enemies.push(enemy);
}

/* =========================================================
   SPAWN
========================================================= */

let spawnTimer=0;

function spawnLogic(dt){

  spawnTimer+=dt;

  const amount=
    Math.min(
      4,
      1+Math.floor(currentPhase/12)
    );

  const delay=
    Math.max(
      .55,
      1.35-currentPhase*.012
    );

  if(
    spawnTimer>delay &&
    enemies.filter(e=>!e.userData.dead).length<amount
  ){

    spawnTimer=0;

    createEnemy();
  }
}

/* =========================================================
   EXPLOSÃO
========================================================= */

function explosion(pos,color){

  for(let i=0;i<26;i++){

    const g=new THREE.SphereGeometry(
      .035+Math.random()*.06,
      6,
      6
    );

    const m=new THREE.MeshBasicMaterial({
      color,
      transparent:true
    });

    const p=new THREE.Mesh(g,m);

    p.position.copy(pos);

    p.userData={
      life:.35+Math.random()*.4,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.2)*7,
      vz:(Math.random()-.5)*7
    };

    effectRoot.add(p);

    effects.push(p);
  }

  flash();
}

/* =========================================================
   TIRO
========================================================= */

function shoot(){

  if(!gameRunning||paused)return;

  const now=performance.now();
  const weapon=currentWeapon();

  if(
    player.reloading ||
    now-player.lastShot<weapon.fireDelay
  ){
    return;
  }

  if(player.ammo<=0){

    reload();

    return;
  }

  player.lastShot=now;
  player.ammo--;

  updateHUD();

  muzzleFlash();

  raycaster.setFromCamera(
    center,
    camera
  );

  const targets=[];

  for(const e of enemies){

    if(!e.userData.dead){

      const hit=e.userData.hit;

      targets.push(hit);
    }
  }

  const hits=
    raycaster.intersectObjects(
      targets,
      true
    );

  if(hits.length){

    const target=hits[0].object;

    const enemy=target.userData.enemy;

    if(enemy&&!enemy.userData.dead){

      enemy.userData.hp-=weapon.damage;

      hitFeedback();

      if(enemy.userData.hp<=0){

        killEnemy(enemy);
      }
    }
  }

  /* tiro visual */

  tracer();
}

/* =========================================================
   MORTE
========================================================= */

function killEnemy(enemy){

  if(enemy.userData.dead)return;

  enemy.userData.dead=true;

  const pos=new THREE.Vector3();

  enemy.getWorldPosition(pos);

  explosion(
    pos,
    enemy.userData.boss
      ?currentWorld().secondary
      :currentWorld().neon
  );

  player.kills++;

  player.coins+=enemy.userData.boss?10:1;

  updateHUD();

  setTimeout(()=>{

    if(enemy.parent){
      enemy.parent.remove(enemy);
    }

  },120);

  checkPhase();
}

/* =========================================================
   TRACER
========================================================= */

function tracer(){

  const start=new THREE.Vector3();

  camera.getWorldPosition(start);

  const dir=new THREE.Vector3(
    0,
    0,
    -1
  ).applyQuaternion(
    camera.quaternion
  );

  const end=
    start.clone().add(
      dir.multiplyScalar(70)
    );

  const geo=new THREE.BufferGeometry()
    .setFromPoints([
      start,
      end
    ]);

  const material=new THREE.LineBasicMaterial({
    color:currentWeapon().color,
    transparent:true,
    opacity:.85
  });

  const line=new THREE.Line(
    geo,
    material
  );

  effectRoot.add(line);

  setTimeout(()=>{

    effectRoot.remove(line);

    geo.dispose();
    material.dispose();

  },45);
}

/* =========================================================
   FLASH
========================================================= */

function flash(){

  const f=$("flash");

  f.style.opacity=".45";

  setTimeout(()=>{
    f.style.opacity="0";
  },45);
}

function muzzleFlash(){

  flash();
}

function hitFeedback(){

  const h=$("hitMarker");

  h.style.opacity="1";
  h.style.transform=
    "translate(-50%,-50%) scale(1)";

  setTimeout(()=>{

    h.style.opacity="0";
    h.style.transform=
      "translate(-50%,-50%) scale(.7)";

  },90);
}

/* =========================================================
   DANO
========================================================= */

function damagePlayer(){

  if(!gameRunning||paused)return;

  player.life--;

  const d=$("damage");

  d.style.opacity=".9";

  setTimeout(()=>{
    d.style.opacity="0";
  },180);

  updateHUD();

  if(player.life<=0){

    endGame();

  }
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(player.reloading)return;

  const weapon=currentWeapon();

  if(player.ammo>=weapon.ammo)return;

  player.reloading=true;

  weaponName.textContent=
    weapon.name+" • RECARREGANDO";

  setTimeout(()=>{

    player.ammo=weapon.ammo;
    player.reloading=false;

    weaponName.textContent=
      weapon.name;

    updateHUD();

  },850);
}

/* =========================================================
   FASE
========================================================= */

function checkPhase(){

  const target=
    phases[currentPhase-1].target;

  if(player.kills>=target){

    setTimeout(()=>{

      if(currentPhase<50){

        currentPhase++;

        unlocked=Math.max(
          unlocked,
          currentPhase
        );

        localStorage.setItem(
          "ultimoSegundoPhase",
          currentPhase
        );

        localStorage.setItem(
          "ultimoSegundoUnlocked",
          unlocked
        );

        startPhase();

      }else{

        victory();

      }

    },700);
  }
}

function startPhase(){

  gameRunning=true;
  paused=false;

  player.life=3;
  player.kills=0;
  player.ammo=currentWeapon().ammo;
  player.reloading=false;

  enemies.forEach(e=>{

    if(e.parent){
      e.parent.remove(e);
    }

  });

  enemies=[];

  clearGroup(effectRoot);

  buildWorld();

  updateHUD();

  menu.classList.add("hidden");
  phaseMenu.classList.add("hidden");
  gameOver.classList.add("hidden");

  hud.style.display="block";
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const p=phases[currentPhase-1];
  const w=currentWorld();
  const gun=currentWeapon();

  phaseEl.textContent=currentPhase;
  killsEl.textContent=player.kills;
  goalEl.textContent=p.target;
  coinsEl.textContent=player.coins;

  lifeEl.textContent=
    "❤️".repeat(Math.max(0,player.life));

  phaseTitle.textContent=
    `FASE ${currentPhase} • ${w.name}`;

  objective.textContent=
    `ELIMINE ${p.target} ALVOS`;

  weaponName.textContent=
    gun.name;

  ammoFill.style.width=
    `${(player.ammo/gun.ammo)*100}%`;
}

   GAME OVER
========================================================= */

function endGame(){

  gameRunning=false;

  hud.style.display="none";

  $("overText").textContent=

}

function victory(){

  gameRunning=false;

  hud.style.display="none";

  $("overText").textContent=

function buildPhaseMenu(){

  const grid=$("phaseGrid");

  grid.innerHTML="";

  for(let i=1;i<=50;i++){

    const b=document.createElement("button");

    b.className="phase";

    if(i>unlocked){
      b.classList.add("locked");
      b.textContent="🔒";
    }else{
      b.textContent=i;
    }

    if(i===currentPhase){
      b.classList.add("current");
    }

    b.onclick=()=>{

      if(i>unlocked)return;

      currentPhase=i;

      localStorage.setItem(
        "ultimoSegundoPhase",
        currentPhase
      );

      startPhase();
    };

    grid.appendChild(b);
  }
}

/* =========================================================
   ANIMAÇÃO
========================================================= */

function updateEnemies(dt){

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.userData.dead){

      enemies.splice(i,1);

      continue;
    }

    e.userData.mixer.update(dt);

    e.position.z+=
      e.userData.speed*
      60*
      dt;

    /* pequena movimentação de combate */

    e.position.x+=
      Math.sin(
        performance.now()*.001+
        i
      )*.0008;

    if(e.position.z>4){

      damagePlayer();

      if(e.parent){
        e.parent.remove(e);
      }

      enemies.splice(i,1);
    }
  }
}

/* =========================================================
   EFEITOS
========================================================= */

function updateEffects(dt){

  for(let i=effects.length-1;i>=0;i--){

    const p=effects[i];

    const d=p.userData;

    d.life-=dt;

    p.position.x+=d.vx*dt;
    p.position.y+=d.vy*dt;
    p.position.z+=d.vz*dt;

    d.vy-=9*dt;

    p.material.opacity=
      Math.max(0,d.life*1.7);

    if(d.life<=0){

      if(p.parent){
        p.parent.remove(p);
      }

      effects.splice(i,1);
    }
  }
}

/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    .033,
    clock.getDelta()
  );

  if(gameRunning&&!paused){

    spawnLogic(dt);

    updateEnemies(dt);

    updateEffects(dt);

    camera.rotation.y=
      THREE.MathUtils.lerp(
        camera.rotation.y,
        cameraYaw,
        .08
      );

    camera.rotation.x=
      THREE.MathUtils.lerp(
        camera.rotation.x,
        cameraPitch,
        .08
      );

    if(weaponRoot){

      weaponRoot.rotation.z=
        Math.sin(
          performance.now()*.004
        )*.008;

      weaponRoot.position.y=
        -.54+
        Math.sin(
          performance.now()*.005
        )*.008;
    }
  }

  if(composer){
    composer.render();
  }else{
    renderer.render(
      scene,
      camera
    );
  }
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    composer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function boot(){

  try{

    initRenderer();

    initScene();

    await loadSoldier();

    buildWeapon();

    loading.classList.add("hidden");

    loadingFinished=true;

    updateHUD();

    animate();

  }catch(error){

    console.error(error);

    loading.innerHTML=`
      <div style="
        font-size:28px;
        font-weight:900;
        letter-spacing:3px;
      ">
        ERRO AO CARREGAR
      </div>

      <div style="
        margin-top:14px;
        max-width:320px;
        text-align:center;
        font-size:12px;
        opacity:.65;
      ">
        Atualize a página e tente novamente.
      </div>
    `;
  }
}

boot();

</script>
</body>
</html>
