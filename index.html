<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
  user-select:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#02040b;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:18px;
  right:18px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.scoreBox{
  text-shadow:0 3px 15px #000;
}

.score{
  color:#fff;
  font-size:38px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.small{
  margin-top:7px;
  color:#ffd83d;
  font-size:15px;
  font-weight:800;
}

.best{
  margin-top:5px;
  color:#b7c0d0;
  font-size:12px;
}

.level{
  padding:10px 15px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  background:rgba(4,8,20,.5);
  color:white;
  font-size:12px;
  font-weight:900;
  backdrop-filter:blur(10px);
}

#combo{
  position:absolute;
  top:125px;
  left:0;
  right:0;
  z-index:12;
  text-align:center;
  color:#ffd43b;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 0 20px #ff9d00;
  opacity:0;
  transform:scale(.8);
  transition:.18s;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:calc(24px + env(safe-area-inset-bottom));
  left:0;
  right:0;
  z-index:10;
  text-align:center;
  color:rgba(255,255,255,.48);
  font-size:10px;
  letter-spacing:.5px;
  pointer-events:none;
}

.screen{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 38%,rgba(0,140,255,.14),transparent 28%),
    rgba(1,3,9,.82);
  backdrop-filter:blur(14px);
}

.hidden{
  display:none!important;
}

.logo{
  font-size:clamp(54px,15vw,90px);
  line-height:.78;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-4px;
  color:white;
  text-shadow:
    3px 4px 0 #ff7900,
    0 0 30px rgba(255,150,0,.55);
}

.subtitle{
  margin-top:24px;
  color:#aeb8c8;
  font-size:11px;
  letter-spacing:4px;
  font-weight:700;
}

.play{
  margin-top:40px;
  width:min(310px,80vw);
  padding:18px 20px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#ffd83d,#ff7a00);
  color:#101010;
  font-size:19px;
  font-weight:1000;
  box-shadow:
    0 12px 35px rgba(255,130,0,.3);
}

.play:active{
  transform:scale(.96);
}

.overTitle{
  color:#ff3348;
  font-size:58px;
  font-weight:1000;
  font-style:italic;
  text-shadow:0 0 30px rgba(255,20,50,.45);
}

.overLabel{
  margin-top:28px;
  color:#aeb8c8;
  font-size:15px;
}

.overScore{
  margin-top:4px;
  color:#fff;
  font-size:70px;
  font-weight:1000;
}

.overBest{
  margin-top:8px;
  color:#ffd83d;
  font-weight:900;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="scoreBox">

    <div
      class="score"
      id="score"
    >0.0</div>

    <div class="small">
      🪙 <span id="coins">0</span>
    </div>

    <div class="best">
      🏆 RECORDE:
      <span id="record">0.0</span>
    </div>

  </div>

  <div
    class="level"
    id="level"
  >
    NÍVEL 1
  </div>

</div>

<div id="combo">
  🔥 COMBO x1
</div>

<div id="hint">
  DESLIZE ← → PARA MUDAR • ↑ PULAR • ↓ DESLIZAR
</div>


<!-- MENU -->

<div
  class="screen"
  id="menu"
>

  <div class="logo">
    ÚLTIMO<br>SEGUNDO
  </div>

  <div class="subtitle">
    CORRA • DESVIE • SOBREVIVA
  </div>

  <button
    class="play"
    onclick="startGame()"
  >
    JOGAR
  </button>

</div>


<!-- GAME OVER -->

<div
  class="screen hidden"
  id="gameOver"
>

  <div class="overTitle">
    GAME OVER
  </div>

  <div class="overLabel">
    SUA PONTUAÇÃO
  </div>

  <div
    class="overScore"
    id="finalScore"
  >
    0.0
  </div>

  <div class="overBest">
    🏆 RECORDE:
    <span id="finalRecord">
      0.0
    </span>
  </div>

  <button
    class="play"
    onclick="startGame()"
  >
    TENTAR DE NOVO
  </button>

</div>

</div>

<script>

/* =====================================================
   ÚLTIMO SEGUNDO
   VERSÃO 0.5
   MOTOR 2D
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const recordEl =
  document.getElementById("record");

const levelEl =
  document.getElementById("level");

const comboEl =
  document.getElementById("combo");

const menu =
  document.getElementById("menu");

const gameOver =
  document.getElementById("gameOver");

const finalScore =
  document.getElementById("finalScore");

const finalRecord =
  document.getElementById("finalRecord");


/* =====================================================
   TELA
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   ESTADO
===================================================== */

let running = false;

let lastTime = 0;

let elapsed = 0;

let score = 0;

let coins = 0;

let combo = 0;

let lane = 1;

let targetLane = 1;

let playerX = 0;

let playerY = 0;

let jumpTime = 0;

let slideTime = 0;

let shake = 0;

let spawnTimer = 0;

let coinTimer = 0;

let cityOffset = 0;

let roadOffset = 0;

let particles = [];

let obstacles = [];

let coinObjects = [];

let touchStartX = 0;

let touchStartY = 0;

let gestureDone = false;


let record =
  Number(
    localStorage.getItem(
      "ultimoSegundoRecorde"
    ) || 0
  );

recordEl.textContent =
  record.toFixed(1);


/* =====================================================
   UTILIDADES
===================================================== */

function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );
}

function lerp(a,b,t){

  return a +
    (b-a)*t;
}

function rand(a,b){

  return Math.random()*
    (b-a)+a;
}


/* =====================================================
   PISTA
===================================================== */

function laneX(l){

  /*
    Perspectiva:
    as pistas ficam mais
    próximas no horizonte.
  */

  const roadBottom =
    H * .96;

  const spread =
    W * .31;

  return (
    W/2 +
    (l-1) * spread
  );
}


/* =====================================================
   PLAYER
===================================================== */

function playerBaseY(){

  return H * .78;
}

function playerPosition(){

  const desired =
    laneX(targetLane);

  playerX =
    lerp(
      playerX,
      desired,
      .24
    );

  if(
    Math.abs(
      playerX-desired
    ) < .5
  ){

    lane =
      targetLane;

  }

  playerY =
    playerBaseY();

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function particle(
  x,
  y,
  color,
  count=5
){

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:rand(-60,60),

      vy:rand(-100,20),

      life:rand(.25,.6),

      max:0.6,

      color:color,

      size:rand(2,5)

    });

  }

}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.life -= dt;

    p.x +=
      p.vx*dt;

    p.y +=
      p.vy*dt;

    p.vy +=
      180*dt;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );

    }

  }

}

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      clamp(
        p.life/p.max,
        0,
        1
      );

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}


/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

  const g =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  g.addColorStop(
    0,
    "#06132c"
  );

  g.addColorStop(
    .48,
    "#101938"
  );

  g.addColorStop(
    1,
    "#02050d"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* brilho urbano */

  const glow =
    ctx.createRadialGradient(
      W*.7,
      H*.25,
      10,
      W*.7,
      H*.25,
      W*.55
    );

  glow.addColorStop(
    0,
    "rgba(150,20,160,.18)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* lua */

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.19,
    45,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(180,225,255,.7)";

  ctx.shadowColor=
    "#74d8ff";

  ctx.shadowBlur=30;

  ctx.fill();

  ctx.shadowBlur=0;


  drawCity();

}


/* =====================================================
   CIDADE
===================================================== */

function drawCity(){

  const base =
    H*.58;

  const buildings = [

    [.00,.22],
    [.10,.37],
    [.21,.27],
    [.32,.48],
    [.44,.31],
    [.55,.43],
    [.67,.29],
    [.78,.40],
    [.89,.25]

  ];

  for(
    let i=0;
    i<buildings.length;
    i++
  ){

    const [x,h] =
      buildings[i];

    const bw =
      W*.11;

    const bh =
      H*h;

    const bx =
      W*x;

    const by =
      base-bh;

    ctx.fillStyle =
      i%2
      ? "#0a1228"
      : "#0b162e";

    ctx.fillRect(
      bx,
      by,
      bw,
      bh
    );

    ctx.fillStyle =
      "#126eff";

    ctx.fillRect(
      bx,
      by,
      bw,
      2
    );


    /* janelas */

    const rows =
      Math.floor(
        bh/27
      );

    const cols =
      Math.max(
        2,
        Math.floor(
          bw/18
        )
      );

    for(
      let r=0;
      r<rows;
      r++
    ){

      for(
        let c=0;
        c<cols;
        c++
      ){

        const on =
          (
            r*7+
            c*3+
            i
          )%5 !== 0;

        if(!on)continue;

        ctx.fillStyle =
          (r+c)%4===0
          ? "#ffd54a"
          : "#00b9ed";

        ctx.globalAlpha=.45;

        ctx.fillRect(
          bx+7+c*16,
          by+12+r*25,
          5,
          7
        );

      }

    }

    ctx.globalAlpha=1;

  }

}


/* =====================================================
   ESTRADA
===================================================== */

function drawRoad(){

  const horizon =
    H*.57;

  const bottom =
    H*1.12;


  /*
    área da estrada
  */

  ctx.beginPath();

  ctx.moveTo(
    W*.43,
    horizon
  );

  ctx.lineTo(
    W*.57,
    horizon
  );

  ctx.lineTo(
    W*1.1,
    bottom
  );

  ctx.lineTo(
    W*-.1,
    bottom
  );

  ctx.closePath();

  ctx.fillStyle =
    "#030713";

  ctx.fill();


  /*
    linhas da estrada
  */

  for(
    let i=0;
    i<15;
    i++
  ){

    const t =
      (
        i/15 +
        roadOffset
      )%1;

    const y =
      horizon +
      Math.pow(
        t,
        2
      )*(bottom-horizon);

    const width =
      lerp(
        20,
        W*.7,
        t
      );

    ctx.strokeStyle =
      `rgba(0,190,255,${.08+.12*t})`;

    ctx.lineWidth =
      1+2*t;

    ctx.beginPath();

    ctx.moveTo(
      W/2-width,
      y
    );

    ctx.lineTo(
      W/2+width,
      y
    );

    ctx.stroke();

  }


  /*
    divisórias
  */

  for(
    const side of [-1,1]
  ){

    ctx.strokeStyle =
      "rgba(0,190,255,.45)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      W/2+side*W*.07,
      horizon
    );

    ctx.lineTo(
      W/2+side*W*.48,
      bottom
    );

    ctx.stroke();

  }

}


/* =====================================================
   PLAYER DESENHO
===================================================== */

function drawPlayer(){

  const x =
    playerX;

  let y =
    playerY;

  let jumpHeight=0;

  if(
    jumpTime>0
  ){

    const p =
      1-
      jumpTime/.52;

    jumpHeight =
      Math.sin(
        p*Math.PI
      )*H*.16;

  }

  y -=
    jumpHeight;


  let scale =
    1;

  if(
    slideTime>0
  ){

    scale=.78;

  }


  /*
    sombra
  */

  ctx.globalAlpha=.35;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    playerBaseY()+18,
    35,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );


  /* pernas */

  ctx.fillStyle=
    "#111d38";

  const run =
    Math.sin(
      elapsed*18
    )*9;

  ctx.save();

  ctx.translate(
    -11,
    30
  );

  ctx.rotate(
    run*Math.PI/180
  );

  roundRect(
    ctx,
    -5,
    0,
    10,
    28,
    5
  );

  ctx.fill();

  ctx.restore();


  ctx.save();

  ctx.translate(
    11,
    30
  );

  ctx.rotate(
    -run*Math.PI/180
  );

  roundRect(
    ctx,
    -5,
    0,
    10,
    28,
    5
  );

  ctx.fill();

  ctx.restore();


  /* corpo */

  const body =
    ctx.createLinearGradient(
      -18,
      0,
      18,
      0
    );

  body.addColorStop(
    0,
    "#ff7b00"
  );

  body.addColorStop(
    .5,
    "#ffc928"
  );

  body.addColorStop(
    1,
    "#ff6200"
  );

  ctx.fillStyle=body;

  roundRect(
    ctx,
    -17,
    -2,
    34,
    42,
    10
  );

  ctx.fill();


  /* cabeça */

  const head =
    ctx.createLinearGradient(
      -20,
      -45,
      20,
      -5
    );

  head.addColorStop(
    0,
    "#ffffff"
  );

  head.addColorStop(
    1,
    "#ffc928"
  );

  ctx.fillStyle=head;

  ctx.shadowColor=
    "#ffc400";

  ctx.shadowBlur=18;

  roundRect(
    ctx,
    -21,
    -48,
    42,
    42,
    12
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* olhos */

  ctx.fillStyle=
    "#07101d";

  ctx.beginPath();

  ctx.arc(
    -8,
    -28,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    8,
    -28,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* boca */

  roundRect(
    ctx,
    -9,
    -15,
    18,
    4,
    2
  );

  ctx.fill();


  /* braços */

  ctx.strokeStyle=
    "#ffb51b";

  ctx.lineWidth=8;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -15,
    5
  );

  ctx.lineTo(
    -27,
    20+run
  );

  ctx.moveTo(
    15,
    5
  );

  ctx.lineTo(
    27,
    20-run
  );

  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function spawnObstacle(){

  const l =
    Math.floor(
      Math.random()*3
    );

  const type =
    Math.random();

  obstacles.push({

    lane:l,

    z:0,

    type:
      type>.75
      ? "barrier"
      : type>.45
      ? "car"
      : "block"

  });

}


/* =====================================================
   MOEDAS
===================================================== */

function spawnCoins(){

  const l =
    Math.floor(
      Math.random()*3
    );

  for(
    let i=0;
    i<5;
    i++
  ){

    coinObjects.push({

      lane:l,

      z:
        -i*.09

    });

  }

}


/* =====================================================
   DESENHAR OBSTÁCULO
===================================================== */

function drawObstacle(o){

  /*
    z 0 = horizonte
    z 1 = jogador
  */

  const z =
    clamp(
      o.z,
      0,
      1.3
    );

  const horizon =
    H*.57;

  const y =
    lerp(
      horizon,
      H*.78,
      Math.pow(z,1.6)
    );

  const x =
    W/2 +
    (o.lane-1)*
    lerp(
      W*.05,
      W*.31,
      z
    );

  const size =
    lerp(
      12,
      75,
      z
    );


  ctx.save();

  ctx.translate(
    x,
    y
  );


  if(
    o.type==="car"
  ){

    /* carro */

    ctx.shadowColor=
      "#ff2455";

    ctx.shadowBlur=
      20*z;

    ctx.fillStyle=
      "#d91d42";

    roundRect(
      ctx,
      -size*.65,
      -size*.35,
      size*1.3,
      size*.7,
      size*.12
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle=
      "#07101d";

    roundRect(
      ctx,
      -size*.32,
      -size*.25,
      size*.64,
      size*.22,
      5
    );

    ctx.fill();

    ctx.fillStyle=
      "#ffd54a";

    ctx.fillRect(
      -size*.55,
      size*.18,
      size*.16,
      size*.08
    );

    ctx.fillRect(
      size*.39,
      size*.18,
      size*.16,
      size*.08
    );

  }
  else if(
    o.type==="barrier"
  ){

    ctx.shadowColor=
      "#ff8c00";

    ctx.shadowBlur=
      15*z;

    ctx.fillStyle=
      "#ff7a00";

    roundRect(
      ctx,
      -size*.75,
      -size*.25,
      size*1.5,
      size*.5,
      6
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle=
      "#ffe44d";

    ctx.lineWidth=
      Math.max(
        2,
        size*.06
      );

    for(
      let i=-1;
      i<2;
      i++
    ){

      ctx.beginPath();

      ctx.moveTo(
        i*size*.4,
        -size*.2
      );

      ctx.lineTo(
        i*size*.2,
        size*.2
      );

      ctx.stroke();

    }

  }
  else{

    ctx.shadowColor=
      "#ff1744";

    ctx.shadowBlur=
      25*z;

    const g =
      ctx.createLinearGradient(
        -size/2,
        -size/2,
        size/2,
        size/2
      );

    g.addColorStop(
      0,
      "#ff254f"
    );

    g.addColorStop(
      1,
      "#ff6500"
    );

    ctx.fillStyle=g;

    roundRect(
      ctx,
      -size/2,
      -size/2,
      size,
      size,
      size*.16
    );

    ctx.fill();

    ctx.shadowBlur=0;

  }

  ctx.restore();

}


/* =====================================================
   MOEDA DESENHO
===================================================== */

function drawCoin(c){

  const z =
    clamp(
      c.z,
      0,
      1.2
    );

  const horizon =
    H*.57;

  const y =
    lerp(
      horizon,
      H*.74,
      Math.pow(z,1.6)
    );

  const x =
    W/2 +
    (c.lane-1)*
    lerp(
      W*.05,
      W*.31,
      z
    );

  const size =
    lerp(
      7,
      20,
      z
    );

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    Math.abs(
      Math.cos(
        elapsed*7
      )
    )*.65+.35,
    1
  );

  ctx.shadowColor=
    "#ffd000";

  ctx.shadowBlur=
    18*z;

  ctx.fillStyle=
    "#ffd329";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    size,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle=
    "#fff1a0";

  ctx.lineWidth=
    Math.max(
      1,
      size*.12
    );

  ctx.stroke();

  ctx.fillStyle=
    "#fff6b8";

  ctx.font=
    `${Math.max(7,size)}px Arial`;

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText(
    "$",
    0,
    1
  );

  ctx.restore();

}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
  c,
  x,
  y,
  w,
  h,
  r
){

  const radius =
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  c.beginPath();

  c.moveTo(
    x+radius,
    y
  );

  c.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    radius
  );

  c.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    radius
  );

  c.arcTo(
    x,
    y+h,
    x,
    y,
    radius
  );

  c.arcTo(
    x,
    y,
    x+w,
    y,
    radius
  );

  c.closePath();

}


/* =====================================================
   COLISÃO SIMPLES
===================================================== */

function checkCollision(o){

  if(
    o.lane !==
    targetLane
  ){

    return false;

  }

  if(
    o.z < .72 ||
    o.z > 1.05
  ){

    return false;

  }

  /*
    Pulo evita blocos/carros.
  */

  if(
    jumpTime > .05
  ){

    return false;

  }

  /*
    Deslizar evita barreira.
  */

  if(
    o.type==="barrier" &&
    slideTime>.05
  ){

    return false;

  }

  return true;

}


/* =====================================================
   ATUALIZAÇÃO
===================================================== */

function update(dt){

  elapsed += dt;

  score =
    elapsed;

  scoreEl.textContent =
    score.toFixed(1);


  const level =
    Math.floor(
      score/15
    )+1;

  levelEl.textContent =
    "NÍVEL " + level;


  /*
    velocidade progressiva
  */

  const speed =
    .32 +
    score*.006;


  roadOffset +=
    dt*(.8+speed);


  cityOffset +=
    dt*(.15+speed*.2);


  playerPosition();


  if(
    jumpTime>0
  ){

    jumpTime -= dt;

  }

  if(
    slideTime>0
  ){

    slideTime -= dt;

  }


  /*
    obstáculos
  */

  spawnTimer -= dt;

  const spawnDelay =
    Math.max(
      .38,
      .82-score*.006
    );

  if(
    spawnTimer<=0
  ){

    spawnObstacle();

    spawnTimer =
      spawnDelay;

  }


  /*
    moedas
  */

  coinTimer -= dt;

  if(
    coinTimer<=0
  ){

    spawnCoins();

    coinTimer =
      1.35;

  }


  /*
    movimento dos obstáculos
  */

  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    const o =
      obstacles[i];

    o.z +=
      dt*(.38+speed);


    if(
      checkCollision(o)
    ){

      endGame();

      return;

    }


    if(
      o.z>1.2
    ){

      obstacles.splice(
        i,
        1
      );

    }

  }


  /*
    moedas
  */

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c =
      coinObjects[i];

    c.z +=
      dt*(.38+speed);


    if(
      c.lane===
      targetLane &&
      c.z>.73 &&
      c.z<1.04
    ){

      collectCoin(c);

      coinObjects.splice(
        i,
        1
      );

      continue;

    }


    if(
      c.z>1.15
    ){

      coinObjects.splice(
        i,
        1
      );

    }

  }


  updateParticles(dt);

}


/* =====================================================
   COLETA
===================================================== */

function collectCoin(c){

  coins++;

  combo++;

  coinsEl.textContent =
    coins;

  comboEl.textContent =
    "🔥 COMBO x" +
    combo;

  comboEl.style.opacity =
    "1";

  comboEl.style.transform =
    "scale(1.12)";

  setTimeout(
    ()=>{
      comboEl.style.transform=
        "scale(1)";
    },
    100
  );

  clearTimeout(
    window.comboTimer
  );

  window.comboTimer =
    setTimeout(
      ()=>{
        comboEl.style.opacity=
          "0";
      },
      700
    );


  particle(
    playerX,
    playerY-25,
    "#ffd000",
    10
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(15);

  }

}


/* =====================================================
   DESENHO PRINCIPAL
===================================================== */

function draw(){

  ctx.save();


  if(
    shake>0
  ){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );

    shake *= .88;

  }


  drawBackground();

  drawRoad();


  /*
    desenhar objetos
    mais distantes primeiro
  */

  const objects = [

    ...obstacles.map(
      o=>({
        type:"obstacle",
        object:o
      })
    ),

    ...coinObjects.map(
      c=>({
        type:"coin",
        object:c
      })
    )

  ];

  objects.sort(
    (a,b)=>
      a.object.z-
      b.object.z
  );


  for(
    const item of objects
  ){

    if(
      item.type===
      "obstacle"
    ){

      drawObstacle(
        item.object
      );

    }
    else{

      drawCoin(
        item.object
      );

    }

  }


  drawPlayer();

  drawParticles();


  ctx.restore();

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(
    !lastTime
  ){

    lastTime =
      time;

  }

  const dt =
    Math.min(
      .033,
      (time-lastTime)/1000
    );

  lastTime =
    time;


  if(running){

    update(dt);

  }

  draw();

  requestAnimationFrame(
    loop
  );

}

requestAnimationFrame(
  loop
);
