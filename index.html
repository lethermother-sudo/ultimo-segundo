<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030308;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#18284b 0%,#080b18 38%,#020207 100%);
}

/* FUNDO */

.grid{
  position:absolute;
  width:160%;
  height:80%;
  left:-30%;
  bottom:-10%;
  opacity:.35;
  transform:perspective(500px) rotateX(58deg);
  background-image:
    linear-gradient(rgba(0,180,255,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,180,255,.18) 1px,transparent 1px);
  background-size:50px 50px;
}

/* HUD */

#hud{
  position:absolute;
  top:25px;
  left:20px;
  right:20px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.score{
  font-size:34px;
  font-weight:900;
}

.record{
  margin-top:5px;
  font-size:13px;
  color:#ffc400;
}

.level{
  padding:8px 13px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  background:rgba(0,0,0,.25);
  font-size:12px;
  font-weight:bold;
}

/* FAIXAS */

.lane{
  position:absolute;
  top:0;
  bottom:0;
  width:33.333%;
  border-left:1px solid rgba(0,190,255,.08);
}

.lane:nth-child(1){left:0}
.lane:nth-child(2){left:33.333%}
.lane:nth-child(3){left:66.666%}

/* PERSONAGEM */

#player{
  position:absolute;
  width:48px;
  height:48px;
  bottom:17%;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  border-radius:14px;
  background:linear-gradient(135deg,#fff,#ffc400);
  box-shadow:
    0 0 15px #ffc400,
    0 0 40px rgba(255,190,0,.65);
  transition:left .12s ease;
}

#player:before{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#090b14;
  left:9px;
  top:10px;
  box-shadow:18px 0 #090b14;
}

#player:after{
  content:"";
  position:absolute;
  width:22px;
  height:4px;
  border-radius:5px;
  background:#090b14;
  left:13px;
  bottom:10px;
}

/* OBSTÁCULOS */

.obstacle{
  position:absolute;
  width:54px;
  height:54px;
  z-index:8;
  transform:translateX(-50%);
  border-radius:12px;
  background:linear-gradient(135deg,#ff164f,#ff5b00);
  box-shadow:
    0 0 18px #ff164f,
    0 0 45px rgba(255,30,70,.45);
}

.obstacle.diamond{
  border-radius:5px;
  transform:translateX(-50%) rotate(45deg);
  background:linear-gradient(135deg,#a500ff,#ff167d);
}

.obstacle.blue{
  border-radius:50%;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  box-shadow:
    0 0 20px #00aaff,
    0 0 45px rgba(0,150,255,.5);
}

/* EFEITO */

#flash{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
  background:#ff1744;
  opacity:0;
}

#combo{
  position:absolute;
  top:110px;
  left:0;
  right:0;
  text-align:center;
  z-index:15;
  font-size:22px;
  font-weight:900;
  color:#ffc400;
  opacity:0;
}

/* TELAS */

.screen{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:rgba(2,2,8,.88);
  backdrop-filter:blur(12px);
}

#gameOver{
  display:none;
}

.logo{
  font-size:clamp(55px,15vw,90px);
  line-height:.82;
  font-weight:1000;
  font-style:italic;
  text-transform:uppercase;
  color:#fff;
  text-shadow:
    4px 4px 0 #ff9800,
    0 0 30px rgba(255,170,0,.5);
}

.subtitle{
  margin-top:22px;
  color:#aaa;
  letter-spacing:3px;
  font-size:12px;
}

button{
  width:min(310px,85vw);
  margin-top:38px;
  padding:19px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#ffd000,#ff8a00);
  color:#111;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 8px 35px rgba(255,170,0,.35);
}

button:active{
  transform:scale(.96);
}

.gameTitle{
  color:#ff3040;
  font-size:55px;
  font-weight:1000;
  font-style:italic;
  text-shadow:0 0 30px rgba(255,0,30,.45);
}

.finalLabel{
  margin-top:30px;
  color:#aaa;
  font-size:15px;
}

.finalScore{
  margin-top:5px;
  font-size:65px;
  font-weight:1000;
}

.newRecord{
  margin-top:10px;
  color:#ffc400;
  font-weight:900;
  opacity:0;
}

.hint{
  position:absolute;
  bottom:6%;
  left:0;
  right:0;
  z-index:15;
  text-align:center;
  color:rgba(255,255,255,.4);
  font-size:11px;
}
</style>
</head>

<body>

<div id="game">

  <div class="grid"></div>

  <div class="lane"></div>
  <div class="lane"></div>
  <div class="lane"></div>

  <div id="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="record">
        🏆 RECORDE <span id="record">0</span>
      </div>
    </div>

    <div class="level" id="level">
      NÍVEL 1
    </div>
  </div>

  <div id="combo">+ COMBO</div>

  <div id="player"></div>

  <div id="flash"></div>

  <div class="hint">
    TOQUE NA ESQUERDA OU DIREITA PARA DESVIAR
  </div>

  <!-- INÍCIO -->

  <div class="screen" id="startScreen">

    <div class="logo">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="subtitle">
      REFLEXO • ESTRATÉGIA • SOBREVIVÊNCIA
    </div>

    <button onclick="startGame()">
      JOGAR
    </button>

  </div>

  <!-- GAME OVER -->

  <div class="screen" id="gameOver">

    <div class="gameTitle">
      GAME OVER
    </div>

    <div class="finalLabel">
      SUA PONTUAÇÃO
    </div>

    <div class="finalScore" id="finalScore">
      0
    </div>

    <div class="newRecord" id="newRecord">
      👑 NOVO RECORDE!
    </div>

    <button onclick="startGame()">
      TENTAR DE NOVO
    </button>

  </div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const recordEl=document.getElementById("record");
const finalScoreEl=document.getElementById("finalScore");
const levelEl=document.getElementById("level");
const comboEl=document.getElementById("combo");
const flash=document.getElementById("flash");

let lane=1;
let score=0;
let record=Number(localStorage.getItem("ultimoSegundoRecorde")||0);

let running=false;
let startTime=0;
let lastSpawn=0;
let obstacles=[];
let combo=0;

recordEl.textContent=record.toFixed(1);

function setLane(value){

  lane=Math.max(0,Math.min(2,value));

  const positions=["16.666%","50%","83.333%"];

  player.style.left=positions[lane];
}

function createObstacle(){

  const el=document.createElement("div");

  const types=["","diamond","blue"];
  const type=types[Math.floor(Math.random()*types.length)];

  if(type){
    el.classList.add(type);
  }

  const obstacleLane=Math.floor(Math.random()*3);

  const positions=["16.666%","50%","83.333%"];

  el.style.left=positions[obstacleLane];
  el.style.top="-70px";

  game.appendChild(el);

  obstacles.push({
    element:el,
    lane:obstacleLane,
    y:-70
  });
}

function hitTest(obstacle){

  const a=player.getBoundingClientRect();
  const b=obstacle.element.getBoundingClientRect();

  return !(
    a.right<b.left+8 ||
    a.left>b.right-8 ||
    a.bottom<b.top+8 ||
    a.top>b.bottom-8
  );
}

function showCombo(){

  combo++;

  if(combo<2)return;

  comboEl.textContent="🔥 COMBO x"+combo;
  comboEl.style.opacity="1";

  clearTimeout(showCombo.timer);

  showCombo.timer=setTimeout(()=>{
    comboEl.style.opacity="0";
  },500);
}

function flashScreen(){

  flash.style.opacity=".35";

  setTimeout(()=>{
    flash.style.opacity="0";
  },80);
}

function gameLoop(time){

  if(!running)return;

  score=(time-startTime)/1000;

  scoreEl.textContent=score.toFixed(1);

  const level=Math.floor(score/10)+1;

  levelEl.textContent="NÍVEL "+level;

  const speed=3.5+(score*.075);

  const spawnDelay=Math.max(300,850-score*7);

  if(time-lastSpawn>spawnDelay){

    createObstacle();

    lastSpawn=time;
  }

  for(let i=obstacles.length-1;i>=0;i--){

    const o=obstacles[i];

    o.y+=speed;

    o.element.style.top=o.y+"px";

    if(o.lane===lane && hitTest(o)){

      endGame();
      return;
    }

    if(o.y>window.innerHeight+100){

      o.element.remove();

      obstacles.splice(i,1);

      showCombo();
    }
  }

  requestAnimationFrame(gameLoop);
}

function startGame(){

  obstacles.forEach(o=>o.element.remove());

  obstacles=[];

  score=0;
  combo=0;

  setLane(1);

  scoreEl.textContent="0.0";

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  document.getElementById("newRecord").style.opacity="0";

  running=true;

  startTime=performance.now();
  lastSpawn=performance.now();

  requestAnimationFrame(gameLoop);
}

function endGame(){

  if(!running)return;

  running=false;

  flashScreen();

  if(navigator.vibrate){

    navigator.vibrate([
      100,
      50,
      180
    ]);
  }

  finalScoreEl.textContent=score.toFixed(1);

  const recordElement=document.getElementById("newRecord");

  if(score>record){

    record=score;

    localStorage.setItem(
      "ultimoSegundoRecorde",
      record.toString()
    );

    recordEl.textContent=record.toFixed(1);

    recordElement.style.opacity="1";
  }

  document.getElementById("gameOver").style.display="flex";
}

/* CONTROLES */

game.addEventListener("touchstart",function(e){

  if(!running)return;

  const x=e.touches[0].clientX;

  if(x<window.innerWidth/2){

    setLane(lane-1);

  }else{

    setLane(lane+1);
  }

},{passive:true});

game.addEventListener("mousedown",function(e){

  if(!running)return;

  if(e.clientX<window.innerWidth/2){

    setLane(lane-1);

  }else{

    setLane(lane+1);
  }

});

</script>

</body>
</html>
