<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo — Neon Strike</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
background:#02030a;color:#fff;
font-family:Arial,Helvetica,sans-serif;
touch-action:none
}
body{position:fixed;inset:0}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#hud{
position:fixed;
top:0;left:0;right:0;
padding:calc(10px + env(safe-area-inset-top)) 9px 8px;
display:grid;
grid-template-columns:1fr 1.15fr 1fr 1fr;
gap:6px;
z-index:20;
pointer-events:none
}

.hbox{
min-width:0;
padding:8px 9px;
border-radius:13px;
background:rgba(3,8,18,.76);
border:1px solid rgba(0,234,255,.27);
box-shadow:0 0 22px rgba(0,220,255,.08);
backdrop-filter:blur(12px)
}

.label{
font-size:8px;
letter-spacing:1.5px;
color:#8195a3;
font-weight:800
}

.value{
margin-top:2px;
font-size:17px;
font-weight:900
}

#phaseName{
font-size:8px;
color:#00eaff;
letter-spacing:1px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

#phaseNum{
font-size:15px
}

#objective{
position:fixed;
top:82px;
left:50%;
transform:translateX(-50%);
z-index:20;
padding:7px 14px;
border-radius:20px;
background:rgba(2,7,16,.65);
border:1px solid rgba(0,234,255,.18);
font-size:10px;
font-weight:900;
letter-spacing:1.5px;
white-space:nowrap;
pointer-events:none
}

#crosshair{
position:fixed;
left:50%;
top:51%;
width:38px;
height:38px;
transform:translate(-50%,-50%);
z-index:18;
pointer-events:none
}

#crosshair:before,
#crosshair:after{
content:"";
position:absolute;
background:#dffcff;
box-shadow:0 0 9px #00eaff
}

#crosshair:before{
width:2px;height:38px;
left:18px;top:0
}

#crosshair:after{
width:38px;height:2px;
left:0;top:18px
}

.dot{
position:absolute;
width:4px;height:4px;
left:17px;top:17px;
border-radius:50%;
background:#fff;
box-shadow:0 0 10px #00eaff
}

#hit{
position:fixed;
left:50%;top:51%;
transform:translate(-50%,-50%);
font-size:24px;
font-weight:900;
opacity:0;
z-index:25;
pointer-events:none;
text-shadow:0 0 15px #00eaff
}

#hit.show{
animation:hit .22s ease-out
}

@keyframes hit{
0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
z-index:30;
pointer-events:none
}

#damage{
position:fixed;
inset:0;
border:0 solid rgba(255,0,40,.7);
z-index:29;
pointer-events:none
}

#bottom{
position:fixed;
left:0;right:0;bottom:0;
height:180px;
z-index:21;
pointer-events:none
}

#ammo{
position:absolute;
left:12px;
bottom:22px;
width:145px;
padding:9px;
border-radius:12px;
background:rgba(2,7,15,.8);
border:1px solid rgba(0,234,255,.2)
}

#ammoText{
font-size:11px;
font-weight:900
}

#ammoBar{
margin-top:6px;
height:5px;
border-radius:10px;
background:#17202c;
overflow:hidden
}

#ammoFill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00eaff,#fff);
box-shadow:0 0 10px #00eaff
}

#weaponName{
position:absolute;
left:50%;
bottom:22px;
transform:translateX(-50%);
font-size:9px;
letter-spacing:2px;
color:#8ea4b2;
white-space:nowrap
}

#controls{
position:absolute;
right:12px;
bottom:calc(10px + env(safe-area-inset-bottom));
display:flex;
gap:9px;
align-items:end;
pointer-events:auto
}

.btn{
border:0;
color:#fff;
font-weight:900;
touch-action:none
}

#reload{
width:58px;
height:58px;
border-radius:50%;
background:rgba(7,15,26,.9);
border:1px solid rgba(255,255,255,.22);
font-size:8px
}

#shoot{
width:84px;
height:84px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,#63ffff,#007d9b 55%,#022b3a);
border:2px solid #75ffff;
box-shadow:0 0 25px rgba(0,238,255,.45),inset 0 0 20px #00eaff;
font-size:11px;
letter-spacing:1px
}

.screen{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
padding:22px;
background:
radial-gradient(circle at 50% 30%,rgba(0,238,255,.13),transparent 38%),
linear-gradient(#02030af0,#02030af8)
}

.hidden{display:none!important}

.panel{
width:min(430px,100%);
padding:25px 20px;
border-radius:24px;
background:rgba(4,8,20,.88);
border:1px solid rgba(0,238,255,.28);
box-shadow:0 0 60px rgba(0,180,255,.14);
text-align:center;
backdrop-filter:blur(18px)
}

.title{
font-size:37px;
font-weight:1000;
letter-spacing:-2px;
line-height:.95;
text-shadow:0 0 25px #00eaff
}

.subtitle{
margin:7px 0 22px;
font-size:10px;
letter-spacing:3px;
color:#8298a7
}

.bigBtn{
width:100%;
padding:15px;
margin-top:9px;
border:0;
border-radius:14px;
background:#00eaff;
color:#001014;
font-size:13px;
font-weight:1000;
letter-spacing:1px
}

.bigBtn.secondary{
background:#101b2a;
color:#dffcff;
border:1px solid #214052
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin:12px 0
}

.stat{
background:#07101d;
border-radius:11px;
padding:10px
}

.stat b{
display:block;
font-size:17px
}

.stat span{
font-size:7px;
color:#78909f
}

#phaseGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
max-height:300px;
overflow:auto;
margin-top:12px
}

.phaseBtn{
padding:10px 2px;
border-radius:9px;
border:1px solid #1b3446;
background:#07101b;
color:#fff;
font-size:10px;
font-weight:900
}

.phaseBtn.locked{
opacity:.28
}

@media(max-width:500px){
#hud{gap:4px}
.hbox{padding:7px 7px}
.label{font-size:7px}
.value{font-size:15px}
#phaseNum{font-size:13px}
#objective{top:78px}
#ammo{bottom:15px}
#weaponName{bottom:15px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

<div class="hbox">
<div class="label">ALVOS</div>
<div class="value">
<span id="kills">0</span>/<span id="target">8</span>
</div>
</div>

<div class="hbox" style="text-align:center">
<div id="phaseName">CIDADE NEON</div>
<div id="phaseNum">FASE 1</div>
</div>

<div class="hbox">
<div class="label">VIDA</div>
<div class="value" id="life">❤️❤️❤️</div>
</div>

<div class="hbox">
<div class="label">MOEDAS</div>
<div class="value" id="coins">0</div>
</div>

</div>

<div id="objective">ELIMINE OS ALVOS</div>

<div id="crosshair">
<div class="dot"></div>
</div>

<div id="hit">✦</div>
<div id="flash"></div>
<div id="damage"></div>

<div id="bottom">

<div id="ammo">
<div id="ammoText">MUNIÇÃO 18 / 72</div>
<div id="ammoBar">
<div id="ammoFill"></div>
</div>
</div>

<div id="weaponName">NEON PISTOL</div>

<div id="controls">
<button class="btn" id="reload">RECARREGAR</button>
<button class="btn" id="shoot">ATIRAR</button>
</div>

</div>


<div id="menu" class="screen">

<div class="panel">

<div class="title">
ÚLTIMO<br>SEGUNDO
</div>

<div class="subtitle">
NEON STRIKE
</div>

<div class="stats">
<div class="stat"><b>50</b><span>FASES</span></div>
<div class="stat"><b>5</b><span>ARMAS</span></div>
<div class="stat"><b>5</b><span>BOSSES</span></div>
</div>

<button class="bigBtn" id="startBtn">
INICIAR MISSÃO
</button>

<button class="bigBtn secondary" id="phasesBtn">
SELECIONAR FASE
</button>

</div>
</div>


<div id="phaseMenu" class="screen hidden">

<div class="panel">

<div class="title" style="font-size:28px">
FASES
</div>

<div class="subtitle">
ESCOLHA SUA MISSÃO
</div>

<div id="phaseGrid"></div>

<button class="bigBtn secondary" id="backBtn">
VOLTAR
</button>

</div>
</div>


<div id="gameOver" class="screen hidden">

<div class="panel">

<div class="title" style="font-size:30px">
MISSÃO<br>ENCERRADA
</div>

<div class="subtitle" id="overReason">
VOCÊ FOI ELIMINADO
</div>

<div class="stats">

<div class="stat">
<b id="overKills">0</b>
<span>ALVOS</span>
</div>

<div class="stat">
<b id="overCoins">0</b>
<span>MOEDAS</span>
</div>

<div class="stat">
<b id="overPhase">1</b>
<span>FASE</span>
</div>

</div>

<button class="bigBtn" id="retryBtn">
TENTAR NOVAMENTE
</button>

<button class="bigBtn secondary" id="menuBtn">
MENU
</button>

</div>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js";

import {EffectComposer} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/EffectComposer.js";

import {RenderPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/RenderPass.js";

import {UnrealBloomPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/UnrealBloomPass.js";

import {OutputPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/OutputPass.js";


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const WORLDS=[
{
name:"CIDADE NEON",
sky:0x030816,
fog:0x030816,
neon:0x00eaff,
secondary:0xff00c8
},
{
name:"DISTRITO CHUVOSO",
sky:0x03050b,
fog:0x08111d,
neon:0x4b8dff,
secondary:0x00eaff
},
{
name:"ZONA INDUSTRIAL",
sky:0x090504,
fog:0x180b08,
neon:0xff6a00,
secondary:0xff1744
},
{
name:"CIDADE SUSPENSA",
sky:0x05020d,
fog:0x0c0520,
neon:0xb000ff,
secondary:0x00eaff
},
{
name:"MEGA TÚNEL",
sky:0x02060a,
fog:0x06151a,
neon:0x00ffb7,
secondary:0x00aaff
},
{
name:"BASE TECNOLÓGICA",
sky:0x030609,
fog:0x071018,
neon:0x00aaff,
secondary:0x7c5cff
},
{
name:"CIDADE NOTURNA",
sky:0x09020b,
fog:0x18051b,
neon:0xff1493,
secondary:0xffd000
},
{
name:"ZONA VERMELHA",
sky:0x100202,
fog:0x210606,
neon:0xff1744,
secondary:0xff7a00
},
{
name:"MEGA CITY",
sky:0x02050b,
fog:0x07121d,
neon:0x00eaff,
secondary:0x7aff00
},
{
name:"ZONA FINAL",
sky:0x09000d,
fog:0x180021,
neon:0xff00ff,
secondary:0x00ffff
}
];

const WEAPONS=[
{
name:"NEON PISTOL",
damage:1,
ammo:18,
reserve:72,
color:0x00eaff
},
{
name:"PULSE SMG",
damage:1,
ammo:28,
reserve:112,
color:0x00ff9d
},
{
name:"CYBER RIFLE",
damage:2,
ammo:24,
reserve:96,
color:0x7c5cff
},
{
name:"PLASMA GUN",
damage:3,
ammo:15,
reserve:60,
color:0xff00d4
},
{
name:"OMEGA CANNON",
damage:5,
ammo:10,
reserve:40,
color:0xff5b00
}
];

const PHASES=50;


/* =====================================================
   ESTADO
===================================================== */

let phase=Number(
localStorage.getItem("ultimoSegundoPhase")||1
);

let unlocked=Number(
localStorage.getItem("ultimoSegundoUnlocked")||1
);

let running=false;
let kills=0;
let target=8;
let lives=3;
let coins=0;

let ammo=18;
let reserve=72;

let reloading=false;

let spawnTimer=0;
let enemyShotTimer=0;
let elapsed=0;

let weapon=WEAPONS[0];

const enemies=[];
const crates=[];
const particles=[];
const tracers=[];
const enemyShots=[];


/* =====================================================
   THREE
===================================================== */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
66,
innerWidth/innerHeight,
.1,
240
);

camera.position.set(0,2.05,5);

camera.rotation.order="YXZ";


const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.35)
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.12;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document.getElementById("game")
.appendChild(renderer.domElement);


/* =====================================================
   BLOOM
===================================================== */

const composer=new EffectComposer(
renderer
);

composer.addPass(
new RenderPass(
scene,
camera
)
);

const bloom=new UnrealBloomPass(
new THREE.Vector2(
innerWidth,
innerHeight
),
.72,
.55,
.72
);

composer.addPass(bloom);

composer.addPass(
new OutputPass()
);


/* =====================================================
   GRUPOS
===================================================== */

const worldGroup=new THREE.Group();
const enemyGroup=new THREE.Group();
const effectGroup=new THREE.Group();
const crateGroup=new THREE.Group();

scene.add(worldGroup);
scene.add(enemyGroup);
scene.add(effectGroup);
scene.add(crateGroup);


/* =====================================================
   HELPERS
===================================================== */

function standard(
color,
emissive=0,
roughness=.35,
metal=.7
){
return new THREE.MeshStandardMaterial({
color,
emissive,
emissiveIntensity:emissive?2.5:0,
roughness,
metalness:metal
});
}

function neon(color){
return new THREE.MeshBasicMaterial({
color,
transparent:true,
opacity:.95
});
}


/* =====================================================
   MUNDO
===================================================== */

function worldIndex(){
return Math.floor((phase-1)/5);
}

function currentWorld(){
return WORLDS[
Math.min(
WORLDS.length-1,
worldIndex()
)
];
}

function clearWorld(){

while(worldGroup.children.length){

const obj=worldGroup.children.pop();

obj.traverse(o=>{
if(o.geometry)o.geometry.dispose();
if(o.material){
if(Array.isArray(o.material))
o.material.forEach(m=>m.dispose());
else o.material.dispose();
}
});

}

}


function makeBuilding(
x,z,w,h,d
){

const building=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
standard(0x09101b)
);

body.position.y=h/2;

building.add(body);


for(let y=2;y<h-1;y+=2.2){

for(let xx=-w/2+.45;
xx<w/2-.25;
xx+=.8){

if(Math.random()<.4)continue;

const win=new THREE.Mesh(
new THREE.BoxGeometry(
.32,.45,.035
),
neon(
Math.random()>.5
?currentWorld().neon
:currentWorld().secondary
)
);

win.position.set(
xx,
y,
-d/2-.03
);

building.add(win);

}

}

building.position.set(
x,0,z
);

worldGroup.add(building);

}


function buildWorld(){

clearWorld();

const w=currentWorld();

scene.background=
new THREE.Color(w.sky);

scene.fog=
new THREE.FogExp2(
w.fog,
.011
);


/* estrada */

const road=new THREE.Mesh(
new THREE.PlaneGeometry(
20,
230
),
standard(0x050912,0,.7,.25)
);

road.rotation.x=-Math.PI/2;
road.position.set(0,-.02,-105);

worldGroup.add(road);


/* bordas */

for(const x of [-9.7,9.7]){

const edge=new THREE.Mesh(
new THREE.BoxGeometry(
.08,.04,230
),
neon(w.neon)
);

edge.position.set(
x,.04,-105
);

worldGroup.add(edge);

}


/* faixas */

for(let z=5;z>-220;z-=8){

for(const x of [-3,3]){

const stripe=new THREE.Mesh(
new THREE.BoxGeometry(
.06,.025,3.5
),
neon(w.neon)
);

stripe.position.set(
x,.035,z
);

worldGroup.add(stripe);

}

}


/* prédios */

for(let i=0;i<32;i++){

const side=i%2===0?-1:1;

const x=side*(11+(i%5)*2.4);

const z=-15-i*5.8;

makeBuilding(
x,
z,
2.5+(i%4)*.7,
5+(i%8)*2.1,
3.5+(i%3)
);

}


/* postes */

for(let z=0;z>-180;z-=14){

for(const x of [-8.8,8.8]){

const pole=new THREE.Mesh(
new THREE.CylinderGeometry(
.045,.065,4.5,8
),
standard(0x101722)
);

pole.position.set(
x,2.25,z
);

worldGroup.add(pole);

const lamp=new THREE.Mesh(
new THREE.SphereGeometry(
.11,12,8
),
neon(w.neon)
);

lamp.position.set(
x,
4.4,
z
);

worldGroup.add(lamp);

}

}


/* luz */

worldGroup.add(
new THREE.HemisphereLight(
0x9fe8ff,
0x03040a,
.75
)
);

const dir=new THREE.DirectionalLight(
0xb9eaff,
1.8
);

dir.position.set(
-10,20,8
);

dir.castShadow=true;

worldGroup.add(dir);


const point=new THREE.PointLight(
w.neon,
22,
45
);

point.position.set(
0,5,-20
);

worldGroup.add(point);

}


/* =====================================================
   ARMA
===================================================== */

let weaponGroup=null;

function buildWeapon(){

if(weaponGroup)
camera.remove(weaponGroup);

weaponGroup=new THREE.Group();

const dark=standard(
0x0b1119,
0,
.22,
.9
);

const metal=standard(
0x26384d,
0,
.18,
.9
);

const energy=neon(
weapon.color
);


/* corpo */

const body=new THREE.Mesh(
new THREE.BoxGeometry(
.45,.24,1.45
),
dark
);

body.position.set(
.46,-.48,-.9
);

weaponGroup.add(body);


/* trilho */

const rail=new THREE.Mesh(
new THREE.BoxGeometry(
.13,.08,.7
),
energy
);

rail.position.set(
.46,-.35,-1.08
);

weaponGroup.add(rail);


/* cano */

const barrel=new THREE.Mesh(
new THREE.CylinderGeometry(
.065,.08,.82,14
),
metal
);

barrel.rotation.x=Math.PI/2;

barrel.position.set(
.46,-.44,-1.65
);

weaponGroup.add(barrel);


/* núcleo */

const core=new THREE.Mesh(
new THREE.SphereGeometry(
.1,14,10
),
energy
);

core.position.set(
.46,-.4,-1.38
);

weaponGroup.add(core);


/* carregador */

const mag=new THREE.Mesh(
new THREE.BoxGeometry(
.18,.42,.28
),
dark
);

mag.position.set(
.46,-.68,-.63
);

weaponGroup.add(mag);


/* cabo */

const grip=new THREE.Mesh(
new THREE.CapsuleGeometry(
.1,.5,5,8
),
dark
);

grip.rotation.x=-.2;

grip.position.set(
.46,-.7,-.2
);

weaponGroup.add(grip);

camera.add(weaponGroup);

}


/* =====================================================
   INIMIGO
===================================================== */

function createEnemy(){

const boss=phase%10===0;

const enemy=new THREE.Group();

const scale=boss?1.65:1.12;

enemy.scale.setScalar(scale);

enemy.userData={
hp:boss?8:2+Math.floor(phase/15),
maxHp:boss?8:2+Math.floor(phase/15),
boss,
time:Math.random()*10,
speed:.55+phase*.009
};


/* pernas */

for(const side of [-1,1]){

const leg=new THREE.Mesh(
new THREE.CapsuleGeometry(
.14,.7,5,9
),
standard(0x111a25)
);

leg.position.set(
side*.27,
.55,
0
);

leg.userData.limb=true;
leg.userData.side=side;

enemy.add(leg);

}


/* corpo */

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(
.48,.75,6,12
),
standard(
boss?0x25102e:0x101b27
)
);

body.position.y=1.4;

body.castShadow=true;

enemy.add(body);


/* peito */

const chest=new THREE.Mesh(
new THREE.BoxGeometry(
.62,.4,.16
),
standard(
boss?0x3c143f:0x172b3b
)
);

chest.position.set(
0,1.43,-.43
);

enemy.add(chest);


/* núcleo */

const core=new THREE.Mesh(
new THREE.SphereGeometry(
.13,16,12
),
neon(
boss?0xff00d4:currentWorld().neon
)
);

core.position.set(
0,1.43,-.54
);

enemy.add(core);


/* cabeça */

const head=new THREE.Mesh(
new THREE.SphereGeometry(
.4,20,14
),
standard(0x0a0f16)
);

head.position.y=2.18;

enemy.add(head);


/* visor */

const visor=new THREE.Mesh(
new THREE.BoxGeometry(
.52,.11,.08
),
neon(
boss?0xff00d4:currentWorld().neon
)
);

visor.position.set(
0,2.2,-.36
);

enemy.add(visor);


/* ombros */

for(const side of [-1,1]){

const shoulder=new THREE.Mesh(
new THREE.SphereGeometry(
.2,14,10
),
neon(
boss?0xff00d4:currentWorld().secondary
)
);

shoulder.position.set(
side*.67,
1.78,
0
);

enemy.add(shoulder);

}


/* braços */

for(const side of [-1,1]){

const arm=new THREE.Mesh(
new THREE.CapsuleGeometry(
.13,.65,5,8
),
standard(0x111c28)
);

arm.position.set(
side*.7,
1.25,
0
);

arm.userData.limb=true;
arm.userData.side=side;

enemy.add(arm);

}


enemy.position.set(
(Math.floor(Math.random()*3)-1)*3,
0,
-48-Math.random()*25
);

enemyGroup.add(enemy);

enemies.push(enemy);

}


/* =====================================================
   OBSTÁCULO
===================================================== */

function createCrate(){

const crate=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(
1.5,1.45,1.5
),
standard(0x121923)
);

crate.add(body);


for(const y of [-.48,.48]){

const line=new THREE.Mesh(
new THREE.BoxGeometry(
1.58,.07,.07
),
neon(0xffa000)
);

line.position.y=y;

crate.add(line);

}


crate.position.set(
(Math.floor(Math.random()*3)-1)*3,
.73,
-55-Math.random()*20
);

crate.userData={
hp:2
};

crateGroup.add(crate);

crates.push(crate);

}


/* =====================================================
   EXPLOSÃO
===================================================== */

function explode(
pos,
color
){

for(let i=0;i<22;i++){

const p=new THREE.Mesh(
new THREE.SphereGeometry(
.035+Math.random()*.06,
6,6
),
neon(color)
);

p.position.copy(pos);

p.userData={
life:.45+Math.random()*.4,
velocity:new THREE.Vector3(
(Math.random()-.5)*3,
Math.random()*3,
(Math.random()-.5)*3
)
};

effectGroup.add(p);

particles.push(p);

}

}


/* =====================================================
   TIRO
===================================================== */

const raycaster=new THREE.Raycaster();

function shoot(){

if(!running||reloading)return;

if(ammo<=0){
reload();
return;
}

ammo--;

updateAmmo();

if(weaponGroup){

weaponGroup.position.z=.08;

setTimeout(()=>{
weaponGroup.position.z=0;
},55);

}

const flash=document.getElementById("flash");

flash.style.opacity=".16";

setTimeout(()=>{
flash.style.opacity="0";
},35);


raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const objects=[];

enemies.forEach(e=>objects.push(e));

crates.forEach(c=>objects.push(c));

const hits=
raycaster.intersectObjects(
objects,
true
);

let targetEnemy=null;
let targetCrate=null;
let point=null;

if(hits.length){

let o=hits[0].object;

point=hits[0].point.clone();

while(
o &&
o!==enemyGroup &&
o!==crateGroup
){

if(enemies.includes(o)){
targetEnemy=o;
break;
}

if(crates.includes(o)){
targetCrate=o;
break;
}

o=o.parent;

}

}


/* mira assistida */

if(!targetEnemy&&!targetCrate){

let best=null;
let bestDist=.30;

for(const e of enemies){

const p=e.position.clone();

p.y+=1.5;

p.project(camera);

const d=Math.sqrt(
p.x*p.x+
p.y*p.y
);

if(
d<bestDist &&
p.z>-1 &&
p.z<1
){

best=e;
bestDist=d;

}

}

if(best){

targetEnemy=best;

point=best.position.clone();

point.y+=1.4;

}

}


/* impacto */

if(targetEnemy){

hitEnemy(targetEnemy,point);

showHit();

}else if(targetCrate){

hitCrate(targetCrate,point);

showHit();

}

}


/* =====================================================
   DANO INIMIGO
===================================================== */

function hitEnemy(
enemy,
point
){

enemy.userData.hp-=weapon.damage;

explode(
point,
enemy.userData.boss
?0xff00d4
:currentWorld().neon
);

if(enemy.userData.hp<=0){

const index=enemies.indexOf(enemy);

if(index>=0)
enemies.splice(index,1);

enemyGroup.remove(enemy);

kills++;

coins+=enemy.userData.boss?10:1;

updateHUD();

if(kills>=target)
completePhase();

}

}


/* =====================================================
   DANO OBSTÁCULO
===================================================== */

function hitCrate(
crate,
point
){

crate.userData.hp--;

explode(
point,
0xffa000
);

if(crate.userData.hp<=0){

const index=crates.indexOf(crate);

if(index>=0)
crates.splice(index,1);

crateGroup.remove(crate);

coins++;

updateHUD();

}

}


/* =====================================================
   HIT
===================================================== */

function showHit(){

const h=document.getElementById("hit");

h.classList.remove("show");

void h.offsetWidth;

h.classList.add("show");

}


/* =====================================================
   RELOAD
===================================================== */

function reload(){

if(!running||reloading)return;

if(ammo>=weapon.ammo)return;

if(reserve<=0)return;

reloading=true;

document.getElementById("ammoText")
.textContent="RECARREGANDO...";

setTimeout(()=>{

const needed=weapon.ammo-ammo;

const amount=Math.min(
needed,
reserve
);

ammo+=amount;
reserve-=amount;

reloading=false;

updateAmmo();

},850);

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

document.getElementById("kills")
.textContent=kills;

document.getElementById("target")
.textContent=target;

document.getElementById("phaseNum")
.textContent=`FASE ${phase}`;

document.getElementById("phaseName")
.textContent=currentWorld().name;

document.getElementById("coins")
.textContent=coins;

document.getElementById("life")
.textContent=
"❤️".repeat(Math.max(0,lives));

document.getElementById("weaponName")
.textContent=weapon.name;

}

function updateAmmo(){

document.getElementById("ammoText")
.textContent=
`MUNIÇÃO ${ammo} / ${reserve}`;

document.getElementById("ammoFill")
.style.width=
`${Math.max(0,ammo/weapon.ammo*100)}%`;

}


/* =====================================================
   FASE
===================================================== */

function setupPhase(){

target=
8+
Math.floor((phase-1)*.65);

weapon=
WEAPONS[
Math.min(
WEAPONS.length-1,
Math.floor((phase-1)/10)
)
];

ammo=weapon.ammo;
reserve=weapon.reserve;

kills=0;
lives=3;

while(enemyGroup.children.length)
enemyGroup.remove(
enemyGroup.children[0]
);

while(crateGroup.children.length)
crateGroup.remove(
crateGroup.children[0]
);

enemies.length=0;
crates.length=0;

buildWorld();
buildWeapon();

updateHUD();
updateAmmo();

createEnemy();
createEnemy();

if(phase>=3)
createCrate();

}


/* =====================================================
   INICIAR
===================================================== */

function startPhase(){

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("phaseMenu")
.classList.add("hidden");

document.getElementById("gameOver")
.classList.add("hidden");

running=true;

setupPhase();

}


/* =====================================================
   COMPLETAR
===================================================== */

function completePhase(){

if(!running)return;

running=false;

if(phase<PHASES){

if(phase>=unlocked){

unlocked=phase+1;

localStorage.setItem(
"ultimoSegundoUnlocked",
unlocked
);

}

phase++;

localStorage.setItem(
"ultimoSegundoPhase",
phase
);

setTimeout(()=>{
startPhase();
},900);

}else{

document.getElementById("overReason")
.textContent=
"VOCÊ CONCLUIU AS 50 FASES";

document.getElementById("overKills")
.textContent=kills;

document.getElementById("overCoins")
.textContent=coins;

document.getElementById("overPhase")
.textContent=50;

document.getElementById("gameOver")
.classList.remove("hidden");

}

}


/* =====================================================
   DANO AO JOGADOR
===================================================== */

function damagePlayer(){

if(!running)return;

lives--;

const damage=document.getElementById("damage");

damage.style.border=
"10px solid rgba(255,0,40,.65)";

setTimeout(()=>{
damage.style.border="0 solid rgba(255,0,40,.65)";
},120);

updateHUD();

if(lives<=0){

running=false;

document.getElementById("overReason")
.textContent=
"VOCÊ FOI ELIMINADO";

document.getElementById("overKills")
.textContent=kills;

document.getElementById("overCoins")
.textContent=coins;

document.getElementById("overPhase")
.textContent=phase;

document.getElementById("gameOver")
.classList.remove("hidden");

}

}


/* =====================================================
   ATUALIZAR INIMIGOS
===================================================== */

function updateEnemies(dt){

for(let i=enemies.length-1;i>=0;i--){

const e=enemies[i];

e.userData.time+=dt;

e.position.z+=
e.userData.speed*
dt;

const t=e.userData.time;

e.rotation.y=
Math.sin(t*1.4)*.08;

e.position.y=
Math.sin(t*2.2)*.025;

e.children.forEach(part=>{

if(part.userData.limb){

part.rotation.x=
Math.sin(
t*5+
part.userData.side*Math.PI
)*.35;

}

});

if(e.position.z>5){

enemyGroup.remove(e);

enemies.splice(i,1);

damagePlayer();

}

}

}


/* =====================================================
   SPAWN
===================================================== */

function updateSpawn(dt){

spawnTimer-=dt;

const interval=
Math.max(
.65,
1.35-phase*.012
);

if(spawnTimer<=0){

spawnTimer=interval;

if(enemies.length<7)
createEnemy();

}

}


/* =====================================================
   EFEITOS
===================================================== */

function updateEffects(dt){

for(let i=particles.length-1;i>=0;i--){

const p=particles[i];

p.userData.life-=dt;

p.position.addScaledVector(
p.userData.velocity,
dt
);

p.scale.multiplyScalar(
1-dt*.8
);

if(p.userData.life<=0){

effectGroup.remove(p);

particles.splice(i,1);

}

}

}


/* =====================================================
   MOVER ESTRADA / CAIXAS
===================================================== */

function updateCrates(dt){

for(let i=crates.length-1;i>=0;i--){

const c=crates[i];

c.position.z+=
(.45+phase*.01)*dt;

c.rotation.y+=dt*.25;

if(c.position.z>5){

crateGroup.remove(c);

crates.splice(i,1);

}

}

}


/* =====================================================
   INPUT TOUCH
===================================================== */

let touching=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
"pointerdown",
e=>{

touching=true;

lastX=e.clientX;
lastY=e.clientY;

});

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(!touching||!running)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

camera.rotation.y-=dx*.0023;

camera.rotation.x-=dy*.0018;

camera.rotation.x=
THREE.MathUtils.clamp(
camera.rotation.x,
-.45,
.35
);

});

window.addEventListener(
"pointerup",
()=>{
touching=false;
});


/* =====================================================
   BOTÕES
===================================================== */

document.getElementById("shoot")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
shoot();
});

document.getElementById("reload")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
reload();
});

document.getElementById("startBtn")
.onclick=()=>{
startPhase();
};

document.getElementById("retryBtn")
.onclick=()=>{
startPhase();
};

document.getElementById("menuBtn")
.onclick=()=>{

running=false;

document.getElementById("gameOver")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

};


/* =====================================================
   FASES
===================================================== */

document.getElementById("phasesBtn")
.onclick=()=>{

const grid=
document.getElementById("phaseGrid");

grid.innerHTML="";

for(let i=1;i<=PHASES;i++){

const button=
document.createElement("button");

button.className="phaseBtn";

if(i>unlocked){

button.classList.add("locked");

button.textContent=
`🔒 ${i}`;

}else{

button.textContent=i;

button.onclick=()=>{

phase=i;

startPhase();

};

}

grid.appendChild(button);

}

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("phaseMenu")
.classList.remove("hidden");

};

document.getElementById("backBtn")
.onclick=()=>{

document.getElementById("phaseMenu")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

};


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
"keydown",
e=>{

if(e.code==="Space")
shoot();

if(e.key.toLowerCase()==="r")
reload();

});


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

composer.setSize(
innerWidth,
innerHeight
);

});


/* =====================================================
   LOOP
===================================================== */

let last=performance.now();

function animate(now){

requestAnimationFrame(animate);

const dt=Math.min(
.05,
(now-last)/1000
);

last=now;

elapsed+=dt;

if(running){

updateSpawn(dt);
updateEnemies(dt);
updateCrates(dt);
updateEffects(dt);

}

composer.render(dt);

}

buildWorld();
buildWeapon();
updateHUD();
updateAmmo();

requestAnimationFrame(animate);

</script>
