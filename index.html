<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:grid;
  grid-template-columns:1fr 1.1fr 1.25fr 1fr;
  gap:7px;
  z-index:30;
  pointer-events:none;
}

.box{
  min-height:67px;
  padding:10px 12px;
  border:1px solid rgba(83,225,255,.38);
  border-radius:17px;
  background:rgba(1,8,14,.80);
  box-shadow:
    0 0 18px rgba(0,220,255,.08),
    inset 0 0 20px rgba(0,220,255,.035);
  backdrop-filter:blur(5px);
}

.label{
  color:#8b99a4;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:4px;
}

.value{
  color:#fff;
  font-size:25px;
  font-weight:900;
}

#life{
  font-size:22px;
  letter-spacing:1px;
}

/* ================= PHASE ================= */

#phaseTitle{
  position:absolute;
  top:137px;
  left:50%;
  transform:translateX(-50%);

  color:#70efff;
  border:2px solid #57eaff;
  border-radius:35px;

  padding:11px 24px;

  font-size:14px;
  font-weight:900;
  letter-spacing:3px;

  white-space:nowrap;

  background:rgba(0,10,16,.58);

  box-shadow:
    0 0 25px rgba(40,225,255,.24),
    inset 0 0 20px rgba(40,225,255,.05);

  z-index:30;
  pointer-events:none;
}

#objective{
  position:absolute;
  top:184px;
  left:50%;
  transform:translateX(-50%);

  color:#fff;
  font-size:13px;
  font-weight:900;
  letter-spacing:3px;

  white-space:nowrap;

  text-shadow:0 0 16px #fff;

  z-index:30;
  pointer-events:none;
}

/* ================= MIRA ================= */

#crosshair{
  position:absolute;

  left:50%;
  top:52%;

  width:82px;
  height:82px;

  transform:translate(-50%,-50%);

  z-index:28;
  pointer-events:none;
}

#crosshair .ring{
  position:absolute;
  inset:11px;

  border:2px solid #7df3ff;
  border-radius:50%;

  box-shadow:
    0 0 12px #47eaff,
    inset 0 0 8px #47eaff;
}

#crosshair .h{
  position:absolute;
  width:82px;
  height:2px;
  top:40px;
  background:#8af5ff;
  box-shadow:0 0 10px #4deaff;
}

#crosshair .v{
  position:absolute;
  width:2px;
  height:82px;
  left:40px;
  background:#8af5ff;
  box-shadow:0 0 10px #4deaff;
}

#crosshair .dot{
  position:absolute;
  width:7px;
  height:7px;

  left:37px;
  top:37px;

  background:white;
  border-radius:50%;

  box-shadow:0 0 10px white;
}

#hitmarker{
  position:absolute;

  left:50%;
  top:52%;

  transform:translate(-50%,-50%) scale(.5);

  opacity:0;

  color:#fff;

  font-size:48px;
  font-weight:900;

  z-index:40;

  text-shadow:
    0 0 12px #fff,
    0 0 25px #6eefff;

  pointer-events:none;
}

#hitmarker.show{
  animation:hit .22s ease-out;
}

@keyframes hit{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.7);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.2);
  }
}

/* ================= DANO ================= */

#damage{
  position:absolute;
  inset:0;

  background:rgba(255,0,0,0);

  z-index:27;

  pointer-events:none;

  transition:background .08s;
}

/* ================= BOTTOM ================= */

#bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:16px;

  height:180px;

  z-index:50;

  pointer-events:none;
}

#ammoBar{
  position:absolute;

  right:22px;
  bottom:144px;

  width:48%;
  height:8px;

  border-radius:20px;

  background:rgba(0,0,0,.7);

  border:1px solid rgba(100,240,255,.25);

  overflow:hidden;
}

#ammoFill{
  width:100%;
  height:100%;

  background:#63eaff;

  box-shadow:0 0 14px #63eaff;
}

#reload{
  position:absolute;

  right:180px;
  bottom:22px;

  width:100px;
  height:100px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.2);

  background:rgba(0,0,0,.68);

  color:#fff;

  font-size:11px;
  font-weight:900;
  letter-spacing:1px;

  pointer-events:auto;
}

#shoot{
  position:absolute;

  right:18px;
  bottom:4px;

  width:145px;
  height:145px;

  border-radius:50%;

  border:3px solid #69ecff;

  background:
    radial-gradient(
      circle,
      rgba(50,220,255,.22),
      rgba(0,12,20,.94) 68%
    );

  color:#fff;

  font-size:16px;
  font-weight:900;

  letter-spacing:3px;

  pointer-events:auto;

  box-shadow:
    0 0 30px rgba(50,225,255,.25),
    inset 0 0 25px rgba(50,225,255,.08);
}

#shoot:active{
  transform:scale(.93);
}

#gunIcon{
  display:block;
  font-size:30px;
  margin-bottom:6px;
}

/* ================= TOAST ================= */

#toast{
  position:absolute;

  left:50%;
  top:35%;

  transform:translate(-50%,-50%);

  color:#fff;

  font-size:24px;
  font-weight:900;
  letter-spacing:3px;

  text-align:center;

  z-index:60;

  opacity:0;

  pointer-events:none;

  text-shadow:
    0 0 15px #6eefff;
}

#toast.show{
  animation:toast .8s ease-out;
}

@keyframes toast{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
  }
  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  75%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-70%) scale(1.1);
  }
}

/* ================= TELAS ================= */

#menu,
#phases,
#gameover,
#victory{
  position:absolute;
  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(0,150,190,.14),
      rgba(0,0,0,.97) 70%
    );
}

#phases,
#gameover,
#victory{
  display:none;
}

.panel{
  width:min(90%,520px);

  padding:30px 24px;

  border:1px solid rgba(80,230,255,.35);

  border-radius:26px;

  background:rgba(0,8,14,.93);

  box-shadow:
    0 0 60px rgba(0,210,255,.12);

  text-align:center;
}

.title{
  color:#6cefff;

  font-size:42px;
  font-weight:1000;

  letter-spacing:6px;

  line-height:1;

  text-shadow:
    0 0 25px #35ddff;
}

.subtitle{
  color:#fff;

  margin-top:12px;
  margin-bottom:25px;

  font-size:13px;
  font-weight:800;

  letter-spacing:3px;
}

.bigButton{
  width:100%;

  padding:17px;

  margin-top:9px;

  border:2px solid #5ceaff;

  border-radius:16px;

  background:rgba(30,180,220,.10);

  color:#fff;

  font-size:17px;
  font-weight:900;

  letter-spacing:4px;
}

.bigButton:active{
  transform:scale(.97);
}

.phaseGrid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;

  max-height:55vh;

  overflow:auto;

  margin-top:15px;
}

.phaseBtn{
  min-height:56px;

  border-radius:12px;

  border:1px solid rgba(80,230,255,.25);

  background:rgba(255,255,255,.04);

  color:#fff;

  font-weight:900;
}

.phaseBtn.locked{
  opacity:.3;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  #hud{
    top:8px;
    left:8px;
    right:8px;
    gap:6px;
  }

  .box{
    min-height:65px;
    padding:9px 10px;
    border-radius:15px;
  }

  .label{
    font-size:8px;
    letter-spacing:2px;
  }

  .value{
    font-size:22px;
  }

  #life{
    font-size:19px;
  }

  #phaseTitle{
    top:130px;
    font-size:12px;
    padding:10px 18px;
    letter-spacing:2px;
  }

  #objective{
    top:178px;
    font-size:11px;
    letter-spacing:2px;
  }

  #reload{
    right:176px;
    bottom:22px;
    width:94px;
    height:94px;
  }

  #shoot{
    right:14px;
    bottom:4px;
    width:140px;
    height:140px;
  }

  #ammoBar{
    right:15px;
    width:57%;
    bottom:138px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- HUD -->

<div id="hud">

  <div class="box">
    <div class="label">FASE</div>
    <div class="value" id="phase">1</div>
  </div>

  <div class="box">
    <div class="label">ALVOS</div>
    <div class="value" id="targets">0/8</div>
  </div>

  <div class="box">
    <div class="label">VIDA</div>
    <div class="value" id="life">❤️❤️❤️</div>
  </div>

  <div class="box">
    <div class="label">MOEDAS</div>
    <div class="value" id="coins">0</div>
  </div>

</div>

<div id="phaseTitle">
  FASE 1 • CIDADE NEON
</div>

<div id="objective">
  ELIMINE 8 ALVOS
</div>

<!-- MIRA -->

<div id="crosshair">

  <div class="ring"></div>
  <div class="h"></div>
  <div class="v"></div>
  <div class="dot"></div>

</div>

<div id="hitmarker">✦</div>

<div id="damage"></div>

<div id="toast"></div>

<!-- CONTROLES -->

<div id="bottom">

  <div id="ammoBar">
    <div id="ammoFill"></div>
  </div>

  <button id="reload">
    ↻
    <br>
    RECARREGAR
  </button>

  <button id="shoot">
    <span id="gunIcon">🔫</span>
    ATIRAR
  </button>

</div>

<!-- MENU -->

<div id="menu">

  <div class="panel">

    <div class="title">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="subtitle">
      NEON COMBAT
    </div>

    <button class="bigButton" id="start">
      JOGAR
    </button>

    <button class="bigButton" id="choosePhase">
      ESCOLHER FASE
    </button>

  </div>

</div>

<!-- FASES -->

<div id="phases">

  <div class="panel">

    <div class="title"
         style="font-size:30px">
      FASES
    </div>

    <div class="subtitle">
      50 MISSÕES
    </div>

    <div
      class="phaseGrid"
      id="phaseGrid">
    </div>

    <button
      class="bigButton"
      id="closePhases">
      VOLTAR
    </button>

  </div>

</div>

<!-- GAME OVER -->

<div id="gameover">

  <div class="panel">

    <div class="title"
         style="font-size:34px">
      MISSÃO<br>FALHOU
    </div>

    <div
      id="message"
      style="
      color:#aaa;
      margin:18px 0;
      line-height:1.7;">
    </div>

    <button
      class="bigButton"
      id="retry">
      TENTAR NOVAMENTE
    </button>

    <button
      class="bigButton"
      id="backMenu">
      MENU
    </button>

  </div>

</div>

<!-- VITÓRIA -->

<div id="victory">

  <div class="panel">

    <div class="title"
         style="font-size:34px">
      FASE<br>CONCLUÍDA
    </div>

    <div
      id="victoryText"
      style="
      color:#aaa;
      margin:18px 0;
      line-height:1.7;">
    </div>

    <button
      class="bigButton"
      id="nextPhase">
      PRÓXIMA FASE
    </button>

    <button
      class="bigButton"
      id="victoryMenu">
      MENU
    </button>

  </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
document.getElementById(id);

const game = $("game");

const phaseEl =
$("phase");

const targetsEl =
$("targets");

const lifeEl =
$("life");

const coinsEl =
$("coins");

const phaseTitle =
$("phaseTitle");

const objective =
$("objective");

const ammoFill =
$("ammoFill");

const hitmarker =
$("hitmarker");

const damage =
$("damage");

const toast =
$("toast");

const menu =
$("menu");

const phasesScreen =
$("phases");

const gameover =
$("gameover");

const victory =
$("victory");


/* =========================================================
   FASES
========================================================= */

const WORLDS = [
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON",
  "CIDADE NEON"
];

let currentPhase =
Number(
  localStorage.getItem(
    "ultimoSegundoPhase"
  ) || 1
);

let unlocked =
Number(
  localStorage.getItem(
    "ultimoSegundoUnlocked"
  ) || 1
);


/* =========================================================
   ESTADO
========================================================= */

let phaseTarget = 8;

let kills = 0;
let coins = 0;
let lives = 3;

let ammo = 12;
const maxAmmo = 12;

let running = false;
let reloading = false;

let enemies = [];
let crates = [];

let particles = [];
let tracers = [];
let enemyShots = [];

let spawnTimer = 0;
let enemyShotTimer = 0;

let cameraYaw = 0;
let cameraPitch = 0;

let touchStartX = 0;
let touchStartY = 0;

let lastTime =
performance.now();


/* =========================================================
   THREE
========================================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x010308);

scene.fog =
new THREE.FogExp2(
  0x02050a,
  .006
);


const camera =
new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  300
);

camera.position.set(
  0,
  1.55,
  4
);

camera.rotation.order =
"YXZ";


const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:
    "high-performance"
});

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    1.6
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.35;

game.appendChild(
  renderer.domElement
);


/* =========================================================
   LUZ CINEMATOGRÁFICA
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0x8bdcff,
    0x04050b,
    1.8
  )
);

const mainLight =
new THREE.DirectionalLight(
  0x9edfff,
  2.5
);

mainLight.position.set(
  5,
  14,
  5
);

scene.add(mainLight);


const cyanLight =
new THREE.PointLight(
  0x00eaff,
  35,
  70
);

cyanLight.position.set(
  -8,
  4,
  -30
);

scene.add(cyanLight);


const magentaLight =
new THREE.PointLight(
  0xff168d,
  28,
  65
);

magentaLight.position.set(
  9,
  5,
  -45
);

scene.add(magentaLight);


/* =========================================================
   MATERIAIS
========================================================= */

function material(
  color,
  emissive=0x000000,
  intensity=0
){

  return new THREE.MeshStandardMaterial({

    color,

    emissive,

    emissiveIntensity:
      intensity,

    roughness:.32,

    metalness:.72
  });
}


function neon(
  color
){

  return new THREE.MeshStandardMaterial({

    color,

    emissive:color,

    emissiveIntensity:3,

    roughness:.18,

    metalness:.55
  });
}


/* =========================================================
   CENÁRIO FIXO
========================================================= */

const world =
new THREE.Group();

scene.add(world);


/* ================= ESTRADA ================= */

const road =
new THREE.Mesh(

  new THREE.PlaneGeometry(
    34,
    330
  ),

  material(
    0x080b10
  )

);

road.rotation.x =
-Math.PI/2;

road.position.z =
-135;

world.add(road);


/* ================= BORDA NEON ================= */

for(const x of [-9,9]){

  const edge =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      .13,
      .07,
      330
    ),

    neon(
      0x00eaff
    )

  );

  edge.position.set(
    x,
    .05,
    -135
  );

  world.add(edge);
}


/* ================= FAIXAS ================= */

for(
  let z=5;
  z>-300;
  z-=11
){

  for(
    const x of [-3,3]
  ){

    const stripe =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        .11,
        .035,
        4.8
      ),

      neon(
        0xb9f5ff
      )

    );

    stripe.position.set(
      x,
      .04,
      z
    );

    world.add(stripe);
  }
}


/* =========================================================
   CIDADE FIXA
========================================================= */

function createBuilding(
  x,
  z,
  width,
  height,
  depth
){

  const building =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),

    material(
      0x060a11
    )

  );

  building.position.set(
    x,
    height/2,
    z
  );

  world.add(building);


  /* linhas verticais */

  const line =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      .055,
      height*.85,
      .05
    ),

    neon(
      0x00eaff
    )

  );

  line.position.set(
    x-width/2+.12,
    height/2,
    z-depth/2-.03
  );

  world.add(line);


  /* janelas */

  for(
    let y=1;
    y<height-1;
    y+=1.45
  ){

    for(
      let xx=-width/2+.45;
      xx<width/2-.2;
      xx+=.8
    ){

      const window =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .38,
          .07,
          .035
        ),

        neon(
          Math.random()>.5
          ? 0x00eaff
          : 0x126cff
        )

      );

      window.position.set(
        x+xx,
        y,
        z-depth/2-.04
      );

      world.add(window);
    }
  }
}


/* lado esquerdo */

createBuilding(
  -14,
  -22,
  6,
  10,
  8
);

createBuilding(
  -17,
  -42,
  8,
  15,
  9
);

createBuilding(
  -13,
  -67,
  5,
  19,
  8
);

createBuilding(
  -18,
  -96,
  9,
  13,
  10
);

createBuilding(
  -14,
  -126,
  7,
  21,
  10
);

createBuilding(
  -19,
  -160,
  10,
  16,
  11
);

createBuilding(
  -14,
  -198,
  7,
  22,
  10
);


/* lado direito */

createBuilding(
  14,
  -25,
  7,
  14,
  9
);

createBuilding(
  18,
  -48,
  9,
  18,
  10
);

createBuilding(
  14,
  -76,
  6,
  11,
  8
);

createBuilding(
  18,
  -102,
  10,
  21,
  11
);

createBuilding(
  14,
  -136,
  7,
  16,
  9
);

createBuilding(
  19,
  -168,
  10,
  23,
  12
);

createBuilding(
  14,
  -205,
  7,
  15,
  9
);


/* =========================================================
   HORIZONTE NEON
========================================================= */

const horizon =
new THREE.Mesh(

  new THREE.SphereGeometry(
    34,
    32,
    16
  ),

  new THREE.MeshBasicMaterial({

    color:0x06384c,

    transparent:true,

    opacity:.30,

    side:
      THREE.BackSide
  })

);

horizon.position.set(
  0,
  12,
  -110
);

scene.add(horizon);


/* =========================================================
   LUA / SOL NEON
========================================================= */

const sun =
new THREE.Mesh(

  new THREE.SphereGeometry(
    7,
    32,
    32
  ),

  new THREE.MeshBasicMaterial({
    color:0x0b6174,
    transparent:true,
    opacity:.32
  })

);

sun.position.set(
  0,
  12,
  -145
);

world.add(sun);


/* =========================================================
   ARMA MODERNA
========================================================= */

const weapon =
new THREE.Group();

camera.add(weapon);

scene.add(camera);


/* corpo */

const gunBody =
new THREE.Mesh(

  new THREE.BoxGeometry(
    .31,
    .20,
    .72
  ),

  material(
    0x11161d

/* =========================================================
   RAYCASTER
========================================================= */

const raycaster =
new THREE.Raycaster();


function shootTarget(){

  /*
    SEMPRE mira no centro.
  */

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const objects=[];


  enemies.forEach(
    enemy=>{

      if(
        !enemy.userData.dead
      ){

        objects.push(
          enemy
        );
      }

    }
  );


  crates.forEach(
    crate=>{
      objects.push(
        crate
      );
    }
  );


  const hits =
  raycaster.intersectObjects(
    objects,
    true
  );


  if(hits.length){

    let object =
      hits[0].object;


    while(
      object &&
      !object.userData.type
    ){

      object =
        object.parent;
    }


    if(object){

      return {

        object,

        point:
          hits[0].point

      };
    }
  }


  /*
    MIRA ASSISTIDA
  */

  let best=null;

  let bestDistance=
    Infinity;


  enemies.forEach(
    enemy=>{

      if(
        enemy.userData.dead
      ) return;


      const target =
      enemy.position.clone();

      target.y+=1.35;


      const projected =
      target.project(
        camera
      );


      const distance =
      Math.sqrt(
        projected.x*
        projected.x+
        projected.y*
        projected.y
      );


      if(
        projected.z>-1 &&
        projected.z<1 &&
        distance<.34 &&
        distance<bestDistance
      ){

        best=
          enemy;

        bestDistance=
          distance;
      }

    }
  );


  if(best){

    const point =
      best.position.clone();

    point.y+=1.35;


    return {

      object:best,

      point

    };
  }


  return null;
}


/* =========================================================
   ATIRAR
========================================================= */

function shoot(){

  if(!running) return;

  if(reloading) return;


  if(ammo<=0){

    showToast(
      "SEM MUNIÇÃO"
    );

    return;
  }


  ammo--;

  updateAmmo();

  muzzleFlash();

  beep(
    700,
    .055
  );


  const start =
    new THREE.Vector3();


  /*
    pega exatamente a posição
    do cano
  */

  barrel.getWorldPosition(
    start
  );


  const target =
    shootTarget();


  let end;


  if(target){

    end =
      target.point.clone();


    tracer(
      start,
      end
    );


    if(
      target.object.userData.type
      ===
      "enemy"
    ){

      hitEnemy(
        target.object
      );

    }else{

      hitCrate(
        target.object
      );
    }


  }else{

    const direction =
      new THREE.Vector3(
        0,
        0,
        -1
      )
      .applyQuaternion(
        camera.quaternion
      );


    end =
      camera.position.clone()
      .add(
        direction.multiplyScalar(
          90
        )
      );


    tracer(
      start,
      end
    );
  }
}

/* =========================================================
   SOM
========================================================= */

let audioCtx=null;


function beep(
  frequency,
  duration
){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioCtx.state===
      "suspended"
    ){

      audioCtx.resume();
    }


    const oscillator =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      .08,
      audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+
      duration
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      audioCtx.destination
    );


    oscillator.start();


    oscillator.stop(
      audioCtx.currentTime+
      duration
    );

  }catch(e){}
}

/* =========================================================
   SPAWN
========================================================= */

function spawnLogic(
  dt
){

  spawnTimer+=dt;


  const interval =
    Math.max(
      .75,
      1.55-
      (currentPhase-1)*.018
    );


  if(
    spawnTimer>=interval &&
    enemies.length<5
  ){

    spawnTimer=0;


    const bossPhase =
      currentPhase%10===0;


    const hasBoss =
      enemies.some(
        e=>e.userData.boss
      );


    if(
      bossPhase &&
      kills>=phaseTarget-1 &&
      !hasBoss
    ){

      createEnemy(true);

    }else{

      createEnemy(false);
    }
  }


  if(
    currentPhase>=3 &&
    Math.random()<dt*.25 &&
    crates.length<3
  ){

    createCrate();
  }
}


/* =========================================================
   MOVIMENTO
========================================================= */

function updateWorld(
  dt
){

  const speed =
    .72+
    (currentPhase-1)*.018;


  const move =
    speed*
    dt*
    13;


  /*
    inimigos
  */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const enemy =
      enemies[i];


    enemy.position.z+=
      move;


    /*
      pequena animação
      para parecer vivo
    */

    enemy.position.y =
      Math.sin(
        performance.now()*.004+
        enemy.userData.phaseOffset
      )*.025;


    if(
      enemy.position.z>5
    ){

      scene.remove(
        enemy
      );

      enemies.splice(
        i,
        1
      );

      damagePlayer();
    }
  }


  /*
    obstáculos
  */

  for(
    let i=crates.length-1;
    i>=0;
    i--
  ){

    const crate =
      crates[i];


    crate.position.z+=
      move;


    crate.rotation.y+=
      dt*.25;


    if(
      crate.position.z>5
    ){

      scene.remove(
        crate
      );

      crates.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function updateParticles(
  dt
){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];


    p.position.addScaledVector(
      p.userData.velocity,
      dt*60
    );


    p.userData.life-=
      dt;


    p.scale.multiplyScalar(
      .95
    );


    if(
      p.userData.life<=0
    ){

      scene.remove(
        p
      );

      particles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   TRACERS
========================================================= */

function updateTracers(
  dt
){

  for(
    let i=tracers.length-1;
    i>=0;
    i--
  ){

    const t =
      tracers[i];


    t.life-=dt;


    t.line.material.opacity =
      Math.max(
        0,
        t.life/.12
      );


    if(
      t.life<=0
    ){

      scene.remove(
        t.line
      );

      tracers.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   TIROS INIMIGOS
========================================================= */

function updateEnemyShots(
  dt
){

  for(
    let i=enemyShots.length-1;
    i>=0;
    i--
  ){

    const shot =
      enemyShots[i];


    shot.life-=dt;


    shot.line.material.opacity =
      Math.max(
        0,
        shot.life/.32
      );


    if(
      shot.life<=0
    ){

      scene.remove(
        shot.line
      );

      enemyShots.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   TOUCH
========================================================= */

renderer.domElement.addEventListener(
  "touchstart",
  event=>{

    if(
      event.touches.length!==1
    ) return;


    touchStartX =
      event.touches[0].clientX;

    touchStartY =
      event.touches[0].clientY;

  },
  {
    passive:false
  }
);


renderer.domElement.addEventListener(
  "touchmove",
  event=>{

    if(!running) return;

    if(
      event.touches.length!==1
    ) return;


    const x =
      event.touches[0].clientX;

    const y =
      event.touches[0].clientY;


    const dx =
      x-touchStartX;

    const dy =
      y-touchStartY;


    touchStartX=x;
    touchStartY=y;


    cameraYaw -=
      dx*.003;


    cameraPitch -=
      dy*.002;


    cameraPitch =
      THREE.MathUtils.clamp(
        cameraPitch,
        -.35,
        .35
      );


    camera.rotation.y =
      cameraYaw;

    camera.rotation.x =
      cameraPitch;


    event.preventDefault();

  },
  {
    passive:false
  }
);

/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.code==="Space"
    ){

      shoot();
    }


    if(
      event.key.toLowerCase()==="r"
    ){

      reload();
    }


    if(
      event.key==="ArrowLeft"
    ){

      cameraYaw+=.05;

      camera.rotation.y=
        cameraYaw;
    }


    if(
      event.key==="ArrowRight"
    ){

      cameraYaw-=.05;

      camera.rotation.y=
        cameraYaw;
    }
  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   LOOP
========================================================= */

function animate(
  now
){

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      (now-lastTime)/1000,
      .05
    );


  lastTime=now;


  if(running){

    spawnLogic(dt);

    updateWorld(dt);


    enemyShotTimer+=dt;


    const interval =
      Math.max(
        1.7,
        3.5-
        (currentPhase-1)*.035
      );


    if(
      enemyShotTimer>=interval
    ){

      enemyShotTimer=0;


      if(
        enemies.length
      ){

        enemyShoot();
      }
    }
  }


  updateParticles(dt);

  updateTracers(dt);

  updateEnemyShots(dt);


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   INÍCIO
========================================================= */

updateHUD();

updateAmmo();

animate(
  performance.now()
);

</script>
