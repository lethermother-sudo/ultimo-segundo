<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo V81</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03040b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{display:none!important}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,rgba(0,220,255,.18),transparent 38%),
    linear-gradient(#040512,#09051b);
}

.logo{
  font-size:10px;
  letter-spacing:6px;
  opacity:.55;
}

.title{
  margin-top:15px;
  text-align:center;
  font-size:45px;
  line-height:.9;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 0 15px #00eaff,0 0 35px rgba(0,220,255,.4);
}

.subtitle{
  margin-top:18px;
  font-size:9px;
  letter-spacing:4px;
  opacity:.55;
}

.version{
  margin-top:18px;
  color:#00eaff;
  font-size:11px;
  letter-spacing:5px;
}

button{
  border:0;
  color:#fff;
  font-weight:900;
  letter-spacing:2px;
  border-radius:14px;
  background:linear-gradient(135deg,#00d9ff,#6737ff);
  box-shadow:0 0 25px rgba(0,220,255,.25);
}

button:active{
  transform:scale(.96);
}

.mainBtn{
  width:245px;
  padding:18px;
  margin-top:35px;
  font-size:16px;
}

.smallBtn{
  width:195px;
  padding:14px;
  margin-top:12px;
  font-size:11px;
}

#hud{
  position:fixed;
  z-index:10;
  top:0;
  left:0;
  right:0;
  padding:calc(10px + env(safe-area-inset-top)) 10px 0;
  pointer-events:none;
}

.hud{
  display:flex;
  justify-content:space-between;
  gap:7px;
}

.hudBox{
  min-width:75px;
  padding:7px 9px;
  border-radius:11px;
  background:rgba(0,0,15,.65);
  border:1px solid rgba(0,235,255,.28);
  backdrop-filter:blur(8px);
}

.hudLabel{
  font-size:7px;
  letter-spacing:2px;
  opacity:.5;
}

.hudValue{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

.centerHud{
  min-width:135px;
  text-align:center;
}

#phaseName{
  font-size:9px;
  letter-spacing:2px;
}

#worldName{
  margin-top:4px;
  font-size:7px;
  letter-spacing:2px;
  opacity:.55;
}

#target{
  margin-top:4px;
  font-size:8px;
  opacity:.5;
}

#phaseMenu{
  justify-content:flex-start;
  padding:40px 14px 30px;
  overflow:auto;
}

.phaseTitle{
  font-size:25px;
  font-weight:900;
}

.phaseSubtitle{
  margin:8px 0 20px;
  font-size:9px;
  letter-spacing:3px;
  opacity:.5;
}

.phaseGrid{
  width:min(440px,95vw);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.phaseBtn{
  height:52px;
  padding:0;
  margin:0;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:none;
}

.phaseBtn.open{
  background:linear-gradient(135deg,#00bde8,#5730d8);
}

.phaseBtn.lock{
  opacity:.2;
}

.result{
  text-align:center;
}

.resultTitle{
  font-size:37px;
  font-weight:900;
  text-shadow:0 0 20px #00eaff;
}

.resultText{
  margin-top:15px;
  font-size:12px;
  line-height:1.9;
  opacity:.75;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud">

    <div class="hudBox">
      <div class="hudLabel">PONTOS</div>
      <div id="score" class="hudValue">0</div>
    </div>

    <div class="hudBox centerHud">
      <div id="phaseName">FASE 1</div>
      <div id="worldName">CIDADE NEON</div>
      <div id="target">META 1200</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">MOEDAS</div>
      <div id="coins" class="hudValue">0</div>
    </div>

  </div>
</div>

<!-- MENU -->

<div id="menu" class="screen">

  <div class="logo">RUNNER EXPERIENCE</div>

  <div class="title">
    ÚLTIMO<br>
    SEGUNDO
  </div>

  <div class="subtitle">
    CORRA • DESVIE • SOBREVIVA
  </div>

  <div class="version">
    V81 • 50 FASES
  </div>

  <button id="play" class="mainBtn">
    JOGAR
  </button>

  <button id="phases" class="smallBtn">
    FASES
  </button>

</div>

<!-- FASES -->

<div id="phaseMenu" class="screen hidden">

  <div class="phaseTitle">SELECIONE A FASE</div>

  <div class="phaseSubtitle">
    50 FASES • 10 AMBIENTES
  </div>

  <div id="phaseGrid" class="phaseGrid"></div>

  <div class="phaseSubtitle">
    DESBLOQUEADAS:
    <span id="unlockedText">1</span>/50
  </div>

  <button id="backMenu" class="smallBtn">
    VOLTAR
  </button>

</div>

<!-- GAME OVER -->

<div id="gameOver" class="screen hidden">

  <div class="result">

    <div class="resultTitle">FIM DE JOGO</div>

    <div id="loseText" class="resultText"></div>

    <button id="retry" class="mainBtn">
      VOLTAR À FASE 1
    </button>

    <button id="loseMenu" class="smallBtn">
      MENU
    </button>

  </div>

</div>

<!-- VITÓRIA -->

<div id="victory" class="screen hidden">

  <div class="result">

    <div class="resultTitle">
      FASE CONCLUÍDA
    </div>

    <div id="winText" class="resultText"></div>

    <button id="next" class="mainBtn">
      PRÓXIMA FASE
    </button>

    <button id="winMenu" class="smallBtn">
      MENU
    </button>

  </div>

</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================
   AMBIENTES
========================= */

const worlds = [

  ["CIDADE NEON","#05051b","#160c3d","#10152c","#00eaff","#ff2d75"],
  ["CENTRO FUTURISTA","#061522","#063b54","#10212b","#29efff","#ff3d91"],
  ["VIA NOTURNA","#13051d","#3a0b43","#211229","#ff42dd","#ff315d"],
  ["ZONA INDUSTRIAL","#151006","#43230a","#211c16","#ffb52e","#ff5428"],
  ["CYBER CITY","#02191a","#06483e","#092421","#00ffb0","#ff3970"],
  ["DISTRITO VERMELHO","#190306","#57090f","#281015","#ff4439","#ffb12e"],
  ["MEGA TÚNEL","#070713","#252253","#17172d","#9e72ff","#ff36dd"],
  ["CIDADE AÉREA","#06162a","#08617c","#0d2938","#52eaff","#ff9134"],
  ["ZONA ZERO","#010104","#141419","#0a0a0d","#d0d0df","#ffffff"],
  ["ÚLTIMO SEGUNDO","#03000d","#32075c","#140c25","#d83cff","#ff205e"]

];


/* =========================
   ESTADO
========================= */

let unlocked = 1;
let phase = 1;
let running = false;

let score = 0;
let coins = 0;
let target = 1200;
let speed = .4;

let lane = 1;
let laneVisual = 1;

let jumping = false;
let jumpTime = 0;

let sliding = false;
let slideTimer = 0;

let spawnTimer = 0;
let lastTime = 0;

let objects = [];
let particles = [];


/* =========================
   FASES
========================= */

function worldIndex(p){
  return Math.floor((p-1)/5);
}

function world(){
  return worlds[worldIndex(phase)];
}

function phaseTarget(p){
  return Math.floor(
    1200 +
    (p-1)*470 +
    Math.pow(p-1,1.2)*18
  );
}

function phaseSpeed(p){
  return .38 +
    (p-1)*.011 +
    Math.min(.25,p*.002);
}

function spawnGap(){
  if(phase <= 5) return 2.35;
  if(phase <= 10) return 2.1;
  if(phase <= 20) return 1.85;
  if(phase <= 30) return 1.6;
  if(phase <= 40) return 1.4;
  return 1.25;
}


/* =========================
   UI
========================= */

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}

function menu(){
  running = false;

  hide("hud");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("menu");
}

function openPhases(){
  hide("menu");
  hide("gameOver");
  hide("victory");

  show("phaseMenu");

  renderPhases();
}

function renderPhases(){

  const grid =
    document.getElementById("phaseGrid");

  grid.innerHTML = "";

  for(let i=1;i<=50;i++){

    const b =
      document.createElement("button");

    b.className = "phaseBtn";

    if(i <= unlocked){

      b.classList.add("open");
      b.textContent = i;

      b.addEventListener("click",function(){
        startGame(i);
      });

    }else{

      b.classList.add("lock");
      b.textContent = "🔒";

    }

    grid.appendChild(b);
  }

  document.getElementById("unlockedText").textContent =
    unlocked;
}

function updateHUD(){

  document.getElementById("score").textContent =
    Math.floor(score);

  document.getElementById("coins").textContent =
    coins;

  document.getElementById("phaseName").textContent =
    "FASE " + phase;

  document.getElementById("worldName").textContent =
    world()[0];

  document.getElementById("target").textContent =
    "META " + target;
}


/* =========================
   COMEÇAR
========================= */

function startGame(p){

  if(p > unlocked) return;

  phase = Math.max(1,Math.min(50,p));

  score = 0;
  coins = 0;

  target = phaseTarget(phase);
  speed = phaseSpeed(phase);

  lane = 1;
  laneVisual = 1;

  jumping = false;
  jumpTime = 0;

  sliding = false;
  slideTimer = 0;

  spawnTimer = .5;

  objects = [];
  particles = [];

  updateHUD();

  hide("menu");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("hud");

  running = true;
  lastTime = performance.now();

  requestAnimationFrame(loop);
}


/* =========================
   ESTRADA
========================= */

function roadY(z){
  return H*.38 + (H*1.08-H*.38)*z;
}

function roadHalf(z){
  return W*(.06+.44*z);
}

function laneX(l,z){

  const center = W/2;
  const spread = roadHalf(z)*.62;

  return center+(l-1)*spread;
}


/* =========================
   FUNDO
========================= */

function drawBackground(){

  const w = world();

  const g =
    ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,w[1]);
  g.addColorStop(.55,w[2]);
  g.addColorStop(1,"#020207");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* prédios */

  for(let i=0;i<28;i++){

    const bw = 25 + (i%5)*12;
    const bh = 50 + ((i*37)%130);

    const x =
      (i*97)%W;

    ctx.fillStyle =
      "rgba(5,8,25,.8)";

    ctx.fillRect(
      x,
      H*.38-bh,
      bw,
      bh
    );

    ctx.fillStyle = w[4];

    for(let y=H*.38-bh+10;y<H*.38-5;y+=15){

      if((i+y)%3===0){

        ctx.globalAlpha=.25;

        ctx.fillRect(
          x+5,
          y,
          4,
          5
        );

        ctx.globalAlpha=1;
      }
    }
  }

  /* horizonte */

  ctx.strokeStyle = w[4];
  ctx.globalAlpha=.35;
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(0,H*.38);
  ctx.lineTo(W,H*.38);
  ctx.stroke();

  ctx.globalAlpha=1;
}


/* =========================
   ESTRADA
========================= */

function drawRoad(){

  const w = world();

  const topY = roadY(0);
  const bottomY = roadY(1);

  const topHalf = roadHalf(0);
  const bottomHalf = roadHalf(1);

  ctx.fillStyle = w[3];

  ctx.beginPath();

  ctx.moveTo(W/2-topHalf,topY);
  ctx.lineTo(W/2+topHalf,topY);
  ctx.lineTo(W/2+bottomHalf,bottomY);
  ctx.lineTo(W/2-bottomHalf,bottomY);

  ctx.closePath();
  ctx.fill();

  /* bordas */

  ctx.strokeStyle = w[4];
  ctx.lineWidth = 2;
  ctx.globalAlpha=.5;

  ctx.beginPath();
  ctx.moveTo(W/2-topHalf,topY);
  ctx.lineTo(W/2-bottomHalf,bottomY);
  ctx.moveTo(W/2+topHalf,topY);
  ctx.lineTo(W/2+bottomHalf,bottomY);
  ctx.stroke();

  /* divisórias */

  for(let l=0;l<2;l++){

    const laneDivider =
      l===0 ? -.33 : .33;

    ctx.beginPath();

    for(let z=.03;z<1;z+=.08){

      const y = roadY(z);
      const x =
        W/2 +
        laneDivider*roadHalf(z);

      if(z===.03) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================
   PERSONAGEM
========================= */

function drawRunner(){

  const baseY = H*.84;

  let jumpOffset = 0;

  if(jumping){

    const t =
      Math.min(1,jumpTime/.85);

    jumpOffset =
      -Math.sin(t*Math.PI)*H*.16;
  }

  const x =
    laneX(laneVisual,.9);

  const y =
    baseY+jumpOffset;

  const w = world();

  /* sombra */

  ctx.globalAlpha=.35;
  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    baseY+10,
    30,
    8,
    0,0,Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /* pernas */

  ctx.strokeStyle="#dffcff";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  const runningMove =
    Math.sin(performance.now()/90)*8;

  ctx.beginPath();

  ctx.moveTo(x-7,y+25);
  ctx.lineTo(x-12+runningMove,y+58);

  ctx.moveTo(x+7,y+25);
  ctx.lineTo(x+12-runningMove,y+58);

  ctx.stroke();

  /* corpo */

  ctx.fillStyle="#111827";

  ctx.beginPath();

  ctx.roundRect(
    x-17,
    y-10,
    34,
    42,
    10
  );

  ctx.fill();

  /* neon */

  ctx.strokeStyle=w[4];
  ctx.lineWidth=3;

  ctx.stroke();

  /* braços */

  ctx.strokeStyle="#dffcff";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(x-14,y);
  ctx.lineTo(x-30-runningMove*.4,y+25);

  ctx.moveTo(x+14,y);
  ctx.lineTo(x+30+runningMove*.4,y+25);

  ctx.stroke();

  /* cabeça */

  ctx.fillStyle="#dffcff";

  ctx.beginPath();

  ctx.arc(
    x,
    y-28,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle=w[4];

  ctx.beginPath();

  ctx.arc(
    x,
    y-31,
    11,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================
   OBJETOS
========================= */

function canSpawn(){

  for(const o of objects){

    if(o.z > .48 && o.type==="obstacle"){
      return false;
    }
  }

  return true;
}

function spawn(){

  if(!canSpawn()) return;

  const amount =
    phase >= 15 && Math.random()<.32 ? 2 : 1;

  const used=[];

  for(let i=0;i<amount;i++){

    let l;

    do{
      l=Math.floor(Math.random()*3);
    }while(used.includes(l));

    used.push(l);

    objects.push({
      type:"obstacle",
      lane:l,
      z:0,
      kind:
        Math.random()<.25 ? "low":"block"
    });
  }

  /* moedas */

  if(Math.random()<.75){

    const l =
      Math.floor(Math.random()*3);

    for(let i=0;i<4;i++){

      objects.push({
        type:"coin",
        lane:l,
        z:-i*.10
      });
    }
  }
}


/* =========================
   DESENHO OBJETOS
========================= */

function drawObjects(){

  const w = world();

  for(const o of objects){

    if(o.z<0 || o.z>1.2) continue;

    const x =
      laneX(o.lane,o.z);

    const y =
      roadY(o.z);

    const s =
      .35+o.z*1.7;

    if(o.type==="coin"){

      ctx.fillStyle="#ffd83d";
      ctx.strokeStyle="#fff4a0";
      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        x,
        y-25*s,
        8*s,
        0,
        Math.PI*2
      );

      ctx.fill();
      ctx.stroke();

    }else{

      const width =
        32*s;

      const height =
        o.kind==="low"
          ? 18*s
          : 42*s;

      ctx.fillStyle=w[5];

      ctx.shadowBlur=15;
      ctx.shadowColor=w[5];

      ctx.fillRect(
        x-width/2,
        y-height,
        width,
        height
      );

      ctx.shadowBlur=0;

      ctx.strokeStyle=w[4];
      ctx.lineWidth=2;

      ctx.strokeRect(
        x-width/2,
        y-height,
        width,
        height
      );
    }
  }
}


/* =========================
   COLISÃO
========================= */

function collision(){

  const playerX =
    laneX(lane,.9);

  for(const o of objects){

    if(o.type!=="obstacle") continue;

    if(
      o.z>.78 &&
      o.z<1.04 &&
      o.lane===lane
    ){

      const jumpingOver =
        jumping &&
        jumpTime>.18 &&
        jumpTime<.72;

      const slidingUnder =
        sliding &&
        o.kind==="low";

      if(!jumpingOver && !slidingUnder){

        gameOver();
        return;
      }
    }
  }
}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(dt){

  /* movimento das pistas */

  laneVisual +=
    (lane-laneVisual) *
    Math.min(1,dt*24);

  /* salto */

  if(jumping){

    jumpTime += dt;

    if(jumpTime>=.85){

      jumping=false;
      jumpTime=0;
    }
  }

  /* slide */

  if(sliding){

    slideTimer-=dt;

    if(slideTimer<=0){
      sliding=false;
    }
  }

  /* objetos */

  for(const o of objects){

    o.z +=
      dt*(.34+speed*.85);

  }

  /* moedas */

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    if(
      o.type==="coin" &&
      o.z>.78 &&
      o.z<1.03 &&
      o.lane===lane
    ){

      coins++;
      score+=35;

      objects.splice(i,1);
      continue;
    }

    if(o.z>1.15){
      objects.splice(i,1);
    }
  }

  /* spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawn();

    spawnTimer =
      spawnGap() *
      (.88+Math.random()*.24);
  }

  /* pontuação */

  score += dt*(48+phase*2);

  if(score>=target){

    win();
    return;
  }

  collision();

  updateHUD();
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(!running) return;

  const lostPhase=phase;

  running=false;

  hide("hud");

  /*
    MORREU:
    tudo volta para a fase 1
  */

  unlocked=1;
  phase=1;

  document.getElementById("loseText").innerHTML =
    "VOCÊ CAIU NA FASE " +
    lostPhase +
    "<br><br>" +
    "Pontuação: " +
    Math.floor(score) +
    "<br>" +
    "As fases foram bloqueadas novamente.";

  show("gameOver");
}


/* =========================
   VITÓRIA
========================= */

function win(){

  if(!running) return;

  running=false;

  hide("hud");

  if(phase<50){

    unlocked =
      Math.max(
        unlocked,
        phase+1
      );
  }

  document.getElementById("winText").innerHTML =
    "FASE " +
    phase +
    " • " +
    world()[0] +
    "<br><br>" +
    "Pontuação: " +
    Math.floor(score) +
    "<br>" +
    "Moedas: " +
    coins +
    "<br><br>" +
    (
      phase<50
      ? "FASE " +
        (phase+1) +
        " DESBLOQUEADA!"
      : "VOCÊ TERMINOU AS 50 FASES!"
    );

  document.getElementById("next").textContent =
    phase<50
      ? "PRÓXIMA FASE"
      : "JOGAR NOVAMENTE";

  show("victory");
}


/* =========================
   LOOP
========================= */

function loop(now){

  if(!running) return;

  let dt =
    (now-lastTime)/1000;

  dt=Math.min(dt,.035);

  lastTime=now;

  update(dt);

  draw();

  if(running){

    requestAnimationFrame(loop);
  }
}


/* =========================
   DESENHAR
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();

  drawRoad();

  drawObjects();

  drawRunner();
}


/* =========================
   CONTROLES
========================= */

let touchX=0;
let touchY=0;

canvas.addEventListener(
  "touchstart",
  e=>{
    if(!running) return;

    const t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;
  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    if(!running) return;

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    const ax=Math.abs(dx);
    const ay=Math.abs(dy);

    if(Math.max(ax,ay)<25) return;

    if(ax>ay){

      if(dx>0){

        lane=Math.min(
          2,
          lane+1
        );

      }else{

        lane=Math.max(
          0,
          lane-1
        );
      }

    }else{

      if(dy<0){

        if(!jumping && !sliding){

          jumping=true;
          jumpTime=0;
        }

      }else{

        if(!jumping){

          sliding=true;
          slideTimer=.65;
        }
      }
    }
  },
  {passive:true}
);

========================= */

  .getElementById("play")

    "click",
    function(){
      startGame(1);
    }

        );

      }else{

      }
    }
  );
