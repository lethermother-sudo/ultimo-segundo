<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(40,220,255,.12),
      transparent 42%
    ),
    rgba(1,3,10,.88);
  backdrop-filter:blur(9px);
}

.screen.show{
  display:flex;
}

.card{
  width:min(440px,94vw);
  max-height:90vh;
  overflow:auto;
  padding:28px 22px;
  border-radius:28px;
  border:1px solid rgba(70,225,255,.28);
  background:
    linear-gradient(
      145deg,
      rgba(7,17,38,.98),
      rgba(2,7,19,.98)
    );
  box-shadow:
    0 0 60px rgba(20,180,255,.16),
    inset 0 0 35px rgba(30,180,255,.04);
  text-align:center;
}

.logo{
  color:#58e9ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:9px;
}

h1{
  margin:0;
  color:white;
  font-size:43px;
  line-height:.94;
  letter-spacing:-2px;
  text-shadow:
    0 0 15px rgba(40,230,255,.75),
    0 0 40px rgba(40,130,255,.25);
}

.subtitle{
  margin:15px 0 23px;
  color:#91a7c2;
  font-size:12px;
  letter-spacing:1px;
}

button{
  appearance:none;
  border:0;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
}

.mainBtn{
  width:100%;
  padding:17px;
  border-radius:17px;
  font-size:18px;
  background:
    linear-gradient(
      100deg,
      #15ddff,
      #7c3cff
    );
  box-shadow:
    0 10px 30px rgba(25,200,255,.22);
}

.secondaryBtn{
  width:100%;
  margin-top:11px;
  padding:15px;
  border-radius:17px;
  font-size:14px;
  color:#ccecff;
  background:rgba(14,31,57,.86);
  border:1px solid rgba(94,234,255,.20);
}

button:active{
  transform:scale(.97);
}

.bestTitle{
  margin-top:20px;
  color:#667e9b;
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

#menuBest{
  margin-top:5px;
  color:#ffd83d;
  font-size:23px;
  font-weight:900;
}

.phaseGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0;
}

.phaseBtn{
  position:relative;
  min-height:80px;
  padding:9px 4px;
  border-radius:15px;
  background:
    linear-gradient(
      145deg,
      rgba(12,31,58,.96),
      rgba(4,13,28,.96)
    );
  border:1px solid rgba(94,234,255,.15);
}

.phaseBtn .num{
  display:block;
  color:#5eeaff;
  font-size:21px;
  font-weight:900;
}

.phaseBtn .name{
  display:block;
  margin-top:4px;
  color:#aabdd3;
  font-size:8px;
  font-weight:900;
}

.phaseBtn .goal{
  display:block;
  margin-top:4px;
  color:#ffd83d;
  font-size:7px;
  font-weight:900;
}

.phaseBtn.locked{
  opacity:.30;
}

.phaseBtn.selected{
  border-color:#5eeaff;
  box-shadow:0 0 15px rgba(94,234,255,.18);
}

.lock{
  position:absolute;
  top:5px;
  right:6px;
  font-size:10px;
}

.resultTitle{
  color:#5eeaff;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
}

.resultStats{
  color:#d7e6f8;
  font-size:15px;
  line-height:1.8;
  margin:18px 0 22px;
}

#hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:23px;
  top:calc(env(safe-area-inset-top) + 12px);
  font-size:42px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
}

#coins{
  position:absolute;
  left:26px;
  top:calc(env(safe-area-inset-top) + 62px);
  color:#ffd83d;
  font-size:17px;
  font-weight:900;
}

#target{
  position:absolute;
  left:26px;
  top:calc(env(safe-area-inset-top) + 91px);
  color:rgba(255,255,255,.64);
  font-size:10px;
  font-weight:900;
}

#progressBox{
  position:absolute;
  left:26px;
  right:26px;
  top:calc(env(safe-area-inset-top) + 111px);
  height:4px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.13);
}

#progress{
  width:0%;
  height:100%;
  background:linear-gradient(
    90deg,
    #16ddff,
    #8b3cff
  );
  box-shadow:0 0 12px #16ddff;
}

#speed{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 15px);
  color:#5eeaff;
  font-size:14px;
  font-weight:900;
}

#phaseHud{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 40px);
  color:#ffd83d;
  font-size:11px;
  font-weight:900;
  text-align:right;
  max-width:190px;
}

#sound{
  position:absolute;
  right:20px;
  top:calc(env(safe-area-inset-top) + 70px);
  pointer-events:auto;
  padding:8px 11px;
  border-radius:13px;
  color:#5eeaff;
  background:rgba(3,12,27,.82);
  border:1px solid rgba(94,234,255,.28);
  font-size:11px;
}

#hint{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  text-align:center;
  color:rgba(255,255,255,.43);
  font-size:10px;
  font-weight:700;
}

@media(max-width:380px){

  h1{
    font-size:35px;
  }

  #score{
    font-size:36px;
  }

  .phaseGrid{
    gap:6px;
  }

  .phaseBtn{
    min-height:74px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="score">0</div>

  <div id="coins">● 0</div>

  <div id="target">META 1200</div>

  <div id="progressBox">
    <div id="progress"></div>
  </div>

  <div id="speed">
    VELOCIDADE 1.0x
  </div>

  <div id="phaseHud">
    FASE 1
  </div>

  <button id="sound">
    🔊 SOM
  </button>

  <div id="hint">
    ← → FAIXA &nbsp; • &nbsp; ↑ PULAR &nbsp; • &nbsp; ↓ DESLIZAR
  </div>

</div>


<!-- MENU -->

<div id="menu" class="screen show">

  <div class="card">

    <div class="logo">
      RUNNER EXPERIENCE
    </div>

    <h1>
      ÚLTIMO<br>SEGUNDO
    </h1>

    <div class="subtitle">
      CORRA • DESVIE • SOBREVIVA
    </div>

    <button id="play" class="mainBtn">
      ▶ JOGAR
    </button>

    <button id="phases" class="secondaryBtn">
      🎮 50 FASES
    </button>

    <div class="bestTitle">
      MELHOR PONTUAÇÃO
    </div>

    <div id="menuBest">
      0
    </div>

  </div>

</div>


<!-- FASES -->

<div id="phaseMenu" class="screen">

  <div class="card">

    <div class="logo">
      PROGRESSÃO
    </div>

    <h1 style="font-size:31px">
      50 FASES
    </h1>

    <div class="subtitle">
      A dificuldade aumenta conforme você avança.
    </div>

    <div id="phaseGrid" class="phaseGrid"></div>

    <button id="backMenu" class="secondaryBtn">
      ← VOLTAR
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameover" class="screen">

  <div class="card">

    <div class="resultTitle">
      CORRIDA ENCERRADA
    </div>

    <h1>
      FIM DE JOGO
    </h1>

    <div id="finalStats" class="resultStats">
      Pontuação: 0
    </div>

    <button id="again" class="mainBtn">
      🔄 TENTAR NOVAMENTE
    </button>

    <button id="overMenu" class="secondaryBtn">
      🏠 MENU
    </button>

  </div>

</div>


<!-- VITÓRIA -->

<div id="victory" class="screen">

  <div class="card">

    <div class="resultTitle">
      FASE CONCLUÍDA
    </div>

    <h1>
      🏆 VITÓRIA
    </h1>

    <div id="victoryStats" class="resultStats"></div>

    <button id="nextPhase" class="mainBtn">
      🚀 PRÓXIMA FASE
    </button>

    <button id="victoryMenu" class="secondaryBtn">
      🏠 MENU
    </button>

  </div>

</div>


<script>

(function(){

"use strict";


/* =========================================================
   ELEMENTOS
========================================================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var phaseMenu=document.getElementById("phaseMenu");
var gameover=document.getElementById("gameover");
var victory=document.getElementById("victory");

var play=document.getElementById("play");
var phases=document.getElementById("phases");
var again=document.getElementById("again");
var backMenu=document.getElementById("backMenu");
var overMenu=document.getElementById("overMenu");
var victoryMenu=document.getElementById("victoryMenu");
var nextPhase=document.getElementById("nextPhase");

var soundButton=document.getElementById("sound");
var phaseGrid=document.getElementById("phaseGrid");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var targetEl=document.getElementById("target");
var progressEl=document.getElementById("progress");
var speedEl=document.getElementById("speed");
var phaseEl=document.getElementById("phaseHud");

var menuBest=document.getElementById("menuBest");
var finalStats=document.getElementById("finalStats");
var victoryStats=document.getElementById("victoryStats");


/* =========================================================
   CANVAS
========================================================= */

var W=0;
var H=0;
var dpr=1;

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   50 FASES
========================================================= */

var themes=[
  ["CIDADE NEON","#020617","#092b4a","#20dcff"],
  ["CENTRO FUTURISTA","#09021c","#24104a","#b45cff"],
  ["VIA NOTURNA","#020611","#102e3a","#35ffd2"],
  ["ZONA INDUSTRIAL","#120504","#4a1c08","#ff7b2f"],
  ["CYBER CITY","#10001c","#30104f","#ff35df"],
  ["DISTRITO VERMELHO","#180208","#52101d","#ff304f"],
  ["MEGA TÚNEL","#02030b","#16264c","#477cff"],
  ["CIDADE AÉREA","#03121a","#07506a","#29f7ff"],
  ["ZONA ZERO","#100008","#360015","#ff168f"],
  ["ÚLTIMO SEGUNDO","#05000f","#26005c","#a855ff"]
];

var phaseData={};

for(var p=1;p<=50;p++){

  var theme=themes[(p-1)%themes.length];

  var target=Math.floor(
    1200+
    (p-1)*600+
    Math.pow(p-1,1.18)*16
  );

  var maxSpeed=Math.min(
    2.15,
    .76+(p-1)*.028
  );

  var difficulty=Math.min(
    1,
    (p-1)/49
  );

  phaseData[p]={

    name:
      p<=10
      ? theme[0]
      : theme[0]+" "+(Math.floor((p-1)/10)+1),

    target:target,

    maxSpeed:maxSpeed,

    difficulty:difficulty,

    sky1:theme[1],
    sky2:theme[2],
    accent:theme[3]
  };
}


/* =========================================================
   PROGRESSÃO
========================================================= */

var currentPhase=Number(
  localStorage.getItem("ultimoSegundoPhase")||1
);

var unlockedPhase=Number(
  localStorage.getItem("ultimoSegundoUnlocked")||1
);

if(!Number.isFinite(currentPhase))
  currentPhase=1;

if(!Number.isFinite(unlockedPhase))
  unlockedPhase=1;

currentPhase=Math.max(
  1,
  Math.min(50,currentPhase)
);

unlockedPhase=Math.max(
  1,
  Math.min(50,unlockedPhase)
);

if(currentPhase>unlockedPhase)
  currentPhase=unlockedPhase;


/* =========================================================
   ESTADO
========================================================= */

var running=false;

var last=0;

var gameTime=0;

var score=0;

var coins=0;

var speed=.55;

var lane=1;

var targetLane=1;

var laneVisual=1;

var jumpTime=0;

var slideTime=0;

var spawnTimer=0;

var coinTimer=0;

var objects=[];

var particles=[];

var speedLines=[];

var shake=0;

var combo=1;

var comboTimer=0;

var best=Number(
  localStorage.getItem("ultimoSegundoBest")||0
);


/* =========================================================
   ÁUDIO
========================================================= */

var audioCtx=null;
var master=null;

var soundOn=true;

function initAudio(){

  try{

    var AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)
      return;

    if(!audioCtx){

      audioCtx=new AC();

      master=audioCtx.createGain();

      master.gain.value=soundOn?.32:0;

      master.connect(
        audioCtx.destination
      );
    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume().catch(function(){});
    }

  }catch(e){}
}


function tone(
  frequency,
  duration,
  type,
  volume,
  endFrequency
){

  if(!soundOn)
    return;

  try{

    initAudio();

    if(!audioCtx||!master)
      return;

    var oscillator=
      audioCtx.createOscillator();

    var gain=
      audioCtx.createGain();

    var now=
      audioCtx.currentTime;

    oscillator.type=
      type||"sine";

    oscillator.frequency.setValueAtTime(
      frequency,
      now
    );

    if(endFrequency){

      oscillator.frequency.exponentialRampToValueAtTime(
        endFrequency,
        now+duration
      );
    }

    gain.gain.setValueAtTime(
      .001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      volume||.08,
      now+.015
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+duration
    );

    oscillator.connect(gain);
    gain.connect(master);

    oscillator.start(now);

    oscillator.stop(
      now+duration+.025
    );

  }catch(e){}
}


function startSound(){

  tone(
    300,
    .16,
    "sine",
    .08,
    650
  );
}


function coinSound(){

  tone(
    680,
    .09,
    "sine",
    .09,
    1100
  );
}


function laneSound(){

  tone(
    220,
    .07,
    "triangle",
    .045,
    330
  );
}


function jumpSound(){

  tone(
    260,
    .14,
    "triangle",
    .07,
    520
  );
}


function slideSound(){

  tone(
    170,
    .12,
    "sawtooth",
    .035,
    90
  );
}


function hitSound(){

  tone(
    90,
    .28,
    "square",
    .12,
    45
  );
}


function victorySound(){

  tone(
    520,
    .15,
    "sine",
    .08,
    780
  );

  setTimeout(function(){

    tone(
      780,
      .22,
      "sine",
      .09,
      1200
    );

  },130);

}


/* =========================================================
   MENU / FASES
========================================================= */

function hideScreens(){

  menu.classList.remove("show");
  phaseMenu.classList.remove("show");
  gameover.classList.remove("show");
  victory.classList.remove("show");
}


function updateMenu(){

  menuBest.textContent=
    Math.floor(best);
}


function buildPhaseMenu(){

  phaseGrid.innerHTML="";

  for(
    var i=1;
    i<=50;
    i++
  ){

    var data=phaseData[i];

    var button=
      document.createElement("button");

    button.className="phaseBtn";

    if(i>unlockedPhase)
      button.classList.add("locked");

    if(i===currentPhase)
      button.classList.add("selected");

    button.innerHTML=

      '<span class="num">'+
      i+
      '</span>'+

      '<span class="name">'+
      data.name+
      '</span>'+

      '<span class="goal">'+
      data.target+
      ' PTS</span>'+

      (
        i>unlockedPhase
        ? '<span class="lock">🔒</span>'
        : ''
      );

    if(i<=unlockedPhase){

      button.onclick=(function(n){

        return function(){

          currentPhase=n;

          localStorage.setItem(
            "ultimoSegundoPhase",
            String(n)
          );

          buildPhaseMenu();

          startGame();
        };

      })(i);
    }

    phaseGrid.appendChild(button);
  }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  var data=phaseData[currentPhase];

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  targetEl.textContent=
    "META "+data.target;

  var percent=
    Math.min(
      100,
      (score/data.target)*100
    );

  progressEl.style.width=
    percent+"%";

  speedEl.textContent=
    "VELOCIDADE "+
    speed.toFixed(1)+"x";

  phaseEl.textContent=
    "FASE "+
    currentPhase+
    " • "+
    data.name;
}


/* =========================================================
   INÍCIO
========================================================= */

function resetGame(){

  var data=phaseData[currentPhase];

  running=true;

  last=performance.now();

  gameTime=0;

  score=0;

  coins=0;

  speed=.55;

  lane=1;

  targetLane=1;

  laneVisual=1;

  jumpTime=0;

  slideTime=0;

  spawnTimer=.55;

  coinTimer=.30;

  objects=[];

  particles=[];

  speedLines=[];

  shake=0;

  combo=1;

  comboTimer=0;

  updateHUD();

  for(var i=0;i<20;i++){

    speedLines.push({
      x:Math.random(),
      y:Math.random(),
      z:Math.random()
    });
  }

  startSound();

  requestAnimationFrame(loop);
}


function startGame(){

  hideScreens();

  initAudio();

  resetGame();
}


/* =========================================================
   CONTROLES
========================================================= */

function moveLeft(){

  if(!running)
    return;

  if(targetLane>0){

    targetLane--;

    lane=targetLane;

    laneSound();
  }
}


function moveRight(){

  if(!running)
    return;

  if(targetLane<2){

    targetLane++;

    lane=targetLane;

    laneSound();
  }
}


function jump(){

  if(!running)
    return;

  if(jumpTime<=0&&slideTime<=0){

    jumpTime=.78;

    jumpSound();

    createBurst(
      playerX(),
      playerY()-30,
      "#5eeaff",
      8
    );
  }
}


function slide(){

  if(!running)
    return;

  if(slideTime<=0&&jumpTime<=0){

    slideTime=.58;

    slideSound();
  }
}


document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft")
      moveLeft();

    else if(e.key==="ArrowRight")
      moveRight();

    else if(e.key==="ArrowUp"||e.key===" ")
      jump();

    else if(e.key==="ArrowDown")
      slide();

    else if(
      e.key==="Enter"&&
      !running
    )
      startGame();
  }
);


/* =========================================================
   TOUCH
========================================================= */

var touchX=0;
var touchY=0;
var touchStartTime=0;

document.addEventListener(
  "touchstart",
  function(e){

    if(!running)
      return;

    var t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

    touchStartTime=Date.now();

  },
  {passive:true}
);


document.addEventListener(
  "touchend",
  function(e){

    if(!running)
      return;

    var t=e.changedTouches[0];

    var dx=t.clientX-touchX;
    var dy=t.clientY-touchY;

    var adx=Math.abs(dx);
    var ady=Math.abs(dy);

    if(
      adx<22&&
      ady<22
    )
      return;

    if(adx>ady){

      if(dx>0)
        moveRight();
      else
        moveLeft();

    }else{

      if(dy<0)
        jump();
      else
        slide();
    }

  },
  {passive:true}
);


/* =========================================================
   GEOMETRIA DA PISTA
========================================================= */

function roadTop(){
  return H*.49;
}

function roadBottom(){
  return H*1.03;
}


function roadWidthAt(y){

  var top=roadTop();
  var bottom=roadBottom();

  var t=
    Math.max(
      0,
      Math.min(
        1,
        (y-top)/(bottom-top)
      )
    );

  return W*(.26+.73*t);
}


function roadCenter(){
  return W*.5;
}


function laneX(laneIndex,y){

  var width=roadWidthAt(y);

  return (
    roadCenter()+
    (laneIndex-1)*width*.305
  );
}


function playerX(){

  return laneX(
    laneVisual,
    H*.84
  );
}


function playerY(){

  var base=H*.84;

  if(jumpTime>0){

    var t=
      1-
      jumpTime/.78;

    var arc=
      Math.sin(t*Math.PI);

    return base-arc*H*.19;
  }

  return base;
}


/* =========================================================
   SPAWN
========================================================= */

function spawnObstacle(
  laneIndex,
  z,
  kind
){

  objects.push({

    type:"obstacle",

    lane:laneIndex,

    z:z,

    kind:kind||"block",

    hit:false,

    seed:Math.random()*10
  });
}


function spawnCoin(
  laneIndex,
  z
){

  objects.push({

    type:"coin",

    lane:laneIndex,

    z:z,

    spin:Math.random()*Math.PI*2,

    collected:false
  });
}


/*
  O gerador trabalha por padrões.
  Isso evita obstáculos grudados
  e cria decisões reais de faixa.
*/

function spawnPattern(){

  var d=phaseData[currentPhase];

  var difficulty=d.difficulty;

  var roll=Math.random();

  var z=1.08;

  var gap=.16;

  if(roll<.30){

    /*
      Obstáculo único
    */

    var l=
      Math.floor(
        Math.random()*3
      );

    var kind=
      Math.random()<.72
      ? "block"
      : "bar";

    spawnObstacle(
      l,
      z,
      kind
    );

    /*
      moeda em outra faixa
    */

    var coinLane=
      (l+1+
      Math.floor(Math.random()*2))%3;

    spawnCoin(
      coinLane,
      z-gap
    );

  }

  else if(
    roll<.55+
    difficulty*.10
  ){

    /*
      Dois obstáculos:
      sempre sobra uma faixa livre.
    */

    var free=
      Math.floor(
        Math.random()*3
      );

    for(
      var l2=0;
      l2<3;
      l2++
    ){

      if(l2!==free){

        spawnObstacle(
          l2,
          z,
          Math.random()<.5
          ? "block"
          : "bar"
        );
      }
    }

    spawnCoin(
      free,
      z-.13
    );

  }

  else if(
    roll<.78+
    difficulty*.08
  ){

    /*
      Sequência deslocada
    */

    var first=
      Math.floor(
        Math.random()*3
      );

    var second=
      (first+
      (Math.random()<.5?1:2))%3;

    spawnObstacle(
      first,
      z,
      "block"
    );

    spawnObstacle(
      second,
      z-.20,
      "bar"
    );

    spawnCoin(
      (second+1)%3,
      z-.34
    );

  }

  else{

    /*
      Padrão avançado.
      A partir das fases mais altas,
      exige troca rápida.
    */

    var startLane=
      Math.floor(
        Math.random()*3
      );

    spawnObstacle(
      startLane,
      z,
      "block"
    );

    var middle=
      (startLane+1)%3;

    spawnObstacle(
      middle,
      z-.18,
      "bar"
    );

    var finalLane=
      (middle+1)%3;

    spawnObstacle(
      finalLane,
      z-.36,
      "block"
    );

    spawnCoin(
      (finalLane+1)%3,
      z-.49
    );
  }
}


/* =========================================================
   MOEDAS EXTRAS
========================================================= */

function spawnCoinLine(){

  var l=
    Math.floor(
      Math.random()*3
    );

  var count=
    3+
    Math.floor(
      Math.random()*3
    );

  for(
    var i=0;
    i<count;
    i++
  ){

    spawnCoin(
      l,
      1.02-i*.12
    );
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createBurst(
  x,
  y,
  color,
  count
){

  for(
    var i=0;
    i<count;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*
        160,

      vy:
        (Math.random()-.5)*
        160,

      life:.45+
        Math.random()*.35,

      max:.8,

      size:
        2+
        Math.random()*4,

      color:color
    });
  }
}


function updateParticles(dt){

  for(
    var i=particles.length-1;
    i>=0;
    i--
  ){

    var p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=190*dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}


function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    var alpha=
      Math.max(
        0,
        p.life/p.max
      );

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.fillStyle=p.color;

    ctx.shadowBlur=12;

    ctx.shadowColor=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   VELOCIDADE
========================================================= */

function updateSpeedLines(dt){

  for(
    var i=0;
    i<speedLines.length;
    i++
  ){

    var line=speedLines[i];

    line.y+=
      dt*
      (.18+
      speed*.20)*
      (1+line.z*2);

    line.z+=
      dt*
      (.08+
      speed*.04);

    if(line.y>1||line.z>1){

      line.x=Math.random();
      line.y=Math.random()*.15;
      line.z=0;
    }
  }
}


function drawSpeedLines(){

  ctx.save();

  for(
    var i=0;
    i<speedLines.length;
    i++
  ){

    var s=speedLines[i];

    var x=
      W*.5+
      (s.x-.5)*
      W*
      (.5+s.z*.7);

    var y=
      roadTop()+
      s.y*
      (H-roadTop());

    var len=
      8+
      s.z*35;

    ctx.globalAlpha=
      .04+
      s.z*.14;

    ctx.strokeStyle=
      phaseData[currentPhase].accent;

    ctx.lineWidth=
      1+s.z*2;

    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );

    ctx.lineTo(
      x,
      y+len
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   ATUALIZAÇÃO
========================================================= */

function update(dt){

  var data=phaseData[currentPhase];

  gameTime+=dt;

  /*
    A velocidade cresce durante a fase.
  */

  var targetSpeed=
    Math.min(
      data.maxSpeed,
      .55+
      gameTime*.010+
      score/data.target*.55
    );

  speed+=
    (targetSpeed-speed)*
    Math.min(
      1,
      dt*3.5
    );

  /*
    Movimento visual muito rápido.
  */

  laneVisual+=
    (targetLane-laneVisual)*
    Math.min(
      1,
      dt*28
    );

  if(jumpTime>0){

    jumpTime-=dt;

    if(jumpTime<0)
      jumpTime=0;
  }

  if(slideTime>0){

    slideTime-=dt;

    if(slideTime<0)
      slideTime=0;
  }

  /*
    Spawn.
  */

  spawnTimer-=dt;

  var spawnInterval=
    Math.max(
      .54,
      .98-
      currentPhase*.007-
      speed*.08
    );

  if(spawnTimer<=0){

    spawnPattern();

    spawnTimer=
      spawnInterval+
      Math.random()*.20;
  }

  coinTimer-=dt;

  if(coinTimer<=0){

    if(Math.random()<.48)
      spawnCoinLine();

    coinTimer=
      Math.max(
        .75,
        1.45-
        currentPhase*.01
      )+
      Math.random()*.35;
  }


  /*
    Movimento dos objetos.
  */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z-=
      dt*
      (.25+
      speed*.32);

    /*
      Coleta de moedas.
    */

    if(
      o.type==="coin"&&
      !o.collected&&
      o.z<.18&&
      o.z>-.05&&
      o.lane===targetLane
    ){

      o.collected=true;

      coins++;

      score+=
        35*combo;

      combo++;

      comboTimer=1.8;

      createBurst(
        laneX(
          o.lane,
          H*.72
        ),
        H*.72,
        "#ffd83d",
        10
      );

      coinSound();
    }


    /*
      Colisão.
    */

    if(
      o.type==="obstacle"&&
      !o.hit&&
      o.z<.16&&
      o.z>-.055&&
      o.lane===targetLane
    ){

      /*
        Barra baixa:
        pular evita.
      */

      if(
        o.kind==="bar"&&
        jumpTime>0
      ){

        o.hit=true;

        score+=
          90*combo;

        combo++;

        comboTimer=1.8;

        createBurst(
          laneX(
            o.lane,
            H*.76
          ),
          H*.76,
          "#5eeaff",
          7
        );

        continue;
      }

      /*
        Obstáculo normal:
        pulo ou slide evitam.
      */

      if(
        jumpTime>0||
        slideTime>0
      ){

        o.hit=true;

        score+=
          90*combo;

        combo++;

        comboTimer=1.8;

        createBurst(
          laneX(
            o.lane,
            H*.76
          ),
          H*.76,
          "#ff3b7a",
          7
        );

        continue;
      }

      endGame();

      return;
    }

    /*
      Remove objetos.
    */

    if(o.z<-.18){

      if(o.type==="obstacle"&&!o.hit){

        score+=
          12*combo;
      }

      objects.splice(i,1);
    }
  }


  /*
    Combo.
  */

  if(comboTimer>0){

    comboTimer-=dt;

  }else{

    combo=1;
  }


  /*
    Pontuação por distância.
  */

  score+=
    dt*
    (35+
    speed*28);


  /*
    Partículas.
  */

  updateParticles(dt);

  updateSpeedLines(dt);


  /*
    Tremor.
  */

  if(shake>0){

    shake-=
      dt*3;

    if(shake<0)
      shake=0;
  }


  /*
    Vitória.
  */

  if(score>=data.target){

    winGame();

    return;
  }

  updateHUD();
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)
    return;

  running=false;

  hitSound();

  shake=.7;

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  finalStats.innerHTML=
    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+
    "Moedas: <b>"+
    coins+
    "</b><br>"+
    "Fase: <b>"+
    currentPhase+
    "</b><br><br>"+
    "Melhor pontuação: "+
    best;

  updateMenu();

  setTimeout(function(){

    gameover.classList.add("show");

  },350);
}


/* =========================================================
   VITÓRIA
========================================================= */

function winGame(){

  if(!running)
    return;

  running=false;

  victorySound();

  if(
    currentPhase<50&&
    unlockedPhase<currentPhase+1
  ){

    unlockedPhase=
      currentPhase+1;

    localStorage.setItem(
      "ultimoSegundoUnlocked",
      String(unlockedPhase)
    );
  }

  localStorage.setItem(
    "ultimoSegundoPhase",
    String(
      Math.min(
        50,
        currentPhase+
        (currentPhase<50?1:0)
      )
    )
  );

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  victoryStats.innerHTML=

    "FASE "+
    currentPhase+
    " • "+
    phaseData[currentPhase].name+
    "<br><br>"+

    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+

    "Moedas: <b>"+
    coins+
    "</b><br><br>"+

    (
      currentPhase<50
      ? "FASE "+
        (currentPhase+1)+
        " DESBLOQUEADA!"
      : "🏆 VOCÊ CHEGOU AO ÚLTIMO SEGUNDO!"
    );

  if(currentPhase>=50){

    nextPhase.style.display="none";

  }else{

    nextPhase.style.display="block";
  }

  updateMenu();

  victory.classList.add("show");
}


/* =========================================================
   DESENHO DO CÉU
========================================================= */

function drawBackground(){

  var data=phaseData[currentPhase];

  var gradient=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    data.sky1
  );

  gradient.addColorStop(
    .58,
    data.sky2
  );

  gradient.addColorStop(
    1,
    "#02040a"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Lua / brilho.
  */

  ctx.globalAlpha=.12;

  ctx.fillStyle=data.accent;

  ctx.shadowBlur=60;

  ctx.shadowColor=data.accent;

  ctx.beginPath();

  ctx.arc(
    W*.72,
    H*.18,
    Math.min(W,H)*.12,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /*
    Estrelas / pontos.
  */

  ctx.save();

  for(
    var i=0;
    i<35;
    i++
  ){

    var x=
      (i*97)%W;

    var y=
      70+
      ((i*61)%Math.floor(H*.35));

      .10+
      ((i%5)/5)*.12;

    ctx.globalAlpha=alpha;

    ctx.fillStyle="#fff";

    ctx.fillRect(
      x,
      y,
      1,
      1
    );
  }

  ctx.restore();
}


/* =========================================================
   CIDADE
========================================================= */

function drawCity(){

  var horizon=roadTop();

  var data=phaseData[currentPhase];

  var offset=
    (gameTime*
    (18+
    speed*18))%
    90;

  for(
    var side=-1;
    side<=1;
    side+=2
  ){

    for(
      var i=0;
      i<12;
      i++
    ){

      var bw=
        35+
        ((i*31)%70);

      var bh=
        70+
        ((i*83)%180);

      var x;

      if(side<0){

        x=
          i*70-
          offset-
          bw;

      }else{

        x=
          W-
          i*70+
          offset;
      }

      var y=
        horizon-bh;

      ctx.fillStyle=
        "rgba(1,7,18,.92)";

      ctx.fillRect(
        x,
        y,
        bw,
        bh
      );

      /*
        topo.
      */

      ctx.fillStyle=
        "rgba(10,20,40,.8)";

      ctx.fillRect(
        x,
        y,
        bw,
        6
      );

      /*
        janelas.
      */

      for(
        var wy=y+18;
        wy<horizon-8;
        wy+=18
      ){

        if(
          Math.random()<
          .42
        ){

          ctx.fillStyle=
            data.accent;

          ctx.globalAlpha=.25;

          ctx.fillRect(
            x+8,
            wy,
            3,
            6
          );

          if(bw>50){

            ctx.fillRect(
              x+bw-12,
              wy,
              3,
              6
            );
          }
        }
      }

      ctx.globalAlpha=1;
    }
  }
}


/* =========================================================
   PISTA
========================================================= */

function drawRoad(){

  var top=roadTop();

  var bottom=roadBottom();

  var topWidth=
    roadWidthAt(top);

  var bottomWidth=
    roadWidthAt(bottom);

  var center=roadCenter();

  /*
    Asfalto.
  */

  var roadGradient=
    ctx.createLinearGradient(
      0,
      top,
      0,
      bottom
    );

  roadGradient.addColorStop(
    0,
    "#030913"
  );

  roadGradient.addColorStop(
    1,
    "#02040a"
  );

  ctx.fillStyle=roadGradient;

  ctx.beginPath();

  ctx.moveTo(
    center-topWidth/2,
    top
  );

  ctx.lineTo(
    center+topWidth/2,
    top
  );

  ctx.lineTo(
    center+bottomWidth/2,
    bottom
  );

  ctx.lineTo(
    center-bottomWidth/2,
    bottom
  );

  ctx.closePath();

  ctx.fill();


  /*
    Bordas luminosas.
  */

  ctx.save();

  ctx.strokeStyle=
    phaseData[currentPhase].accent;

  ctx.shadowBlur=14;

  ctx.shadowColor=
    phaseData[currentPhase].accent;

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    center-topWidth/2,
    top
  );

  ctx.lineTo(
    center-bottomWidth/2,
    bottom
  );

  ctx.moveTo(
    center+topWidth/2,
    top
  );

  ctx.lineTo(
    center+bottomWidth/2,
    bottom
  );

  ctx.stroke();

  ctx.restore();


  /*
    Divisórias das três faixas.
  */

  for(
    var l=1;
    l<=2;
    l++
  ){

    ctx.save();

    ctx.strokeStyle=
      "rgba(45,190,240,.22)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      laneX(l,top),
      top
    );

    ctx.lineTo(
      laneX(l,bottom),
      bottom
    );

    ctx.stroke();

    ctx.restore();
  }


  /*
    Faixas horizontais em perspectiva.
  */

  for(
    var i=0;
    i<12;
    i++
  ){

    var t=
      ((i/12)+
      gameTime*
      (.10+
      speed*.035))%1;

    var y=
      top+
      Math.pow(t,1.65)*
      (bottom-top);

    var width=
      roadWidthAt(y);

    ctx.globalAlpha=
      .08+
      t*.12;

    ctx.strokeStyle=
      "#61dfff";

    ctx.lineWidth=
      1+
      t*2;

    ctx.beginPath();

    ctx.moveTo(
      center-width*.43,
      y
    );

    ctx.lineTo(
      center+width*.43,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   OBJETOS
========================================================= */

function objectY(z){

  /*
    z 1 = longe
    z 0 = jogador
  */

  var t=
    1-
    Math.max(
      0,
      Math.min(
        1,
        z
      )
    );

  return=
    roadTop()+
    Math.pow(t,1.65)*
    (H*.84-roadTop());
}


function drawObstacle(o){

  var y=objectY(o.z);

  var size=
    22+
    (1-o.z)*145;

  var x=
    laneX(
      o.lane,
      y
    );

  var accent=
    phaseData[currentPhase].accent;

  if(o.kind==="bar"){

    var w=size*1.65;

    var h=Math.max(
      8,
      size*.28
    );

    ctx.save();

    ctx.shadowBlur=22;

    ctx.shadowColor="#ff3470";

    ctx.fillStyle="#111827";

    ctx.fillRect(
      x-w/2,
      y-h/2,
      w,
      h
    );

    ctx.strokeStyle="#ff3470";

    ctx.lineWidth=
      Math.max(
        2,
        size*.07
      );

    ctx.strokeRect(
      x-w/2,
      y-h/2,
      w,
      h
    );

    ctx.fillStyle="#ff527f";

    ctx.fillRect(
      x-w*.35,
      y-h*.10,
      w*.7,
      Math.max(
        3,
        h*.20
      )
    );

    ctx.restore();

    return;
  }


  /*
    Obstáculo bloco.
  */

  var w=size*1.12;

  var h=size*.78;

  ctx.save();

  ctx.shadowBlur=25;

  ctx.shadowColor="#ff245e";

  ctx.fillStyle="#0b1222";

  ctx.fillRect(
    x-w/2,
    y-h/2,
    w,
    h
  );

  ctx.strokeStyle="#ff245e";

  ctx.lineWidth=
    Math.max(
      3,
      size*.07
    );

  ctx.strokeRect(
    x-w/2,
    y-h/2,
    w,
    h
  );

  ctx.fillStyle="#ff315e";

  ctx.shadowBlur=12;

  ctx.shadowColor="#ff315e";

  ctx.fillRect(
    x-w*.32,
    y-h*.08,
    size*.12,
    size*.12
  );

  ctx.fillRect(
    x+w*.20,
    y-h*.08,
    size*.12,
    size*.12
  );

  ctx.restore();
}


function drawCoin(o){

  if(o.collected)
    return;

  var y=objectY(o.z);

  var x=
    laneX(
      o.lane,
      y
    );

  var r=
    5+
    (1-o.z)*18;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    Math.sin(
      gameTime*6+
      o.spin
    )*.18
  );

  ctx.globalAlpha=
    .5+
    Math.min(
      .5,
      1-o.z
    );

  ctx.shadowBlur=22;

  ctx.shadowColor="#ffd83d";

  ctx.fillStyle="#ffd83d";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*.72,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff4a6";

  ctx.beginPath();

  ctx.arc(
    -r*.22,
    -r*.28,
    Math.max(
      1,
      r*.18
    ),
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   PERSONAGEM
========================================================= */

function drawRunner(){

  var x=playerX();

  var y=playerY();

  var jumpOffset=
    H*.84-y;

  var sliding=
    slideTime>0;

  /*
    Sombra.
  */

  ctx.save();

  ctx.globalAlpha=
    Math.max(
      .12,
      .30-
      jumpOffset/H
    );

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    H*.86,
    25+
    jumpOffset*.18,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  if(sliding){

    drawSlidingRunner(
      x,
      y
    );

    return;
  }


  /*
    Animação de corrida.
  */

  var runCycle=
    Math.sin(
      gameTime*
      (13+
      speed*4)
    );

  var legA=
    runCycle*
    12;

  var legB=
    -runCycle*
    12;

  var armA=
    -runCycle*
    11;

  var armB=
    runCycle*
    11;


  /*
    glow.
  */

  ctx.save();

  ctx.shadowBlur=25;

  ctx.shadowColor="#5eeaff";


  /*
    pernas.
  */

  ctx.strokeStyle="#dffaff";

  ctx.lineWidth=9;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x-7,
    y+34
  );

  ctx.lineTo(
    x-7+legA,
    y+67
  );

  ctx.moveTo(
    x+7,
    y+34
  );

  ctx.lineTo(
    x+7+legB,
    y+67
  );

  ctx.stroke();


  /*
    tênis.
  */

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    x-7+legA,
    y+67
  );

  ctx.lineTo(
    x-18+legA,
    y+67
  );

  ctx.moveTo(
    x+7+legB,
    y+67
  );

  ctx.lineTo(
    x+18+legB,
    y+67
  );

  ctx.stroke();


  /*
    corpo.
  */

  ctx.fillStyle="#10253b";

  ctx.beginPath();

  ctx.roundRect(
    x-13,
    y-2,
    26,
    39,
    8
  );

  ctx.fill();

  ctx.strokeStyle="#5eeaff";

  ctx.lineWidth=2;

  ctx.stroke();


  /*
    braços.
  */

  ctx.strokeStyle="#e7fbff";

  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(
    x-11,
    y+6
  );

  ctx.lineTo(
    x-24+armA,
    y+31
  );

  ctx.moveTo(
    x+11,
    y+6
  );

  ctx.lineTo(
    x+24+armB,
    y+31
  );

  ctx.stroke();


  /*
    cabeça.
  */

  ctx.fillStyle="#f3ffff";

  ctx.beginPath();

  ctx.arc(
    x,
    y-17,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    visor.
  */

  ctx.fillStyle="#07101d";

  ctx.shadowBlur=8;

  ctx.shadowColor="#5eeaff";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y-18,
    12,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    núcleo.
  */

  ctx.fillStyle="#5eeaff";

  ctx.shadowBlur=16;

  ctx.shadowColor="#5eeaff";

  ctx.beginPath();

  ctx.arc(
    x,
    y+17,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


function drawSlidingRunner(
  x,
  y
){

  ctx.save();

  ctx.translate(
    x,
    y+28
  );

  ctx.rotate(
    -.05
  );

  ctx.shadowBlur=22;

  ctx.shadowColor="#5eeaff";

  /*
    pernas.
  */

  ctx.strokeStyle="#e7fbff";

  ctx.lineWidth=8;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -2,
    14
  );

  ctx.lineTo(
    24,
    25
  );

  ctx.moveTo(
    -5,
    14
  );

  ctx.lineTo(
    -28,
    22
  );

  ctx.stroke();


  /*
    corpo.
  */

  ctx.fillStyle="#10253b";

  ctx.fillRect(
    -25,
    -7,
    50,
    20
  );


  /*
    cabeça.
  */

  ctx.fillStyle="#f3ffff";

  ctx.beginPath();

  ctx.arc(
    26,
    -2,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    visor.
  */

  ctx.fillStyle="#07101d";

  ctx.beginPath();

  ctx.ellipse(
    29,
    -4,
    9,
    4,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   PARTICULAS DO CORREDOR
========================================================= */

function drawRunnerTrail(){

  var x=playerX();

  var y=playerY();

  ctx.save();

  ctx.globalAlpha=.20;

  ctx.strokeStyle=
    phaseData[currentPhase].accent;

  ctx.lineWidth=3;

  for(
    var i=1;
    i<=5;
    i++
  ){

    ctx.beginPath();

    ctx.moveTo(
      x-
      Math.sin(
        gameTime*10+i
      )*
      5,
      y+45+i*6
    );

    ctx.lineTo(
      x-
      Math.sin(
        gameTime*10+i
      )*
      5,
      y+55+i*15
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   DESENHO DOS OBJETOS
========================================================= */

function drawObjects(){

  /*
    Ordenação:
    objetos mais distantes primeiro.
  */

  var sorted=
    objects.slice().sort(
      function(a,b){
        return b.z-a.z;
      }
    );

  for(
    var i=0;
    i<sorted.length;
    i++
  ){

    var o=sorted[i];

    if(o.type==="coin")
      drawCoin(o);
    else
      drawObstacle(o);
  }
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!running)
    return;

  var dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  draw();

  if(running)
    requestAnimationFrame(loop);
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.save();

  if(shake>0){

    var amount=
      shake*7;

    ctx.translate(
      (Math.random()-.5)*amount,
      (Math.random()-.5)*amount
    );
  }

  drawBackground();

  drawCity();

  drawSpeedLines();

  drawRoad();

  drawObjects();

  drawRunnerTrail();

  drawRunner();

  drawParticles();

  ctx.restore();
}

   BOTÕES

again.addEventListener(

    phaseMenu.classList.add("show");

);


backMenu.addEventListener(

  }

  }
);


victoryMenu.addEventListener(

    hideScreens();

    updateMenu();

    menu.classList.add("show");
  }
);


nextPhase.addEventListener(
  "click",
  function(){

    if(currentPhase>=50)
      return;

    currentPhase++;

    if(
      currentPhase>
      unlockedPhase
    ){

      unlockedPhase=
        currentPhase;

      localStorage.setItem(
        "ultimoSegundoUnlocked",
        String(unlockedPhase)
      );
    }

    localStorage.setItem(
      "ultimoSegundoPhase",
      String(currentPhase)
    );

    startGame();
  }
);


soundButton.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    soundOn=!soundOn;

    soundButton.textContent=
      soundOn
      ? "🔊 SOM"
      : "🔇 SOM";

    if(soundOn){

      initAudio();

      if(master)
        master.gain.value=.32;

      tone(
        520,
        .10,
        "sine",
        .06,
        720
      );

    }else{

      if(master)
        master.gain.value=0;
    }
  }
);

   INICIALIZAÇÃO
========================================================= */

updateMenu();

buildPhaseMenu();

updateHUD();


/*
  Desenha uma tela inicial
  antes de começar.
*/

function idleDraw(){

  if(running)
    return;

  drawBackground();

  drawCity();

  drawRoad();
}

idleDraw();

})();
