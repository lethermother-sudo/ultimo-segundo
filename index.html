<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
  font-family:Arial,sans-serif;
  touch-action:none
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block
}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(24,220,255,.13),transparent 35%),
    linear-gradient(180deg,rgba(1,5,18,.42),rgba(1,3,10,.92))
}

.card{
  width:min(420px,92vw);
  padding:32px 24px;
  border:1px solid rgba(80,220,255,.4);
  border-radius:28px;
  text-align:center;
  background:rgba(4,10,27,.88);
  box-shadow:
    0 0 60px rgba(0,180,255,.22),
    inset 0 0 35px rgba(40,180,255,.04);
  backdrop-filter:blur(14px)
}

h1{
  margin:0 0 10px;
  color:#fff;
  font-size:44px;
  line-height:.95;
  letter-spacing:-2px;
  text-shadow:0 0 25px #19dfff
}

.sub{
  color:#9eb4cf;
  margin-bottom:26px;
  font-size:14px;
  line-height:1.5
}

button{
  border:0;
  border-radius:18px;
  padding:17px 40px;
  background:linear-gradient(90deg,#16dfff,#7b45ff);
  color:white;
  font-weight:900;
  font-size:18px;
  box-shadow:0 10px 30px rgba(35,190,255,.25);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent
}

button:active{
  transform:scale(.97)
}

#gameover{
  display:none
}

#hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  color:#fff
}

#score{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 15px);
  font-size:42px;
  font-weight:900;
  text-shadow:0 3px 15px #000
}

#coins{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 68px);
  font-size:18px;
  font-weight:900;
  color:#ffd83d;
  text-shadow:0 0 12px rgba(255,216,61,.4)
}

#speedHud{
  position:absolute;
  right:25px;
  top:calc(env(safe-area-inset-top) + 20px);
  font-size:15px;
  font-weight:900;
  color:#5eeaff;
  text-shadow:0 0 12px #5eeaff
}

#phaseHud{
  position:absolute;
  right:25px;
  top:calc(env(safe-area-inset-top) + 105px);
  font-size:13px;
  font-weight:900;
  color:#ffd83d
}

#comboHud{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 103px);
  font-size:15px;
  font-weight:900;
  color:#ff48dc;
  text-shadow:0 0 12px #ff48dc
}

#soundBtn{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 62px);
  pointer-events:auto;
  border:1px solid rgba(94,234,255,.45);
  border-radius:14px;
  padding:8px 12px;
  background:rgba(3,12,28,.8);
  color:#5eeaff;
  font-size:13px;
  font-weight:900
}

#hint{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  text-align:center;
  color:rgba(255,255,255,.58);
  font-size:12px
}

#flash{
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
  background:#fff;
  opacity:0
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="flash"></div>

<div id="hud">

  <div id="score">0</div>

  <div id="coins">● 0</div>

  <div id="comboHud">COMBO ×1</div>

  <div id="speedHud">VELOCIDADE 1.0x</div>

  <div id="phaseHud">FASE 1</div>

  <button id="soundBtn" type="button">🔊 SOM</button>

  <div id="hint">
    DESLIZE ← → PARA MUDAR DE FAIXA
  </div>

</div>


<div id="menu">

  <div class="card">

    <h1>ÚLTIMO<br>SEGUNDO</h1>

    <div class="sub">
      CORRA. DESVIE. SOBREVIVA.
    </div>

    <button id="play">
      JOGAR
    </button>

  </div>

</div>


<div id="gameover">

  <div class="card">

    <h1>FIM DE JOGO</h1>

    <div class="sub" id="finalScore">
      Pontuação: 0
    </div>

    <button id="again">
      JOGAR NOVAMENTE
    </button>

  </div>

</div>


<script>
(function(){

"use strict";


/* =====================================================
   ELEMENTOS
===================================================== */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var over=document.getElementById("gameover");

var play=document.getElementById("play");
var again=document.getElementById("again");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var comboEl=document.getElementById("comboHud");
var speedEl=document.getElementById("speedHud");
var phaseEl=document.getElementById("phaseHud");
var soundBtn=document.getElementById("soundBtn");
var finalEl=document.getElementById("finalScore");
var flash=document.getElementById("flash");


/* =====================================================
   TELA
===================================================== */

var W=0;
var H=0;
var dpr=1;

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   ESTADO
===================================================== */

var running=false;

var last=0;
var gameTime=0;

var score=0;
var coins=0;

var speed=.52;

var lane=1;
var targetLane=1;

var spawn=.8;
var coinSpawn=.4;

var objects=[];
var particles=[];
var streaks=[];
var sparks=[];

var combo=1;
var comboTimer=0;

var phase=1;

var shake=0;

var best=Number(
  localStorage.getItem("ultimoSegundoBest")||0
);


/* =====================================================
   AUDIO
===================================================== */

var audioCtx=null;

function audioStart(){

  try{

    var AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)return;

    if(!audioCtx){

      audioCtx=new AC();

    }

    if(
      audioCtx.state==="suspended"
    ){

      audioCtx.resume()
      .catch(function(){});

    }

  }catch(e){}

}


function sound(type){

  try{

    if(!audioCtx)return;

    if(
      audioCtx.state==="suspended"
    ){

      audioCtx.resume()
      .catch(function(){});

    }

    var o=
      audioCtx.createOscillator();

    var g=
      audioCtx.createGain();

    o.connect(g);
    g.connect(
      audioCtx.destination
    );

    var now=
      audioCtx.currentTime;


    if(type==="start"){

      o.type="sine";

      o.frequency.setValueAtTime(
        380,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        760,
        now+.18
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .16,
        now+.025
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.23
      );

      o.start(now);
      o.stop(now+.25);

    }


    else if(type==="coin"){

      o.type="sine";

      o.frequency.setValueAtTime(
        650,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        1050,
        now+.08
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .17,
        now+.012
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.14
      );

      o.start(now);
      o.stop(now+.16);

    }


    else if(type==="combo"){

      o.type="triangle";

      o.frequency.setValueAtTime(
        520,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        1250,
        now+.13
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .14,
        now+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.18
      );

      o.start(now);
      o.stop(now+.2);

    }


    else if(type==="hit"){

      o.type="sawtooth";

      o.frequency.setValueAtTime(
        180,
        now
      );

      o.frequency.exponentialRampToValueAtTime(
        42,
        now+.28
      );

      g.gain.setValueAtTime(
        .001,
        now
      );

      g.gain.exponentialRampToValueAtTime(
        .22,
        now+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        now+.3
      );

      o.start(now);
      o.stop(now+.32);

    }

  }catch(e){}

}


/* =====================================================
   HUD
===================================================== */

function updateHud(){

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  comboEl.textContent=
    "COMBO ×"+combo;

  speedEl.textContent=
    "VELOCIDADE "+
    (speed/.52).toFixed(1)+"x";

  phaseEl.textContent=
    "FASE "+phase;

}


/* =====================================================
   RESET
===================================================== */

function reset(){

  score=0;
  coins=0;

  speed=.52;

  lane=1;
  targetLane=1;

  spawn=.8;
  coinSpawn=.4;

  gameTime=0;

  combo=1;
  comboTimer=0;

  phase=1;

  shake=0;

  objects=[];
  particles=[];
  streaks=[];
  sparks=[];

  updateHud();

}


/* =====================================================
   COMEÇAR
===================================================== */

function start(){

  audioStart();

  sound("start");

  reset();

  running=true;

  menu.style.display="none";
  over.style.display="none";

  last=performance.now();

  requestAnimationFrame(loop);

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  if(!running)return;

  running=false;

  sound("hit");

  shake=18;

  flash.style.opacity=".18";

  setTimeout(function(){

    flash.style.opacity="0";

  },80);

  var s=
    Math.floor(score);

  if(s>best){

    best=s;

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );

  }

  finalEl.textContent=
    "Pontuação: "+
    s+
    " • Recorde: "+
    best;

  over.style.display="flex";

}


/* =====================================================
   BOTÕES
===================================================== */

function startButton(e){

  e.preventDefault();

  audioStart();

  start();

}


play.addEventListener(
  "click",
  startButton
);

play.addEventListener(
  "touchend",
  startButton,
  {passive:false}
);


again.addEventListener(
  "click",
  startButton
);

again.addEventListener(
  "touchend",
  startButton,
  {passive:false}
);


soundBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    audioStart();

    sound("start");

    soundBtn.textContent="🔊 SOM ON";

  },
  {passive:false}
);


/* =====================================================
   PISTA
===================================================== */

function roadY(z){

  var horizon=H*.39;

  return horizon+
    Math.pow(z,1.65)*
    (H*.68-horizon);

}


function roadHalf(z){

  return W*.055+
    Math.pow(z,1.12)*
    W*.48;

}


function laneX(l,z){

  var center=W/2;

  var half=roadHalf(z);

  return center+
    (l-1)*half*.62;

}


/* =====================================================
   FASES
===================================================== */

function updatePhase(){

  var newPhase=
    Math.min(
      5,
      1+
      Math.floor(score/500)
    );

  if(newPhase!==phase){

    phase=newPhase;

    combo=1;

    for(
      var i=0;
      i<30;
      i++
    ){

      particles.push({

        x:W/2,
        y:H*.38,

        vx:(Math.random()-.5)*400,
        vy:(Math.random()-.5)*300,

        life:.8,
        size:2+
          Math.random()*4,

        color:
          phase%2?
          "#21eaff":
          "#ff3cdb"

      });

    }

  }

}


/* =====================================================
   SPAWN OBSTÁCULOS
===================================================== */

function spawnObstacle(){

  var roll=Math.random();

  /*
    FASE 1
    obstáculos simples
  */

  if(phase===1 || roll<.28){

    objects.push({

      type:"ob",
      kind:"block",
      lane:
        Math.floor(
          Math.random()*3
        ),
      z:0

    });

    return;

  }


  /*
    BARREIRA DUPLA
    sempre deixa uma passagem
  */

  if(roll<.52){

    var safe=
      Math.floor(
        Math.random()*3
      );

    for(
      var l=0;
      l<3;
      l++
    ){

      if(l!==safe){

        objects.push({

          type:"ob",
          kind:"barrier",
          lane:l,
          z:0

        });

      }

    }

    return;

  }


  /*
    OBSTÁCULO ESPECIAL
  */

  var kinds=[
    "energy",
    "drone",
    "car",
    "tower"
  ];

  objects.push({

    type:"ob",

    kind:
      kinds[
        Math.floor(
          Math.random()*kinds.length
        )
      ],

    lane:
      Math.floor(
        Math.random()*3
      ),

    z:0

  });

}


/* =====================================================
   MOEDAS
===================================================== */

function spawnCoin(){

  var l=
    Math.floor(
      Math.random()*3
    );

  var amount=
    phase>=3 ? 4 : 3;


  for(
    var i=0;
    i<amount;
    i++
  ){

    objects.push({

      type:"coin",

      lane:l,

      z:
        -i*.13

    });

  }

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function burst(
  x,
  y,
  amount,
  color
){

  for(
    var i=0;
    i<amount;
    i++
  ){

    var a=
      Math.random()*
      Math.PI*2;

    var v=
      40+
      Math.random()*180;

    particles.push({

      x:x,
      y:y,

      vx:
        Math.cos(a)*v,

      vy:
        Math.sin(a)*v,

      life:
        .35+
        Math.random()*.45,

      size:
        1+
        Math.random()*4,

      color:color||
        "#5eeaff"

    });

  }

}


/* =====================================================
   ATUALIZAÇÃO
===================================================== */

function update(dt){

  gameTime+=dt;

  /*
    Pontuação
  */

  score+=
    speed*
    dt*
    120;


  /*
    Velocidade progressiva
  */

  speed=
    Math.min(
      .88,
      speed+
      dt*
      .012
    );


  updatePhase();


  /*
    Movimento lateral
  */

  lane+=
    (targetLane-lane)*
    (
      1-
      Math.exp(-dt*20)
    );


  /*
    Combo
  */

  comboTimer-=dt;

  if(comboTimer<=0){

    combo=1;

  }


  /*
    Spawn
  */

  spawn-=dt;

  if(spawn<=0){

    spawnObstacle();

    spawn=
      Math.max(
        .46,
        .90-speed*.38
      )+
      Math.random()*.25;

  }


  /*
    Moedas
  */

  coinSpawn-=dt;

  if(coinSpawn<=0){

    spawnCoin();

    coinSpawn=
      .55+
      Math.random()*.35;

  }


  /*
    Objetos
  */

  for(
    var i=
      objects.length-1;
    i>=0;
    i--
  ){

    var o=
      objects[i];


    o.z+=
      (
        speed*
        (
          1+
          o.z*.85
        )
      )*
      dt;


    /*
      Chegou no jogador
    */

    if(o.z>.90){

      var same=
        Math.abs(
          o.lane-lane
        )<.34;


      /*
        OBSTÁCULO
      */

      if(
        o.type==="ob" &&
        same
      ){

        var ox=
          laneX(
            o.lane,
            .96
          );

        var oy=
          roadY(.96);


        burst(
          ox,
          oy-30,
          30,
          "#ff315d"
        );

        gameOver();

        return;

      }


      /*
        MOEDA
      */

      if(
        o.type==="coin" &&
        same
      ){

        coins++;

        score+=
          12*combo;

        comboTimer=1.7;

        combo=
          Math.min(
            10,
            combo+1
          );

        if(combo>=3){

          sound("combo");

        }else{

          sound("coin");

        }

        burst(
          laneX(
            o.lane,
            .93
          ),
          roadY(.93)-30,
          12,
          "#ffd83d"
        );

        objects.splice(
          i,
          1
        );

        continue;

      }


      /*
        REMOVE
      */

      if(o.z>1.03){

        objects.splice(
          i,
          1
        );

      }

    }

  }


  /*
    Partículas
  */

  for(
    var j=
      particles.length-1;
    j>=0;
    j--
  ){

    var p=
      particles[j];

    p.life-=dt;

    p.x+=p.vx*dt;

    p.y+=p.vy*dt;

    p.vy+=120*dt;

    if(p.life<=0){

      particles.splice(
        j,
        1
      );

    }

  }


  /*
    Riscos de velocidade
  */

  if(speed>.62){

    if(
      Math.random()<
      dt*18
    ){

      streaks.push({

        x:
          Math.random()*W,

        y:
          H*.40+
          Math.random()*H*.5,

        length:
          20+
          Math.random()*70,

        speed:
          300+
          Math.random()*500,

        life:.22

      });

    }

  }


  for(
    var k=
      streaks.length-1;
    k>=0;
    k--
  ){

    var st=
      streaks[k];

    st.life-=dt;

    st.y+=
      st.speed*dt;

    if(st.life<=0){

      streaks.splice(
        k,
        1
      );

    }

  }


  updateHud();

}


/* =====================================================
   DESENHO PRINCIPAL
===================================================== */

function draw(){

  ctx.save();


  /*
    Tremor de impacto
  */

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );

    shake*=.88;

    if(shake<.2){
      shake=0;
    }

  }


  drawSky();

  drawCity();

  drawLights();

  drawRoad();

  drawStreaks();


  /*
    Objetos distantes primeiro
  */

  objects.sort(
    function(a,b){
      return b.z-a.z;
    }
  );


  for(
    var i=0;
    i<objects.length;
    i++
  ){

    if(
      objects[i].type==="coin"
    ){

      drawCoin(
        objects[i]
      );

    }else{

      drawObstacle(
        objects[i]
      );

    }

  }


  drawRunner();

  drawParticles();

  ctx.restore();

}


/* =====================================================
   CÉU
===================================================== */

function drawSky(){

  var g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  if(phase===1){

    g.addColorStop(
      0,
      "#020617"
    );

    g.addColorStop(
      .48,
      "#082c4a"
    );

    g.addColorStop(
      1,
      "#02040b"
    );

  }

  else if(phase===2){

    g.addColorStop(
      0,
      "#09021c"
    );

    g.addColorStop(
      .48,
      "#21135a"
    );

    g.addColorStop(
      1,
      "#03040c"
    );

  }

  else if(phase===3){

    g.addColorStop(
      0,
      "#071525"
    );

    g.addColorStop(
      .48,
      "#073f59"
    );

    g.addColorStop(
      1,
      "#05050d"
    );

  }

  else{

    g.addColorStop(
      0,
      "#17031c"
    );

    g.addColorStop(
      .48,
      "#3c123f"
    );

    g.addColorStop(
      1,
      "#05030a"
    );

  }


  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Lua/luz
  */

  var glow=
    ctx.createRadialGradient(
      W*.72,
      H*.22,
      10,
      W*.72,
      H*.22,
      150
    );

  glow.addColorStop(
    0,
    "rgba(60,220,255,.16)"
  );

  glow.addColorStop(
    1,
    "rgba(60,220,255,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    0,
    0,
    W,
    H*.55
  );

}


/* =====================================================
   CIDADE
===================================================== */

function drawCity(){

  var horizon=
    H*.39;


  /*
    prédios distantes
  */

  for(
    var i=0;
    i<28;
    i++
  ){

    var bw=
      24+
      ((i*43)%75);

    var bh=
      45+
      ((i*71)%175);

    var x=
      ((i*97)%(
        W+bw
      ))-bw;


    ctx.fillStyle=
      i%3===0
      ?
      "rgba(11,38,78,.92)"
      :
      "rgba(7,28,60,.88)";


    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );


    /*
      janelas
    */

    var light=
      i%4===0
      ?
      "rgba(255,61,198,.42)"
      :
      "rgba(42,220,255,.35)";


    ctx.fillStyle=light;


    for(
      var yy=
        horizon-bh+14;
      yy<horizon-5;
      yy+=17
    ){

      for(
        var xx=
          x+8;
        xx<x+bw-5;
        xx+=16
      ){

        if(
          ((xx+yy+i)%4)<2
        ){

          ctx.fillRect(
            xx,
            yy,
            4,
            6
          );

        }

      }

    }

  }


  /*
    linha do horizonte
  */

  ctx.strokeStyle=
    phase%2
    ?
    "#39eaff"
    :
    "#ff42d9";

  ctx.lineWidth=2;

  ctx.shadowBlur=18;

  ctx.shadowColor=
    phase%2
    ?
    "#39eaff"
    :
    "#ff42d9";


  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon
  );

  ctx.lineTo(
    W,
    horizon
  );

  ctx.stroke();

  ctx.shadowBlur=0;

}


/* =====================================================
   LUZES LATERAIS
===================================================== */

function drawLights(){

  var horizon=
    H*.39;


  for(
    var i=0;
    i<8;
    i++
  ){

    var z=
      ((i*.17+
        gameTime*speed*.35)
       %1);


    var y=
      roadY(z);

    var half=
      roadHalf(z);


    var size=
      3+
      z*8;


    /*
      esquerda
    */

    ctx.fillStyle=
      "#16dfff";

    ctx.shadowBlur=
      12;

    ctx.shadowColor=
      "#16dfff";


    ctx.fillRect(
      W/2-half-7,
      y-size,
      size,
      size*2
    );


    /*
      direita
    */

    ctx.fillStyle=
      "#ff3bd5";

    ctx.shadowColor=
      "#ff3bd5";


    ctx.fillRect(
      W/2+half+4,
      y-size,
      size,
      size*2
    );

  }


  ctx.shadowBlur=0;

}


/* =====================================================
   ESTRADA
===================================================== */

function drawRoad(){

  var horizon=
    H*.39;

  var bottom=H;


  var g=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      bottom
    );

  g.addColorStop(
    0,
    "#081726"
  );

  g.addColorStop(
    1,
    "#010307"
  );


  ctx.fillStyle=g;


  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.closePath();

  ctx.fill();


  /*
    bordas
  */

  ctx.strokeStyle=
    "#20dcff";

  ctx.lineWidth=3;

  ctx.shadowBlur=10;

  ctx.shadowColor=
    "#20dcff";


  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.stroke();


  ctx.shadowBlur=0;


  /*
    faixas
  */

  for(
    var l=1;
    l<3;
    l++
  ){

    ctx.strokeStyle=
      "rgba(80,220,255,.45)";

    ctx.lineWidth=2;

    ctx.setLineDash(
      [18,18]
    );


    ctx.beginPath();

    ctx.moveTo(
      laneX(
        l-.5,
        0
      ),
      horizon
    );

    ctx.lineTo(
      W/2+
      (l-1.5)*W*.5,
      bottom
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  /*
    linhas horizontais
  */

  var offset=
    (gameTime*
      speed*
      .55)% .1;


  for(
    var z=.04-offset;
    z<1;
    z+=.10
  ){

    if(z<0)continue;

    var y=
      roadY(z);

    var half=
      roadHalf(z);


    ctx.strokeStyle=
      "rgba(50,190,255,.14)";

    ctx.lineWidth=
      1+
      z*1.5;


    ctx.beginPath();

    ctx.moveTo(
      W/2-half,
      y
    );

    ctx.lineTo(
      W/2+half,
      y
    );

    ctx.stroke();

  }

}


/* =====================================================
   RISCOS DE VELOCIDADE
===================================================== */

function drawStreaks(){

  for(
    var i=0;
    i<streaks.length;
    i++
  ){

    var s=
      streaks[i];

    ctx.globalAlpha=
      Math.max(
        0,
        s.life*4
      );

    ctx.strokeStyle=
      "#55eaff";

    ctx.lineWidth=1.5;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x,
      s.y+s.length
    );

    ctx.stroke();

  }

  ctx.globalAlpha=1;

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacle(o){

  var z=o.z;

  if(z<0)return;


  var x=
    laneX(
      o.lane,
      z
    );

  var y=
    roadY(z);

  var s=
    12+
    z*78;


  ctx.save();

  ctx.translate(
    x,
    y-s*.55
  );


  /*
    BLOCO
  */

  if(o.kind==="block"){

    ctx.fillStyle=
      "#ff315d";

    ctx.shadowBlur=12;

    ctx.shadowColor=
      "#ff315d";


    ctx.fillRect(
      -s*.58,
      -s*.36,
      s*1.16,
      s*.72
    );


    ctx.fillStyle=
      "#270b1b";

    ctx.fillRect(
      -s*.40,
      -s*.18,
      s*.80,
      s*.13
    );


    ctx.fillStyle=
      "#ffd5df";

    ctx.globalAlpha=.85;

    ctx.fillRect(
      -s*.33,
      s*.06,
      s*.66,
      s*.07
    );

  }


  /*
    BARREIRA
  */

  else if(o.kind==="barrier"){

    ctx.fillStyle=
      "#ff3b83";

    ctx.shadowBlur=15;

    ctx.shadowColor=
      "#ff3b83";


    ctx.beginPath();

    ctx.moveTo(
      -s*.62,
      s*.30
    );

    ctx.lineTo(
      -s*.48,
      -s*.40
    );

    ctx.lineTo(
      s*.48,
      -s*.40
    );

    ctx.lineTo(
      s*.62,
      s*.30
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle=
      "#160c20";

    ctx.fillRect(
      -s*.30,
      -s*.10,
      s*.60,
      s*.12
    );

  }


  /*
    ENERGIA
  */

  else if(o.kind==="energy"){

    ctx.strokeStyle=
      "#c44cff";

    ctx.lineWidth=
      Math.max(
        2,
        s*.09
      );

    ctx.shadowBlur=18;

    ctx.shadowColor=
      "#c44cff";


    ctx.beginPath();

    ctx.moveTo(
      0,
      -s*.65
    );

    ctx.lineTo(
      s*.45,
      0
    );

    ctx.lineTo(
      0,
      s*.45
    );

    ctx.lineTo(
      -s*.45,
      0
    );

    ctx.closePath();

    ctx.stroke();


    ctx.fillStyle=
      "#5deaff";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s*.12,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /*
    DRONE
  */

  else if(o.kind==="drone"){

    ctx.fillStyle=
      "#ff9d2e";

    ctx.shadowBlur=15;

    ctx.shadowColor=
      "#ff9d2e";


    ctx.beginPath();

    ctx.moveTo(
      -s*.62,
      0
    );

    ctx.lineTo(
      -s*.30,
      -s*.28
    );

    ctx.lineTo(
      s*.30,
      -s*.28
    );

    ctx.lineTo(
      s*.62,
      0
    );

    ctx.lineTo(
      s*.30,
      s*.25
    );

    ctx.lineTo(
      -s*.30,
      s*.25
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle=
      "#fff2bd";

    ctx.fillRect(
      -s*.22,
      -s*.04,
      s*.44,
      s*.07
    );

  }


  /*
    CARRO
  */

  else if(o.kind==="car"){

    ctx.fillStyle=
      "#e72cff";

    ctx.shadowBlur=14;

    ctx.shadowColor=
      "#e72cff";


    ctx.beginPath();

    ctx.roundRect(
      -s*.60,
      -s*.25,
      s*1.20,
      s*.52,
      s*.10
    );

    ctx.fill();


    ctx.fillStyle=
      "#071426";

    ctx.beginPath();

    ctx.roundRect(
      -s*.32,
      -s*.38,
      s*.64,
      s*.25,
      s*.06
    );

    ctx.fill();


    ctx.fillStyle=
      "#55edff";

    ctx.fillRect(
      -s*.38,
      s*.06,
      s*.76,
      s*.07
    );

  }


  /*
    TORRE
  */

  else if(o.kind==="tower"){

    ctx.fillStyle=
      "#5d4cff";

    ctx.shadowBlur=15;

    ctx.shadowColor=
      "#5d4cff";


    ctx.fillRect(
      -s*.32,
      -s*.72,
      s*.64,
      s*1.05
    );


    ctx.fillStyle=
      "#45edff";


    for(
      var i=0;
      i<3;
      i++
    ){

      ctx.fillRect(
        -s*.18,
        -s*.55+
        i*s*.27,
        s*.36,
        s*.07
      );

    }

  }


  ctx.restore();

}


/* =====================================================
   MOEDA
===================================================== */

function drawCoin(o){

  var z=o.z;

  if(z<0)return;


  var x=
    laneX(
      o.lane,
      z
    );

  var y=
    roadY(z)-
    20-
    z*28;

  var r=
    5+
    z*17;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  var pulse=
    1+
    Math.sin(
      gameTime*8+
      o.lane
    )*.08;


  ctx.scale(
    pulse,
    pulse
  );


  ctx.fillStyle=
    "#ffd83d";

  ctx.shadowBlur=18;

  ctx.shadowColor=
    "#ffd83d";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=
    "#fff4a0";

  ctx.shadowBlur=0;


  ctx.beginPath();

  ctx.arc(
    -r*.28,
    -r*.28,
    r*.27,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}

/* =====================================================
   PARTÍCULAS
===================================================== */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=
      particles[i];


    ctx.globalAlpha=
      Math.max(
        0,
        p.life*2
      );


    ctx.fillStyle=
      p.color;


    ctx.shadowBlur=8;

    ctx.shadowColor=
      p.color;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

}


/* =====================================================
   LOOP
===================================================== */

function loop(t){

  if(!running)return;

  var dt=
    Math.min(
      .035,
      (t-last)/1000||0
    );

  last=t;

  update(dt);

  if(running){

    draw();

    requestAnimationFrame(
      loop
    );

  }

}


/* =====================================================
   CONTROLE POR GESTO
===================================================== */

var sx=0;
var sy=0;


canvas.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    sx=t.clientX;
    sy=t.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    var dx=
      t.clientX-sx;

    var dy=
      t.clientY-sy;


    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<25
    ){

      return;

    }


    /*
      Apenas esquerda/direita.
    */

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0){

        targetLane=
          Math.min(
            2,
            targetLane+1
          );

      }else{

        targetLane=
          Math.max(
            0,
            targetLane-1
          );

      }

    }

  },
  {passive:true}
);


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(!running)return;


    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){

      targetLane=
        Math.max(
          0,
          targetLane-1
        );

    }


    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){

      targetLane=
        Math.min(
          2,
          targetLane+1
        );

    }

  }
);


/* =====================================================
   PRIMEIRO FRAME
===================================================== */

draw();

})();
</script>
