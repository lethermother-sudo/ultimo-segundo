<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
  font-family:Arial,sans-serif;
  touch-action:none
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block
}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(
    180deg,
    rgba(1,5,18,.45),
    rgba(1,3,10,.88)
  )
}

.card{
  width:min(420px,92vw);
  padding:30px 24px;
  border:1px solid rgba(80,220,255,.35);
  border-radius:26px;
  text-align:center;
  background:rgba(4,10,27,.86);
  box-shadow:0 0 50px rgba(0,180,255,.2);
  backdrop-filter:blur(12px)
}

h1{
  margin:0 0 8px;
  color:#fff;
  font-size:44px;
  letter-spacing:-2px;
  text-shadow:0 0 25px #19dfff
}

.sub{
  color:#9eb4cf;
  margin-bottom:25px;
  font-size:14px
}

button{
  border:0;
  border-radius:18px;
  padding:17px 38px;
  background:linear-gradient(90deg,#16dfff,#7b45ff);
  color:white;
  font-weight:900;
  font-size:18px;
  box-shadow:0 10px 30px rgba(35,190,255,.25);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent
}

button:active{
  transform:scale(.97)
}

#gameover{
  display:none
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff
}

#score{
  position:absolute;
  left:25px;
  top:calc(env(safe-area-inset-top) + 15px);
  font-size:42px;
  font-weight:900;
  text-shadow:0 3px 15px #000
}

#coins{
  position:absolute;
  left:27px;
  top:calc(env(safe-area-inset-top) + 68px);
  font-size:18px;
  font-weight:900;
  color:#ffd83d
}

#hint{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:12px
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="score">0</div>

  <div id="coins">● 0</div>

  <button
    id="soundBtn"
    type="button"
    style="
      position:absolute;
      right:22px;
      top:calc(env(safe-area-inset-top) + 68px);
      pointer-events:auto;
      border:1px solid rgba(94,234,255,.45);
      border-radius:14px;
      padding:8px 12px;
      background:rgba(3,12,28,.8);
      color:#5eeaff;
      font-size:13px;
      font-weight:900
    "
  >🔊 SOM</button>

  <div
    id="phaseHud"
    style="
      position:absolute;
      right:25px;
      top:calc(env(safe-area-inset-top) + 105px);
      font-size:13px;
      font-weight:900;
      color:#ffd83d
    "
  >FASE 1</div>

  <div
    id="speedHud"
    style="
      position:absolute;
      right:25px;
      top:calc(env(safe-area-inset-top) + 20px);
      font-size:15px;
      font-weight:900;
      color:#5eeaff
    "
  >VELOCIDADE 1.0x</div>

  <div id="hint">
    DESLIZE ← → PARA MUDAR DE FAIXA • DESVIE DOS OBSTÁCULOS
  </div>

</div>

<div id="menu">

  <div class="card">

    <h1>ÚLTIMO<br>SEGUNDO</h1>

    <div class="sub">
      CORRA. DESVIE. SOBREVIVA.
    </div>

    <button id="play">
      JOGAR
    </button>

  </div>

</div>

<div id="gameover">

  <div class="card">

    <h1>FIM DE JOGO</h1>

    <div class="sub" id="finalScore">
      Pontuação: 0
    </div>

    <button id="again">
      JOGAR NOVAMENTE
    </button>

  </div>

</div>

<script>
(function(){

"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var over=document.getElementById("gameover");

var play=document.getElementById("play");
var again=document.getElementById("again");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var soundBtn=document.getElementById("soundBtn");
var speedEl=document.getElementById("speedHud");
var phaseEl=document.getElementById("phaseHud");
var finalEl=document.getElementById("finalScore");

var W=0;
var H=0;
var dpr=1;

var running=false;
var last=0;
var gameTime=0;

var audioCtx=null;
var engineOsc=null;
var engineGain=null;
var engineFilter=null;

var score=0;
var coins=0;

var speed=.52;

var lane=1;
var targetLane=1;

var jump=0;

var spawn=0;
var coinSpawn=0;

var objects=[];
var particles=[];

var best=Number(
  localStorage.getItem("ultimoSegundoBest")||0
);


/* =========================
   TELA
========================= */

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   RESET
========================= */

function reset(){

  score=0;
  coins=0;

  speed=.52;

  lane=1;
  targetLane=1;

  gameTime=0;

  jump=0;

  spawn=.8;
  coinSpawn=.35;

  objects=[];
  particles=[];

  updateHud();
}


/* =========================
   HUD
========================= */

function updateHud(){

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  if(speedEl){

    speedEl.textContent=
      "VELOCIDADE "+
      (speed/.52).toFixed(1)+
      "x";

  }

  if(phaseEl){

    phaseEl.textContent=
      "FASE "+
      (
        1+
        Math.min(
          4,
          Math.floor(score/500)
        )
      );

  }

}


/* =========================
   AUDIO
========================= */

function audioStart(){

  try{

    var AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)return false;

    if(!audioCtx){

      audioCtx=
        new AC();

    }

    if(
      audioCtx.state==="suspended" &&
      audioCtx.resume
    ){

      audioCtx
        .resume()
        .catch(function(){});

    }

    /*
      Motor contínuo fica SILENCIOSO.
      Os sons são somente eventos.
    */

    if(!engineOsc){

      var buffer=
        audioCtx.createBuffer(
          1,
          audioCtx.sampleRate,
          audioCtx.sampleRate
        );

      var data=
        buffer.getChannelData(0);

      for(
        var i=0;
        i<data.length;
        i++
      ){

        data[i]=
          Math.random()*2-1;

      }

      engineOsc=
        audioCtx.createBufferSource();

      engineOsc.buffer=
        buffer;

      engineOsc.loop=true;

      engineFilter=
        audioCtx.createBiquadFilter();

      engineFilter.type=
        "lowpass";

      engineFilter.frequency.value=
        600;

      engineGain=
        audioCtx.createGain();

      engineGain.gain.value=
        0;

      engineOsc
        .connect(engineFilter);

      engineFilter
        .connect(engineGain);

      engineGain
        .connect(audioCtx.destination);

      engineOsc.start(0);

    }

    return true;

  }catch(e){

    return false;

  }

}


function sound(type){

  try{

    if(!audioCtx)return;

    if(
      audioCtx.state==="suspended" &&
      audioCtx.resume
    ){

      audioCtx
        .resume()
        .catch(function(){});

    }

    var o=
      audioCtx.createOscillator();

    var g=
      audioCtx.createGain();

    o.connect(g);
    g.connect(
      audioCtx.destination
    );

    var now=
      audioCtx.currentTime;


    /* SOM DE INÍCIO */

    if(type==="start"){

      o.type="sine";

      o.frequency
        .setValueAtTime(
          420,
          now
        );

      o.frequency
        .exponentialRampToValueAtTime(
          760,
          now+.16
        );

      g.gain
        .setValueAtTime(
          .001,
          now
        );

      g.gain
        .exponentialRampToValueAtTime(
          .18,
          now+.025
        );

      g.gain
        .exponentialRampToValueAtTime(
          .001,
          now+.22
        );

      o.start(now);
      o.stop(now+.24);

    }


    /* MOEDA */

    else if(type==="coin"){

      o.type="sine";

      o.frequency
        .setValueAtTime(
          650,
          now
        );

      o.frequency
        .exponentialRampToValueAtTime(
          1050,
          now+.10
        );

      g.gain
        .setValueAtTime(
          .001,
          now
        );

      g.gain
        .exponentialRampToValueAtTime(
          .18,
          now+.015
        );

      g.gain
        .exponentialRampToValueAtTime(
          .001,
          now+.16
        );

      o.start(now);
      o.stop(now+.18);

    }


    /* PULO */

    else if(type==="jump"){

      o.type="square";

      o.frequency
        .setValueAtTime(
          230,
          now
        );

      o.frequency
        .exponentialRampToValueAtTime(
          560,
          now+.13
        );

      g.gain
        .setValueAtTime(
          .001,
          now
        );

      g.gain
        .exponentialRampToValueAtTime(
          .10,
          now+.015
        );

      g.gain
        .exponentialRampToValueAtTime(
          .001,
          now+.17
        );

      o.start(now);
      o.stop(now+.19);

    }


    /* BATIDA */

    else if(type==="hit"){

      o.type="sawtooth";

      o.frequency
        .setValueAtTime(
          180,
          now
        );

      o.frequency
        .exponentialRampToValueAtTime(
          48,
          now+.28
        );

      g.gain
        .setValueAtTime(
          .001,
          now
        );

      g.gain
        .exponentialRampToValueAtTime(
          .20,
          now+.02
        );

      g.gain
        .exponentialRampToValueAtTime(
          .001,
          now+.30
        );

      o.start(now);
      o.stop(now+.32);

    }

  }catch(e){}

}


/* =========================
   INÍCIO
========================= */

function start(){

  audioStart();

  if(
    engineGain &&
    audioCtx
  ){

    engineGain.gain
      .setValueAtTime(
        0,
        audioCtx.currentTime
      );

  }

  reset();

  running=true;

  menu.style.display=
    "none";

  over.style.display=
    "none";

  last=
    performance.now();

  requestAnimationFrame(
    loop
  );

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(!running)return;

  if(
    engineGain &&
    audioCtx
  ){

    engineGain.gain
      .setValueAtTime(
        0,
        audioCtx.currentTime
      );

  }

  running=false;

  var s=
    Math.floor(score);

  if(s>best){

    best=s;

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );

  }

  finalEl.textContent=
    "Pontuação: "+
    s+
    " • Recorde: "+
    best;

  over.style.display=
    "flex";

}


/* =========================
   BOTÕES
========================= */

play.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    audioStart();

    sound("start");

    start();

  }
);

again.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    start();

  }
);

play.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    audioStart();

    sound("start");

    start();

  },
  {passive:false}
);

again.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    start();

  },
  {passive:false}
);


/* =========================
   BOTÃO SOM
========================= */

function activateSound(e){

  if(e){

    e.preventDefault();
    e.stopPropagation();

  }

  audioStart();

  sound("start");

  if(soundBtn){

    soundBtn.textContent=
      "🔊 SOM ON";

  }

}

if(soundBtn){

  soundBtn.addEventListener(
    "pointerdown",
    activateSound,
    {passive:false}
  );

  soundBtn.addEventListener(
    "touchstart",
    activateSound,
    {passive:false}
  );

  soundBtn.addEventListener(
    "click",
    activateSound
  );

}


/* =========================
   PISTA
========================= */

function roadY(z){

  var horizon=
    H*.39;

  return horizon+
    Math.pow(z,1.65)*
    (H*.68-horizon);

}


function roadHalf(z){

  return W*.055+
    Math.pow(z,1.12)*
    W*.48;

}


function laneX(l,z){

  var center=
    W/2;

  var half=
    roadHalf(z);

  return center+
    (l-1)*
    half*
    .62;

}


/* =========================
   OBSTÁCULOS
========================= */

function spawnObstacle(){

  var pattern=
    Math.random();


  /*
    DUAS FAIXAS BLOQUEADAS.
    SEMPRE EXISTE UMA FAIXA SEGURA.
  */

  if(pattern<.25){

    var safe=
      Math.floor(
        Math.random()*3
      );

    for(
      var l=0;
      l<3;
      l++
    ){

      if(l!==safe){

        objects.push({

          type:"ob",
          lane:l,
          z:0,
          kind:"gate"

        });

      }

    }

  }


  /*
    OBSTÁCULO DE TRÂNSITO
  */

  else if(pattern<.50){

    objects.push({

      type:"ob",
      lane:
        Math.floor(
          Math.random()*3
        ),
      z:0,
      kind:"traffic"

    });

  }


  /*
    COLUNA DE ENERGIA
  */

  else if(pattern<.72){

    objects.push({

      type:"ob",
      lane:
        Math.floor(
          Math.random()*3
        ),
      z:0,
      kind:"column"

    });

  }


  /*
    DRONE
  */

  else{

    objects.push({

      type:"ob",
      lane:
        Math.floor(
          Math.random()*3
        ),
      z:0,
      kind:"drone"

    });

  }

}


/* =========================
   MOEDAS
========================= */

function spawnCoin(){

  var l=
    Math.floor(
      Math.random()*3
    );

  var trail=
    Math.random()<.35;

  objects.push({

    type:"coin",
    lane:l,
    z:0

  });

  if(trail){

    objects.push({

      type:"coin",
      lane:l,
      z:-.13

    });

    objects.push({

      type:"coin",
      lane:l,
      z:-.26

    });

  }

}


/* =========================
   PARTICULAS
========================= */

function addBurst(x,y,n){

  for(
    var i=0;
    i<n;
    i++
  ){

    var a=
      Math.random()*
      Math.PI*2;

    var v=
      30+
      Math.random()*100;

    particles.push({

      x:x,
      y:y,

      vx:
        Math.cos(a)*v,

      vy:
        Math.sin(a)*v,

      life:.5

    });

  }

}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(dt){

  gameTime+=dt;

  score+=
    speed*
    dt*
    120;

  speed=
    Math.min(
      .82,
      speed+
      dt*.012
    );


  /*
    Movimento lateral suave.
  */

  lane+=
    (targetLane-lane)*
    (
      1-
      Math.exp(-dt*20)
    );


  if(jump>0){

    jump=
      Math.max(
        0,
        jump-dt
      );

  }


  /* OBSTÁCULOS */

  spawn-=dt;

  if(spawn<=0){

    spawnObstacle();

    spawn=
      Math.max(
        .48,
        .92-speed*.34
      )+
      Math.random()*.28;

  }


  /* MOEDAS */

  coinSpawn-=dt;

  if(coinSpawn<=0){

    spawnCoin();

    coinSpawn=
      .38+
      Math.random()*.38;

  }


  /* OBJETOS */

  for(
    var i=
      objects.length-1;
    i>=0;
    i--
  ){

    var o=
      objects[i];

    o.z+=
      (
        speed*
        (
          1+
          o.z*.9
        )
      )*
      dt;


    if(o.z>.90){

      var same=
        Math.abs(
          o.lane-lane
        )<.34;


      /*
        COLISÃO
      */

      if(
        o.type==="ob" &&
        same &&
        jump<.38
      ){

        var x=
          laneX(
            o.lane,
            .96
          );

        var y=
          roadY(.96);

        addBurst(
          x,
          y,
          18
        );

        sound("hit");

        gameOver();

        return;

      }


      /*
        MOEDA
      */

      if(
        o.type==="coin" &&
        same
      ){

        coins++;

        score+=12;

        addBurst(
          laneX(
            o.lane,
            .93
          ),
          roadY(.93)-28,
          8
        );

        sound("coin");

        objects.splice(
          i,
          1
        );

        continue;

      }


      /*
        REMOVE OBJETO QUE PASSOU
      */

      if(o.z>1.01){

        objects.splice(
          i,
          1
        );

      }

    }

  }


  /* PARTICULAS */

  for(
    var j=
      particles.length-1;
    j>=0;
    j--
  ){

    var p=
      particles[j];

    p.life-=dt;

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      110*dt;

    if(p.life<=0){

      particles.splice(
        j,
        1
      );

    }

  }


  updateHud();

}


/* =========================
   DESENHO
========================= */

function draw(){

  var g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  g.addColorStop(
    0,
    "#020617"
  );

  g.addColorStop(
    .45,
    "#092b4a"
  );

  g.addColorStop(
    1,
    "#02040b"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  drawCity();

  drawRoad();


  objects.sort(
    function(a,b){

      return b.z-a.z;

    }
  );


  for(
    var i=0;
    i<objects.length;
    i++
  ){

    var o=
      objects[i];

    if(o.type==="coin"){

      drawCoin(o);

    }else{

      drawObstacle(o);

    }

  }


  drawRunner();


  for(
    var j=0;
    j<particles.length;
    j++
  ){

    var p=
      particles[j];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life*2
      );

    ctx.fillStyle=
      "#62eaff";

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );

  }

  ctx.globalAlpha=1;

}


/* =========================
   CIDADE
========================= */

function drawCity(){

  var horizon=
    H*.39;

  ctx.fillStyle=
    "rgba(10,30,65,.7)";


  for(
    var i=0;
    i<18;
    i++
  ){

    var bw=
      30+
      ((i*37)%70);

    var bh=
      35+
      ((i*61)%150);

    var x=
      (i*83)%W;


    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );


    ctx.fillStyle=
      "rgba(38,208,255,.35)";


    for(
      var y=
        horizon-bh+12;
      y<horizon-5;
      y+=18
    ){

      ctx.fillRect(
        x+7,
        y,
        4,
        6
      );

    }


    ctx.fillStyle=
      "rgba(10,30,65,.7)";

  }


  ctx.fillStyle=
    "#4feaff";

  ctx.shadowBlur=18;
  ctx.shadowColor=
    "#4feaff";

  ctx.fillRect(
    0,
    horizon,
    W,
    2
  );

  ctx.shadowBlur=0;

}


/* =========================
   PISTA
========================= */

function drawRoad(){

  var horizon=
    H*.39;

  var bottom=
    H;


  var p=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      bottom
    );

  p.addColorStop(
    0,
    "#071321"
  );

  p.addColorStop(
    1,
    "#010307"
  );


  ctx.fillStyle=p;


  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.closePath();

  ctx.fill();


  /*
    BORDAS
  */

  ctx.strokeStyle=
    "#20dcff";

  ctx.lineWidth=3;

  ctx.shadowBlur=0;


  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.055,
    horizon
  );

  ctx.lineTo(
    W/2-W*.5,
    bottom
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    W/2+W*.055,
    horizon
  );

  ctx.lineTo(
    W/2+W*.5,
    bottom
  );

  ctx.stroke();


  /*
    FAIXAS
  */

  for(
    var l=1;
    l<3;
    l++
  ){

    ctx.strokeStyle=
      "rgba(80,220,255,.45)";

    ctx.lineWidth=2;

    ctx.setLineDash(
      [18,18]
    );


    ctx.beginPath();

    ctx.moveTo(
      laneX(
        l-.5,
        0
      ),
      horizon
    );

    ctx.lineTo(
      W/2+
      (l-1.5)*
      W*.5,
      bottom
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  /*
    GRADE DA PISTA
  */

  for(
    var z=.08;
    z<1;
    z+=.1
  ){

    var y=
      roadY(z);

    var half=
      roadHalf(z);

    ctx.strokeStyle=
      "rgba(40,180,255,.14)";

    ctx.beginPath();

    ctx.moveTo(
      W/2-half,
      y
    );

    ctx.lineTo(
      W/2+half,
      y
    );

    ctx.stroke();

  }

}

/* =========================

========================= */

function drawCoin(o){

  var z=o.z;

    laneX(
      o.lane,
      z
    );

  var y=
    roadY(z)-
    20-
    z*28;

  var r=

    z*16;


  ctx.save();

  ctx.translate(
    x,
    y

  ctx.fillStyle=
    "#ffd83d";

  ctx.shadowBlur=6;

  ctx.shadowColor=
    "#ffd83d";


  ctx.beginPath();

  ctx.arc(
    0,
    0,

    0,

  );

  ctx.fillStyle=

    -r*.25,

  );

  ctx.fill();


  ctx.restore();

}

/* =========================
   LOOP
========================= */

function loop(t){

  if(!running)return;

  var dt=
    Math.min(
      .035,
      (t-last)/1000||0
    );

  last=t;

  update(dt);

  if(running){

    draw();

  }

  if(running){

    requestAnimationFrame(
      loop
    );

  }

}


/* =========================
   CONTROLES TOUCH
========================= */

var sx=0;
var sy=0;


canvas.addEventListener(
  "touchstart",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    sx=
      t.clientX;

    sy=
      t.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    var t=
      e.changedTouches[0];

    var dx=
      t.clientX-sx;

    var dy=
      t.clientY-sy;


    /*
      SÓ MOVIMENTO LATERAL.
    */

    if(
      Math.abs(dx)<25
    ){

      return;

    }


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0){

        targetLane=
          Math.min(
            2,
            targetLane+1
          );

      }else{

        targetLane=
          Math.max(
            0,
            targetLane-1
          );

      }

    }

  },
  {passive:true}
);


/* =========================
   TECLADO
========================= */

window.addEventListener(
  "keydown",
  function(e){

    if(!running)return;


    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){

      targetLane=
        Math.max(
          0,
          targetLane-1
        );

    }


    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){

      targetLane=
        Math.min(
          2,
          targetLane+1
        );

    }

  }
);


/* =========================
   PRIMEIRO DESENHO
========================= */

draw();

})();
