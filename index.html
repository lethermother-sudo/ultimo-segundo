<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Último Segundo V80</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03040b;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
  color:#fff;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{
  display:none!important;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(0,220,255,.16),
      transparent 38%
    ),
    linear-gradient(
      #040512,
      #09051b
    );
}

.logo{
  font-size:11px;
  letter-spacing:7px;
  opacity:.6;
  margin-bottom:15px;
}

.title{
  text-align:center;
  font-size:44px;
  line-height:.92;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:
    0 0 12px rgba(0,230,255,.7),
    0 0 35px rgba(0,230,255,.35);
}

.subtitle{
  margin-top:17px;
  font-size:10px;
  letter-spacing:4px;
  opacity:.65;
}

.version{
  margin-top:18px;
  font-size:11px;
  letter-spacing:5px;
  color:#00eaff;
}

button{
  color:#fff;
  border:0;
  font-weight:900;
  letter-spacing:2px;
  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00d9ff,
      #6737ff
    );

  box-shadow:
    0 0 25px rgba(0,220,255,.25);
}

button:active{
  transform:scale(.97);
}

.mainBtn{
  width:245px;
  padding:18px;
  margin-top:36px;
  font-size:16px;
}

.smallBtn{
  width:195px;
  padding:14px;
  margin-top:12px;
  font-size:11px;
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:
    calc(10px + env(safe-area-inset-top))
    11px
    0;
  pointer-events:none;
}

.hud{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:7px;
}

.hudBox{
  min-width:76px;
  padding:7px 9px;
  border-radius:11px;

  background:
    rgba(0,0,15,.64);

  border:
    1px solid
    rgba(0,235,255,.28);

  backdrop-filter:blur(8px);
}

.hudLabel{
  font-size:7px;
  letter-spacing:2px;
  opacity:.55;
}

.hudValue{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

.centerHud{
  min-width:130px;
  text-align:center;
}

#phaseName{
  font-size:9px;
  letter-spacing:2px;
}

#worldName{
  margin-top:4px;
  font-size:7px;
  letter-spacing:2px;
  opacity:.55;
}

#target{
  margin-top:4px;
  font-size:8px;
  opacity:.5;
}

#phaseMenu{
  justify-content:flex-start;
  padding:
    calc(35px + env(safe-area-inset-top))
    14px
    30px;

  overflow:auto;
}

.phaseTitle{
  font-size:25px;
  font-weight:900;
}

.phaseSubtitle{
  margin-top:8px;
  margin-bottom:20px;
  font-size:9px;
  letter-spacing:3px;
  opacity:.5;
}

.phaseGrid{
  width:min(440px,95vw);

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;
}

.phaseBtn{
  height:52px;
  padding:0;
  margin:0;

  border-radius:10px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:none;
}

.phaseBtn.open{
  background:
    linear-gradient(
      135deg,
      #00bde8,
      #5730d8
    );
}

.phaseBtn.lock{
  opacity:.22;
}

.phaseInfo{
  margin-top:17px;
  font-size:9px;
  letter-spacing:2px;
  opacity:.5;
  text-align:center;
}

.result{
  text-align:center;
}

.resultTitle{
  font-size:38px;
  font-weight:900;
  text-shadow:
    0 0 20px #00eaff;
}

.resultText{
  margin-top:15px;
  font-size:12px;
  line-height:1.9;
  opacity:.75;
}

</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- HUD -->

<div id="hud" class="hidden">

  <div class="hud">

    <div class="hudBox">

      <div class="hudLabel">
        PONTOS
      </div>

      <div
        class="hudValue"
        id="score"
      >
        0
      </div>

    </div>


    <div class="hudBox centerHud">

      <div id="phaseName">
        FASE 1
      </div>

      <div id="worldName">
        CIDADE NEON
      </div>

      <div id="target">
        META 1200
      </div>

    </div>


    <div class="hudBox">

      <div class="hudLabel">
        MOEDAS
      </div>

      <div
        class="hudValue"
        id="coins"
      >
        0
      </div>

    </div>

  </div>

</div>


<!-- MENU -->

<div
  id="menu"
  class="screen"
>

  <div class="logo">
    RUNNER EXPERIENCE
  </div>

  <div class="title">
    ÚLTIMO<br>
    SEGUNDO
  </div>

  <div class="subtitle">
    CORRA • DESVIE • SOBREVIVA
  </div>

  <div class="version">
    V80 • 50 FASES
  </div>

  <button
    id="play"
    class="mainBtn"
  >
    JOGAR
  </button>

  <button
    id="phases"
    class="smallBtn"
  >
    FASES
  </button>

</div>


<!-- FASES -->

<div
  id="phaseMenu"
  class="screen hidden"
>

  <div class="phaseTitle">
    SELECIONE A FASE
  </div>

  <div class="phaseSubtitle">
    50 FASES • 10 AMBIENTES
  </div>

  <div
    id="phaseGrid"
    class="phaseGrid"
  ></div>

  <div class="phaseInfo">
    DESBLOQUEADAS:
    <span id="unlockedText">1</span>/50
  </div>

  <button
    id="backMenu"
    class="smallBtn"
  >
    VOLTAR
  </button>

</div>


<!-- GAME OVER -->

<div
  id="gameOver"
  class="screen hidden"
>

  <div class="result">

    <div class="resultTitle">
      FIM DE JOGO
    </div>

    <div
      id="loseText"
      class="resultText"
    ></div>

    <button
      id="retry"
      class="mainBtn"
    >
      VOLTAR À FASE 1
    </button>

    <button
      id="loseMenu"
      class="smallBtn"
    >
      MENU
    </button>

  </div>

</div>


<!-- VITÓRIA -->

<div
  id="victory"
  class="screen hidden"
>

  <div class="result">

    <div class="resultTitle">
      FASE CONCLUÍDA
    </div>

    <div
      id="winText"
      class="resultText"
    ></div>

    <button
      id="next"
      class="mainBtn"
    >
      PRÓXIMA FASE
    </button>

    <button
      id="winMenu"
      class="smallBtn"
    >
      MENU
    </button>

  </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

let DPR =
  Math.min(
    devicePixelRatio || 1,
    2
  );


function resize(){

  W = innerWidth;
  H = innerHeight;

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}


addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   10 AMBIENTES
========================================================= */

const worlds = [

  {
    name:"CIDADE NEON",
    sky:"#05051b",
    sky2:"#160c3d",
    road:"#10152c",
    glow:"#00eaff",
    obstacle:"#ff2d75"
  },

  {
    name:"CENTRO FUTURISTA",
    sky:"#061522",
    sky2:"#063b54",
    road:"#10212b",
    glow:"#29efff",
    obstacle:"#ff3d91"
  },

  {
    name:"VIA NOTURNA",
    sky:"#13051d",
    sky2:"#3a0b43",
    road:"#211229",
    glow:"#ff42dd",
    obstacle:"#ff315d"
  },

  {
    name:"ZONA INDUSTRIAL",
    sky:"#151006",
    sky2:"#43230a",
    road:"#211c16",
    glow:"#ffb52e",
    obstacle:"#ff5428"
  },

  {
    name:"CYBER CITY",
    sky:"#02191a",
    sky2:"#06483e",
    road:"#092421",
    glow:"#00ffb0",
    obstacle:"#ff3970"
  },

  {
    name:"DISTRITO VERMELHO",
    sky:"#190306",
    sky2:"#57090f",
    road:"#281015",
    glow:"#ff4439",
    obstacle:"#ffb12e"
  },

  {
    name:"MEGA TÚNEL",
    sky:"#070713",
    sky2:"#252253",
    road:"#17172d",
    glow:"#9e72ff",
    obstacle:"#ff36dd"
  },

  {
    name:"CIDADE AÉREA",
    sky:"#06162a",
    sky2:"#08617c",
    road:"#0d2938",
    glow:"#52eaff",
    obstacle:"#ff9134"
  },

  {
    name:"ZONA ZERO",
    sky:"#010104",
    sky2:"#141419",
    road:"#0a0a0d",
    glow:"#d0d0df",
    obstacle:"#ffffff"
  },

  {
    name:"ÚLTIMO SEGUNDO",
    sky:"#03000d",
    sky2:"#32075c",
    road:"#140c25",
    glow:"#d83cff",
    obstacle:"#ff205e"
  }

];


/* =========================================================
   ESTADO
========================================================= */

/*
  IMPORTANTE:

  Não existe localStorage.

  Portanto:
  - fechar página = começa de novo
  - morrer = bloqueia tudo novamente
  - não existe checkpoint
*/

let unlocked = 1;

let phase = 1;

let running = false;

let score = 0;

let coins = 0;

let target = 1200;

let speed = .4;

let lane = 1;

let laneVisual = 1;

let jumping = false;

let jumpTime = 0;

let sliding = false;

let slideTimer = 0;

let spawnTimer = 0;

let lastTime = 0;

let objects = [];

let particles = [];


/* =========================================================
   FASES
========================================================= */

function worldIndex(p){

  return Math.floor(
    (p - 1) / 5
  );
}


function world(){

  return worlds[
    worldIndex(phase)
  ];
}


function phaseTarget(p){

  return Math.floor(
    1200 +
    (p - 1) * 470 +
    Math.pow(
      p - 1,
      1.2
    ) * 18
  );
}


function phaseSpeed(p){

  return (
    .38 +
    (p - 1) * .011 +
    Math.min(
      .25,
      p * .002
    )
  );
}


function spawnGap(){

  if(phase <= 5)
    return 2.35;

  if(phase <= 10)
    return 2.10;

  if(phase <= 20)
    return 1.85;

  if(phase <= 30)
    return 1.60;

  if(phase <= 40)
    return 1.40;

  return 1.25;
}


/* =========================================================
   UI
========================================================= */

function show(id){

  document
    .getElementById(id)
    .classList
    .remove("hidden");
}


function hide(id){

  document
    .getElementById(id)
    .classList
    .add("hidden");
}


function goMenu(){

  running = false;

  hide("hud");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("menu");
}


function openPhases(){

  hide("menu");
  hide("gameOver");
  hide("victory");

  show("phaseMenu");

  renderPhases();
}


function renderPhases(){

  const grid =
    document.getElementById(
      "phaseGrid"
    );

  grid.innerHTML = "";

  for(
    let i = 1;
    i <= 50;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "phaseBtn";

    if(i <= unlocked){

      button.classList.add(
        "open"
      );

      button.textContent =
        i;

      button.onclick = () => {

        startGame(i);

      };

    }else{

      button.classList.add(
        "lock"
      );

      button.textContent =
        "🔒";

    }

    grid.appendChild(
      button
    );
  }

  document.getElementById(
    "unlockedText"
  ).textContent =
    unlocked;
}


function updateHUD(){

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(score);

  document.getElementById(
    "coins"
  ).textContent =
    coins;

  document.getElementById(
    "phaseName"
  ).textContent =
    "FASE " + phase;

  document.getElementById(
    "worldName"
  ).textContent =
    world().name;

  document.getElementById(
    "target"
  ).textContent =
    "META " + target;
}


/* =========================================================
   COMEÇAR
========================================================= */

function startGame(p){

  if(p > unlocked){
    return;
  }

  phase =
    Math.max(
      1,
      Math.min(
        50,
        p
      )
    );

  score = 0;

  coins = 0;

  target =
    phaseTarget(
      phase
    );

  speed =
    phaseSpeed(
      phase
    );

  lane = 1;

  laneVisual = 1;

  jumping = false;

  jumpTime = 0;

  sliding = false;

  slideTimer = 0;

  spawnTimer = 0;

  objects = [];

  particles = [];

  updateHUD();

  hide("menu");
  hide("phaseMenu");
  hide("gameOver");
  hide("victory");

  show("hud");

  running = true;

  lastTime =
    performance.now();

  requestAnimationFrame(
    loop
  );
}


/* =========================================================
   ESTRADA
========================================================= */

function roadY(z){

  const top =
    H * .39;

  const bottom =
    H * 1.05;

  return (
    top +
    (bottom - top) * z
  );
}


function roadHalf(z){

  return W *
    (
      .065 +
      .44 * z
    );
}


function laneX(
  selectedLane,
  z
){

  const center =
    W / 2;

  const spread =
    roadHalf(z) * .62;

  return (
    center +
    (selectedLane - 1) *
    spread
  );
}


/* =========================================================
   FUNDO
========================================================= */

function drawBackground(){

  const w =
    world();

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    w.sky
  );

  gradient.addColorStop(
    .55,
    w.sky2
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  drawStars();

  drawMoon();

  drawBuildings();

  drawWorldDetails();
}


function drawStars(){

  const wi =
    worldIndex(
      phase
    );

  if(
    wi !== 2 &&
    wi !== 5 &&
    wi !== 8 &&
    wi !== 9
  ){
    return;
  }

  for(
    let i = 0;
    i < 40;
    i++
  ){

    const x =
      (i * 83) % W;

    const y =
      20 +
      (i * 47) %
      (H * .35);

    const alpha =
      .25 +
      .25 *
      Math.sin(
        performance.now()/500 +
        i
      );

    ctx.fillStyle =
      "rgba(255,255,255," +
      alpha +
      ")";

    ctx.fillRect(
      x,
      y,
      2,
      2
    );
  }
}


function drawMoon(){

  const wi =
    worldIndex(
      phase
    );

  let color =
    "rgba(140,230,255,.12)";

  if(wi === 3){

    color =
      "rgba(255,170,40,.18)";

  }

  if(wi === 5){

    color =
      "rgba(255,50,40,.18)";

  }

  if(wi === 9){

    color =
      "rgba(210,70,255,.18)";

  }

  ctx.fillStyle =
    color;

  ctx.beginPath();

  ctx.arc(
    W * .78,
    H * .16,
    38,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


function drawBuildings(){

  const base =
    H * .48;

  const wi =
    worldIndex(
      phase
    );

  for(
    let i = 0;
    i < 22;
    i++
  ){

    const width =
      W / 22 + 5;

    const x =
      i * width;

    let height =
      45 +
      (
        i * 41 +
        wi * 27
      ) % 145;

    if(wi === 6){

      height += 35;

    }

    ctx.fillStyle =
      "rgba(5,8,25,.94)";

    ctx.fillRect(
      x,
      base - height,
      width - 2,
      height
    );

    for(
      let y =
        base - height + 10;

      y < base - 8;

      y += 15
    ){

      if(
        (
          i +
          Math.floor(y) +
          phase
        ) % 4 < 1
      ){

        ctx.fillStyle =
          "rgba(0,220,255,.24)";

        ctx.fillRect(
          x + 4,
          y,
          4,
          6
        );
      }
    }
  }
}


function drawWorldDetails(){

  const wi =
    worldIndex(
      phase
    );

  const glow =
    world().glow;

  ctx.save();

  if(wi === 1){

    for(
      let i = 0;
      i < 5;
      i++
    ){

      const x =
        W *
        (.1 + i * .2);

      ctx.strokeStyle =
        "rgba(40,230,255,.18)";

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.arc(
        x,
        H * .30,
        25 + i * 8,
        0,
        Math.PI * 2
      );

      ctx.stroke();
    }
  }


  if(wi === 3){

    for(
      let i = 0;
      i < 8;
      i++
    ){

      ctx.fillStyle =
        "rgba(255,140,20,.18)";

      ctx.fillRect(
        W * (i / 7),
        H * .31,
        4,
        80
      );
    }
  }


  if(wi === 5){

    for(
      let i = 0;
      i < 7;
      i++
    ){

      ctx.fillStyle =
        "rgba(255,40,40,.15)";

      ctx.fillRect(
        i * W / 7,
        H * .34,
        3,
        H * .12
      );
    }
  }


  if(wi === 6){

    ctx.strokeStyle =
      "rgba(160,110,255,.18)";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.arc(
      W / 2,
      H * .40,
      W * .30,
      Math.PI,
      Math.PI * 2
    );

    ctx.stroke();
  }


  if(wi === 7){

    for(
      let i = 0;
      i < 5;
      i++
    ){

      ctx.strokeStyle =
        "rgba(60,220,255,.22)";

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.moveTo(
        i * W / 4,
        H * .46
      );

      ctx.lineTo(
        i * W / 4 +
        W * .12,
        H * .25
      );

      ctx.stroke();
    }
  }


  if(wi === 8){

    ctx.fillStyle =
      "rgba(255,255,255,.08)";

    ctx.fillRect(
      0,
      H * .47,
      W,
      2
    );
  }


  if(wi === 9){

    ctx.strokeStyle =
      glow;

    ctx.globalAlpha =
      .12;

    ctx.lineWidth = 2;

    for(
      let i = 0;
      i < 9;
      i++
    ){

      ctx.beginPath();

      ctx.arc(
        W / 2,
        H * .40,
        50 + i * 38,
        0,
        Math.PI * 2
      );

      ctx.stroke();
    }
  }

  ctx.restore();
}


/* =========================================================
   ESTRADA
========================================================= */

function drawRoad(){

  const w =
    world();

  const topY =
    H * .39;

  const bottomY =
    H * 1.05;

  const topHalf =
    W * .07;

  const bottomHalf =
    W * .49;


  ctx.beginPath();

  ctx.moveTo(
    W/2 - topHalf,
    topY
  );

  ctx.lineTo(
    W/2 + topHalf,
    topY
  );

  ctx.lineTo(
    W/2 + bottomHalf,
    bottomY
  );

  ctx.lineTo(
    W/2 - bottomHalf,
    bottomY
  );

  ctx.closePath();


  const gradient =
    ctx.createLinearGradient(
      0,
      topY,
      0,
      H
    );

  gradient.addColorStop(
    0,
    w.road
  );

  gradient.addColorStop(
    1,
    "#05070d"
  );

  ctx.fillStyle =
    gradient;

  ctx.fill();


  ctx.strokeStyle =
    w.glow;

  ctx.globalAlpha =
    .55;

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    W/2 - topHalf,
    topY
  );

  ctx.lineTo(
    W/2 - bottomHalf,
    bottomY
  );

  ctx.moveTo(
    W/2 + topHalf,
    topY
  );

  ctx.lineTo(
    W/2 + bottomHalf,
    bottomY
  );

  ctx.stroke();

  ctx.globalAlpha = 1;


  for(
    let l = 1;
    l <= 2;
    l++
  ){

    const tx =
      W/2 +
      (l - 1.5) *
      topHalf *
      .85;

    const bx =
      W/2 +
      (l - 1.5) *
      bottomHalf *
      .85;

    ctx.strokeStyle =
      "rgba(130,180,220,.22)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      tx,
      topY
    );

    ctx.lineTo(
      bx,
      bottomY
    );

    ctx.stroke();
  }


  const time =
    performance.now() / 1000;

  for(
    let i = 0;
    i < 15;
    i++
  ){

    const z =
      (
        i / 15 +
        time * speed * .34
      ) % 1;

    const y =
      roadY(z);

    const height =
      3 + z * 9;

    ctx.fillStyle =
      w.glow;

    ctx.globalAlpha =
      .04 + z * .18;

    ctx.fillRect(
      W/2 - roadHalf(z),
      y,
      roadHalf(z) * 2,
      height
    );

    ctx.globalAlpha = 1;
  }
}


/* =========================================================
   OBJETOS
========================================================= */

function objectScale(z){

  return .25 +
    z * 1.05;
}


function canSpawn(){

  for(
    const object of objects
  ){

    if(
      object.type !== "coin" &&
      object.z > .50
    ){

      return false;
    }
  }

  return true;
}


function spawnObstacle(){

  if(!canSpawn()){
    return;
  }


  let amount = 1;


  /*
    Fases iniciais:
    sempre uma pista livre.

    Fases intermediárias:
    dois obstáculos às vezes.

    Fases finais:
    dois obstáculos com
    bastante frequência.
  */

  if(
    phase >= 8 &&
    phase <= 15 &&
    Math.random() < .18
  ){

    amount = 2;

  }


  if(
    phase >= 16 &&
    phase <= 30 &&
    Math.random() < .32
  ){

    amount = 2;

  }


  if(
    phase >= 31 &&
    Math.random() < .44
  ){

    amount = 2;

  }


  const lanes =
    [0,1,2]
      .sort(
        () =>
          Math.random() - .5
      );


  /*
    Nunca ocupa as 3 pistas.
  */

  for(
    let i = 0;
    i < amount;
    i++
  ){

    const selected =
      lanes[i];

    let type =
      "block";


    if(
      phase >= 7 &&
      Math.random() < .28
    ){

      type =
        "bar";

    }


    objects.push({

      lane:selected,

      z:0,

      type:type,

      passed:false,

      dead:false

    });
  }


  /*
    Moedas ficam em uma pista
    que pode ser alcançada.
  */

  if(
    Math.random() < .68
  ){

    let coinLane =
      lanes[
        amount
      ];

    if(
      coinLane === undefined
    ){

      coinLane =
        Math.floor(
          Math.random() * 3
        );
    }


    for(
      let i = 0;
      i < 3;
      i++
    ){

      objects.push({

        lane:coinLane,

        z:
          -.12 -
          i * .14,

        type:"coin",

        passed:false,

        dead:false

      });
    }
  }
}


/* =========================================================
   CONTROLES
========================================================= */

function move(direction){

  if(!running){
    return;
  }

  lane += direction;

  if(lane < 0){
    lane = 0;
  }

  if(lane > 2){
    lane = 2;
  }
}


function jump(){

  if(!running){
    return;
  }

  if(jumping){
    return;
  }

  if(sliding){
    return;
  }

  jumping = true;

  jumpTime = 0;
}


function slide(){

  if(!running){
    return;
  }

  if(jumping){
    return;
  }

  if(sliding){
    return;
  }

  sliding = true;

  slideTimer = .48;
}


/* =========================================================
   COLISÃO
========================================================= */

function collision(
  object
){

  if(
    object.type === "coin"
  ){

    return false;
  }


  if(
    Math.abs(
      object.z - 1
    ) > .12
  ){

    return false;
  }


  if(
    object.lane !== lane
  ){

    return false;
  }


  /*
    Pulo evita obstáculos.
  */

  if(jumping){

    return false;
  }


  /*
    Slide evita barras.
  */

  if(
    object.type === "bar" &&
    sliding
  ){

    return false;
  }


  return true;
}


function collectCoin(
  object
){

  if(
    object.type !== "coin"
  ){

    return;
  }


  if(
    Math.abs(
      object.z - 1
    ) < .13 &&
    object.lane === lane
  ){

    object.dead = true;

    coins++;

    score += 100;

    createParticles(
      laneX(
        lane,
        1
      ),
      roadY(1) - 35
    );
  }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createParticles(
  x,
  y
){

  for(
    let i = 0;
    i < 8;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5) *
        100,

      vy:
        (Math.random()-.5) *
        100,

      life:.5

    });
  }
}


function updateParticles(
  dt
){

  for(
    const p of particles
  ){

    p.x +=
      p.vx * dt;

    p.y +=
      p.vy * dt;

    p.life -=
      dt;
  }


  particles =
    particles.filter(
      p =>
        p.life > 0
    );
}


function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        p.life * 2
      );

    ctx.fillStyle =
      "#00eaff";

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );
  }

  ctx.globalAlpha = 1;
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  /*
    Movimento rápido entre pistas.
  */

  laneVisual +=
    (
      lane -
      laneVisual
    ) *
    Math.min(
      1,
      dt * 25
    );


  /*
    Pulo.
  */

  if(jumping){

    jumpTime += dt;

    if(
      jumpTime >= .72
    ){

      jumping = false;

      jumpTime = 0;
    }
  }


  /*
    Slide.
  */

  if(sliding){

    slideTimer -= dt;

    if(
      slideTimer <= 0
    ){

      sliding = false;
    }
  }


  /*
    Obstáculos.
  */

  spawnTimer += dt;


  const gap =
    spawnGap() /
    Math.max(
      .75,
      speed
    );


  if(
    spawnTimer >= gap
  ){

    spawnTimer = 0;

    spawnObstacle();
  }


  const velocity =
    speed *
    dt *
    .72;


  for(
    const object of objects
  ){

    object.z +=
      velocity;


    collectCoin(
      object
    );


    if(
      collision(object)
    ){

      gameOver();

      return;
    }


    if(
      !object.passed &&
      object.z > 1.05
    ){

      object.passed = true;

      if(
        object.type !== "coin"
      ){

        score += 35;
      }
    }
  }


  objects =
    objects.filter(
      object =>
        !object.dead &&
        object.z < 1.2
    );


  score +=
    dt *
    speed *
    18;


  updateParticles(
    dt
  );


  /*
    Vitória.
  */

  if(
    score >= target
  ){

    winPhase();

    return;
  }


  updateHUD();
}


/* =========================================================
   DESENHO DOS OBJETOS
========================================================= */

function drawObject(
  object
){

  const z =
    Math.max(
      0,
      object.z
    );

  const x =
    laneX(
      object.lane,
      z
    );

  const y =
    roadY(z);

  const s =
    objectScale(z);

  const w =
    world();


  /*
    MOEDA
  */

  if(
    object.type === "coin"
  ){

    ctx.save();

    ctx.translate(
      x,
      y - 28 * s
    );

    ctx.rotate(
      performance.now() /
      500
    );

    ctx.strokeStyle =
      "#ffd84d";

    ctx.lineWidth =
      5 * s;

    ctx.shadowBlur =
      15 * s;

    ctx.shadowColor =
      "#ffd84d";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      11 * s,
      0,
      Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

    return;
  }


  /*
    OBSTÁCULO
  */

  const width =
    object.type === "bar"
      ? 72 * s
      : 52 * s;


  const height =
    object.type === "bar"
      ? 22 * s
      : 62 * s;


  const yy =
    y - height;


  ctx.save();


  ctx.shadowBlur =
    18 * s;

  ctx.shadowColor =
    w.obstacle;


  const gradient =
    ctx.createLinearGradient(
      x - width/2,
      yy,
      x + width/2,
      yy + height
    );


  gradient.addColorStop(
    0,
    w.obstacle
  );


  gradient.addColorStop(
    1,
    "#6c20c7"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    x - width/2,
    yy,
    width,
    height
  );


  ctx.shadowBlur = 0;


  ctx.strokeStyle =
    "rgba(255,255,255,.65)";

  ctx.lineWidth =
    2 * s;


  ctx.strokeRect(
    x - width/2,
    yy,
    width,
    height
  );


  ctx.fillStyle =
    "rgba(255,255,255,.25)";


  if(
    object.type === "block"
  ){

    ctx.fillRect(
      x - width*.32,
      yy + height*.2,
      width*.64,
      3*s
    );

    ctx.fillRect(
      x - width*.32,
      yy + height*.5,
      width*.64,
      3*s
    );

  }else{

    ctx.fillRect(
      x - width*.38,
      yy + height*.35,
      width*.76,
      3*s
    );
  }


  ctx.restore();
}
