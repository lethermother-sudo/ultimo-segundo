<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Último Segundo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#02030a;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{
  position:relative;
  width:100vw;height:100dvh;
  overflow:hidden;
  background:
    linear-gradient(#07152e 0%,#09142a 40%,#02040b 100%);
}

/* CÉU */
.sky{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 20%,#006eff33,transparent 24%),
    radial-gradient(circle at 80% 25%,#ff006633,transparent 22%);
}

/* LUA */
.moon{
  position:absolute;
  width:90px;height:90px;
  border-radius:50%;
  right:13%;top:13%;
  background:#bde9ff;
  box-shadow:0 0 35px #70d8ff88;
  opacity:.7;
}

/* PRÉDIOS */
.city{
  position:absolute;
  left:0;right:0;bottom:38%;
  height:34%;
  display:flex;
  align-items:flex-end;
  gap:5px;
}
.building{
  position:relative;
  flex:1;
  min-width:35px;
  background:linear-gradient(#111b35,#070b17);
  border-top:2px solid #126eff55;
}
.building:nth-child(1){height:55%}
.building:nth-child(2){height:85%}
.building:nth-child(3){height:62%}
.building:nth-child(4){height:100%}
.building:nth-child(5){height:72%}
.building:nth-child(6){height:92%}
.building:nth-child(7){height:58%}
.building:nth-child(8){height:78%}

.building:after{
  content:"";
  position:absolute;
  inset:12px 8px;
  background:
    repeating-linear-gradient(
      90deg,
      #00d9ff88 0 3px,
      transparent 3px 13px
    ),
    repeating-linear-gradient(
      0deg,
      #ffcf0088 0 3px,
      transparent 3px 18px
    );
  opacity:.55;
}

/* ESTRADA */
.road{
  position:absolute;
  left:-50%;
  width:200%;
  height:75%;
  bottom:-32%;
  transform:perspective(500px) rotateX(60deg);
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 70px,
      #12bfff22 71px 73px
    ),
    #040817;
  box-shadow:0 -30px 100px #006eff33;
}

.laneLine{
  position:absolute;
  bottom:-5%;
  height:75%;
  width:3px;
  background:linear-gradient(transparent,#00d9ff88);
  transform-origin:bottom;
}
.line1{left:33.33%}
.line2{left:66.66%}

/* HUD */
#hud{
  position:absolute;
  top:22px;left:18px;right:18px;
  z-index:50;
  display:flex;
  justify-content:space-between;
}
.score{
  font-size:36px;
  font-weight:900;
  color:white;
}
.coins{
  margin-top:5px;
  color:#ffd000;
  font-weight:900;
}
.record{
  margin-top:4px;
  color:#aab4c6;
  font-size:12px;
}
.level{
  height:max-content;
  padding:9px 14px;
  border:1px solid #ffffff22;
  border-radius:20px;
  background:#00000044;
  color:white;
  font-size:12px;
  font-weight:900;
}

/* PERSONAGEM */
#player{
  position:absolute;
  width:60px;height:82px;
  left:50%;bottom:16%;
  transform:translateX(-50%);
  z-index:30;
  transition:left .12s ease;
}
.head{
  position:absolute;
  width:42px;height:42px;
  left:9px;top:0;
  border-radius:14px;
  background:linear-gradient(145deg,#fff,#ffc400);
  box-shadow:0 0 20px #ffc400;
}
.head:before{
  content:"";
  position:absolute;
  width:9px;height:9px;
  border-radius:50%;
  background:#07101d;
  left:9px;top:13px;
  box-shadow:15px 0 #07101d;
}
.head:after{
  content:"";
  position:absolute;
  width:18px;height:4px;
  border-radius:4px;
  background:#07101d;
  left:12px;bottom:8px;
}
.body{
  position:absolute;
  width:34px;height:40px;
  left:13px;top:38px;
  border-radius:10px;
  background:linear-gradient(180deg,#ffc400,#ff6a00);
  box-shadow:0 0 15px #ff9d00;
}
.leg{
  position:absolute;
  width:10px;height:27px;
  top:67px;
  background:#101b35;
  border-radius:6px;
}
.leg1{left:15px;transform:rotate(10deg)}
.leg2{right:15px;transform:rotate(-10deg)}
.shadow{
  position:absolute;
  width:62px;height:12px;
  bottom:-3px;
  background:#0009;
  border-radius:50%;
  filter:blur(5px);
}

/* ANIMAÇÃO */
.running .leg1{animation:run1 .22s infinite alternate}
.running .leg2{animation:run2 .22s infinite alternate}
@keyframes run1{
  from{transform:rotate(20deg)}
  to{transform:rotate(-25deg)}
}
@keyframes run2{
  from{transform:rotate(-25deg)}
  to{transform:rotate(20deg)}
}

/* OBSTÁCULOS */
.obstacle{
  position:absolute;
  z-index:25;
  transform:translateX(-50%);
  width:62px;height:62px;
  border-radius:14px;
  background:linear-gradient(145deg,#ff164f,#ff6200);
  box-shadow:0 0 20px #ff164f,0 0 45px #ff164f66;
}
.obstacle.blue{
  background:linear-gradient(145deg,#00eaff,#0066ff);
  box-shadow:0 0 20px #00d9ff,0 0 45px #006eff66;
}
.barrier{
  width:105px;height:35px;
  border-radius:8px;
}

/* MOEDAS */
.coin{
  position:absolute;
  width:31px;height:31px;
  z-index:24;
  transform:translateX(-50%);
  border-radius:50%;
  border:5px solid #ffd000;
  background:#fff5a8;
  box-shadow:0 0 15px #ffd000;
}

/* TURBO */
.boost{
  position:absolute;
  width:42px;height:42px;
  z-index:24;
  transform:translateX(-50%) rotate(45deg);
  border-radius:9px;
  background:#8d00ff;
  box-shadow:0 0 22px #b000ff,0 0 50px #8d00ff88;
}

/* COMBO */
#combo{
  position:absolute;
  top:115px;left:0;right:0;
  z-index:55;
  text-align:center;
  color:#ffd000;
  font-size:24px;
  font-weight:1000;
  opacity:0;
}

/* FLASH */
#flash{
  position:absolute;inset:0;
  z-index:90;
  background:#ff1744;
  opacity:0;
  pointer-events:none;
}

/* TELAS */
.screen{
  position:absolute;inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#02030add;
  backdrop-filter:blur(14px);
}
#gameOver{display:none}

.logo{
  font-size:clamp(58px,15vw,94px);
  line-height:.82;
  font-weight:1000;
  font-style:italic;
  color:white;
  text-shadow:
    4px 4px 0 #ff8c00,
    0 0 35px #ffb00077;
}
.tagline{
  margin-top:22px;
  color:#aab4c6;
  font-size:11px;
  letter-spacing:3px;
}
button{
  width:min(320px,84vw);
  margin-top:38px;
  padding:19px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#ffd400,#ff8200);
  color:#101010;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 10px 40px #ff9d0055;
}
button:active{transform:scale(.96)}

.gameTitle{
  color:#ff3040;
  font-size:55px;
  font-weight:1000;
  font-style:italic;
}
.finalLabel{
  margin-top:28px;
  color:#aab4c6;
}
.finalScore{
  font-size:68px;
  font-weight:1000;
  margin-top:5px;
}
.best{
  margin-top:8px;
  color:#ffd000;
  font-weight:900;
}
.hint{
  position:absolute;
  bottom:5%;
  left:0;right:0;
  z-index:50;
  text-align:center;
  color:#ffffff66;
  font-size:10px;
}
</style>
</head>

<body>

<div id="game">

<div class="sky"></div>
<div class="moon"></div>

<div class="city">
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
</div>

<div class="road">
  <div class="laneLine line1"></div>
  <div class="laneLine line2"></div>
</div>

<div id="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="coins">🪙 <span id="coinCount">0</span></div>
    <div class="record">🏆 RECORDE: <span id="record">0.0</span></div>
  </div>
  <div class="level" id="level">NÍVEL 1</div>
</div>

<div id="combo"></div>

<div id="player">
  <div class="head"></div>
  <div class="body"></div>
  <div class="leg leg1"></div>
  <div class="leg leg2"></div>
  <div class="shadow"></div>
</div>

<div id="flash"></div>

<div class="hint">
DESLIZE ← → PARA MUDAR • ↑ PULAR • ↓ DESLIZAR
</div>

<div class="screen" id="startScreen">
  <div class="logo">ÚLTIMO<br>SEGUNDO</div>
  <div class="tagline">CORRA • DESVIE • SOBREVIVA</div>
  <button onclick="startGame()">JOGAR</button>
</div>

<div class="screen" id="gameOver">
  <div class="gameTitle">GAME OVER</div>
  <div class="finalLabel">SUA PONTUAÇÃO</div>
  <div class="finalScore" id="finalScore">0</div>
  <div class="best">🏆 RECORDE: <span id="finalRecord">0</span></div>
  <button onclick="startGame()">TENTAR DE NOVO</button>
</div>

</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const coinEl=document.getElementById("coinCount");
const recordEl=document.getElementById("record");
const levelEl=document.getElementById("level");
const comboEl=document.getElementById("combo");
const flash=document.getElementById("flash");

const lanes=["16.666%","50%","83.333%"];

let lane=1;
let score=0;
let coins=0;
let combo=0;

let record=Number(
  localStorage.getItem("ultimoSegundoRecorde") || 0
);

let running=false;
let startTime=0;
let lastSpawn=0;
let lastCoin=0;

let obstacles=[];
let coinObjects=[];

let touchX=0;
let touchY=0;

recordEl.textContent=record.toFixed(1);

function setLane(n){
  lane=Math.max(0,Math.min(2,n));
  player.style.left=lanes[lane];
}

function jump(){
  player.style.transform="translateX(-50%) translateY(-100px)";
  setTimeout(()=>{
    player.style.transform="translateX(-50%)";
  },520);
}

function slide(){
  player.style.transform="translateX(-50%) scaleY(.55)";
  setTimeout(()=>{
    player.style.transform="translateX(-50%)";
  },600);
}

function spawnObstacle(){

  const el=document.createElement("div");
  el.className="obstacle";

  if(Math.random()>.65)
    el.classList.add("blue");

  if(Math.random()>.82)
    el.classList.add("barrier");

  const l=Math.floor(Math.random()*3);

  el.style.left=lanes[l];
  el.style.top="-100px";

  game.appendChild(el);

  obstacles.push({
    element:el,
    lane:l,
    y:-100
  });
}

function spawnCoins(){

  const l=Math.floor(Math.random()*3);

  for(let i=0;i<4;i++){

    const el=document.createElement("div");

    el.className="coin";

    el.style.left=lanes[l];
    el.style.top=(-50-(i*70))+"px";

    game.appendChild(el);

    coinObjects.push({
      element:el,
      lane:l,
      y:-50-(i*70)
    });
  }
}

function hit(a,b){

  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  return !(
    r1.right<r2.left+8 ||
    r1.left>r2.right-8 ||
    r1.bottom<r2.top+8 ||
    r1.top>r2.bottom-8
  );
}

function collect(c){

  c.element.remove();

  const i=coinObjects.indexOf(c);

  if(i>=0)
    coinObjects.splice(i,1);

  coins++;

  combo++;

  coinEl.textContent=coins;

  comboEl.textContent="🔥 COMBO x"+combo;
  comboEl.style.opacity="1";

  clearTimeout(window.comboTimer);

  window.comboTimer=setTimeout(()=>{
    comboEl.style.opacity="0";
  },650);

  if(navigator.vibrate)
    navigator.vibrate(20);
}

function gameLoop(time){

  if(!running)return;

  score=(time-startTime)/1000;

  scoreEl.textContent=score.toFixed(1);

  const level=Math.floor(score/15)+1;

  levelEl.textContent="NÍVEL "+level;

  const speed=5+(score*.09);

  const delay=Math.max(
    330,
    900-score*7
  );

  if(time-lastSpawn>delay){

    spawnObstacle();

    lastSpawn=time;
  }

  if(time-lastCoin>1500){

    spawnCoins();

    lastCoin=time;
  }

  for(let i=obstacles.length-1;i>=0;i--){

    const o=obstacles[i];

    o.y+=speed;

    o.element.style.top=o.y+"px";

    if(
      o.lane===lane &&
      hit(player,o.element)
    ){

      endGame();
      return;
    }

    if(o.y>innerHeight+120){

      o.element.remove();
      obstacles.splice(i,1);
    }
  }

  for(let i=coinObjects.length-1;i>=0;i--){

    const c=coinObjects[i];

    c.y+=speed;

    c.element.style.top=c.y+"px";

    if(
      c.lane===lane &&
      hit(player,c.element)
    ){

      collect(c);
      continue;
    }

    if(c.y>innerHeight+100){

      c.element.remove();
      coinObjects.splice(i,1);
    }
  }

  requestAnimationFrame(gameLoop);
}

function startGame(){

  obstacles.forEach(o=>o.element.remove());
  coinObjects.forEach(c=>c.element.remove());

  obstacles=[];
  coinObjects=[];

  lane=1;
  score=0;
  coins=0;
  combo=0;

  setLane(1);

  scoreEl.textContent="0";
  coinEl.textContent="0";

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  player.classList.add("running");

  running=true;

  startTime=performance.now();
  lastSpawn=performance.now();
  lastCoin=performance.now();

  requestAnimationFrame(gameLoop);
}

function endGame(){

  if(!running)return;

  running=false;

  player.classList.remove("running");

  flash.style.opacity=".35";

  setTimeout(()=>{
    flash.style.opacity="0";
  },100);

  if(navigator.vibrate)
    navigator.vibrate([100,50,200]);

  if(score>record){

    record=score;

    localStorage.setItem(
      "ultimoSegundoRecorde",
      record
    );
  }

  scoreEl.textContent=score.toFixed(1);
  recordEl.textContent=record.toFixed(1);

  document.getElementById("finalScore")
    .textContent=score.toFixed(1);

  document.getElementById("finalRecord")
    .textContent=record.toFixed(1);

  document.getElementById("gameOver")
    .style.display="flex";
}

/* GESTOS */

game.addEventListener("touchstart",e=>{

  if(!running)return;

  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;

},{passive:true});

game.addEventListener("touchend",e=>{

  if(!running)return;

  const x=e.changedTouches[0].clientX;
  const y=e.changedTouches[0].clientY;

  const dx=x-touchX;
  const dy=y-touchY;

  if(Math.abs(dx)<30 && Math.abs(dy)<30)
    return;

  if(Math.abs(dx)>Math.abs(dy)){

    if(dx>0)
      setLane(lane+1);
    else
      setLane(lane-1);

  }else{

    if(dy<0)
      jump();
    else
      slide();
  }

},{passive:true});
</script>

</body>
</html>
