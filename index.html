<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Último Segundo</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  overscroll-behavior:none;
}

#game{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:
    linear-gradient(
      #07152e 0%,
      #09142a 43%,
      #02040b 100%
    );
}

/* =========================
   CÉU
========================= */

.sky{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 18% 20%,
      #006eff35,
      transparent 25%
    ),
    radial-gradient(
      circle at 82% 27%,
      #ff006630,
      transparent 25%
    );
}

/* =========================
   LUA
========================= */

.moon{
  position:absolute;

  width:90px;
  height:90px;

  right:13%;
  top:13%;

  border-radius:50%;

  background:#bde9ff;

  box-shadow:
    0 0 35px #70d8ff88;

  opacity:.75;
}

/* =========================
   CIDADE
========================= */

.city{
  position:absolute;

  left:0;
  right:0;
  bottom:38%;

  height:34%;

  display:flex;
  align-items:flex-end;

  gap:5px;
}

.building{
  position:relative;

  flex:1;
  min-width:35px;

  background:
    linear-gradient(
      #111b35,
      #070b17
    );

  border-top:2px solid #126eff55;
}

.building:nth-child(1){height:55%}
.building:nth-child(2){height:85%}
.building:nth-child(3){height:62%}
.building:nth-child(4){height:100%}
.building:nth-child(5){height:72%}
.building:nth-child(6){height:92%}
.building:nth-child(7){height:58%}
.building:nth-child(8){height:78%}

.building:after{
  content:"";

  position:absolute;

  inset:12px 8px;

  background:
    repeating-linear-gradient(
      90deg,
      #00d9ff88 0 3px,
      transparent 3px 13px
    ),
    repeating-linear-gradient(
      0deg,
      #ffcf0088 0 3px,
      transparent 3px 18px
    );

  opacity:.55;
}

/* =========================
   ESTRADA
========================= */

.road{
  position:absolute;

  left:-50%;
  width:200%;

  height:75%;

  bottom:-32%;

  transform:
    perspective(500px)
    rotateX(60deg);

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 70px,
      #12bfff22 71px 73px
    ),
    #040817;

  box-shadow:
    0 -30px 100px #006eff33;
}

.laneLine{
  position:absolute;

  bottom:-5%;

  height:75%;

  width:3px;

  background:
    linear-gradient(
      transparent,
      #00d9ff88
    );

  transform-origin:bottom;
}

.line1{
  left:33.33%;
}

.line2{
  left:66.66%;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;

  top:22px;
  left:18px;
  right:18px;

  z-index:50;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.score{
  font-size:36px;
  font-weight:900;
  color:white;
}

.coins{
  margin-top:5px;

  color:#ffd000;

  font-size:17px;
  font-weight:900;
}

.record{
  margin-top:4px;

  color:#aab4c6;

  font-size:12px;
}

.level{
  height:max-content;

  padding:9px 14px;

  border:1px solid #ffffff22;

  border-radius:20px;

  background:#00000044;

  color:white;

  font-size:12px;

  font-weight:900;
}

/* =========================
   PERSONAGEM
========================= */

#player{
  position:absolute;

  width:60px;
  height:82px;

  left:50%;
  bottom:16%;

  transform:
    translateX(-50%);

  z-index:30;

  transition:
    left .07s cubic-bezier(.2,.8,.2,1),
    transform .08s ease;
}

.head{
  position:absolute;

  width:42px;
  height:42px;

  left:9px;
  top:0;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #ffc400
    );

  box-shadow:
    0 0 20px #ffc400;
}

.head:before{
  content:"";

  position:absolute;

  width:9px;
  height:9px;

  border-radius:50%;

  background:#07101d;

  left:9px;
  top:13px;

  box-shadow:
    15px 0 #07101d;
}

.head:after{
  content:"";

  position:absolute;

  width:18px;
  height:4px;

  border-radius:4px;

  background:#07101d;

  left:12px;
  bottom:8px;
}

.body{
  position:absolute;

  width:34px;
  height:40px;

  left:13px;
  top:38px;

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #ffc400,
      #ff6a00
    );

  box-shadow:
    0 0 15px #ff9d00;
}

.leg{
  position:absolute;

  width:10px;
  height:27px;

  top:67px;

  background:#101b35;

  border-radius:6px;
}

.leg1{
  left:15px;
  transform:rotate(10deg);
}

.leg2{
  right:15px;
  transform:rotate(-10deg);
}

.shadow{
  position:absolute;

  width:62px;
  height:12px;

  bottom:-3px;

  background:#0009;

  border-radius:50%;

  filter:blur(5px);
}

/* corrida */

.running .leg1{
  animation:
    run1 .18s infinite alternate;
}

.running .leg2{
  animation:
    run2 .18s infinite alternate;
}

@keyframes run1{

  from{
    transform:rotate(25deg);
  }

  to{
    transform:rotate(-30deg);
  }
}

@keyframes run2{

  from{
    transform:rotate(-30deg);
  }

  to{
    transform:rotate(25deg);
  }
}

/* =========================
   PULO
========================= */

.jumping{
  animation:
    playerJump .48s cubic-bezier(.2,.8,.3,1);
}

@keyframes playerJump{

  0%{
    transform:
      translateX(-50%)
      translateY(0);
  }

  45%{
    transform:
      translateX(-50%)
      translateY(-125px);
  }

  100%{
    transform:
      translateX(-50%)
      translateY(0);
  }
}

/* =========================
   DESLIZE
========================= */

.sliding .head{
  top:20px;
}

.sliding .body{
  top:48px;
  height:24px;
}

.sliding .leg{
  top:67px;
}

.sliding{
  transform:
    translateX(-50%)
    scale(.9,.72);
}

/* =========================
   OBSTÁCULOS
========================= */

.obstacle{
  position:absolute;

  z-index:25;

  transform:
    translateX(-50%);

  width:62px;
  height:62px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #ff164f,
      #ff6200
    );

  box-shadow:
    0 0 20px #ff164f,
    0 0 45px #ff164f66;
}

.obstacle.blue{
  background:
    linear-gradient(
      145deg,
      #00eaff,
      #0066ff
    );

  box-shadow:
    0 0 20px #00d9ff,
    0 0 45px #006eff66;
}

.barrier{
  width:105px;
  height:35px;

  border-radius:8px;
}

/* =========================
   MOEDAS
========================= */

.coin{
  position:absolute;

  width:31px;
  height:31px;

  z-index:24;

  transform:
    translateX(-50%);

  border-radius:50%;

  border:5px solid #ffd000;

  background:#fff5a8;

  box-shadow:
    0 0 15px #ffd000;

  animation:
    coinSpin .5s linear infinite;
}

@keyframes coinSpin{

  from{
    transform:
      translateX(-50%)
      rotateY(0deg);
  }

  to{
    transform:
      translateX(-50%)
      rotateY(360deg);
  }
}

/* =========================
   COMBO
========================= */

#combo{
  position:absolute;

  top:115px;
  left:0;
  right:0;

  z-index:55;

  text-align:center;

  color:#ffd000;

  font-size:24px;

  font-weight:1000;

  opacity:0;

  transition:
    opacity .15s ease,
    transform .15s ease;
}

/* =========================
   FLASH
========================= */

#flash{
  position:absolute;

  inset:0;

  z-index:90;

  background:#ff1744;

  opacity:0;

  pointer-events:none;
}

/* =========================
   TELAS
========================= */

.screen{
  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  background:#02030add;

  backdrop-filter:blur(14px);
}

#gameOver{
  display:none;
}

.logo{
  font-size:
    clamp(
      58px,
      15vw,
      94px
    );

  line-height:.82;

  font-weight:1000;

  font-style:italic;

  color:white;

  text-shadow:
    4px 4px 0 #ff8c00,
    0 0 35px #ffb00077;
}

.tagline{
  margin-top:22px;

  color:#aab4c6;

  font-size:11px;

  letter-spacing:3px;
}

button{
  width:min(320px,84vw);

  margin-top:38px;

  padding:19px;

  border:0;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #ffd400,
      #ff8200
    );

  color:#101010;

  font-size:20px;

  font-weight:1000;

  box-shadow:
    0 10px 40px #ff9d0055;
}

button:active{
  transform:scale(.96);
}

.gameTitle{
  color:#ff3040;

  font-size:55px;

  font-weight:1000;

  font-style:italic;
}

.finalLabel{
  margin-top:28px;

  color:#aab4c6;
}

.finalScore{
  font-size:68px;

  font-weight:1000;

  margin-top:5px;
}

.best{
  margin-top:8px;

  color:#ffd000;

  font-weight:900;
}

.hint{
  position:absolute;

  bottom:5%;

  left:0;
  right:0;

  z-index:50;

  text-align:center;

  color:#ffffff66;

  font-size:10px;
}

</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="moon"></div>

  <div class="city">

    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>

  </div>

  <div class="road">

    <div class="laneLine line1"></div>
    <div class="laneLine line2"></div>

  </div>

  <div id="hud">

    <div>

      <div
        class="score"
        id="score"
      >
        0
      </div>

      <div class="coins">
        🪙
        <span id="coinCount">
          0
        </span>
      </div>

      <div class="record">

        🏆 RECORDE:
        <span id="record">
          0.0
        </span>

      </div>

    </div>

    <div
      class="level"
      id="level"
    >
      NÍVEL 1
    </div>

  </div>

  <div id="combo"></div>

  <div id="player">

    <div class="head"></div>

    <div class="body"></div>

    <div class="leg leg1"></div>

    <div class="leg leg2"></div>

    <div class="shadow"></div>

  </div>

  <div id="flash"></div>

  <div class="hint">

    DESLIZE ← → PARA MUDAR
    • ↑ PULAR
    • ↓ DESLIZAR

  </div>

  <!-- TELA INICIAL -->

  <div
    class="screen"
    id="startScreen"
  >

    <div class="logo">

      ÚLTIMO<br>
      SEGUNDO

    </div>

    <div class="tagline">

      CORRA • DESVIE • SOBREVIVA

    </div>

    <button onclick="startGame()">

      JOGAR

    </button>

  </div>

  <!-- GAME OVER -->

  <div
    class="screen"
    id="gameOver"
  >

    <div class="gameTitle">

      GAME OVER

    </div>

    <div class="finalLabel">

      SUA PONTUAÇÃO

    </div>

    <div
      class="finalScore"
      id="finalScore"
    >
      0
    </div>

    <div class="best">

      🏆 RECORDE:
      <span id="finalRecord">
        0
      </span>

    </div>

    <button onclick="startGame()">

      TENTAR DE NOVO

    </button>

  </div>

</div>

<script>

/* =========================
   ELEMENTOS
========================= */

const game =
  document.getElementById("game");

const player =
  document.getElementById("player");

const scoreEl =
  document.getElementById("score");

const coinEl =
  document.getElementById("coinCount");

const recordEl =
  document.getElementById("record");

const levelEl =
  document.getElementById("level");

const comboEl =
  document.getElementById("combo");

const flash =
  document.getElementById("flash");


/* =========================
   CONFIGURAÇÃO
========================= */

const lanes = [
  "16.666%",
  "50%",
  "83.333%"
];

let lane = 1;

let score = 0;

let coins = 0;

let combo = 0;

let running = false;

let startTime = 0;

let lastSpawn = 0;

let lastCoin = 0;

let obstacles = [];

let coinObjects = [];

let record = Number(
  localStorage.getItem(
    "ultimoSegundoRecorde"
  ) || 0
);

recordEl.textContent =
  record.toFixed(1);


/* =========================
   PISTA
========================= */

function setLane(newLane){

  lane = Math.max(
    0,
    Math.min(
      2,
      newLane
    )
  );

  player.style.left =
    lanes[lane];
}


/* =========================
   PULO
========================= */

function jump(){

  if(
    player.classList.contains("jumping")
  ){
    return;
  }

  player.classList.add(
    "jumping"
  );

  setTimeout(() => {

    player.classList.remove(
      "jumping"
    );

  },480);
}


/* =========================
   DESLIZAR
========================= */

function slide(){

  if(
    player.classList.contains("sliding")
  ){
    return;
  }

  player.classList.add(
    "sliding"
  );

  setTimeout(() => {

    player.classList.remove(
      "sliding"
    );

  },420);
}


/* =========================
   OBSTÁCULO
========================= */

function spawnObstacle(){

  const el =
    document.createElement("div");

  el.className =
    "obstacle";

  if(
    Math.random() > .65
  ){

    el.classList.add(
      "blue"
    );

  }

  if(
    Math.random() > .82
  ){

    el.classList.add(
      "barrier"
    );

  }

  const obstacleLane =
    Math.floor(
      Math.random() * 3
    );

  el.style.left =
    lanes[obstacleLane];

  el.style.top =
    "-100px";

  game.appendChild(el);

  obstacles.push({

    element:el,

    lane:obstacleLane,

    y:-100

  });
}


/* =========================
   MOEDAS
========================= */

function spawnCoins(){

  const coinLane =
    Math.floor(
      Math.random() * 3
    );

  for(
    let i = 0;
    i < 4;
    i++
  ){

    const el =
      document.createElement("div");

    el.className =
      "coin";

    el.style.left =
      lanes[coinLane];

    const y =
      -50 - (i * 70);

    el.style.top =
      y + "px";

    game.appendChild(el);

    coinObjects.push({

      element:el,

      lane:coinLane,

      y:y

    });

  }
}


/* =========================
   COLISÃO
========================= */

function hit(a,b){

  const r1 =
    a.getBoundingClientRect();

  const r2 =
    b.getBoundingClientRect();

  return !(
    r1.right < r2.left + 8 ||

    r1.left > r2.right - 8 ||

    r1.bottom < r2.top + 8 ||

    r1.top > r2.bottom - 8
  );
}


/* =========================
   PEGAR MOEDA
========================= */

function collectCoin(c){

  c.element.remove();

  const index =
    coinObjects.indexOf(c);

  if(index >= 0){

    coinObjects.splice(
      index,
      1
    );

  }

  coins++;

  combo++;

  coinEl.textContent =
    coins;

  comboEl.textContent =
    "🔥 COMBO x" + combo;

  comboEl.style.opacity =
    "1";

  comboEl.style.transform =
    "scale(1.12)";

  setTimeout(() => {

    comboEl.style.transform =
      "scale(1)";

  },120);

  clearTimeout(
    window.comboTimer
  );

  window.comboTimer =
    setTimeout(() => {

      comboEl.style.opacity =
        "0";

    },650);

  if(
    navigator.vibrate
  ){

    navigator.vibrate(18);

  }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

  if(!running){
    return;
  }

  score =
    (time - startTime) / 1000;

  scoreEl.textContent =
    score.toFixed(1);

  const level =
    Math.floor(
      score / 15
    ) + 1;

  levelEl.textContent =
    "NÍVEL " + level;


  /*
    Jogo começa mais rápido
    e acelera gradualmente.
  */

  const speed =
    7 + (score * .12);


  /*
    Obstáculos aparecem
    progressivamente mais rápido.
  */

  const spawnDelay =
    Math.max(
      330,
      850 - score * 7
    );


  if(
    time - lastSpawn >
    spawnDelay
  ){

    spawnObstacle();

    lastSpawn =
      time;

  }


  if(
    time - lastCoin >
    1450
  ){

    spawnCoins();

    lastCoin =
      time;

  }


  /* =====================
     OBSTÁCULOS
  ===================== */

  for(
    let i = obstacles.length - 1;
    i >= 0;
    i--
  ){

    const o =
      obstacles[i];

    o.y += speed;

    o.element.style.top =
      o.y + "px";


    /*
      Se estiver pulando,
      o obstáculo passa por baixo.
    */

    const jumping =
      player.classList.contains(
        "jumping"
      );


    /*
      Barreiras podem ser
      evitadas deslizando.
    */

    const sliding =
      player.classList.contains(
        "sliding"
      );


    const isBarrier =
      o.element.classList.contains(
        "barrier"
      );


    if(
      o.lane === lane &&
      hit(
        player,
        o.element
      )
    ){

      if(jumping){

        /* passou por cima */

      }
      else if(
        isBarrier &&
        sliding
      ){

        /* passou por baixo */

      }
      else{

        endGame();

        return;

      }

    }


    if(
      o.y >
      window.innerHeight + 120
    ){

      o.element.remove();

      obstacles.splice(
        i,
        1
      );

    }

  }


  /* =====================
     MOEDAS
  ===================== */

  for(
    let i = coinObjects.length - 1;
    i >= 0;
    i--
  ){

    const c =
      coinObjects[i];

    c.y += speed;

    c.element.style.top =
      c.y + "px";


    if(
      c.lane === lane &&
      hit(
        player,
        c.element
      )
    ){

      collectCoin(c);

      continue;

    }


    if(
      c.y >
      window.innerHeight + 100
    ){

      c.element.remove();

      coinObjects.splice(
        i,
        1
      );

    }

  }


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   COMEÇAR
========================= */

function startGame(){

  obstacles.forEach(
    o => o.element.remove()
  );

  coinObjects.forEach(
    c => c.element.remove()
  );

  obstacles = [];

  coinObjects = [];

  lane = 1;

  score = 0;

  coins = 0;

  combo = 0;

  setLane(1);

  scoreEl.textContent =
    "0";

  coinEl.textContent =
    "0";

  comboEl.style.opacity =
    "0";

  document
    .getElementById(
      "startScreen"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "gameOver"
    )
    .style.display =
    "none";

  player.classList.add(
    "running"
  );

  running = true;

  startTime =
    performance.now();

  lastSpawn =
    performance.now();

  lastCoin =
    performance.now();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   GAME OVER
========================= */

function endGame(){

  if(!running){
    return;
  }

  running = false;

  player.classList.remove(
    "running"
  );

  player.classList.remove(
    "jumping"
  );

  player.classList.remove(
    "sliding"
  );


  flash.style.opacity =
    ".35";

  setTimeout(() => {

    flash.style.opacity =
      "0";

  },100);


  if(
    navigator.vibrate
  ){

    navigator.vibrate([
      100,
      50,
      180
    ]);

  }


  if(
    score > record
  ){

    record = score;

    localStorage.setItem(
      "ultimoSegundoRecorde",
      record.toString()
    );

  }


  recordEl.textContent =
    record.toFixed(1);


  document
    .getElementById(
      "finalScore"
    )
    .textContent =
    score.toFixed(1);


  document
    .getElementById(
      "finalRecord"
    )
    .textContent =
    record.toFixed(1);


  document
    .getElementById(
      "gameOver"
    )
    .style.display =
    "flex";
}


/* =========================
   CONTROLES
   ULTRA RESPONSIVOS
========================= */

let touchStartX = 0;

let touchStartY = 0;

let gestureDone = false;


/*
  Começou o toque.
*/

game.addEventListener(
  "touchstart",
  (e) => {

    if(!running){
      return;
    }

    touchStartX =
      e.touches[0].clientX;

    touchStartY =
      e.touches[0].clientY;

    gestureDone =
      false;

  },
  {
    passive:true
  }
);


/*
  Detectamos o movimento
  DURANTE o arrasto.

  Não esperamos o dedo
  levantar.
*/

game.addEventListener(
  "touchmove",
  (e) => {

    if(
      !running ||
      gestureDone
    ){

      return;

    }

    const x =
      e.touches[0].clientX;

    const y =
      e.touches[0].clientY;

    const dx =
      x - touchStartX;

    const dy =
      y - touchStartY;


    /*
      TROCA DE PISTA

      Apenas 15 pixels
      já são suficientes.
    */

    if(
      Math.abs(dx) > 15 &&
      Math.abs(dx) >
      Math.abs(dy)
    ){

      gestureDone =
        true;


      if(dx > 0){

        setLane(
          lane + 1
        );

      }
      else{

        setLane(
          lane - 1
        );

      }

      return;

    }


    /*
      PULO
    */

    if(
      dy < -30 &&
      Math.abs(dy) >
      Math.abs(dx)
    ){

      gestureDone =
        true;

      jump();

      return;

    }


    /*
      DESLIZAR
    */

    if(
      dy > 30 &&
      Math.abs(dy) >
      Math.abs(dx)
    ){

      gestureDone =
        true;

      slide();

    }

  },
  {
    passive:true
  }
);


/*
  Também permitimos
  clique rápido:

  toque no lado esquerdo
  ou direito da tela.
*/

game.addEventListener(
  "click",
  (e) => {

    if(!running){
      return;
    }

    /*
      Ignora o botão inicial
      e outras áreas.
    */

    const x =
      e.clientX;

    const width =
      window.innerWidth;


    if(x < width * .33){

      setLane(
        lane - 1
      );

    }
    else if(
      x > width * .66
    ){

      setLane(
        lane + 1
      );

    }

  }
);

</script>
