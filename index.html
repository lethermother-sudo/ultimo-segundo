<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Último Segundo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(1,3,10,.88);
  backdrop-filter:blur(8px);
}

.screen.show{
  display:flex;
}

.card{
  width:min(440px,94vw);
  max-height:90vh;
  overflow:auto;
  padding:28px 22px;
  border-radius:28px;
  border:1px solid rgba(70,225,255,.28);
  background:linear-gradient(145deg,rgba(7,17,38,.98),rgba(2,7,19,.98));
  box-shadow:0 0 60px rgba(20,180,255,.16);
  text-align:center;
}

.logo{
  color:#58e9ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:9px;
}

h1{
  margin:0;
  color:#fff;
  font-size:43px;
  line-height:.94;
  letter-spacing:-2px;
  text-shadow:0 0 15px rgba(40,230,255,.75);
}

.subtitle{
  margin:15px 0 23px;
  color:#91a7c2;
  font-size:12px;
  letter-spacing:1px;
}

button{
  appearance:none;
  border:0;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

.mainBtn{
  width:100%;
  padding:17px;
  border-radius:17px;
  font-size:18px;
  background:linear-gradient(100deg,#15ddff,#7c3cff);
  box-shadow:0 10px 30px rgba(25,200,255,.22);
}

.secondaryBtn{
  width:100%;
  margin-top:11px;
  padding:15px;
  border-radius:17px;
  font-size:14px;
  color:#ccecff;
  background:rgba(14,31,57,.86);
  border:1px solid rgba(94,234,255,.20);
}

.bestTitle{
  margin-top:20px;
  color:#667e9b;
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

#menuBest{
  margin-top:5px;
  color:#ffd83d;
  font-size:23px;
  font-weight:900;
}

.phaseGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0;
}

.phaseBtn{
  position:relative;
  min-height:80px;
  padding:9px 4px;
  border-radius:15px;
  background:linear-gradient(145deg,rgba(12,31,58,.96),rgba(4,13,28,.96));
  border:1px solid rgba(94,234,255,.15);
}

.phaseBtn .num{
  display:block;
  color:#5eeaff;
  font-size:21px;
  font-weight:900;
}

.phaseBtn .name{
  display:block;
  margin-top:4px;
  color:#aabdd3;
  font-size:8px;
  font-weight:900;
}

.phaseBtn .goal{
  display:block;
  margin-top:4px;
  color:#ffd83d;
  font-size:7px;
  font-weight:900;
}

.phaseBtn.locked{
  opacity:.3;
}

.phaseBtn.selected{
  border-color:#5eeaff;
  box-shadow:0 0 15px rgba(94,234,255,.18);
}

.lock{
  position:absolute;
  top:5px;
  right:6px;
}

.resultTitle{
  color:#5eeaff;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
}

.resultStats{
  color:#d7e6f8;
  font-size:15px;
  line-height:1.8;
  margin:18px 0 22px;
}

#hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  color:#fff;
}

#score{
  position:absolute;
  left:23px;
  top:calc(env(safe-area-inset-top) + 12px);
  font-size:42px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
}

#coins{
  position:absolute;
  left:26px;
  top:calc(env(safe-area-inset-top) + 62px);
  color:#ffd83d;
  font-size:17px;
  font-weight:900;
}

#target{
  position:absolute;
  left:26px;
  top:calc(env(safe-area-inset-top) + 91px);
  color:rgba(255,255,255,.64);
  font-size:10px;
  font-weight:900;
}

#progressBox{
  position:absolute;
  left:26px;
  right:26px;
  top:calc(env(safe-area-inset-top) + 111px);
  height:4px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.13);
}

#progress{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#16ddff,#8b3cff);
  box-shadow:0 0 12px #16ddff;
}

#speed{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 15px);
  color:#5eeaff;
  font-size:14px;
  font-weight:900;
}

#phaseHud{
  position:absolute;
  right:22px;
  top:calc(env(safe-area-inset-top) + 40px);
  color:#ffd83d;
  font-size:11px;
  font-weight:900;
  text-align:right;
  max-width:190px;
}

#sound{
  position:absolute;
  right:20px;
  top:calc(env(safe-area-inset-top) + 70px);
  pointer-events:auto;
  padding:8px 11px;
  border-radius:13px;
  color:#5eeaff;
  background:rgba(3,12,27,.82);
  border:1px solid rgba(94,234,255,.28);
  font-size:11px;
}

#hint{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  text-align:center;
  color:rgba(255,255,255,.43);
  font-size:10px;
  font-weight:700;
}

@media(max-width:380px){
  h1{font-size:35px}
  #score{font-size:36px}
  .phaseGrid{gap:6px}
  .phaseBtn{min-height:74px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="coins">● 0</div>
  <div id="target">META 1200</div>

  <div id="progressBox">
    <div id="progress"></div>
  </div>

  <div id="speed">VELOCIDADE 1.0x</div>
  <div id="phaseHud">FASE 1</div>

  <button id="sound">🔊 SOM</button>

  <div id="hint">
    ← → FAIXA • ↑ PULAR • ↓ DESLIZAR
  </div>
</div>

<div id="menu" class="screen show">
  <div class="card">
    <div class="logo">RUNNER EXPERIENCE</div>

    <h1>ÚLTIMO<br>SEGUNDO</h1>

    <div class="subtitle">
      CORRA • DESVIE • SOBREVIVA
    </div>

    <button id="play" class="mainBtn">
      ▶ JOGAR
    </button>

    <button id="phases" class="secondaryBtn">
      🎮 50 FASES
    </button>

    <div class="bestTitle">
      MELHOR PONTUAÇÃO
    </div>

    <div id="menuBest">0</div>
  </div>
</div>

<div id="phaseMenu" class="screen">
  <div class="card">
    <div class="logo">PROGRESSÃO</div>

    <h1 style="font-size:31px">
      50 FASES
    </h1>

    <div class="subtitle">
      A dificuldade aumenta conforme você avança.
    </div>

    <div id="phaseGrid" class="phaseGrid"></div>

    <button id="backMenu" class="secondaryBtn">
      ← VOLTAR
    </button>
  </div>
</div>

<div id="gameover" class="screen">
  <div class="card">
    <div class="resultTitle">CORRIDA ENCERRADA</div>

    <h1>FIM DE JOGO</h1>

    <div id="finalStats" class="resultStats">
      Pontuação: 0
    </div>

    <button id="again" class="mainBtn">
      🔄 TENTAR NOVAMENTE
    </button>

    <button id="overMenu" class="secondaryBtn">
      🏠 MENU
    </button>
  </div>
</div>

<div id="victory" class="screen">
  <div class="card">
    <div class="resultTitle">FASE CONCLUÍDA</div>

    <h1>🏆 VITÓRIA</h1>

    <div id="victoryStats" class="resultStats"></div>

    <button id="nextPhase" class="mainBtn">
      🚀 PRÓXIMA FASE
    </button>

    <button id="victoryMenu" class="secondaryBtn">
      🏠 MENU
    </button>
  </div>
</div>

<script>
(function(){

"use strict";

/* =========================
   ELEMENTOS
========================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var phaseMenu=document.getElementById("phaseMenu");
var gameover=document.getElementById("gameover");
var victory=document.getElementById("victory");

var play=document.getElementById("play");
var phases=document.getElementById("phases");
var again=document.getElementById("again");
var backMenu=document.getElementById("backMenu");
var overMenu=document.getElementById("overMenu");
var victoryMenu=document.getElementById("victoryMenu");
var nextPhase=document.getElementById("nextPhase");

var soundButton=document.getElementById("sound");
var phaseGrid=document.getElementById("phaseGrid");

var scoreEl=document.getElementById("score");
var coinsEl=document.getElementById("coins");
var targetEl=document.getElementById("target");
var progressEl=document.getElementById("progress");
var speedEl=document.getElementById("speed");
var phaseEl=document.getElementById("phaseHud");

var menuBest=document.getElementById("menuBest");
var finalStats=document.getElementById("finalStats");
var victoryStats=document.getElementById("victoryStats");


/* =========================
   CANVAS
========================= */

var W=0;
var H=0;
var dpr=1;

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   FASES
========================= */

var themes=[
  ["CIDADE NEON","#020617","#092b4a","#20dcff"],
  ["CENTRO FUTURISTA","#09021c","#24104a","#b45cff"],
  ["VIA NOTURNA","#020611","#102e3a","#35ffd2"],
  ["ZONA INDUSTRIAL","#120504","#4a1c08","#ff7b2f"],
  ["CYBER CITY","#10001c","#30104f","#ff35df"],
  ["DISTRITO VERMELHO","#180208","#52101d","#ff304f"],
  ["MEGA TÚNEL","#02030b","#16264c","#477cff"],
  ["CIDADE AÉREA","#03121a","#07506a","#29f7ff"],
  ["ZONA ZERO","#100008","#360015","#ff168f"],
  ["ÚLTIMO SEGUNDO","#05000f","#26005c","#a855ff"]
];

var phaseData={};

for(var p=1;p<=50;p++){

  var theme=themes[(p-1)%themes.length];

  var target=Math.floor(
    1200+
    (p-1)*560+
    Math.pow(p-1,1.20)*14
  );

  var maxSpeed=Math.min(
    2.05,
    .76+(p-1)*.026
  );

  phaseData[p]={
    name:
      p<=10
      ? theme[0]
      : theme[0]+" "+(Math.floor((p-1)/10)+1),

    target:target,
    maxSpeed:maxSpeed,
    difficulty:(p-1)/49,
    sky1:theme[1],
    sky2:theme[2],
    accent:theme[3]
  };
}


/* =========================
   PROGRESSÃO
========================= */

var currentPhase=Number(
  localStorage.getItem(
    "ultimoSegundoPhase"
  )||1
);

var unlockedPhase=Number(
  localStorage.getItem(
    "ultimoSegundoUnlocked"
  )||1
);

if(!Number.isFinite(currentPhase))
  currentPhase=1;

if(!Number.isFinite(unlockedPhase))
  unlockedPhase=1;

currentPhase=Math.max(
  1,
  Math.min(50,currentPhase)
);

unlockedPhase=Math.max(
  1,
  Math.min(50,unlockedPhase)
);

if(currentPhase>unlockedPhase)
  currentPhase=unlockedPhase;


/* =========================
   ESTADO
========================= */

var running=false;
var last=0;
var gameTime=0;

var score=0;
var coins=0;

var speed=.55;

var targetLane=1;
var laneVisual=1;

var jumpTime=0;
var slideTime=0;

var spawnTimer=0;
var coinTimer=0;

var objects=[];
var particles=[];
var speedLines=[];

var shake=0;

var combo=1;
var comboTimer=0;

var best=Number(
  localStorage.getItem(
    "ultimoSegundoBest"
  )||0
);


/* =========================
   ÁUDIO
   sem som contínuo
========================= */

var audioCtx=null;
var master=null;
var soundOn=true;

function initAudio(){

  try{

    var AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)
      return;

    if(!audioCtx){

      audioCtx=new AC();

      master=
        audioCtx.createGain();

      master.gain.value=
        soundOn?.32:0;

      master.connect(
        audioCtx.destination
      );
    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume().catch(
        function(){}
      );
    }

  }catch(e){}
}

function tone(
  frequency,
  duration,
  type,
  volume,
  endFrequency
){

  if(!soundOn)
    return;

  try{

    initAudio();

    if(!audioCtx||!master)
      return;

    var osc=
      audioCtx.createOscillator();

    var gain=
      audioCtx.createGain();

    var now=
      audioCtx.currentTime;

    osc.type=type||"sine";

    osc.frequency.setValueAtTime(
      frequency,
      now
    );

    if(endFrequency){

      osc.frequency.exponentialRampToValueAtTime(
        endFrequency,
        now+duration
      );
    }

    gain.gain.setValueAtTime(
      .001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      volume||.07,
      now+.015
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(now);

    osc.stop(
      now+duration+.03
    );

  }catch(e){}
}

function coinSound(){
  tone(
    700,
    .09,
    "sine",
    .09,
    1100
  );
}

function moveSound(){
  tone(
    220,
    .07,
    "triangle",
    .045,
    340
  );
}

function jumpSound(){
  tone(
    260,
    .14,
    "triangle",
    .07,
    560
  );
}

function slideSound(){
  tone(
    170,
    .12,
    "sawtooth",
    .035,
    90
  );
}

function hitSound(){
  tone(
    90,
    .25,
    "square",
    .11,
    45
  );
}

function victorySound(){

  tone(
    520,
    .14,
    "sine",
    .08,
    780
  );

  setTimeout(
    function(){
      tone(
        780,
        .20,
        "sine",
        .09,
        1200
      );
    },
    130
  );
}


/* =========================
   TELAS
========================= */

function hideScreens(){

  menu.classList.remove("show");
  phaseMenu.classList.remove("show");
  gameover.classList.remove("show");
  victory.classList.remove("show");
}

function updateMenu(){

  menuBest.textContent=
    Math.floor(best);
}


/* =========================
   MENU DE FASES
========================= */

function buildPhaseMenu(){

  phaseGrid.innerHTML="";

  for(
    var i=1;
    i<=50;
    i++
  ){

    var data=phaseData[i];

    var button=
      document.createElement("button");

    button.className="phaseBtn";

    if(i>unlockedPhase)
      button.classList.add("locked");

    if(i===currentPhase)
      button.classList.add("selected");

    button.innerHTML=
      '<span class="num">'+
      i+
      '</span>'+
      '<span class="name">'+
      data.name+
      '</span>'+
      '<span class="goal">'+
      data.target+
      ' PTS</span>'+
      (
        i>unlockedPhase
        ? '<span class="lock">🔒</span>'
        : ''
      );

    if(i<=unlockedPhase){

      button.onclick=(function(n){

        return function(){

          currentPhase=n;

          localStorage.setItem(
            "ultimoSegundoPhase",
            String(n)
          );

          startGame();
        };

      })(i);
    }

    phaseGrid.appendChild(button);
  }
}


/* =========================
   HUD
========================= */

function updateHUD(){

  var data=phaseData[currentPhase];

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    "● "+coins;

  targetEl.textContent=
    "META "+data.target;

  progressEl.style.width=
    Math.min(
      100,
      score/data.target*100
    )+"%";

  speedEl.textContent=
    "VELOCIDADE "+
    speed.toFixed(1)+"x";

  phaseEl.textContent=
    "FASE "+
    currentPhase+
    " • "+
    data.name;
}


/* =========================
   JOGO
========================= */

function resetGame(){

  running=true;

  last=performance.now();

  gameTime=0;

  score=0;
  coins=0;

  speed=.55;

  targetLane=1;
  laneVisual=1;

  jumpTime=0;
  slideTime=0;

  spawnTimer=.65;
  coinTimer=.4;

  objects=[];
  particles=[];
  speedLines=[];

  shake=0;

  combo=1;
  comboTimer=0;

  for(var i=0;i<24;i++){

    speedLines.push({
      x:Math.random(),
      y:Math.random(),
      z:Math.random()
    });
  }

  updateHUD();

  requestAnimationFrame(loop);
}

function startGame(){

  hideScreens();

  initAudio();

  resetGame();
}


/* =========================
   CONTROLES
========================= */

function moveLeft(){

  if(!running)
    return;

  if(targetLane>0){

    targetLane--;

    moveSound();
  }
}

function moveRight(){

  if(!running)
    return;

  if(targetLane<2){

    targetLane++;

    moveSound();
  }
}

function jump(){

  if(!running)
    return;

  if(
    jumpTime<=0&&
    slideTime<=0
  ){

    jumpTime=.78;

    jumpSound();

    createBurst(
      playerX(),
      playerY()-20,
      "#5eeaff",
      8
    );
  }
}

function slide(){

  if(!running)
    return;

  if(
    slideTime<=0&&
    jumpTime<=0
  ){

    slideTime=.58;

    slideSound();
  }
}

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft")
      moveLeft();

    else if(e.key==="ArrowRight")
      moveRight();

    else if(
      e.key==="ArrowUp"||
      e.key===" "
    )
      jump();

    else if(e.key==="ArrowDown")
      slide();
  }
);


/* =========================
   TOUCH
========================= */

var touchX=0;
var touchY=0;

document.addEventListener(
  "touchstart",
  function(e){

    if(!running)
      return;

    var t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

  },
  {passive:true}
);

document.addEventListener(
  "touchend",
  function(e){

    if(!running)
      return;

    var t=e.changedTouches[0];

    var dx=t.clientX-touchX;
    var dy=t.clientY-touchY;

    var ax=Math.abs(dx);
    var ay=Math.abs(dy);

    if(ax<22&&ay<22)
      return;

    if(ax>ay){

      if(dx>0)
        moveRight();
      else
        moveLeft();

    }else{

      if(dy<0)
        jump();
      else
        slide();
    }

  },
  {passive:true}
);


/* =========================
   PISTA
========================= */

function roadTop(){
  return H*.49;
}

function roadBottom(){
  return H*1.04;
}

function roadWidthAt(y){

  var t=
    Math.max(
      0,
      Math.min(
        1,
        (y-roadTop())/
        (roadBottom()-roadTop())
      )
    );

  return W*(.27+.72*t);
}

function laneX(l,y){

  var width=roadWidthAt(y);

  return W*.5+
    (l-1)*width*.305;
}

function playerX(){
  return laneX(
    laneVisual,
    H*.84
  );
}

function playerY(){

  var base=H*.84;

  if(jumpTime>0){

    var t=
      1-jumpTime/.78;

    return base-
      Math.sin(t*Math.PI)*
      H*.19;
  }

  return base;
}


/* =========================
   SPAWN
========================= */

function spawnObstacle(l,z,kind){

  objects.push({
    type:"obstacle",
    lane:l,
    z:z,
    kind:kind||"block",
    hit:false
  });
}

function spawnCoin(l,z){

  objects.push({
    type:"coin",
    lane:l,
    z:z,
    spin:Math.random()*6,
    collected:false
  });
}

function spawnPattern(){

  var d=phaseData[currentPhase];

  var r=Math.random();

  var z=1.08;

  if(r<.34){

    var l=
      Math.floor(Math.random()*3);

    spawnObstacle(
      l,
      z,
      Math.random()<.75
      ?"block"
      :"bar"
    );

    spawnCoin(
      (l+1+Math.floor(Math.random()*2))%3,
      z-.15
    );

  }else if(
    r<.60+d.difficulty*.10
  ){

    var free=
      Math.floor(Math.random()*3);

    for(
      var a=0;
      a<3;
      a++
    ){

      if(a!==free){

        spawnObstacle(
          a,
          z,
          Math.random()<.5
          ?"block"
          :"bar"
        );
      }
    }

    spawnCoin(
      free,
      z-.14
    );

  }else{

    var first=
      Math.floor(Math.random()*3);

    var second=
      (first+
      (Math.random()<.5?1:2))%3;

    spawnObstacle(
      first,
      z,
      "block"
    );

    spawnObstacle(
      second,
      z-.22,
      "bar"
    );

    spawnCoin(
      (second+1)%3,
      z-.38
    );

    if(d.difficulty>.55){

      var third=
        (second+1)%3;

      spawnObstacle(
        third,
        z-.55,
        "block"
      );
    }
  }
}

function spawnCoinLine(){

  var l=
    Math.floor(Math.random()*3);

  var count=
    3+
    Math.floor(Math.random()*3);

  for(
    var i=0;
    i<count;
    i++
  ){

    spawnCoin(
      l,
      1.03-i*.12
    );
  }
}


/* =========================
   PARTÍCULAS
========================= */

function createBurst(
  x,y,color,count
){

  for(
    var i=0;
    i<count;
    i++
  ){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*160,
      vy:(Math.random()-.5)*160,
      life:.45+Math.random()*.3,
      max:.75,
      size:2+Math.random()*4,
      color:color
    });
  }
}

function updateParticles(dt){

  for(
    var i=particles.length-1;
    i>=0;
    i--
  ){

    var p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=190*dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    ctx.save();

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );

    ctx.fillStyle=p.color;

    ctx.shadowBlur=12;
    ctx.shadowColor=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================
   VELOCIDADE
========================= */

function updateSpeedLines(dt){

  for(
    var i=0;
    i<speedLines.length;
    i++
  ){

    var s=speedLines[i];

    s.y+=
      dt*
      (.18+speed*.20)*
      (1+s.z*2);

    s.z+=
      dt*
      (.08+speed*.04);

    if(
      s.y>1||
      s.z>1
    ){

      s.x=Math.random();
      s.y=Math.random()*.15;
      s.z=0;
    }
  }
}

function drawSpeedLines(){

  ctx.save();

  for(
    var i=0;
    i<speedLines.length;
    i++
  ){

    var s=speedLines[i];

    var x=
      W*.5+
      (s.x-.5)*W*(.5+s.z*.7);

    var y=
      roadTop()+
      s.y*(H-roadTop());

    ctx.globalAlpha=
      .04+s.z*.14;

    ctx.strokeStyle=
      phaseData[currentPhase].accent;

    ctx.lineWidth=
      1+s.z*2;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.lineTo(
      x,
      y+8+s.z*35
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(dt){

  var data=phaseData[currentPhase];

  gameTime+=dt;

  var targetSpeed=
    Math.min(
      data.maxSpeed,
      .55+
      gameTime*.010+
      score/data.target*.55
    );

  speed+=
    (targetSpeed-speed)*
    Math.min(1,dt*3.5);

  laneVisual+=
    (targetLane-laneVisual)*
    Math.min(1,dt*30);

  if(jumpTime>0){

    jumpTime-=dt;

    if(jumpTime<0)
      jumpTime=0;
  }

  if(slideTime>0){

    slideTime-=dt;

    if(slideTime<0)
      slideTime=0;
  }


  /* spawn */

  spawnTimer-=dt;

  var interval=
    Math.max(
      .48,
      .92-
      currentPhase*.006-
      speed*.07
    );

  if(spawnTimer<=0){

    spawnPattern();

    spawnTimer=
      interval+
      Math.random()*.18;
  }

  coinTimer-=dt;

  if(coinTimer<=0){

    if(Math.random()<.52)
      spawnCoinLine();

    coinTimer=
      Math.max(
        .7,
        1.35-currentPhase*.008
      )+
      Math.random()*.3;
  }


  /* objetos */

  for(
    var i=objects.length-1;
    i>=0;
    i--
  ){

    var o=objects[i];

    o.z-=
      dt*
      (.25+speed*.32);


    /* moeda */

    if(
      o.type==="coin"&&
      !o.collected&&
      o.z<.18&&
      o.z>-.05&&
      o.lane===targetLane
    ){

      o.collected=true;

      coins++;

      score+=
        35*combo;

      combo++;

      comboTimer=1.8;

      createBurst(
        laneX(o.lane,H*.72),
        H*.72,
        "#ffd83d",
        9
      );

      coinSound();
    }


    /* obstáculo */

    if(
      o.type==="obstacle"&&
      !o.hit&&
      o.z<.16&&
      o.z>-.055&&
      o.lane===targetLane
    ){

      var avoided=false;

      if(o.kind==="bar"){

        if(jumpTime>0)
          avoided=true;

      }else{

        if(
          jumpTime>0||
          slideTime>0
        )
          avoided=true;
      }

      if(avoided){

        o.hit=true;

        score+=
          90*combo;

        combo++;

        comboTimer=1.8;

        createBurst(
          laneX(o.lane,H*.76),
          H*.76,
          "#5eeaff",
          7
        );

      }else{

        endGame();
        return;
      }
    }


    if(o.z<-.18){

      if(
        o.type==="obstacle"&&
        !o.hit
      ){

        score+=
          12*combo;
      }

      objects.splice(i,1);
    }
  }


  if(comboTimer>0){

    comboTimer-=dt;

  }else{

    combo=1;
  }


  score+=
    dt*
    (35+speed*28);

  updateParticles(dt);
  updateSpeedLines(dt);

  if(shake>0){

    shake-=dt*3;

    if(shake<0)
      shake=0;
  }


  if(score>=data.target){

    winGame();
    return;
  }

  updateHUD();
}


/* =========================
   FIM
========================= */

function endGame(){

  if(!running)
    return;

  running=false;

  hitSound();

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  finalStats.innerHTML=
    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+
    "Moedas: <b>"+
    coins+
    "</b><br>"+
    "Fase: <b>"+
    currentPhase+
    "</b><br><br>"+
    "Melhor pontuação: "+
    best;

  updateMenu();

  gameover.classList.add("show");
}

function winGame(){

  if(!running)
    return;

  running=false;

  victorySound();

  if(
    currentPhase<50&&
    unlockedPhase<currentPhase+1
  ){

    unlockedPhase=
      currentPhase+1;

    localStorage.setItem(
      "ultimoSegundoUnlocked",
      String(unlockedPhase)
    );
  }

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ultimoSegundoBest",
      String(best)
    );
  }

  victoryStats.innerHTML=
    "FASE "+
    currentPhase+
    " • "+
    phaseData[currentPhase].name+
    "<br><br>"+
    "Pontuação: <b>"+
    Math.floor(score)+
    "</b><br>"+
    "Moedas: <b>"+
    coins+
    "</b><br><br>"+
    (
      currentPhase<50
      ? "FASE "+
        (currentPhase+1)+
        " DESBLOQUEADA!"
      : "🏆 VOCÊ CHEGOU AO ÚLTIMO SEGUNDO!"
    );

  nextPhase.style.display=
    currentPhase>=50
    ?"none"
    :"block";

  updateMenu();

  victory.classList.add("show");
}


/* =========================
   DESENHO
========================= */

function drawBackground(){

  var data=phaseData[currentPhase];

  var g=
    ctx.createLinearGradient(
      0,0,0,H
    );

  g.addColorStop(0,data.sky1);
  g.addColorStop(.58,data.sky2);
  g.addColorStop(1,"#02040a");

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );

  ctx.save();

  ctx.globalAlpha=.13;
  ctx.fillStyle=data.accent;
  ctx.shadowBlur=60;
  ctx.shadowColor=data.accent;

  ctx.beginPath();

  ctx.arc(
    W*.72,
    H*.18,
    Math.min(W,H)*.12,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  for(
    var i=0;
    i<38;
    i++
  ){

    ctx.globalAlpha=
      .08+(i%5)*.025;

    ctx.fillStyle="#fff";

    ctx.fillRect(
      (i*97)%W,
      65+((i*61)%Math.floor(H*.35)),
      1,
      1
    );
  }

  ctx.globalAlpha=1;
}


function drawCity(){

  var horizon=roadTop();
  var data=phaseData[currentPhase];

  var offset=
    (gameTime*(18+speed*18))%90;

  for(
    var side=-1;
    side<=1;
    side+=2
  ){

    for(
      var i=0;
      i<12;
      i++
    ){

      var bw=
        35+
        ((i*31)%70);

      var bh=
        70+
        ((i*83)%180);

      var x;

      if(side<0)
        x=i*70-offset-bw;
      else
        x=W-i*70+offset;

      var y=horizon-bh;

      ctx.fillStyle="#010713";

      ctx.fillRect(
        x,y,bw,bh
      );

      ctx.fillStyle=
        "rgba(20,40,70,.8)";

      ctx.fillRect(
        x,y,bw,5
      );

      for(
        var wy=y+18;
        wy<horizon-8;
        wy+=19
      ){

        if(
          (i+Math.floor(wy))%4===0
        ){

          ctx.fillStyle=data.accent;
          ctx.globalAlpha=.25;

          ctx.fillRect(
            x+8,
            wy,
            3,
            6
          );
        }
      }

      ctx.globalAlpha=1;
    }
  }
}


function drawRoad(){

  var top=roadTop();
  var bottom=roadBottom();

  var tw=roadWidthAt(top);
  var bw=roadWidthAt(bottom);

  var center=W*.5;

  ctx.fillStyle="#030913";

  ctx.beginPath();

  ctx.moveTo(center-tw/2,top);
  ctx.lineTo(center+tw/2,top);
  ctx.lineTo(center+bw/2,bottom);
  ctx.lineTo(center-bw/2,bottom);
  ctx.closePath();

  ctx.fill();


  /* bordas */

  ctx.save();

  ctx.strokeStyle=
    phaseData[currentPhase].accent;

  ctx.shadowBlur=14;
  ctx.shadowColor=
    phaseData[currentPhase].accent;

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    center-tw/2,
    top
  );

  ctx.lineTo(
    center-bw/2,
    bottom
  );

  ctx.moveTo(
    center+tw/2,
    top
  );

  ctx.lineTo(
    center+bw/2,
    bottom
  );

  ctx.stroke();

  ctx.restore();


  /* faixas */

  for(
    var l=1;
    l<=2;
    l++
  ){

    ctx.strokeStyle=
      "rgba(45,190,240,.22)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      laneX(l,top),
      top
    );

    ctx.lineTo(
      laneX(l,bottom),
      bottom
    );

    ctx.stroke();
  }


  /* linhas de perspectiva */

  for(
    var i=0;
    i<13;
    i++
  ){

    var t=
      ((i/13)+
      gameTime*(.10+speed*.035))%1;

    var y=
      top+
      Math.pow(t,1.65)*
      (bottom-top);

    var width=roadWidthAt(y);

    ctx.globalAlpha=
      .07+t*.13;

    ctx.strokeStyle="#61dfff";

    ctx.lineWidth=
      1+t*2;

    ctx.beginPath();

    ctx.moveTo(
      center-width*.43,
      y
    );

    ctx.lineTo(
      center+width*.43,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================
   OBJETOS
========================= */

function objectY(z){

  var t=
    1-
    Math.max(
      0,
      Math.min(1,z)
    );

  return roadTop()+
    Math.pow(t,1.65)*
    (H*.84-roadTop());
}

function drawObstacle(o){

  var y=objectY(o.z);

  var size=
    22+
    (1-o.z)*145;

  var x=laneX(
    o.lane,
    y
  );

  ctx.save();

  if(o.kind==="bar"){

    var w=size*1.65;
    var h=Math.max(8,size*.28);

    ctx.shadowBlur=22;
    ctx.shadowColor="#ff3470";

    ctx.fillStyle="#111827";

    ctx.fillRect(
      x-w/2,
      y-h/2,
      w,
      h
    );

    ctx.strokeStyle="#ff3470";

    ctx.lineWidth=
      Math.max(2,size*.07);

    ctx.strokeRect(
      x-w/2,
      y-h/2,
      w,
      h
    );

    ctx.fillStyle="#ff527f";

    ctx.fillRect(
      x-w*.35,
      y-h*.10,
      w*.7,
      Math.max(3,h*.20)
    );

  }else{

    var ow=size*1.12;
    var oh=size*.78;

    ctx.shadowBlur=25;
    ctx.shadowColor="#ff245e";

    ctx.fillStyle="#0b1222";

    ctx.fillRect(
      x-ow/2,
      y-oh/2,
      ow,
      oh
    );

    ctx.strokeStyle="#ff245e";

    ctx.lineWidth=
      Math.max(3,size*.07);

    ctx.strokeRect(
      x-ow/2,
      y-oh/2,
      ow,
      oh
    );

    ctx.fillStyle="#ff315e";

    ctx.fillRect(
      x-ow*.32,
      y-oh*.08,
      size*.12,
      size*.12
    );

    ctx.fillRect(
      x+ow*.20,
      y-oh*.08,
      size*.12,
      size*.12
    );
  }

  ctx.restore();
}


function drawCoin(o){

  if(o.collected)
    return;

  var y=objectY(o.z);

  var x=laneX(
    o.lane,
    y
  );

  var r=
    5+
    (1-o.z)*18;

  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(
    Math.sin(
      gameTime*6+o.spin
    )*.18
  );

  ctx.shadowBlur=22;
  ctx.shadowColor="#ffd83d";

  ctx.fillStyle="#ffd83d";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*.72,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff4a6";

  ctx.beginPath();

  ctx.arc(
    -r*.22,
    -r*.28,
    Math.max(1,r*.18),
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   PERSONAGEM
========================= */

function drawRunner(){

  var x=playerX();
  var y=playerY();

  if(slideTime>0){

    drawSlidingRunner(
      x,y
    );

    return;
  }

  var cycle=
    Math.sin(
      gameTime*(13+speed*4)
    );

  var legA=cycle*12;
  var legB=-cycle*12;

  var armA=-cycle*11;
  var armB=cycle*11;


  /* sombra */

  ctx.save();

  ctx.globalAlpha=.25;
  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    H*.86,
    25,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  ctx.save();

  ctx.shadowBlur=22;
  ctx.shadowColor="#5eeaff";

  /* pernas */

  ctx.strokeStyle="#e7fbff";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(x-7,y+34);
  ctx.lineTo(x-7+legA,y+67);

  ctx.moveTo(x+7,y+34);
  ctx.lineTo(x+7+legB,y+67);

  ctx.stroke();


  /* pés */

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    x-7+legA,
    y+67
  );

  ctx.lineTo(
    x-18+legA,
    y+67
  );

  ctx.moveTo(
    x+7+legB,
    y+67
  );

  ctx.lineTo(
    x+18+legB,
    y+67
  );

  ctx.stroke();


  /* corpo */

  ctx.fillStyle="#10253b";

  ctx.beginPath();

  ctx.roundRect(
    x-13,
    y-2,
    26,
    39,
    8
  );

  ctx.fill();

  ctx.strokeStyle="#5eeaff";
  ctx.lineWidth=2;
  ctx.stroke();


  /* braços */

  ctx.strokeStyle="#e7fbff";
  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(x-11,y+6);
  ctx.lineTo(x-24+armA,y+31);

  ctx.moveTo(x+11,y+6);
  ctx.lineTo(x+24+armB,y+31);

  ctx.stroke();


  /* cabeça */

  ctx.fillStyle="#f3ffff";

  ctx.beginPath();

  ctx.arc(
    x,
    y-17,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* visor */

  ctx.fillStyle="#07101d";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y-18,
    12,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* núcleo */

  ctx.fillStyle="#5eeaff";
  ctx.shadowBlur=16;
  ctx.shadowColor="#5eeaff";

  ctx.beginPath();

  ctx.arc(
    x,
    y+17,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


function drawSlidingRunner(x,y){

  ctx.save();

  ctx.translate(
    x,
    y+28
  );

  ctx.shadowBlur=20;
  ctx.shadowColor="#5eeaff";

  ctx.strokeStyle="#e7fbff";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-2,14);
  ctx.lineTo(24,25);

  ctx.moveTo(-5,14);
  ctx.lineTo(-28,22);

  ctx.stroke();

  ctx.fillStyle="#10253b";

  ctx.fillRect(
    -25,
    -7,
    50,
    20
  );

  ctx.fillStyle="#f3ffff";

  ctx.beginPath();

  ctx.arc(
    26,
    -2,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#07101d";

  ctx.beginPath();

  ctx.ellipse(
    29,
    -4,
    9,
    4,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   OBJETOS NA PISTA
========================= */

function drawObjects(){

  var sorted=
    objects.slice().sort(
      function(a,b){
        return b.z-a.z;
      }
    );

  for(
    var i=0;
    i<sorted.length;
    i++
  ){

    if(sorted[i].type==="coin")
      drawCoin(sorted[i]);
    else
      drawObstacle(sorted[i]);
  }
}


/* =========================
   LOOP
========================= */

function loop(now){

  if(!running)
    return;

  var dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  draw();

  if(running)
    requestAnimationFrame(loop);
}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.save();

  if(shake>0){

    var amount=shake*7;

    ctx.translate(
      (Math.random()-.5)*amount,
      (Math.random()-.5)*amount
    );
  }

  drawBackground();
  drawCity();
  drawSpeedLines();
  drawRoad();
  drawObjects();
  drawRunner();
  drawParticles();

  ctx.restore();
}


/* =========================
   BOTÕES
========================= */

play.addEventListener(
  "click",
  function(){
    startGame();
  }
);

again.addEventListener(
  "click",
  function(){
    startGame();
  }
);

phases.addEventListener(
  "click",
  function(){

    hideScreens();

    buildPhaseMenu();

    phaseMenu.classList.add("show");
  }
);

backMenu.addEventListener(
  "click",
  function(){

    hideScreens();

    updateMenu();

    menu.classList.add("show");
  }
);

overMenu.addEventListener(
  "click",
  function(){

    hideScreens();

    updateMenu();

    menu.classList.add("show");
  }
);

victoryMenu.addEventListener(
  "click",
  function(){

    hideScreens();

    updateMenu();

    menu.classList.add("show");
  }
);

nextPhase.addEventListener(
  "click",
  function(){

    if(currentPhase>=50)
      return;

    currentPhase++;

    if(currentPhase>unlockedPhase){

      unlockedPhase=currentPhase;

      localStorage.setItem(
        "ultimoSegundoUnlocked",
        String(unlockedPhase)
      );
    }

    localStorage.setItem(
      "ultimoSegundoPhase",
      String(currentPhase)
    );

    startGame();
  }
);

soundButton.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    soundOn=!soundOn;

    soundButton.textContent=
      soundOn
      ?"🔊 SOM"
      :"🔇 SOM";

    if(soundOn){

      initAudio();

      if(master)
        master.gain.value=.32;

      tone(
        520,
        .10,
        "sine",
        .06,
        720
      );

    }else{

      if(master)
        master.gain.value=0;
    }
  }
);


/* =========================
   INICIALIZAÇÃO
========================= */

updateMenu();
buildPhaseMenu();
updateHUD();

drawBackground();
drawCity();
drawRoad();

})();
