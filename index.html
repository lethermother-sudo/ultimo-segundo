<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040b">
<title>Último Segundo — Neon Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{position:fixed;inset:0}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
.hidden{display:none!important}

/* ================= MENU ================= */

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.menuBG{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 25%,rgba(0,238,255,.20),transparent 32%),
    radial-gradient(circle at 80% 80%,rgba(255,0,180,.16),transparent 30%),
    linear-gradient(180deg,#02050e,#030714 55%,#010208);
}

.menuBG:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.16;
  background-image:
    linear-gradient(rgba(0,220,255,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.2) 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(450px) rotateX(58deg) scale(1.8);
  transform-origin:center bottom;
}

.card{
  position:relative;
  width:min(720px,94vw);
  padding:30px 22px;
  border-radius:30px;
  background:rgba(3,8,18,.91);
  border:1px solid rgba(0,235,255,.48);
  box-shadow:
    0 0 70px rgba(0,220,255,.13),
    inset 0 0 50px rgba(0,150,255,.04);
  text-align:center;
}

.logo{
  font-size:clamp(43px,10vw,76px);
  font-weight:1000;
  line-height:.86;
  letter-spacing:-3px;
  text-shadow:
    0 0 8px white,
    0 0 25px #00eaff,
    0 0 55px rgba(0,234,255,.4);
}

.tag{
  margin-top:16px;
  color:#94a8bb;
  letter-spacing:8px;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:30px 0;
}

.stat{
  padding:17px 5px;
  background:#07111f;
  border:1px solid rgba(255,255,255,.05);
  border-radius:18px;
}
.stat b{font-size:28px}
.stat span{
  display:block;
  margin-top:6px;
  color:#73859a;
  font-size:10px;
  letter-spacing:1px;
}

.bigBtn{
  width:100%;
  border:0;
  border-radius:19px;
  padding:20px;
  margin-top:10px;
  background:linear-gradient(135deg,#00eaff,#00a9e0);
  color:#001018;
  font-weight:1000;
  font-size:18px;
  letter-spacing:2px;
  box-shadow:0 0 28px rgba(0,220,255,.18);
}
.bigBtn:active{transform:scale(.98)}
.bigBtn.secondary{
  background:#0a1727;
  color:#d9faff;
  border:1px solid #23455e;
}

/* ================= FASES ================= */

.phaseGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  max-height:65vh;
  overflow:auto;
  margin:25px 0 10px;
}
.phase{
  height:55px;
  border-radius:14px;
  border:1px solid #20384d;
  background:#07101d;
  color:#fff;
  font-weight:900;
}
.phase.lock{opacity:.28}
.phase.current{
  border-color:#00eaff;
  box-shadow:0 0 16px #00eaff44;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  inset:0;
  z-index:8;
  pointer-events:none;
}

.top{
  position:absolute;
  top:max(9px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr 1fr;
  gap:6px;
}

.box{
  padding:8px 4px;
  border-radius:14px;
  background:rgba(2,7,16,.76);
  border:1px solid rgba(0,220,255,.17);
  text-align:center;
  backdrop-filter:blur(8px);
}
.box small{
  display:block;
  color:#6e8195;
  font-size:8px;
  letter-spacing:1px;
}
.box b{
  display:block;
  margin-top:3px;
  font-size:16px;
}

.objective{
  position:absolute;
  top:105px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 17px;
  border-radius:30px;
  background:rgba(2,7,15,.52);
  border:1px solid rgba(0,220,255,.14);
  color:#e6fcff;
  font-weight:1000;
  font-size:11px;
  letter-spacing:2px;
  white-space:nowrap;
}

#cross{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
}
#cross:before,#cross:after{
  content:"";
  position:absolute;
  background:#d9ffff;
  box-shadow:0 0 10px #00eaff;
}
#cross:before{
  width:28px;height:2px;top:13px;
}
#cross:after{
  width:2px;height:28px;left:13px;
}

#hit{
  position:absolute;
  left:50%;
  top:50%;
  width:42px;
  height:42px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.4);
  opacity:0;
}
.hitAnim{animation:hit .2s}
@keyframes hit{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}

/* ================= ARMA ================= */

#gun{
  position:absolute;
  right:-20px;
  bottom:72px;
  width:265px;
  height:230px;
  transform:rotate(-7deg);
  filter:drop-shadow(0 10px 15px #000);
}

.gunBody{
  position:absolute;
  right:18px;
  top:55px;
  width:205px;
  height:70px;
  border-radius:16px 38px 13px 13px;
  background:
    linear-gradient(150deg,#263443 0%,#111a25 42%,#050a10 43%,#151f2b);
  border:2px solid #40566a;
}
.gunBody:before{
  content:"";
  position:absolute;
  left:16px;
  top:12px;
  width:105px;
  height:8px;
  border-radius:8px;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
}
.gunBody:after{
  content:"";
  position:absolute;
  left:20px;
  bottom:10px;
  width:60px;
  height:5px;
  background:#ff25c8;
  box-shadow:0 0 12px #ff25c8;
}

.gunTop{
  position:absolute;
  right:75px;
  top:35px;
  width:112px;
  height:28px;
  border-radius:9px;
  background:#0b1119;
  border:2px solid #304354;
}

.gunBarrel{
  position:absolute;
  right:-2px;
  top:70px;
  width:55px;
  height:27px;
  border-radius:4px 15px 15px 4px;
  background:#03070c;
  border:2px solid #314658;
}

.grip{
  position:absolute;
  right:102px;
  top:110px;
  width:48px;
  height:105px;
  border-radius:9px 9px 22px 22px;
  background:linear-gradient(90deg,#070c12,#3d4d5b,#0b121a);
  transform:rotate(13deg);
}

.energy{
  position:absolute;
  right:32px;
  top:78px;
  width:48px;
  height:8px;
  background:#00eaff;
  box-shadow:0 0 18px #00eaff;
}

/* ================= CONTROLES ================= */

.bottom{
  position:absolute;
  left:13px;
  right:13px;
  bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.ammo{
  width:185px;
  color:#e9f8ff;
}
.weaponName{
  color:#91a7ba;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:6px;
}
.ammoText{
  font-size:17px;
  font-weight:1000;
}
.ammoBar{
  height:6px;
  margin-top:7px;
  background:#182535;
  border-radius:10px;
  overflow:hidden;
}
#ammoFill{
  width:100%;
  height:100%;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.ctrl{
  width:78px;
  height:60px;
  border-radius:24px;
  border:1px solid #34475a;
  background:rgba(4,12,23,.84);
  color:white;
  font-size:10px;
  font-weight:1000;
}
.fire{
  width:96px;
  height:96px;
  border-radius:50%;
  border:1px solid #00eaff88;
  background:rgba(0,47,68,.82);
  color:white;
  font-size:14px;
  font-weight:1000;
  box-shadow:0 0 28px #00dfff22;
}
.fire:active{
  transform:scale(.92);
  background:#00bcd4;
}

/* ================= TOAST ================= */

#toast{
  position:absolute;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%) scale(.8);
  padding:14px 22px;
  border-radius:17px;
  background:rgba(2,8,16,.92);
  border:1px solid #00eaff;
  color:white;
  font-weight:1000;
  letter-spacing:2px;
  opacity:0;
  transition:.2s;
  white-space:nowrap;
}
#toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* ================= RESULTADO ================= */

#result{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(1,4,10,.78);
  backdrop-filter:blur(10px);
  padding:20px;
}
.resultCard{
  width:min(470px,92vw);
  padding:30px 22px;
  border-radius:27px;
  background:#050c18;
  border:1px solid #00eaff;
  text-align:center;
  box-shadow:0 0 60px #00eaff18;
}
.resultCard h1{
  margin:0 0 12px;
  font-size:34px;
}
.resultCard p{
  color:#91a5b9;
  line-height:1.5;
}

@media(max-width:520px){
  .phaseGrid{grid-template-columns:repeat(4,1fr)}
  #gun{
    transform:scale(.72) rotate(-7deg);
    transform-origin:right bottom;
    right:-12px;
    bottom:72px;
  }
  .ammo{width:145px}
  .fire{width:84px;height:84px}
  .ctrl{width:67px;height:55px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ================= MENU ================= -->

<div id="home" class="screen">
  <div class="menuBG"></div>

  <div class="card">

    <div class="logo">
      ÚLTIMO<br>SEGUNDO
    </div>

    <div class="tag">NEON STRIKE</div>

    <div class="stats">
      <div class="stat">
        <b>50</b>
        <span>FASES</span>
      </div>
      <div class="stat">
        <b>5</b>
        <span>ARMAS</span>
      </div>
      <div class="stat">
        <b>5</b>
        <span>BOSSES</span>
      </div>
    </div>

    <button id="start" class="bigBtn">
      INICIAR MISSÃO
    </button>

    <button id="phases" class="bigBtn secondary">
      SELECIONAR FASE
    </button>

  </div>
</div>

<!-- ================= FASES ================= -->

<div id="phaseScreen" class="screen hidden">
  <div class="menuBG"></div>

  <div class="card">

    <div class="logo" style="font-size:43px">
      FASES
    </div>

    <div class="tag">
      ESCOLHA SUA MISSÃO
    </div>

    <div id="phaseGrid" class="phaseGrid"></div>

    <button id="back" class="bigBtn secondary">
      VOLTAR
    </button>

  </div>
</div>

<!-- ================= HUD ================= -->

<div id="hud" class="hidden">

  <div class="top">

    <div class="box">
      <small>ALVOS</small>
      <b id="targetText">0/8</b>
    </div>

    <div class="box">
      <small id="worldText">CIDADE NEON</small>
      <b id="phaseText">FASE 1</b>
    </div>

    <div class="box">
      <small>VIDA</small>
      <b id="lifeText">❤️❤️❤️</b>
    </div>

    <div class="box">
      <small>MOEDAS</small>
      <b id="coinText">0</b>
    </div>

  </div>

  <div id="objective" class="objective">
    ELIMINE OS ALVOS
  </div>

  <div id="cross"></div>
  <div id="hit"></div>
  <div id="toast"></div>

  <!-- arma -->
  <div id="gun">
    <div class="gunTop"></div>
    <div class="gunBody"></div>
    <div class="gunBarrel"></div>
    <div class="grip"></div>
    <div class="energy"></div>
  </div>

  <div class="bottom">

    <div class="ammo">

      <div id="weaponName" class="weaponName">
        NEON PISTOL
      </div>

      <div class="ammoText">
        MUNIÇÃO <span id="ammoText">18 / 72</span>
      </div>

      <div class="ammoBar">
        <div id="ammoFill"></div>
      </div>

    </div>

    <div class="controls">

      <button id="reload" class="ctrl">
        RECARREGAR
      </button>

      <button id="fire" class="fire">
        ATIRAR
      </button>

    </div>

  </div>

</div>

<!-- ================= RESULTADO ================= -->

<div id="result" class="hidden">

  <div class="resultCard">

    <h1 id="resultTitle">
      FASE CONCLUÍDA
    </h1>

    <p id="resultText">
      Missão concluída.
    </p>

    <button id="next" class="bigBtn">
      PRÓXIMA FASE
    </button>

    <button id="resultMenu" class="bigBtn secondary">
      MENU PRINCIPAL
    </button>

  </div>

</div>

<script>
/* =========================================================
   NEON STRIKE
   MOTOR 2D CINEMÁTICO
   SEM BIBLIOTECAS EXTERNAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* ================= ELEMENTOS ================= */

const home=document.getElementById("home");
const phaseScreen=document.getElementById("phaseScreen");
const hud=document.getElementById("hud");
const result=document.getElementById("result");

const targetText=document.getElementById("targetText");
const worldText=document.getElementById("worldText");
const phaseText=document.getElementById("phaseText");
const lifeText=document.getElementById("lifeText");
const coinText=document.getElementById("coinText");
const objective=document.getElementById("objective");

const ammoText=document.getElementById("ammoText");
const ammoFill=document.getElementById("ammoFill");
const weaponName=document.getElementById("weaponName");

const gun=document.getElementById("gun");
const hit=document.getElementById("hit");
const toast=document.getElementById("toast");

/* ================= MUNDOS ================= */

const WORLDS=[
  {
    name:"CIDADE NEON",
    sky:"#020816",
    horizon:"#00eaff",
    neon:"#00eaff",
    second:"#ff2bd6",
    rain:false,
    tunnel:false
  },
  {
    name:"DISTRITO CHUVOSO",
    sky:"#030713",
    horizon:"#3b8cff",
    neon:"#46aaff",
    second:"#a34dff",
    rain:true,
    tunnel:false
  },
  {
    name:"ZONA INDUSTRIAL",
    sky:"#100603",
    horizon:"#ff6420",
    neon:"#ff8a28",
    second:"#ff214d",
    rain:false,
    tunnel:false
  },
  {
    name:"CIDADE SUSPENSA",
    sky:"#070215",
    horizon:"#bd43ff",
    neon:"#df4dff",
    second:"#00eaff",
    rain:false,
    tunnel:false
  },
  {
    name:"MEGA TÚNEL",
    sky:"#020909",
    horizon:"#00ffb7",
    neon:"#00ffb7",
    second:"#00bfff",
    rain:false,
    tunnel:true
  },
  {
    name:"BASE TECNOLÓGICA",
    sky:"#02050c",
    horizon:"#bceeff",
    neon:"#dffbff",
    second:"#518dff",
    rain:false,
    tunnel:true
  },
  {
    name:"CIDADE NOTURNA",
    sky:"#09020d",
    horizon:"#ff40bd",
    neon:"#ff39cb",
    second:"#5e72ff",
    rain:true,
    tunnel:false
  },
  {
    name:"ZONA VERMELHA",
    sky:"#110202",
    horizon:"#ff2638",
    neon:"#ff3048",
    second:"#ff9d27",
    rain:false,
    tunnel:false
  },
  {
    name:"MEGA CITY",
    sky:"#02050d",
    horizon:"#00d0ff",
    neon:"#00eaff",
    second:"#ffd426",
    rain:false,
    tunnel:false
  },
  {
    name:"ZONA FINAL",
    sky:"#060008",
    horizon:"#ff00ad",
    neon:"#ff00db",
    second:"#00f7ff",
    rain:true,
    tunnel:false
  }
];

/* ================= ARMAS ================= */

const WEAPONS=[
  {
    name:"NEON PISTOL",
    ammo:18,
    reserve:72,
    damage:1,
    rate:270,
    color:"#00eaff"
  },
  {
    name:"VOLT SMG",
    ammo:30,
    reserve:120,
    damage:1,
    rate:115,
    color:"#4b8cff"
  },
  {
    name:"CYBER RIFLE",
    ammo:24,
    reserve:96,
    damage:2,
    rate:190,
    color:"#ff39d4"
  },
  {
    name:"PLASMA X",
    ammo:12,
    reserve:60,
    damage:3,
    rate:420,
    color:"#ff7629"
  },
  {
    name:"OMEGA CANNON",
    ammo:8,
    reserve:40,
    damage:6,
    rate:700,
    color:"#fff04d"
  }
];

function world(){
  return WORLDS[Math.floor((phase-1)/5)];
}
function weapon(){
  return WEAPONS[Math.min(4,Math.floor((phase-1)/10))];
}
function targetGoal(){
  return 8+Math.floor((phase-1)*.65);
}
function isBoss(){
  return phase%10===0;
}

/* ================= ESTADO ================= */

let phase=1;
let unlocked=Number(localStorage.getItem("ultimoSegundoUnlocked")||1);

let playing=false;
let targets=0;
let goal=8;
let lives=3;
let coins=0;

let ammo=18;
let reserve=72;

let enemies=[];
let particles=[];
let buildings=[];
let lights=[];
let rain=[];
let stars=[];

let spawnTimer=0;
let lastShot=0;
let lastTime=0;
let flash=0;
let shake=0;
let toastTimer=0;

/* ================= MENU ================= */

document.getElementById("start").onclick=()=>{
  startGame(1);
};

document.getElementById("phases").onclick=()=>{
  openPhases();
};

document.getElementById("back").onclick=()=>{
  phaseScreen.classList.add("hidden");
  home.classList.remove("hidden");
};

document.getElementById("fire").onclick=shoot;
document.getElementById("reload").onclick=reload;

document.getElementById("resultMenu").onclick=()=>{
  result.classList.add("hidden");
  showHome();
};

document.getElementById("next").onclick=()=>{
  result.classList.add("hidden");
  startGame(Math.min(50,phase+1));
};

/* ================= FASES ================= */

function openPhases(){

  home.classList.add("hidden");
  phaseScreen.classList.remove("hidden");

  const grid=document.getElementById("phaseGrid");
  grid.innerHTML="";

  for(let i=1;i<=50;i++){

    const b=document.createElement("button");

    b.className="phase";

    if(i>unlocked){
      b.classList.add("lock");
      b.textContent="🔒 "+i;
      b.disabled=true;
    }else{

      b.textContent=i;

      if(i===phase){
        b.classList.add("current");
      }

      b.onclick=()=>{
        startGame(i);
      };
    }

    grid.appendChild(b);
  }
}

/* ================= INICIAR ================= */

function startGame(p){

  phase=Math.max(1,Math.min(50,p));

  playing=true;

  targets=0;
  goal=targetGoal();
  lives=3;
  coins=0;

  enemies=[];
  particles=[];

  const w=weapon();

  ammo=w.ammo;
  reserve=w.reserve;

  home.classList.add("hidden");
  phaseScreen.classList.add("hidden");
  result.classList.add("hidden");
  hud.classList.remove("hidden");

  buildWorld();
  updateHUD();

  showToast(
    isBoss() ? "⚠ BOSS DETECTADO" : "FASE "+phase
  );
}

/* ================= HOME ================= */

function showHome(){
  playing=false;
  hud.classList.add("hidden");
  result.classList.add("hidden");
  phaseScreen.classList.add("hidden");
  home.classList.remove("hidden");
}

/* ================= HUD ================= */

function updateHUD(){

  const w=weapon();

  targetText.textContent=targets+"/"+goal;
  worldText.textContent=world().name;
  phaseText.textContent="FASE "+phase;

  lifeText.textContent=
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);

  coinText.textContent=coins;

  objective.textContent=
    isBoss()
      ? "ELIMINE O BOSS"
      : "ELIMINE "+goal+" ALVOS";

  weaponName.textContent=w.name;
  ammoText.textContent=ammo+" / "+reserve;

  ammoFill.style.width=
    Math.max(0,ammo/w.ammo*100)+"%";

  ammoFill.style.background=w.color;
  ammoFill.style.boxShadow="0 0 12px "+w.color;

  gun.querySelector(".energy").style.background=w.color;
  gun.querySelector(".energy").style.boxShadow="0 0 18px "+w.color;
  gun.querySelector(".gunBody").style.borderColor=w.color+"66";
}

/* ================= MUNDO ================= */

function buildWorld(){

  const w=world();

  buildings=[];
  lights=[];
  rain=[];
  stars=[];

  for(let i=0;i<110;i++){

    stars.push({
      x:Math.random(),
      y:Math.random()*.48,
      s:.5+Math.random()*2,
      a:.2+Math.random()*.7
    });
  }

  for(let i=0;i<38;i++){

    buildings.push({
      x:i/38+Math.random()*.018,
      width:.018+Math.random()*.04,
      height:.07+Math.random()*.28,
      neon:i%2?w.neon:w.second,
      depth:Math.random()
    });
  }

  for(let i=0;i<24;i++){

    lights.push({
      side:i%2?-1:1,
      p:i/24,
      phase:Math.random()*6
    });
  }

  if(w.rain){

    for(let i=0;i<170;i++){

      rain.push({
        x:Math.random(),
        y:Math.random(),
        speed:.4+Math.random()*.8,
        len:8+Math.random()*18
      });
    }
  }
}

/* ================= PROJEÇÃO ================= */

function project(e){

  const z=Math.max(.07,e.z);

  const p=1/z;

  const horizon=H*.44;

  const y=
    horizon+
    Math.min(H*.65,Math.pow(Math.min(1,p/8),.72)*H*.7);

  const roadWidth=
    Math.min(W*.88,W*.10+p*W*.11);

  return{
    x:W/2+e.lane*roadWidth*.27,
    y:y,
    scale:Math.max(.35,Math.min(3.2,p*.13))
  };
}

/* ================= SPAWN ================= */

function spawn(){

  if(!playing||targets>=goal)return;

  const boss=isBoss()&&enemies.length===0;

  enemies.push({
    lane:Math.floor(Math.random()*3)-1,
    z:1,
    hp:boss?18:1+Math.floor((phase-1)/12),
    max:boss?18:1+Math.floor((phase-1)/12),
    boss,
    alive:true,
    wobble:Math.random()*7,
    hit:0
  });
}

/* ================= TIRO ================= */

function shoot(){

  if(!playing)return;

  const now=performance.now();
  const w=weapon();

  if(now-lastShot<w.rate)return;

  lastShot=now;

  if(ammo<=0){
    showToast("SEM MUNIÇÃO");
    return;
  }

  ammo--;
  flash=1;
  shake=.5;

  muzzle();

  let best=null;
  let depth=Infinity;

  for(const e of enemies){

    if(!e.alive)continue;

    const p=project(e);

    const dx=Math.abs(p.x-W/2);
    const dy=Math.abs(p.y-H*.5);

    const tolerance=e.boss?190:140;

    if(dx<tolerance&&dy<190&&e.z<depth){

      best=e;
      depth=e.z;
    }
  }

  if(best){

    best.hp-=w.damage;
    best.hit=1;

    hit.classList.remove("hitAnim");
    void hit.offsetWidth;
    hit.classList.add("hitAnim");

    const p=project(best);

    explosion(
      p.x,
      p.y,
      best.boss?35:18
    );

    if(best.hp<=0){

      best.alive=false;

      if(best.boss){

        targets=goal;
        coins+=20;

      }else{

        targets++;
        coins++;

        if(Math.random()<.16){
          coins++;
        }
      }

      updateHUD();

      if(targets>=goal){
        setTimeout(complete,450);
      }
    }
  }

  updateHUD();
}

/* ================= RELOAD ================= */

function reload(){

  if(!playing)return;

  const w=weapon();

  if(ammo>=w.ammo||reserve<=0)return;

  const need=w.ammo-ammo;
  const amount=Math.min(need,reserve);

  ammo+=amount;
  reserve-=amount;

  updateHUD();
}

/* ================= MUZZLE ================= */

function muzzle(){

  for(let i=0;i<16;i++){

    particles.push({
      x:W*.84,
      y:H*.69,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:.25+Math.random()*.3,
      size:2+Math.random()*5,
      color:"#ffffff"
    });
  }
}

/* ================= EXPLOSÃO ================= */

function explosion(x,y,count){

  const w=world();

  for(let i=0;i<count;i++){

    const a=Math.random()*Math.PI*2;
    const s=1+Math.random()*7;

    particles.push({
      x,
      y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:.5+Math.random()*.7,
      size:2+Math.random()*6,
      color:i%2?w.neon:w.second
    });
  }
}

/* ================= PARTÍCULAS ================= */

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt*60;
    p.y+=p.vy*dt*60;

    p.vy+=.08;
    p.life-=dt*1.9;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=Math.max(0,p.life);

    ctx.fillStyle=p.color;
    ctx.shadowBlur=15;
    ctx.shadowColor=p.color;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* ================= CENÁRIO ================= */

function drawWorld(t){

  const w=world();

  /* céu */

  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,w.sky);
  sky.addColorStop(.42,w.sky);
  sky.addColorStop(.56,w.horizon);
  sky.addColorStop(1,"#010207");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* estrelas */

  for(const s of stars){

    ctx.globalAlpha=s.a;
    ctx.fillStyle="#d7fbff";

    ctx.fillRect(
      s.x*W,
      s.y*H,
      s.s,
      s.s
    );
  }

  ctx.globalAlpha=1;

  const horizon=H*.44;

  /* glow */

  const glow=ctx.createRadialGradient(
    W/2,
    horizon,
    10,
    W/2,
    horizon,
    W*.58
  );

  glow.addColorStop(0,w.horizon+"aa");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.fillRect(0,horizon-170,W,320);

  /* cidade */

  for(const b of buildings){

    const x=b.x*W;
    const bw=b.width*W;
    const bh=b.height*H;

    ctx.fillStyle=
      b.depth>.5
        ? "#030914"
        : "#050c17";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );

    const rows=Math.floor(bh/15)+2;

    for(let r=0;r<rows;r++){

      if((r+Math.floor(x))%3!==0){

        ctx.fillStyle=b.neon;
        ctx.globalAlpha=.28;

        ctx.fillRect(
          x+bw*.18,
          horizon-bh+r*15+5,
          Math.max(2,bw*.17),
          4
        );

        ctx.fillStyle=b.second;

        ctx.fillRect(
          x+bw*.62,
          horizon-bh+r*15+5,
          Math.max(2,bw*.12),
          4
        );
      }
    }

    ctx.globalAlpha=1;
  }

  /* estrada */

  const top=H*.44;

  ctx.fillStyle=
    w.tunnel
      ? "#020b0d"
      : "#030812";

  ctx.beginPath();

  ctx.moveTo(W*.45,top);
  ctx.lineTo(W*.55,top);
  ctx.lineTo(W*1.08,H);
  ctx.lineTo(-W*.08,H);
  ctx.closePath();

  ctx.fill();

  /* bordas */

  ctx.strokeStyle=w.neon;
  ctx.lineWidth=3;
  ctx.shadowBlur=18;
  ctx.shadowColor=w.neon;

  ctx.beginPath();
  ctx.moveTo(W*.45,top);
  ctx.lineTo(-W*.08,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.55,top);
  ctx.lineTo(W*1.08,H);
  ctx.stroke();

  ctx.shadowBlur=0;

  /* centro */

  for(let i=0;i<14;i++){

    const p=(i/14+(t*.00008))%1;

    const y=
      top+
      Math.pow(p,2)*H*.67;

    const size=
      2+p*8;

    ctx.fillStyle=w.second;
    ctx.shadowBlur=12;
    ctx.shadowColor=w.second;

    ctx.fillRect(
      W/2-size/2,
      y,
      size,
      size*(2+p*4)
    );
  }

  ctx.shadowBlur=0;

  /* postes */

  for(const l of lights){

    const p=(l.p+t*.000025)%1;

    const y=
      top+
      Math.pow(p,2)*H*.68;

    const x=
      W/2+
      l.side*(W*.11+p*W*.44);

    const h=
      15+p*80;

    ctx.strokeStyle=w.neon;
    ctx.lineWidth=Math.max(1,p*3);
    ctx.shadowBlur=12;
    ctx.shadowColor=w.neon;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x,y-h);
    ctx.stroke();

    ctx.fillStyle=w.neon;

    ctx.beginPath();
    ctx.arc(x,y-h,Math.max(2,p*6),0,Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur=0;

  /* túnel */

  if(w.tunnel){

    for(let i=0;i<9;i++){

      const p=(i/9+t*.00004)%1;

      const y=
        top+
        Math.pow(p,2)*H*.6;

      const width=
        W*.1+p*W*.48;

      ctx.strokeStyle=i%2?w.neon:w.second;
      ctx.globalAlpha=.28+p*.5;
      ctx.lineWidth=2+p*3;

      ctx.beginPath();
      ctx.ellipse(
        W/2,
        y,
        width,
        width*.22,
        0,
        Math.PI,
        Math.PI*2
      );
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }

  /* chuva */

  if(w.rain){

    ctx.strokeStyle=w.neon;
    ctx.globalAlpha=.3;

    for(const r of rain){

      const x=r.x*W;
      const y=((r.y+t*r.speed*.0006)%1)*H;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-4,y+r.len);
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }
}

/* ================= INIMIGO ================= */

function drawEnemy(e,t){

  if(!e.alive)return;

  const p=project(e);
  const s=p.scale;

  if(e.boss){

    drawBoss(p.x,p.y,s,e);
    return;
  }

  const w=world();
  const bob=Math.sin(t*.004+e.wobble)*3*s;
  const x=p.x;
  const y=p.y+bob;

  /* sombra */

  ctx.fillStyle="#0008";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y+52*s,
    30*s,
    9*s,
    0,0,Math.PI*2
  );
  ctx.fill();

  /* pernas */

  ctx.strokeStyle="#263748";
  ctx.lineWidth=Math.max(3,7*s);
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x-9*s,y+26*s);
  ctx.lineTo(x-13*s,y+52*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+9*s,y+26*s);
  ctx.lineTo(x+13*s,y+52*s);
  ctx.stroke();

  /* braços */

  ctx.strokeStyle="#3c4e61";
  ctx.lineWidth=Math.max(3,8*s);

  ctx.beginPath();
  ctx.moveTo(x-21*s,y-7*s);
  ctx.lineTo(x-39*s,y+18*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+21*s,y-7*s);
  ctx.lineTo(x+39*s,y+18*s);
  ctx.stroke();

  /* corpo */

  const grad=ctx.createLinearGradient(
    x-25*s,y-20*s,
    x+25*s,y+35*s
  );

  grad.addColorStop(0,"#62788b");
  grad.addColorStop(.45,"#273644");
  grad.addColorStop(1,"#070e16");

  ctx.fillStyle=grad;

  roundRect(
    x-25*s,
    y-20*s,
    50*s,
    56*s,
    12*s
  );

  ctx.fill();

  /* cabeça */

  ctx.fillStyle="#172432";

  roundRect(
    x-24*s,
    y-42*s,
    48*s,
    30*s,
    11*s
  );

  ctx.fill();

  /* visor */

  ctx.fillStyle=w.neon;
  ctx.shadowBlur=16;
  ctx.shadowColor=w.neon;

  roundRect(
    x-16*s,
    y-31*s,
    32*s,
    7*s,
    4*s
  );

  ctx.fill();

  /* núcleo */

  ctx.fillStyle=w.second;
  ctx.shadowBlur=18;
  ctx.shadowColor=w.second;

  ctx.beginPath();
  ctx.arc(
    x,
    y+3*s,
    7*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.shadowBlur=0;

  /* vida */

  if(e.max>1){

    const bw=60*s;

    ctx.fillStyle="#02050a";

    ctx.fillRect(
      x-bw/2,
      y-54*s,
      bw,
      5*s
    );

    ctx.fillStyle=w.neon;

    ctx.fillRect(
      x-bw/2,
      y-54*s,
      bw*(e.hp/e.max),
      5*s
    );
  }
}

/* ================= BOSS ================= */

function drawBoss(x,y,s,e){

  const w=world();

  s*=1.5;

  ctx.shadowBlur=30;
  ctx.shadowColor=w.second;

  ctx.fillStyle="#130d1d";

  roundRect(
    x-46*s,
    y-55*s,
    92*s,
    112*s,
    20*s
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /* ombros */

  ctx.fillStyle="#3f4c5b";

  ctx.beginPath();
  ctx.arc(x-55*s,y-30*s,17*s,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+55*s,y-30*s,17*s,0,Math.PI*2);
  ctx.fill();

  /* cabeça */

  ctx.fillStyle="#65798b";

  roundRect(
    x-43*s,
    y-86*s,
    86*s,
    43*s,
    16*s
  );

  ctx.fill();

  /* visor */

  ctx.fillStyle=w.neon;
  ctx.shadowBlur=22;
  ctx.shadowColor=w.neon;

  roundRect(
    x-29*s,
    y-70*s,
    58*s,
    9*s,
    5*s
  );

  ctx.fill();

  /* núcleo */

  ctx.fillStyle=w.second;
  ctx.shadowBlur=30;
  ctx.shadowColor=w.second;

  ctx.beginPath();
  ctx.arc(x,y+3*s,16*s,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  /* vida boss */

  const bw=140*s;

  ctx.fillStyle="#02040a";

  ctx.fillRect(
    x-bw/2,
    y-110*s,
    bw,
    8*s
  );

  ctx.fillStyle=w.neon;

  ctx.fillRect(
    x-bw/2,
    y-110*s,
    bw*(e.hp/e.max),
    8*s
  );
}

/* ================= ROUND RECT ================= */

function roundRect(x,y,w,h,r){

  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ================= UPDATE ================= */

function update(dt,t){

  if(!playing)return;

  spawnTimer-=dt*1000;

  if(spawnTimer<=0&&targets<goal){

    spawn();

    spawnTimer=
      Math.max(
        380,
        950-phase*10
      );
  }

  for(const e of enemies){

    if(!e.alive)continue;

    e.z-=
      (.00013+phase*.000002)*
      dt*1000;

    e.hit*=.85;

    if(e.z<.055){

      e.alive=false;

      if(!e.boss){

        lives--;

        shake=.8;

        updateHUD();

        if(lives<=0){
          gameOver();
          return;
        }
      }
    }
  }

  enemies=enemies.filter(e=>e.alive);

  updateParticles(dt);

  flash*=.84;
  shake*=.90;

  if(toastTimer>0){

    toastTimer-=dt;

    if(toastTimer<=0){
      toast.classList.remove("show");
    }
  }
}

/* ================= RESULTADO ================= */

function complete(){

  if(!playing)return;

  playing=false;

  if(phase<50){

    unlocked=Math.max(unlocked,phase+1);

    localStorage.setItem(
      "ultimoSegundoUnlocked",
      unlocked
    );
  }

  result.classList.remove("hidden");

  document.getElementById("resultTitle").textContent=
    phase===50
      ? "OPERAÇÃO CONCLUÍDA"
      : "FASE "+phase+" CONCLUÍDA";

  document.getElementById("resultText").textContent=
    phase===50
      ? "Você completou as 50 fases."
      : "Alvos destruídos: "+targets+
        " • Moedas: "+coins;

  document.getElementById("next").textContent=
    phase===50
      ? "JOGAR NOVAMENTE"
      : "FASE "+(phase+1);

  document.getElementById("next").onclick=()=>{

    result.classList.add("hidden");

    if(phase===50){
      startGame(1);
    }else{
      startGame(phase+1);
    }
  };
}

function gameOver(){

  playing=false;

  result.classList.remove("hidden");

  document.getElementById("resultTitle").textContent=
    "MISSÃO FALHOU";

  document.getElementById("resultText").textContent=
    "Você caiu na Fase "+phase+". Tente novamente.";

  document.getElementById("next").textContent=
    "TENTAR NOVAMENTE";

  document.getElementById("next").onclick=()=>{

    result.classList.add("hidden");

    startGame(phase);
  };
}

/* ================= TOAST ================= */

function showToast(text){

  toast.textContent=text;
  toast.classList.add("show");
  toastTimer=1.4;
}

/* ================= TOQUE ================= */

canvas.addEventListener("pointerdown",e=>{

  if(playing){
    shoot();
  }
});

/* ================= TECLADO ================= */

addEventListener("keydown",e=>{

  if(e.code==="Space")shoot();
  if(e.key.toLowerCase()==="r")reload();
});

/* ================= LOOP ================= */

function loop(t){

  const dt=
    Math.min(.033,(t-lastTime)/1000||.016);

  lastTime=t;

  update(dt,t);

  let sx=0;
  let sy=0;

  if(shake>.02){

    sx=(Math.random()-.5)*shake*13;
    sy=(Math.random()-.5)*shake*13;
  }

  ctx.save();
  ctx.translate(sx,sy);

  drawWorld(t);

  for(const e of enemies){
    drawEnemy(e,t);
  }

  drawParticles();

  if(flash>.03){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      flash*.13+")";

    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  requestAnimationFrame(loop);
}

/* ================= START ================= */

buildWorld();
updateHUD();

lastTime=performance.now();
requestAnimationFrame(loop);

console.log("NEON STRIKE — versão gráfica carregada");
</script>
